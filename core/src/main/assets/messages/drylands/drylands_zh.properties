###the desert: its oasis and buried temples, the sandstorm and their wares (levels/overworld/Drylands)

###the places (levels/overworld/Drylands, DrylandsLife, OverworldLevel.enterTemple)
levels.overworld.drylands.found_oasis=你发现了一处绿洲：沙海中央有清水、阴凉和棕榈树。
levels.overworld.drylands.found_temple=一座被掩埋的神庙顶部从沙丘中探出。一道阶梯向下通入其中。
levels.overworld.drylands.temple_desc=风化的石阶向下通入一座被沙漠掩埋的神庙，第%1$d层。它的%2$d层楼里布满陷阱，亡者仍在其中游荡，但其中既没有力量药剂，也没有升级卷轴。一名守卫在最底层看守着它的圣物。
levels.overworld.drylands.temple_cleared_desc=你的旗帜飘扬在它的阶梯口上空：守卫已被击溃，圣物已被取走。它的楼层仍是你离开时的模样。
levels.overworld.drylands.temple_yes=下楼
levels.overworld.drylands.temple_no=暂不

