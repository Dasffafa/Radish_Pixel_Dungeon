###their props (tiles/DrylandsArt)
tiles.drylandsart.palm=椰枣树
tiles.drylandsart.palm_desc=一棵根须浸在绿洲水中的椰枣树。每隔一天，成熟的椰枣就会落在树脚下。
tiles.drylandsart.rug=商人的地毯
tiles.drylandsart.rug_desc=一张铺在阴凉处的编织地毯，绿洲商人就坐在上面，身旁摆着他的货物。
tiles.drylandsart.stair=神庙阶梯
tiles.drylandsart.stair_desc=砂岩台阶向下通入被掩埋神庙的黑暗之中。
tiles.drylandsart.obelisk=方尖碑
tiles.drylandsart.obelisk_desc=一根雕凿而成的砂岩尖碑。在烈日下历经这么多年，它的尖端依然镀着金。
tiles.drylandsart.statue=豺狼雕像
tiles.drylandsart.statue_desc=一尊黑石豺狼蹲坐在基座上，守望着阶梯口。
tiles.drylandsart.slab=神庙屋顶
tiles.drylandsart.slab_desc=一座被沙漠掩埋的神庙的屋顶。流沙漫过它雕琢的石板。

###the sandstorm (actors/Sandstorm)
actors.buffs.sandblown.name=沙暴
actors.buffs.sandblown.desc=狂风把沙漠的黄沙吹打在你身上。你的视野缩短了%1$d%%，移动速度降低了%2$d%%，沙子还可能钻进你的眼睛，让你短暂失明（每回合%3$d%%的概率）。\n\n到迎风一侧的坚固掩体后躲避，或进入室内。背包里的沙地护目镜或沙漠围巾能挡住风沙。
actors.buffs.sandblown.desc_lee=沙暴正在肆虐，但迎风一侧有坚固的东西替你挡着风沙。一旦走出它的遮蔽，风沙就会扑面而来。
actors.buffs.sandblown.desc_worn=沙暴正在肆虐，但你的护目镜或围巾挡住了扑向眼睛和嘴巴的沙子：它不会让你失明或减速，你的视野一如既往。
actors.buffs.sandblown.onset=沙暴来了！沙子刺痛你的眼睛，把你向后推。
actors.buffs.sandblown.onset_lee=沙暴席卷沙漠，但你站在遮蔽之处，躲过了它。
actors.buffs.sandblown.onset_worn=沙暴席卷沙漠。你遮住脸，挡着风沙。
actors.buffs.sandblown.blinded=沙子钻进了你的眼睛！
ui.sundialindicator.w_sandstorm=沙暴

###the wares (items/misc/DesertWear, items/food/Dates, items/trinkets/SunScarab)
items.food.dates.name=椰枣
items.food.dates.desc=来自绿洲椰枣树的甜美椰枣。片刻之间就能吃完，能让你在一段时间内不觉得饥饿。
items.food.dates.discover_hint=成熟的椰枣会落在沙漠绿洲的椰枣树下，绿洲商人也有出售。
items.misc.sandgoggles.name=沙地护目镜
items.misc.sandgoggles.desc=皮革束带上的黄铜镜框镶着琥珀色镜片。随身携带它，沙暴就无法让你失明、减速或缩短视野：沙尘袭来时你只需戴上它。\n\n绿洲商人有售，工作台也能用一块玻璃板和一块皮革做出一副。
items.misc.sandgoggles.discover_hint=绿洲商人有售，工作台也能用一块玻璃板和一块皮革做出一副。
items.misc.desertscarf.name=沙漠围巾
items.misc.desertscarf.desc=一段编织布，可以裹住你的口鼻与双眼。随身携带它，沙暴就无法让你失明、减速或缩短视野。\n\n绿洲商人有售，工作台也能用三捆茅草织出一条。
items.misc.desertscarf.discover_hint=绿洲商人有售，工作台也能用三捆茅草织出一条。
items.trinkets.sunscarab.name=太阳圣甲虫
items.trinkets.sunscarab.desc=一只金色的圣甲虫，正推着一轮红日前行：被掩埋神庙的守卫所看守的圣物。神庙的亡者曾在那轮太阳下安息，而它至今仍灼烧着他们。
items.trinkets.sunscarab.typical_stats_desc=这件饰物通常会使你对亡灵生物的打击增强_%d%%_。
items.trinkets.sunscarab.stats_desc=在当前等级下，这件饰物会使你对亡灵生物的打击增强_%d%%_。
items.trinkets.sunscarab.discover_hint=沙漠中被掩埋神庙的守卫在神庙最深处看守着一只。

###who lives there (actors/mobs)
actors.mobs.mummy.name=木乃伊
actors.mobs.mummy.desc=被掩埋神庙中的亡者之一，至今仍裹着亚麻布。它行走的楼层越深，它就越强；它的抓握会让你变得虚弱，而它干枯的裹布极易烧着。
actors.mobs.mummy.discover_hint=你可以在沙漠沙丘之下的被掩埋神庙中找到这种敌人。
actors.mobs.npcs.oasistrader.name=绿洲商人
actors.mobs.npcs.oasistrader.desc=一位身穿蓝袍的商人，正在水边的阴凉处歇息。他背上卷着的那张地毯，见证过从此地直到世界尽头的每一片沙漠。
actors.mobs.npcs.oasistrader.discover_hint=你可以在沙漠绿洲的水边、他的地毯上找到这位人物。
actors.mobs.npcs.oasistrader.talk=坐吧，喝点水：这里的水不要钱。要是你要穿过沙海，趁着还没起风，先弄副护目镜或一条围巾。
actors.mobs.npcs.oasistrader.temple=据说此地%1$s%2$s的沙丘下埋着一座神庙。它的亡者不会安睡。
actors.mobs.npcs.oasistrader.no_temple=这处水源附近，我不知道有什么被掩埋的神庙。到下个绿洲再问吧。

