journal.document.legends_story.title=F A B L E S
journal.document.legends_story.ren_vs_lvb.title=Dungeon Chronicles: The Leaf-ren Strife
journal.document.legends_story.ren_vs_lvb.body=SmallLeaf and ren were both feudal lords of considerable power. ren's conduct was improper and he was often criticized for it, so he took care that word of his doings did not get out. SmallLeaf, however, had always been on bad terms with ren, so he sent his own trusted men to lurk at ren's side, record his every deed and spread it far and wide among the people, in order to damage ren's image. When ren learned of this, he purged those around him many times, keeping only the people he trusted most, but in the end he still could not stop SmallLeaf and had to give up. In those days there were many conflicts between SmallLeaf and ren, but they were limited to the two of them and their confidants; they did not grow or spread widely, and the overall situation was relatively peaceful.\nSmallLeaf often boasted about his designs, believing that no one could match his ability to design. One day ren mocked SmallLeaf's designs, and the remarks reached SmallLeaf through his planted confidants. SmallLeaf was furious and wanted to raise an army and attack on the spot, but someone advised him: "To do this now would not be righteous, and it would hurt your reputation before the Emperor." Only then did SmallLeaf give up the idea of raising an army and attacking, but he was still dissatisfied, so he took his revenge by deliberately letting insults reach ren's ears. ren was very angry and began to insult not only SmallLeaf but also the people connected with him. SmallLeaf let the people know of these words. Having been insulted for no reason, the people were all outraged; there was nowhere that the cries denouncing ren could not be heard, and some righteous men even gathered their forces, raised their arms and shouted, wanting to go and punish ren.\nren grew afraid, and so he submitted a memorial to the Emperor, saying: "SmallLeaf has always boasted of his own achievements, and now I see that the people on his land are in turmoil and unrest. I fear he is about to rebel!" The Emperor was greatly alarmed when he read the memorial and wanted to send troops to put down the rebellion, but a minister objected, saying: "SmallLeaf and ren have never been on good terms, and each of them has no small number of supporters. You should find out the whole truth of the matter before passing judgment, lest rumors say that you are not impartial and favor one side." The Emperor thought this very reasonable and sent men to investigate in secret. Finding that it was indeed not a rebellion, he had SmallLeaf and ren reprimanded: do not let personal grudges interfere with public affairs.\nSmallLeaf had already built up a great deal of resentment, and when he learned that ren had slandered him before the Emperor, his anger rose even higher. So he hurriedly drafted a revisionist chronicle of bygone years, calling to account those who had once spoken ill of his designs. But out of consideration for people's feelings, and knowing that he himself was in the wrong, SmallLeaf never followed through, and nothing came of it. Before long the chaos died down, and the people lived as they always had, as if nothing had happened.\nSmallLeaf was arrogant and ren was overbearing, so why was it ren who ended up on the losing side morally and was drowned in the anger of the masses? Was it because SmallLeaf had more subordinates who served him loyally and more people who supported and loved him? Was it because the people on ren's side were poor at debate and unclear in their reasoning? Was it because SmallLeaf had planted confidants and could slander ren as he pleased? It was not so. ren behaved improperly, yet he only received some criticism, because that was his own business; SmallLeaf was arrogant and boastful, yet he only received some ridicule, because that was his own business; when ren and SmallLeaf came into conflict and fell out, most people merely looked on and supported neither side, because neither of them was in the right, and handling their relationship was a matter between the two of them. It was only when ren, in his anger, cast morality aside and insulted people who had nothing to do with it that he began to fall behind; and when SmallLeaf, in his anger, called people to account for old matters, he too knew in the end that he was in the wrong, and it came to nothing. Seen in this light, the conclusion is perfectly clear: the root of ren's failure lay in a moment of impulse, in casting aside benevolence and righteousness!\nCrab says: "The breadth of mind of a sage is not like the sea, able to hold all things; but when sages are angry, they know how to ride that momentum to accomplish what they ordinarily could not, and such a one may be called a man of courage. The tolerance of a petty man is not like a broken bowl, unable to hold anything; but when petty men are angry, they only ride that momentum to do wicked things that should not be done, and such a one is nothing but a reckless brute."
journal.document.legends_story.lvb_story.title=Radish Garden Secret Tales: The Story of SmallLeaf
journal.document.legends_story.lvb_story.body=SmallLeaf lived in a small village called Radish Garden. Everyone in the village was a Shattered Pixel Dungeon adventurer, and SmallLeaf was no exception.\nUnfortunately, SmallLeaf was a warrior, and as a member of the weakest class he was always looked down upon throughout his adventuring career. For example, on every major holiday Radish Garden would rally the whole village to conquer Shattered Pixel Dungeon with all challenges enabled, and at such times only the warriors were not allowed to go. They were left behind to guard the village, on the grounds that a warrior attempting all challenges would bring shame on adventurers. Any who were stubborn and refused to accept this would be beaten up by armor-piercing snipers, magic-damage warlocks, high-speed freerunners and long-sustain monks. These people all had qualities that warriors lacked, and any one of them picked at random utterly outclassed a warrior, so the warriors had no choice but to swallow their anger.\nSo SmallLeaf soon changed trades and became a blacksmith. He studied under the village's only old blacksmith, who was about to retire. He learned quickly and he learned well, and in less than a year he had mastered the forging methods for every piece of equipment in Shattered Pixel Dungeon. People all said SmallLeaf had found the right path: why bother being some lousy warrior? With your talent, you are sure to become an outstanding master of the forge. And so SmallLeaf lived in peace for a long time.\nOne day a traveler came to the village. He called himself a designer and showed the villagers of Radish Garden many of his own designs. The villagers had long since grown used to Shattered's equipment and paid this stranger no mind, simply going about their usual business. SmallLeaf, however, was deeply fascinated. He had only ever forged ordinary equipment and had never seen such interesting designs. He asked the designer about a great many things, and when SmallLeaf showed the designer his own designs, the designer only smiled and said:\n"What a design, full of grooves and gutters. I certainly have no designs like that."\nThen he quickly left Radish Garden. SmallLeaf took this as praise and was convinced that he was a DIY master after all, so he gave up forging Shattered's equipment and began creating more and more designs of his own.\nThe old blacksmith had already retired, and SmallLeaf was the only blacksmith in Radish Garden. Anyone who wanted equipment from some other source had to ask the few villagers who had seen the world to buy it in the city, but that was expensive and troublesome, and those people did not go to the city all the time, whereas equipment for adventuring was indispensable at every moment.\nAt last, the villagers who could not get used to the new equipment began coming to SmallLeaf, urging him to give up this crap. SmallLeaf did not say a word and just kept tinkering with his designs.\n"I told you to stop designing. Are you deaf?"\n"I will keep on designing."\nAfter one expedition against all-challenge Shattered using SmallLeaf's new equipment ended in a crushing defeat at the hands of crabs of every color, the villagers were furious. They blamed SmallLeaf, surrounded him and beat him for a long time. Fortunately, SmallLeaf had picked up Iron Stomach +2 and bipolar disorder during his career as a warrior. He kept taking his medicine the whole time he was being beaten and did not take a single point of damage, and even when the villagers had worn themselves out he still had not finished his medicine, so the people could only leave, cursing as they went.\nAfter that, SmallLeaf gave up designing and went back to forging the equipment of Shattered Pixel Dungeon. Seeing this, the villagers said nothing more and returned to the lives they had led before.\nThe people returned to their daily routine. Only SmallLeaf had changed.\nPeople saw him always wandering aimlessly all over Radish Garden, muttering:\n"Right, right, I will keep on designing... No, no, my design duties are already over..."\nBefore long the villagers grew annoyed with the muttering SmallLeaf again, and planned to recruit a new blacksmith from the city and then send SmallLeaf away. Since the job covered all the blacksmith work of the whole village, the villagers soon found a blacksmith, and then asked a man who happened to be leaving for the city on business to take SmallLeaf with him and just settle him anywhere at all. But SmallLeaf flatly refused to go. Mindful of SmallLeaf's feelings for design, which he could not bear to give up, the man who was leaving said to him:\n"SmallLeaf, I will introduce you to an adventuring team with a richer, more innovative dungeon. You can design to your heart's content there."\nHearing that he could design to his heart's content, SmallLeaf's eyes lit up at once, and he said happily:\n"Right, right, I will keep on designing!"\nAnd so SmallLeaf went off with the man who was leaving.\nMany years passed. A villager in Radish Garden, while tidying up some odds and ends, came across a seeking spear that SmallLeaf had forged, and it occurred to him that SmallLeaf had left Radish Garden long ago and nobody knew where he had gone. So during a casual chat he asked the man who had taken SmallLeaf away where SmallLeaf had ended up, and only then learned that SmallLeaf had gone to Ember Hollow.\nThat damn SmallLeaf's life is pretty much over.
journal.document.legends_story.free_fly.title=SmallLeaf 2: Wings of Freedom and the Pure Soul
journal.document.legends_story.free_fly.body=A man walked briskly down the road. He was wrapped in an overcoat, and though a biting cold wind swept across his cheeks, he did not feel cold at all. He had finally found a foothold in this bustling city and would never have to go back to Radish Garden again. On the way he passed Ember Hollow and thought of SmallLeaf, whom he had sent off all those years ago. After so many years, how was he doing now? Out of curiosity he asked the people inside about SmallLeaf, but the only answer he got was "There is no such person here."\nSmallLeaf had never gone to Ember Hollow at all.\nThat damn SmallLeaf has pretty much won the revival match of his life.\n* * * * *\n"SmallLeaf, do you truly understand design?" asked a figure not far away, wrapped from head to toe in black, with a touch of anger.\n"Naturally."\n"Then how is it that you cannot even fix the flaws of a single artifact?"\n"Great strength in one respect inevitably brings weakness in another. There is no perfect artifact in this world; each of them merely has its own strengths."\n"Tch..." The man in black clicked his tongue in displeasure. His expression could not be seen, but one could picture his brows tightly knitted.\n"I don't believe any of that! I have done everything I can to provide you with the finest equipment and materials, and I will absolutely not allow you to produce nothing but a defective piece riddled with flaws. You must finish improving it within this week!"\nThe man in black left without looking back, leaving SmallLeaf all alone. He looked at the elite badge, still glowing faintly on the forge, and could not say a word. Beside him, gray sewage flowed endlessly out of the sewer drainpipes, and greenish moss grew over every corner. This was some floor of the sewers region of some unknown dungeon, like a square box. The stairs leading up were not far away, but at the top of the stairs was a locked door.\nHow long had SmallLeaf been here? Even he himself could not answer. It seemed he had gone mad and had only recently come back to his senses, and his memories from before were blurry. What he could remember clearly was that he had been making all kinds of things here and handing them over to the man in black, and also his love of design. He used to think that as long as he kept designing he could go on living and would not have to care about anything. Now he realized that he only wanted to design what he wished to make, free of all worry; handing in his designs to someone else as if it were a job, the way he did now, left him unable to breathe.\nHe had to escape from this place.\n* * * * *\n"At last I've found it... Ding Zhen's divine treasure!" Crab swept aside the magnifying glass, marker pens, scratch paper and all the other clutter on the messy desk, then spread out on it a map so huge it could be called a cloak. The map was densely covered with all kinds of circles, markings and arrows, so that its original appearance could hardly be made out anymore, but every mark ultimately pointed to one place. It was circled with an extremely thick red ring, with several big exclamation marks beside it, and the name of the place could just barely be read off the map: the Snow Leopard Grand Hall.\n"I never would have thought that Ding Zhen's treasure, which I have sought for so many years, was hidden somewhere so obvious." Muttering to himself, Crab began to pack his bags - he had to set out for the Snow Leopard Grand Hall at once. There was an important matter that would not let him lose a single moment.\n"'Dungeon Emperor', I will never let your scheme succeed!"\n* * * * *\nDrenched in sweat, SmallLeaf leaned against the forge, holding the elite badge in both hands. Its light was more dazzling than ever before.\n"The elite badge in its complete form... is finished..."\nOver these few days SmallLeaf's inspiration had exploded, and he had completed the work of improving the elite badge at nearly twice his former speed.\n"...But not yet. I still have to keep them tied up a little longer." SmallLeaf removed one gem from the badge and hid it on his person, and the badge's light dimmed in an instant. He could not hand over this design yet. He had to buy more time and think of a way to escape from this place, and if he still had no good plan by then, he would have to rely on the power of the elite badge and force his way out at great risk.\nNo matter what, he would not stay trapped here. Some donkeys are born with wings of freedom, and he was just such a Caiyu donkey.\nIn a pause in his thoughts, SmallLeaf felt a faint breeze blowing up from below.\n* * * * *\n"SmallLeaf! How is your design coming along?!" The man in black entered the dungeon as he always did and asked the familiar question.\nNo one answered.\nThe dungeon was frighteningly quiet. There was only the sound of sewage flowing on and on, and the forge still gave off a lingering warmth. SmallLeaf had vanished, together with the elite badge.\nEven in his shock, the man in black keenly noticed that the forge had been shifted slightly. He moved the forge aside, and a tunnel lay plainly revealed in the floor. This must be how SmallLeaf had escaped.\nThe man in black instantly went red with rage and shouted:\n"You damned SmallLeaf, you just wait for me~!"\n* * * * *\nSmallLeaf, a Caiyu donkey with wings of freedom, was at this moment racing through the night. From now on he would design only for himself. The moon was very bright tonight, and ever since coming out of the tunnel SmallLeaf had been running along the highway by its light. He knew the pursuers would come soon, so he had to keep moving without a moment's pause.\nSuddenly SmallLeaf's heart shuddered. He realized there was already a dark figure behind him, moving with an eerie gait and keeping a fixed distance from him the whole time. If this went on, he would run out of stamina and then be caught.\nSmallLeaf jogged to save his stamina, kept an eye on what was behind him, and thought about a countermeasure, all at once. Just then, not far away, an office worker who had just gotten off work was about to drive home. Seeing this, SmallLeaf put on a burst of speed and leapt into the car.\n"Someone behind me is out to kill me. Can you help me shake him off?"\n"Sure thing."\nThe car sped up and soon shook off the dark figure. SmallLeaf had not expected to meet such an obliging kind soul, and hurriedly expressed his thanks. After they had introduced themselves to each other, SmallLeaf learned that his name was ling. SmallLeaf then explained his own situation, and ling thought for a moment and said:\n"I have a friend who seems to have gone through the same thing as you. He has been fighting against those people all along. Let me give you his contact details; he might be able to help you. You can come to my place first to rest for a while. My house is pretty big."\nJust as SmallLeaf was rejoicing at having found help as soon as he got out, the pursuing dark figure, standing at the spot where SmallLeaf had gotten into the car, got on the phone with the man in black.\n"Shenyang Street, 13 Haoguozi Avenue. The target has fled by car. Requesting interception."\n* * * * *\n"Understood. I will be waiting over there." On the train, Crab hung up the phone and re-planned his route on the map. He had meant to travel in a straight line and reach the Snow Leopard Grand Hall as fast as possible, but now the plan had changed: a designer who had suffered the same fate as he had was on the run. He decided to take a detour and meet that person - SmallLeaf - at another station. This would also help in the fight against the Dungeon Emperor.\nCrab was at this moment racing through the night.\n* * * * *\nling and SmallLeaf were stuck in traffic on Shenyang Street.\n"This shouldn't be happening. How can there be a traffic jam at this ungodly overtime hour?" ling's car was pinned in the middle of the road, unable to move. Only after getting out and asking around did they learn that a large truck had apparently overturned up ahead and blocked the entire road.\n"This makes things a bit difficult..." SmallLeaf frowned, thinking hard about a countermeasure.\nJust then, a dark figure was approaching from the distance. He was holding a flashlight, and looked inside every car he passed. Was he a traffic officer checking the cars? As SmallLeaf was thinking this, he suddenly jumped up.\n"Damn it, that bastard is here for me. For them to catch up this fast, the crash must have been their design too."\nWith no time to mourn for ling, who would be stuck here for who knows how long, might lose out on his rest and might well be late for work tomorrow, SmallLeaf said goodbye to ling, took the 100 x 2 = 500 yuan of taxi money that ling gave him, and dashed into the bushes by the roadside.\nSmallLeaf soon made his way to another road and managed to hail a taxi. He figured those people could not pull off that kind of large traffic accident a second time. Sure enough, SmallLeaf reached the agreed station without any obstruction. Crab was already waiting there, and as soon as he saw SmallLeaf he handed him a parcel.\n"What is this?"\n"A cheese snow burger." Crab gave a brief answer, then motioned for SmallLeaf to board the train with him. Facing a powerful enemy, they had to search, or flee, without stopping for a moment; exchanging information and resting would have to be done on the way.\nThey quickly boarded the train. There were many office workers on the train. Most of them had vacant eyes and simply kept their heads down, playing with their phones. At this ungodly overtime hour, would there really be this many people?\nSmallLeaf remembered ling's words.\n"Run." Before Crab could react, SmallLeaf, amid the startled cries of the train attendant, dragged Crab flying out through the doors that were about to close. Those office workers suddenly bared ferocious faces and pounced, but they were all shut inside the car and could only pound in vain on the doors and windows.\nSmallLeaf and Crab were at this moment racing through the night.\nThey had no choice but to change their route, keeping to remote places the whole way. On the road they exchanged a great deal of information. The man in black who had locked SmallLeaf up was called Bulski. His background was a mystery; all that was known was that he had been searching all over the world for divine weapons, artifacts and designers to fulfill his ambition: to descend upon the world and become the Dungeon Emperor. SmallLeaf and Crab were both designers who had been captured, and SmallLeaf must have been abducted by Bu on his way to Ember Hollow. As for the hole under the forge, Crab had dug it when he escaped.\n"If you want to stand against Bu together with me, then come with me to the Snow Leopard Grand Hall. If you would rather escape the hunt and live a quiet life, I have arranged a place for you to go as well."\n"...I'm going to the Snow Leopard Grand Hall. I will help you."\nThe two of them reached an agreement: to crush Bu's scheme to become the Dungeon Emperor and rule the world.\nJust then, several concealed throwing weapons came flying in from the side. Almost on instinct, SmallLeaf drew his glimmer dagger and knocked every one of them down in an instant, and the light of the dagger lit up a figure in the shadows.\n"'The Jutte Catman', Moonlight." Crab recognized the uninvited guest before them.\nMoonlight had originally been an adventurer, famous for dual-wielding jutte and never failing to win in battle. Later he began to serve Bu, because Bu had promised that once he became the Dungeon Emperor he would gather the best designers to forge him the strongest jutte in the world - and two of them at that.\nMoonlight did not speak. Brandishing his jutte, he attacked SmallLeaf and Crab. SmallLeaf raised his dagger to meet him, and Crab also drew the shortsword he carried for self-defense. The fierce clash of iron on iron rose and fell, accompanied by the occasional burst of flashing from the glimmer dagger. Moonlight's skill at fighting with jutte was truly unrivaled, and even SmallLeaf and Crab working together as a pair were quickly forced onto the back foot. Seizing his chance, Moonlight sent Crab's shortsword flying with a heavy blow, and Crab himself was flung several meters away, while SmallLeaf's flimsy dagger was shattered outright, its glowing fragments scattering everywhere. The jutte came straight down at Leaf.\n"Projecting champion, bearer of the power to 'smash heads from eight hundred li away'! Our badge, champion transformation!"\nThe instant the chant was heard, a rainstorm of fists came crashing toward Moonlight. Unable to parry in time, Moonlight was beaten back step after step. When he recovered his wits, he saw that Crab, in the distance, had the elite badge pinned to his chest and that an intense purple light was radiating from his body, bringing to mind a certain purple Stand that throws very fast punches.\nAs it turned out, SmallLeaf had put the elite badge back together while they were on the road and had entrusted it, along with how to use it, to Crab, in case of the unexpected. The distance Crab had just been knocked away was exactly the right opportunity for a projecting champion to show its worth.\n"To hell with that damned bastard projecting Crab." Seeing that things were going badly, Moonlight quickly fled, yelling as he went.\n"Ran into the projecting Crab in an alley fight. He throws punches across empty air and is as strong as a monster. Even giving it everything I had, I could not win." Moonlight then contacted Bu and reported the situation to him.\nCrab did not give chase, but instead lost no time in laying out the plan for what came next.\n"Bu has coveted Ding Zhen's treasure for a long time, but he has never been able to find it. We are already very close to the Snow Leopard Grand Hall, and if we approach it directly we may lead the enemy to it. SmallLeaf, you draw their fire for me. I will conceal myself and go to the Snow Leopard Grand Hall alone."\nCrab used a scroll of prismatic image to summon a double and had it follow SmallLeaf, then gave the elite badge back to SmallLeaf and set out on the road to the Snow Leopard Grand Hall. SmallLeaf, for his part, straightened his clothes and walked off in a different direction.\nSmallLeaf and Crab were at this moment each racing through the night.\n* * * * *\nLong, long ago there was a place called "Litang". The god who watched over it - Ding Zhen - lived peacefully together with His people. Ding Zhen loved the people deeply. Every day He worked alongside His people, rested alongside them, gathered with them and celebrated with them. He was so unlike a god that He even came to have the lifespan of a human. Before He departed, He bestowed blessings upon His people.\n"Look the snow leopard in the eye." He gave His people courage.\n"Born of Mama." He gave His people a place to belong.\n"Study knowledge till it bursts." He gave His people wisdom.\n"Codes, codes, left over." He tested His people's codes.\nBesides this, He also left behind a powerful artifact imbued with His divine power. In the days without Him, should His people face a grave threat to their survival, the purest of persons may solve the riddle He left behind, wield His divine power, and deliver the people from their peril.\n* * * * *\nCrab was rushing toward the Snow Leopard Grand Hall at full speed. He ran very fast and stepped very lightly, like a snow leopard running across the snow. The moon was already hidden by dark clouds and the road was frighteningly quiet, yet no enemy ambushed him from the shadows. They would not give up the hunt easily, so SmallLeaf must have succeeded in drawing their attention. Now he not only had to obtain the artifact and crush Bu's scheme, but also get SmallLeaf out of danger.\nWith no enemies to obstruct him, Crab, advancing at full speed, soon reached the Snow Leopard Grand Hall. This was a building for the worship of the Snow Leopard God. The Snow Leopard God stood for strength and courage, so the building looked solemn and dignified even in the dark of night.\nIt was said that on the night of the full moon, at the moment the moon lined up with the round hole in the ornament atop the Snow Leopard Grand Hall, the riddle left by Ding Zhen would appear, and whoever solved this riddle would obtain the artifact Ding Zhen left behind. Crab stood before the door. That moment was about to come.\nThe moonlight parted the clouds and the full moon returned to the world. At once the hall cast its shadow on the ground; this was the very moment the full moon lined up with the round hole. On the shadow of the hall, two glowing lines of text appeared:\n  Late moon faces the sky, half its face aglow  Night shadow lies upon the ground, one streak of a wild goose\nCrab pondered these two lines of text. What was Ding Zhen's riddle? Just what kind of answer did Ding Zhen want His people to give?\n"Night shadow... late moon..." Crab kept muttering the riddle He had given. Then, as if a snow leopard had let out a great roar in the depths of his heart, Crab's mind was shaken wide open in an instant, and he blurted out the answer:\n"The night shadow is aligned. Verdict: caused by the rising of the late moon."\n* * * * *\nSmallLeaf, too, was running with all his might. He had no destination, or rather, any place that could hold up the pursuers was his destination. Bringing the prismatic image with him, SmallLeaf pressed on through a darkness that lacked even moonlight, completely unaware of the danger closing in. Moonlight had not fled far; he had circled around and come back. An utterly dark environment like this was exactly his home ground. He drifted down from on high like a withered leaf, his jutte pointed straight at SmallLeaf and the prismatic image.\nSmallLeaf saw a flash of light come from behind him.\nHe rolled over to face Moonlight and, in the posture of a rabbit kicking a hawk, sent Moonlight sprawling on the ground with a single kick. Moonlight lost consciousness on the spot.\n"The glimmer dagger is such a great design! Do you people understand that or not?!" SmallLeaf howled loudly.\nDuring the earlier fight, fragments from the shattered glimmer dagger had stuck to Moonlight's jutte, and the jutte had already taken on the glimmer dagger's shape of lighting up whenever it makes a surprise attack.\nJust as SmallLeaf was about to confiscate Moonlight's jutte, what he failed to consider was that, after their last defeat at the hands of the projecting Crab, the enemy this time would not be Moonlight alone.\nAn enemy in the shadows reached out its evil claws toward SmallLeaf.\n* * * * *\nBefore he knew it, Crab had entered an unfamiliar place. It was sealed on all six sides and had no source of light, yet he could see things clearly. On the wall directly in front of him was a mural of Ding Zhen and a snow leopard, and everywhere else was carved full of inscriptions he could not read. Crab had passed Ding Zhen's trial.\n"A thousand years of peace and happiness were, in the end, only a thousand years. Of the wisdom, the courage and the place to belong that I left to the people, after being worn away by who knows how many years, only courage remained in the end. But fortunately you have come, 'pure' one who has passed the trial. You possess extraordinary courage, and you likewise possess profound wisdom. Since you were able to come here, I firmly believe that you have already found your own place to belong, and are seeking a place to belong for many more people. Go, my dear child, and once again bring peace and happiness to Litang!"\nIn the blink of an eye, Crab was back in front of the Snow Leopard Grand Hall. Listening to that brief yet endless conversation just now seemed like a dream, but it was certainly no dream, because in his hand Crab was already gripping the artifact that held Ding Zhen's divine power - the RELX Gen Five. Just as Ding Zhen had said, he would bring down Bulski and save this land beneath his feet, which a thousand years ago had been Litang.\n\nWelcome to the highest city in the world - Litang\nIts people all sing its praises\nA thousand years of unbroken peace and happiness\n* * * * *\nSmallLeaf put the jutte away and was about to set off again when a wave of sword energy suddenly came slashing toward him. SmallLeaf immediately raised the jutte to defend himself, but it did little good. The sword energy cut Crab's prismatic image to pieces and, pushing against the jutte, slammed SmallLeaf hard into the wall.\nThe man in black - or Bulski, as he should now be called - walked out of a corner. Carrying a greatsword, wearing a suit of plate armor and with a ring on his hand, he came before SmallLeaf fully armed.\n"SmallLeaf, give me the elite badge."\n"If you want it, you will have to come and take it yourself."\n"You don't know what is good for you. Then die!" Bu swung his greatsword at SmallLeaf's head.\n"Blessed champion, bearer of the power to 'die only on a door'! Our badge, champion transformation!"\nA flash of golden light lit up the surroundings in an instant. SmallLeaf, still wounded, at once leapt up nimbly and dodged the fatal blow, then took up the jutte and faced off against Bu.\n"If you think you can escape with the agility of a blessed champion, then go ahead and try. The armor I went to such pains to get is no heavy, ordinary plate armor."\nIn fact SmallLeaf had seen it long ago: Bu was dressed like a tin can, yet he moved with extraordinary speed and ferocity, and even as a blessed champion SmallLeaf had nearly been hit. That gear of his had to be the finest divine weapons he had seized over the years. That being the case, it was all the more important not to let him get the elite badge.\nBu said nothing more and came straight at SmallLeaf, who could only dodge and keep him busy. The edge of the greatsword carved gash after gash into the walls and the ground; this alley would soon be wrecked beyond recognition.\n"We vape..." Crab's voice came from behind Bu. Bu quickly turned and swung his sword but hit nothing, and behind him a thick wall of fog had already formed.\n"What is this, an illusion?!"\nAs if in answer to Bu's question, a fist flew out of the thick fog and struck his helmet with a dull, echoing thud. Bu charged into the fog in a single bound, swinging his sword in an arc so exaggeratedly wide that it seemed to cleave space itself. This stroke hit no one, but it was as if it had cut a taut string holding the wall of fog together: the white fog burst and scattered in all directions, turning every color in an instant.\nInstinct told Bu that these colors were by no means decoration, and that a single breath of this mixture of gases would be fatal. But Bu, secure in his protection, raised his left hand without fear and shouted to the unseen Crab:\n"If your trick is to use the environment, then you had already lost from the very start! With this ring, I am immune to all poisons!"\nImpervious to blade and spear, able to cut iron like mud, immune to all poisons: this was Bulski's strength now.\nAs if to show his resolve to stand against him, a figure gradually took shape in the fog.\n"The peerless sun of the design world, the double-speed dungeon runner, the executor of judgment on behalf of the god of Litang - Sewer Crab has come to put an end to your crimes!"\nCrab stood unarmed not far in front of Bu, the RELX Gen Five in his hand and the elite badge hanging on his chest. It seemed Crab had already sent SmallLeaf somewhere else; now it was time for their duel.\n"It seems you have brought me both of the artifacts I want most. That saves me the trouble of going to look for them."\nThe words had barely left his mouth when Bu swung his greatsword around and began to spin. This mighty whirlwind slash swept up even the stones on the ground and ground them to powder, and the thick fog was caught up in the whirlwind as well. By the time Bu stopped attacking and looked around, the fog had cleared and the alley had become flat ground.\nBu knew his own strength very well, and he understood that he was not yet able to level a large area to the ground. Just then Crab appeared again.\n"I have brought you into the dungeon, you terrorist. Do not hurt the innocent."\nWith that, the battle between the two broke out in an instant. One was the divine envoy of Ding Zhen, wielder of two artifacts, the RELX Gen Five and the elite badge; the other was a stat monster with peerless equipment and a legendary ring, many divine weapons gathered in one body. They fought in the dungeon until the sky went dark, and wherever they passed there was nothing that was not cut down by the greatsword and no living thing that was not suffocated by the thick fog. They fought on like this for three days and two nights. Neither side had taken any real damage, but the elite badge was constantly short on charge, the RELX Gen Five was often out of battery, and Bu's swings of the greatsword were slowing down too. They were both very tired.\nBu had long been prepared for this. He had already foreseen this situation during the fight, so he had been gathering supplies along the way as he fought. By now dozens of food items of all kinds were stacked up in his backpack, and his potions, scrolls and other items were beyond counting.\nFor the sake of those two artifacts, for the sake of his great cause of becoming the Dungeon Emperor, he did not care however long the war of attrition lasted. What was more, this war of attrition had already driven Crab to the end of his rope! He surely had nothing left on him!\nWhen it comes to a battle of wits, I, Bulski, am the better man after all! Sewer Crab!\nAnd so Bu began to rest and eat. Perhaps by the next fight he would be in peak condition and could defeat Crab in a single stroke.\nAdmittedly, Crab had nothing. He truly was at the end of his rope, with nowhere left to turn. At this moment he was sitting in some corner of the dungeon, his eyes as pure as when he had beheld Ding Zhen, and there was no fear at all in his heart.\nThis battle, he had already won.\n* * * * *\nWhat Bulski did not know was that the land beneath his feet had been Litang a thousand years ago. This was Ding Zhen's home ground, and even though he was covered in equipment blessed by other gods, in the end he would be no match for Ding Zhen.\n\nWelcome to the highest city in the world - Litang\nIts people all sing its praises\nA thousand years of unbroken peace and happiness\n- So let Litang defeat Bulski\n\nWhat Bulski had expected even less was this: just what kind of dungeon would have so much food?\nThis was Ember Hollow.\nBefore long, Bulski, having carelessly eaten the dozens of stacked food items all in one go and then being unable to find any toilet paper, died from holding it in.\n* * * * *\nAfter this, Crab returned Ding Zhen's artifact and exposed Bu's scheme to the world, and his gang was soon broken up.\nSmallLeaf became the keeper of the very dungeon that had once held him captive, named it Radish Dungeon, and called on the people of Radish Garden to come.\nMoonlight became an adventurer once more, cutting down everything in his path in the dungeon with his jutte.\nling was late the next day and got his pay docked by his damned boss. He really had it rough.\nWith this, Litang once again welcomed the peace and happiness He had hoped for. Even if it would not last the thousand years it had while He was still there, even if dark currents still surged beneath this city, whenever an imminent threat arose there would always be brave, wise and pure people who would step forward and once more save Litang from danger. This pure and unyielding faith would live on in people's hearts even a thousand years from now, and this was the greatest treasure Ding Zhen left to His people.\n\n\n--END--
journal.document.legends_story.skywindows_sword.title=SmallLeaf 3: The Skylight Incident - Mystery of the Wing Sword
journal.document.legends_story.skywindows_sword.body=A fire was burning in my chest. With every pause, every breath, a scorching warmth spread through my whole body. This long-dormant body was yearning to move, and so I opened my eyes.\n"Clang!"\nThe pitch-black sky suddenly came crashing down. In my fright, the eyes I had only just opened were forced shut again. I tried a few more times, with the same result. So I would never get to see the light... I suddenly recalled that long, long ago the world had also been a boundless darkness. Then a crack began to split open at the edge of the sky, and a dazzling white light grew wider and wider along with it until it filled my entire view, but soon the world sank back into darkness. What a murky, muddled memory. So I stopped thinking and began to feel around me.\n\n* * * * * * *\n\nSmallLeaf heard the sound of breaking glass from inside the room. He hurried back and unlocked the door with his key. The room was a mess: the glass of the skylight was shattered, and shards were still spinning on the floor. More importantly, the wing sword SmallLeaf had only just finished making was gone. Moonlight came running at the noise as well.\n\n\nYe: Moonlight, the wing sword has been stolen. Go and check right away whether there is anyone suspicious around.\nMoon: Okie-dokie (nerd face, finger raised) I'll go out through the skylight and take a look... Not a single soul.\nYe: You are wrecking the freaking crime scene. No, what I mean is, you can come down now. Let's analyze the situation.\nYe: First of all, why would the culprit go through the skylight instead of the window?\nMoon: Don't you think coming down from above on a rope, like a phantom thief robbing a museum, is really cool?\nYe: Then why not go and rob a museum? Also, there is something odd about this window.\nMoon: Erm (nerd face, finger raised), I know why the culprit did not use the window. Because this is not a window at all, but wallpaper that I put up.\nYe: You seem to be seriously sick in the head. No, what I mean is, now I know the skylight is the only way in, but there is still one question...\nMoon: Actually, I put some up on the outside too. What the wallpaper shows even differs depending on the viewing angle.\nYe: You really do deserve to die. No, what I mean is, that does not matter. Anyone who checks it by hand can tell it is fake. What I want to say is...\n\n* * * * * * *\n\nJust as I was groping around blindly, I suddenly felt a strange sensation on my back. I reached behind me and was astonished to find that I had actually grown a pair of hard wings. This must be what fate has arranged! Although I could not open my eyes for now, as long as I kept flying upward, higher than that pitch-black sky that had suddenly fallen, I would be able to look down on the world to my heart's content. And so I flew upward and broke through the obstacle.\n\n* * * * * * *\n\nYe: ...Moonlight, what do you make of these glass shards on the floor?\nMoon: When we first came in, one shard was spinning on the floor like a top, which means the culprit had not gone far. But when I went outside, I saw no one.\nYe: That is one point. What else?\nMoon: That shard was an isosceles triangle, similar to the cross-section of a top. That is why it could spin for so long.\nYe: An equilateral triangle, to be more precise.\nMoon: The shards on the floor are arranged in the shape of a radish. It may be some kind of secret sign.\nYe: I think it looks more like a crab. No, what I mean is, take me up to the roof. There is something I want to confirm.\nMoon: Who are you to give me orders? (angry face)\nYe: (nerd face, finger raised) One jutte.\nMoon: Erm (nerd face, finger raised), and just like that, up we go.\nYe: Look, this skylight is broken. It is open, but not all the way, only wide enough for a radish to pass through.\nMoon: I think it is only wide enough for a crab to pass through. No, what I mean is, did the culprit smash the glass to get in because the skylight was broken?\nYe: Not to get in. Most of the glass is scattered on the roof, which means it was broken from the inside. And that raises a question. How did the culprit get in when the skylight was broken, without smashing the glass?\nMoon: Maybe there is a tunnel under your forge, or the culprit was hiding in the room beforehand.\nYe: Impossible. Either I am in this room, or the door does not open from this side, and there is no other way in. Stealing something from a place that cannot be entered, huh...\n\n* * * * * * *\n\nI flew very fast. The air rubbed against my body, producing a burning heat even more exhilarating than at the start. Only when my wings had gone numb did I stop and open my eyes, and a pure azure filled my view. Perhaps I had long since broken through the black canopy of the sky. And so I began to fall.\n\n* * * * * * *\n\nYe: Moonlight, have you ever heard this saying? Once you have eliminated everything impossible, the answer that remains...\nMoon: However unbelievable, must be the truth?\nYe: No (nerd face, finger raised), what I mean is, we should go back and see whether we have missed any clues. I noticed something just now. Let's take a careful look at that horribly broken skylight, folks. Why can it only open wide enough for a radish or a crab to pass through?\nMoon: Lemme see... Ooh, there is a part missing. (nerd face, finger raised)\nYe: The structure of this skylight is symmetrical, and there is an identical part on the other side. Try taking it off.\nMoon: Without the power of tools, I cannot prevail even giving it my all.\nYe: If the part on that side had fallen off and broken on its own from years of neglect, then the part on this side should not be this sturdy. That means the part was removed by someone. The skylight did not have just one state. It was fine first and broken afterwards!\nMoon: My thinking has been turned around! (nerd face, finger pointing down)\nYe: Hear my deduction! The culprit first came in through the working skylight, then removed the skylight part to break it, hid in the room, waited for the right moment to steal the wing sword, smashed the glass and fled, and then used the chaotic scene to cover up the tampering with the skylight, creating an "impossible" theft. Gwah, how utterly brilliant, yah!\nMoon: Erm (nerd face, finger raised), I object. If the skylight was okie-dokie to begin with, why did the culprit not simply steal it right away, instead of removing a part, hiding, and smashing the glass?\nYe: (nerd face)\nMoon: (nerd face)\nYe: To create an "impossible" theft?\nMoon: Then I still think a phantom thief coming down from above is cooler.\n\n* * * * * * *\n\nI landed with a tremendous crash, drawing a crowd of onlookers. Through the din I heard them saying things like "We missed you, Fall-Proof King" and "Kids, I have a wing sword". After listening for a while, I understood one thing:\nKids, I am the wing sword, and I am back\n\n* * * * * * *\n\nMoon: Erm (nerd face, finger raised), is it just possible that there was actually no culprit at all, and the wing sword simply "took wing and flew away" on its own?
journal.document.legends_story.nosync_enter.title=SmallLeaf 4: Alien Invasion - No-Challenge Promo Short
journal.document.legends_story.nosync_enter.body=The sun was setting in the west, gorgeous fiery clouds filled the sky, and the clamor of voices drifted in from the street. Another day is almost over, SmallLeaf thought, and he checked the time. What the heck, how was it only 12 noon. SmallLeaf looked up at the sky again. That was no setting sun, but the giant eyeball of the Old God. Countless god's larvae were falling from the sky, and the sounds of battle outside rose and fell without end.\nEverything went black before SmallLeaf's eyes and he dropped dead on the spot. In the darkness he heard an innocent voice.\n"Generally speaking, once a save file ends, everything in that save is erased and ceases to exist."\n"Who are you?"\n"But the Old God is simply too powerful. When a save file ends, part of His power and experience is retained."\n"Who asked you."\n"In other words, every failed and repeated run lets the Old God build up power, and one day He will affect reality. The way to break this is to use different weapons to shatter the repeating cycle, which is to say..."\n"Are you deaf."\n"Exotic! Weapons!"\nSmallLeaf suddenly came back to life. The voice drifted away from him, growing fainter and fainter in his memory. Only Exotic! Weapons! kept surging and echoing in his heart, refusing to fade. So SmallLeaf immediately rallied the people to take up different weapons, and with the help of a mysterious power, the crowd charged at the Old God in the sky. The instant the two sides collided, a flash of light burst forth, and the world seemed to sink into a murky, primordial chaos. And within this chaos, people heard thunder, rain, the sound of falling snowflakes, and the roar of a snow leopard. Then there was nothing at all, and the innocent voice rang out once more:\n"Pixel Dungeon is a traditional roguelike dungeon crawler. In the game you become a dungeon hero and overcome countless hardships to obtain the Amulet of Yendor. Every run is completely different, letting you feel the thrill of combat, while the rich variety of character choices, class abilities, gear combinations and item uses brings you unexpected delights. Pixel Dungeon is a game of infinite possibilities. Let us stop setting limits for ourselves, stop clinging to a single way of playing, happily explore and discover, and use the power of Exotic! Weapons! to defeat the Old God and save the world!"
journal.document.legends_story.body_sendsun.title=SmallLeaf 5: Plunging into the Blazing Sun
journal.document.legends_story.body_sendsun.body=SmallLeaf woke up on a desolate land. Across the flat, endless wilderness there was nothing to be seen but dry brown earth, sand and gravel. The sky was not yet fully light. A cobalt-blue dome enveloped the lonely SmallLeaf, and the chill seeped unhindered into the marrow of his bones. SmallLeaf lay on the ground doing nothing, and closed his eyes again. He wanted to sleep a little longer.\nSmallLeaf just kept lying there until light began to glow at one corner of his vision. He opened his eyes. The sun was slowly rising over the horizon, its rays sweeping across the land and stretching his shadow so long that its end could not be seen, as if to draw out his very soul. Scorching waves of heat came rolling in. SmallLeaf got up and gazed through the gaps between his fingers at that dazzling ball of fire. Ah, how warm. If only he could catch it, he would never have to fear the cold again. And so SmallLeaf ran toward the sun. As the only living thing between heaven and earth, his footsteps made the silent world tremble.\nSmallLeaf ran without a moment's rest. His strides were long enough to cross a grand canyon, and the thud, thud of his footsteps resounded through the heavens louder than thunder. Sweat kept pouring from SmallLeaf's body, and he gradually grew dizzy, hotter and hotter. Yet the sun was still far away at the edge of the sky, out of reach.\nJust as SmallLeaf was about to collapse, a river appeared before him. Its clear water flowed quietly, glittering with an enchanting radiance in the sunlight. It ran across ground full of sand and soil yet picked up not a speck of dust, so unreal that it seemed to have been forcibly inlaid into the earth. The sweet scent of water washed over SmallLeaf. Long since parched beyond endurance, he bent down and gulped the water, glug, glug. SmallLeaf drained the river in one go, and the damp riverbed was instantly baked dry by the sun, as though the river had never existed. Rested, SmallLeaf went on running toward the sun.\nTime ticked away, minute by minute, second by second - only when the sun was right above his head did SmallLeaf realize this fact. Now, whichever way he went, he could get no closer to the sun. SmallLeaf raised his head and stared blankly at the sun through his fingers. Then he leapt with all his might, whipping up a gale with a whoosh, stretched his arm out straight, and grasped toward the sun.\nSmallLeaf's sweat fell from his body, pattering down so that it seemed to be raining on the ground. He felt his body grow heavier and heavier. He stopped in midair, then gradually began to fall. With a boom, SmallLeaf landed, his feet splitting a great crack in the earth. In the pitch-black fissure something glinted as it drew near, and then flew out. SmallLeaf reached out and caught it. Looking closely, he saw that it was a wing sword. The wing sword flew upward, carrying SmallLeaf along with it toward the sun.\nAfter flying for who knows how long, SmallLeaf looked up, and the sun was right before his eyes. But before SmallLeaf could reach out, the wing sword suddenly stopped, and SmallLeaf began to fall again. The wing sword had flown very high and SmallLeaf fell very fast. He hit the ground and, to no one's surprise, died. But his body turned into fertile soil, his blood into clear rivers, and his body hair into trees and radishes. If anyone ever chases the sun again, they will have no fear of thirst when they pass through this Radish Garden.\nAs his consciousness gradually faded, SmallLeaf heard a voice:\n"When the Caiyu Donkey was little he chased the sun with a wing sword flew up into midair and because there was nothing to hit his levitation turns ran out so he dropped to the ground and died from the fall and his body turned into the Dreadish Garden and grew dreadishes to quench the thirst of those who chase the sun in the future."
journal.document.legends_story.cut_future.title=SmallLeaf 6: Taking Back the Future
journal.document.legends_story.cut_future.body=Bleary-eyed, SmallLeaf struggled up from his bed. Numbness and aching spread through his whole body, and his memory was hazy too, as if a wing sword were flying wildly around inside his head and blending his brains. SmallLeaf squinted out the window. Ah, a blue sky, not seen in so long. What a lovely color, and yet something felt off. Why? He could not quite remember.\nAfter loosening up his limbs a little, SmallLeaf climbed out of bed and crashed through the door as if doing drunken boxing. A familiar, lively atmosphere washed over him. That's right, this was the entrance area of the Radish Dungeon that he managed, and he lived right next to it.\n"Yo, I was just about to call you. You're up this early." Someone greeted him kindly. It was the sewer crab.\n"Say, you Caiyu Donkey, you've gone and stolen someone else's dungeon designs again and added them to your Radish Dungeon, haven't you." Allegedly a little less kind, this one. A vaguely familiar conversation. Next, he was supposed to answer something like...\n"When it is a designer's business, how can you call it stealing? We are all friends here. This is called learning and borrowing from one another."\n"Heh, just kidding. Grab a seeking spear and come raid the dungeon with me."\n"No thanks, I have other things to do."\nThe crab left, twirling his spear. Apparently, if you get too cocky you get elbowed flying by the earth dragon. It seems even raiding should be done in moderation.\nOther things to do... what were they again? Oh right, he still had to go and find Ling. SmallLeaf set off once more with his muddled steps to look for Ling.\n"Ling! That, uh, technical problem with the Radish Dungeon, is it still not solved?"\n"Don't rush me, I'm on it, I'm on it. Your pigeon bro here is fighting a lone, cooing battle, you know."\nWhat a wonderful Big Ling! Even with his own Magic Ling Dungeon to keep him busy, he never forgets to help the Radish. At this thought, SmallLeaf shed tears of emotion and secretly resolved that he would surely become someone like Big Ling one day. (Doubtful)\nThere seemed to be nothing left to do, so he might as well go back and tinker with his little gadgets. SmallLeaf returned home. He recalled that he had not had much design inspiration lately and had just been making decorative gems. SmallLeaf thought this was great, since they made his equipment look very stylishly designed, but everyone else said they were all flash and no substance. What they did not know was that SmallLeaf had no money to buy gems at all. These were all ground from colored glass, with neither flash nor substance. SmallLeaf did not care.\nThe day passed quickly. SmallLeaf fell into a deep sleep.\n* * * * * * *\nSmallLeaf got up from his bed and looked out the window. A blue sky, same as always. SmallLeaf got out of bed and went outside.\n"Grab a seeking spear and come raid the dungeon with me."\nNo thanks. Watch out for the earth dragon.\n"Don't rush me, I'm on it, I'm on it. Your pigeon bro here is fighting a lone, cooing battle, you know."\nSmallLeaf! Sheds tears...\nGrinds glass.\nThe day passed quickly. SmallLeaf fell into a deep sleep.\n* * * * * * *\nSmallLeaf got up from his bed and looked out the window. A blue Defect, same as always.\nA Defect?!\nSmallLeaf was startled wide awake. He seemed never to have seen the robot in front of him before, and yet it felt somehow familiar. As SmallLeaf kept thinking, the loose ends that his memory had let slip were pulled out like a thread, and he soon remembered everything.\n"Could this be the Old God's..."\n"Correct," said the Defect.\n"Long ago, the Old God invaded the surface, and people fought a long war. Seeing no hope of winning a head-on struggle, the Old God began endlessly looping a certain day of the past, gradually tampering with people's perception so that they would accept His existence. I awoke because I sensed the chaotic, frenzied energy of the Old God's attempt to control time. To stop Him, I launched an attack, but..." The Defect broke off, and a gloomy look came over his face.\n"But?"\n"(nerd face, finger raised) My Lightning orbs pick their targets at random, and one of them zapped you."\n"So you are pure trash, then. No, what I mean is, why were you not affected by the Old God?"\n"I was once caught in an infinite loop between the bottom of the Spire and the middle of the Spire, once every 4 minutes. In the end I broke it and raised that number to 1.5 hours. Looping tricks do not work on me."\n"What do we do now?"\n"In this looping world, I can sense shifts in the 'world line', which is to say I know which way my orbs will attack. My White Noise and I have no end of great stories about that... Anyway, you do some different things to shift the world line onto the one where the attack goes toward the Old God. I will take care of channeling Dark orbs and stacking Focus, and while the Old God still has not noticed us, we will finish Him in a single blow!"\nHaving said this, the Defect fished a Hologram out of his pocket, handed it to SmallLeaf, and gave further instructions: "Upgrade slots are scarce, and I still need to upgrade Zap and Dualcast, so this Hologram is not upgraded and can only be used once. I will contact you when the world line shift is complete. Good luck!" With that, the Defect vanished without a trace. He had probably run off to some hidden spot to channel orbs.\nAs SmallLeaf was pondering what to do, someone burst through the door.\n"Donkey! Grab a seeking spear and come..."\n"Erm! (nerd face, finger raised) Why not try this instead? It will make you fly!" SmallLeaf handed the wing sword to the crab and sent him down into the dungeon.\nSmallLeaf remembered that the crab, playing with the seeking spear, had been elbowed into a chasm by the earth dragon and fallen to his death. With the wing sword this time, things might change. Sure enough, with the divine power of infinite levitation the crab ignored traps, strolled over chasms, freeloaded the levitation rooms, humiliated the spiders, and blocked the earth dragon's elbow that sends people crashing down, sweeping through the dungeon as if no one stood in his way. However, the world line had still not been rewritten into the correct one.\nSeeing no reaction from the Hologram, SmallLeaf set off to find Ling.\n"Ling! That, uh, technical problem with the Radish Dungeon, is it still not solved?"\n"Don't rush me, I'm on it, I'm on it. Your pigeon bro here is fighting a lone, cooing battle, you know."\n"I have a plan!" No sooner had he spoken than SmallLeaf summoned Xinmeng.\n"I am here to help you!" Working together, the two quickly solved the technical problem.\nThe Radish Dungeon updates today!\n\n\n(The above is merely Yelv's fantasy. Xinmeng stopped working on Radish long ago.)\n\n\n\nSmallLeaf went home and, gazing at the colored glass before him, sank into thought. What different thing could this glass be used for? In the end SmallLeaf made glass swords in seven different colors. Damn, they looked cool. But the world line still did not change.\nThe day passed quickly. SmallLeaf fell into a deep sleep.\nIn the end the crab, thanks to his clumsy fingers, mis-tapped, rammed into a wall of fire, could not reach any water, and burned to death.\n* * * * * * *\nSmallLeaf woke up. Perhaps because he had discovered the truth, or perhaps thanks to the Defect, his memories were still intact. No sooner had SmallLeaf stepped outside than he slipped and, with a headbutt, smashed his colored glass to pieces, four panes stacked together at that. What a hard head. While SmallLeaf was still in a daze, the Hologram suddenly responded: "The world line shift succeeded. I will be right there!" And then it was Exhausted. SmallLeaf could not help wondering: if every card got Exhausted the moment it was played like this, what would there be left to play once they were all gone?\nWith the astonishing speed gained from years of running through the bottom of the Spire, the Defect soon met up with SmallLeaf. His whole body radiated a fearsome, powerful dark energy that made one feel as if "Here it comes!" were echoing in one's ears. It seemed his setup was complete.\nThe Defect pointed at the sky and said: "The Old God has been hiding up in that sky all along. But controlling the workings of the world takes enormous energy, so He has not noticed that we, tiny as specks of dust, have already awakened."\nThe Defect took his stance, gathered energy, and prepared to Evoke his orbs. "Now let us specks of dust annihilate Him in a single blow!"\nA tremendously destructive surge of energy rose up, devouring the light wherever it passed. It collided violently with something in the seemingly empty sky, and then stopped.\n"Not good!" As the Defect cried out, the sky turned blood red and a giant eye hung within it, its throbbing blood vessels looking as if they would shake the earth to pieces. The Defect's Dark orb, a hair's breadth from the Old God, had met the Old God's laser head-on. It seemed the sneak attack had failed, and He had reacted in time.\n"A whole day of setting up and you cannot even match their opening move. You really are a noob, huh. No, what I mean is, if even you cannot stand against the Old God, what are we supposed to do!"\n"If it were them, they would surely find a way..." The Defect lowered his head in anguish.\nThings kept getting worse. On the main front, the Defect's Dark orb was locked in an evenly matched struggle with the Old God's laser. Meanwhile, countless god's larvae were falling from the sky. The moment they hit the ground they converged on the Defect from all directions, and the sound of their crawling, drawing ever closer, made one's skin crawl. Amid this scene of despair, some corner of SmallLeaf's vision gave off a wondrous glow. SmallLeaf turned to look, but before he could take in the sight, a dreamlike image filled his view.\nIn the image, the Defect cupped his hands in salute to a woman in purple and said: "I wanna learn Rushdown!" The woman in purple shook her head and spoke: "No, it is not yet enough. You still lack that item..." "That item is..."\nSmallLeaf returned to reality. What met his eyes was the colored glass he had smashed or, to be precise, four panes of colored glass in red, green, blue and purple. Their shards overlapped one another and, in a peculiar arrangement, cast a strange light. The Defect was bathed in this light, and three figures gradually appeared at his side.\nA woman in purple holding a long staff. "Watch!" The Watcher opened her hand. In it were Rushdown x3, Tantrum, Inner Peace, and a lotus bullseye. "I grant you infinite cycling and energy!"\nA weirdo wearing the skull of a strange beast. "Hunt!" The Silent took Wraith Form and After Image out of her cloak. "I grant you the strongest, unbreakable defense!"\nA warrior clad in armor, gripping a long blade. "Fight!" The Ironclad held just a single card in his hand. He reached out toward the Defect, and that card was Dual Wield. "I grant you endless Power cards!"\nThe Defect accepted it all. In an instant his POWER suddenly surged, soared, and skyrocketed, and his Focus shot all the way up to nine nine nine! The Dark orb, which had been gradually losing ground, flared up and pressed ever closer to the Old God. Anything touched by this energy would absolutely be blasted to ashes, without a speck left, yah!\n"Gwah!" Another cry of astonishment! What on earth could astonish a Defect like this yet again! The Dark orb, though pressing ever closer to the Old God, was also veering off course. The world line had shifted! Where was the Dark orb running off to?! It was precisely because the Defect had gained this incomparably mighty power that the world line had shifted. If you ask who could astonish the Defect once more, the answer is the Defect himself!\nThe god's larvae grew ever more numerous, scrambling to pounce on the Defect. Though they could not harm him, they made his chances of hitting the Old God ever slimmer.\n"Even with all this, we still cannot stop the Old God?! Damn it!" The Defect clenched his fists and roared.\n"We will win." Along with a familiar voice, yet another figure drifted out of the prism. Could it be that the Spire crew had a fifth member? The figure gradually came into focus. It was none other than a blue Defect!\n"You are? Me! The Defect?!" The third astonishment! Even looking back over the Defect's whole life up to now, there could hardly be anything more bizarre and convoluted than this! The second Defect thrust a fist at the sky and opened his hand. In it was a Lock-On.\n"Even adding more damage now is no use anymore!"\n"I am the you of the past." The second Defect aimed the Lock-On at the Old God, and only then did the Defect see clearly: that was not Lock-On, it was Lock-On (old)! That miraculous mark which turns the orbs' random attacks into precise attacks!\n"But do not miss me. Go, march on toward the future!"\nThe Old God was marked, and the Dark orb's energy at once locked back onto the Old God and rushed at Him. How could His feeble laser possibly withstand that!\n"Rewrite that unjust fate!"\n\n*Now playing: Rerolled seeds for 1 hour and finally got two elites for free, and one of them was the burning one!\n\n*Now playing: 20 minutes of save-loading until White Noise gave Echo Form, then utterly wrecked the Slime Boss!\n\n*Now playing: 2 hours of save-loading to tune the card plays, precisely controlling which cards Creative AI generates. The only world line where the Heart can be killed by the narrowest of margins!\n\nThe instant the Dark orb touched the Old God, darkness shrouded the world, and then time began to collapse and warp - or rather, it was probably beginning to return to normal. In that darkness which had swallowed everything, SmallLeaf saw the Defect's back, standing tall.\nThe Defect, facing forward, takes one firm step--
journal.document.legends_story.atri.title=Jianghu Showdown: The Legend of the Radish Seed
journal.document.legends_story.atri.body=Moonlight had only just passed by the Radish Garden when he heard that the garden's treasure, the Radish Seeds, had been seized. According to the garden folk, the Radish Seeds were a treasure that the first garden master found while roaming the jianghu in his youth. Having endured eighteen lightning strikes and twenty-four months of frost, a seed need only be kept out of the light for thirty double-hours to grow into a radish that reaches the heavens. They have been handed down from one garden master to the next, and may only be used when the garden is short of food. But the Radish Garden is a blessed plot of land, so to this day no one has seen what this "radish that reaches the heavens" actually looks like. And this time the Radish Seeds were seized precisely because Sanren, master of the Tranquil Garden, wanted to see for himself whether the Radish Seeds were really as miraculous as the legends say.\nSeeing this, Moonlight at once announced to the Radish Garden that he would storm the garden alone, defeat Sanren with a single radish, and take back the Radish Seeds. Everyone was fired up at the news, but on second thought, Moonlight was not one of the Radish Garden's own. People had heard of his skill with the jutte, but only as rumor. Besides, this time he meant to defeat Sanren with a single radish, and Sanren was no pushover either: his corner strikes with the rapier were nothing short of superhuman. At that thought, everyone lost their confidence again.\nMoonlight set off. He left his pack at the Radish Garden, put on a straw hat, draped a burlap cloak over his shoulders, and swung himself onto the Caiyu Donkey. He truly brought nothing else, only a radish tucked at his waist, and headed for the Tranquil Garden. Try as they might, people could not see how he could beat Sanren.\nRiding the Caiyu Donkey, Moonlight soon arrived at the gate of the Tranquil Garden. The guard at the gate, seeing how he was dressed, thought nothing of him, raised his spear, and stepped up to search him. Moonlight kicked off the ground, stepped on the Caiyu Donkey's back, used the momentum to vault over the guard, and with a flourish of his cloak slipped in through the gate, leaving the guard standing there dumbstruck. The Caiyu Donkey, having had its back stepped on, gave a displeased bray, brushed past the guard, and followed him in through the gate.\nAs soon as he was through the gate, Moonlight shouted: "Where is Dungeon Sanren? I, Moonlight, have come to seek your instruction!" His voice drew quite a few people to stop and watch. Some said that, dressed like that, he was plainly a great hero from the streets. Others said he was clearly a madman. The quiet garden grew lively all at once, and the Caiyu Donkey joined in the fun, braying at the top of its lungs: hee-haw-- hee- haw-.\n"Dungeon Sanren is here!" shouted a burly man in cloth armor, standing on a hilltop. "Sanren, I have come to collect the Radish Seeds." "Big words!" said Sanren, leaping down from the hilltop. Moonlight straightened his back, cupped his fist in salute to all around, and said: "I am not asking for them for free. How about I trade this radish of mine for them? It is the very finest of the Radish Garden." He jiggled the radish hanging at his waist.\nThe crowd roared with laughter. However good that radish of yours may be, could it possibly compare to the Radish Seeds?\n"You do not know how good this radish is. The radishes of the Radish Garden, ah, they are big, juicy, full of flavor and packed with punch. Our Caiyu Donkey here cannot go a single day without eating one." Moonlight patted the Caiyu Donkey beside him, and it brayed again: hee-haw-- hee- haw-.\nThe crowd roared with laughter again. A radish that you feed to a donkey, and you have the nerve to bring it here?\n"Do not take it lightly. This radish is also a fine, handy weapon. Saber, spear, sword, halberd, fork. Whip, sword, hammer, hook, sickle. Even a keen blade that cleaves gold, severs jade and cuts iron like mud is no match for this one radish of mine."\nThese words roused everyone in the crowd, each of them itching to have a go. Sanren shouted the crowd back, drew his rapier, and laughed loudly: "Let me try." Before the words had even faded, he had already launched a lunge and shot up to Moonlight.\nJust as the thrust was about to land, Moonlight's figure drifted aside. He dodged with a light sidestep, then slid the radish along the blade and turned the rapier away. Sanren had not truly meant to hurt him and had planned to stop the moment he made contact, but now he had not touched so much as his opponent's shadow. Unable to save face, Sanren's face turned as dark as you-know-what. His swordplay grew fierce, and he pressed in step by step.\nRadish in hand, Moonlight parried and maneuvered against Sanren, and actually kept him from closing in. Someone shouted: "Is dodging all you can do?" At that, Moonlight tore off his cloak and tossed it into the air to hide his figure, then followed up at once with a leg sweep aimed at Sanren's lower body. Sanren was taken aback for a moment, but he was not frightened. On the contrary, he saw through Moonlight's attack and, with a move called Cloud Ladder Ascent, stepped on Moonlight's leg and used it to spring up above him. Moonlight's figure was completely exposed. Sanren flicked his hand, and the rapier shot toward Moonlight, charged with force. It pierced clean through the radish and nearly reached Moonlight's throat. Before Sanren could gloat, Moonlight pushed with his palm and let go of the radish, which slid along the long, slender blade all the way until it slammed into the guard. Greatly alarmed, Sanren steadied his balance in midair and tried to fling the radish off with the motion. But a radish of the Radish Garden, ah, is of superior quality with firm, dense flesh, and so it stayed stuck fast on the rapier. By the time Sanren landed, the rapier, robbed of its agility by the extra weight, could not be raised in time. Moonlight had long since closed in on Sanren, two fingers resting on a pressure point.\nThe crowd went wild. Sanren pulled the radish off and tossed it to the Caiyu Donkey to eat, then sheathed his rapier, cupped his fists in both hands, and said: "I am impressed, truly impressed! I never expected Brother Moonlight to be so remarkable in both skill and wits!" Feeling in his heart that the Radish Seeds were not something an ordinary person could possess, he gave up that idea and hurriedly ordered someone to bring the Radish Seeds and hand them to Moonlight.\nMeanwhile, everyone in the garden, high and low, was amazed to see that Moonlight had entered the tiger's den alone and brought back the Radish Seeds without a scratch. They called the garden master to look: genuine, without a doubt. They counted them: one, two, three, not one missing. That night, the Radish Garden held a great banquet to thank Moonlight, inviting every notable in the garden to keep him company, and it did not break up until midnight. Moonlight would stay at the Radish Garden for the time being and set off again in the morning.\nIn the morning, as the sun rose in the east, Moonlight packed his things and prepared to continue his journey. Suddenly a visitor arrived, covered in dust, in a frantic hurry to speak with the garden master. It turned out he was a member of a certain garden in the north, one that had once done the Radish Garden a kindness. He had come because strange omens had appeared in the sky over his land and a great drought had become a disaster beyond their power to resolve, and he hoped to borrow the power of a Radish Seed to ease the situation for a while. After some explanation, the master of the Radish Garden bowed solemnly and handed over one Radish Seed. Moonlight happened to be going the same way, so he traveled with him, and the whole garden watched them leave.\nUpon arriving, Moonlight found that this drought was extremely abnormal: it was high noon, yet the sky was dim, and the earth was cracked, yet it would not take in a drop of water. So Moonlight led the people, carrying the Radish Seed, to an open space in the garden and waited for it to work its miracle. Counting the time spent on the road, it had been about thirty double-hours.\nMoonlight felt a tremor in his palm, hastily opened his hand, and fled backward. The Radish Seed fell into a crack in the ground, and at once the earth shook and the mountains swayed. Moonlight could not get clear in time and, amid the screams of the crowd, was thrust up into the clouds. Only when everything had gone still did Moonlight loosen his grip a little and look down. This was no radish at all. It was plainly a giant spire reaching to the heavens. At some point a figure had appeared at the other end of the spire's top. Moonlight recognized this figure: he had once been a mysterious master ranked fourth under heaven, who one day abruptly vanished without a trace. Some said his lifespan had run out and he had died, and some said he had attained the Way and ascended to become an immortal. But no one knew his real name, and everyone simply called him "Defect".\n"We will win," said the Defect, raising a hand as he spoke. At once lightning flashed and thunder rumbled all around, and a rainstorm came pouring down. "Problem solved." With that, the Defect's figure began to drift and slowly faded away.\n"Defect! Where on earth are you?"\n"There is no need to look for me. I am everywhere. Look to every bolt of lightning, every snowflake, every drop of rain, every patch of darkness. That is where I exist."\nBy the time Moonlight came to his senses, he was already back on the ground. The giant spire had vanished, and the people were cheering the coming of the rain.\nA gleam of light welled up on the horizon.
journal.document.legends_story.lvbuyorange.title=Caiyu Fables 1: The Caiyu Donkey Sells Pomelos
journal.document.legends_story.lvbuyorange.body=The Caiyu Donkey was a pomelo grower. One day he walked down the street with a full basket of pomelos on his back, saying "Buy a pomelo" to everyone he met. But the pomelos were too heavy, and before long the Caiyu Donkey collapsed from exhaustion, so he had to call it a day and go home.\nOn the second day, the Caiyu Donkey loaded the pomelos onto a small cart and came to the street again, saying "Buy a pomelo" to everyone he met. But the sun was fierce and the pomelos all shriveled in the heat. Seeing how poor the pomelos looked, people did not want to bother with him. Once again the Caiyu Donkey sold no pomelos, so he had to call it a day and go home.\nOn the third day, the Caiyu Donkey fitted a parasol to the cart and came to the street, saying "Buy a pomelo" to everyone he met. Someone asked the price, and the Caiyu Donkey shouted: "A hunnerd yuan each!" Everyone gave him a kick and cursed: "Shoo, shoo, where did this wild donkey come from." The Caiyu Donkey had to call it a day and go home.\nOn the fourth day, the Caiyu Donkey came to the street, saying "Buy a pomelo, twenty yuan each" to everyone he met. That day the Caiyu Donkey finally sold some pomelos, but only a very few. A fruit vendor with a stall nearby told him that he ought to set up a stall where the crowds were biggest. People would buy on their own when they felt like eating, while wandering around and pestering everyone only annoys them. The Caiyu Donkey took his advice, called it a day and went home, and would give it a try tomorrow.\nOn the fifth day, after improving his business methods day after day, the Caiyu Donkey finally succeeded in getting his back stepped on by the city management officers. His big fruits were gone too, and he was fined more than seven hundred.\nThis story teaches us that when doing business, you must beware of being set up by your competitors.
journal.document.legends_story.lvgold.title=Caiyu Fables 2: Caiyu Pans for Gold
journal.document.legends_story.lvgold.body=The Caiyu Donkey was an idler with nothing to do. Once, while strolling by the river, he noticed something glittering in the water. He fished it out and found that it was, of all things, a grain of gold. From then on the Caiyu Donkey spent every day soaking in the river panning for gold, until one day he finally slipped, fell so hard that everything went black, and drifted off downstream. When the Caiyu Donkey woke up, it was already night, and he had no idea where he had drifted to. Suddenly an old man appeared on the riverbank. Without a word, he pointed at a spot on the surface of the river where something was glittering. Thinking it was a grain of gold, the Caiyu Donkey hurried to scoop it up but came up with nothing. It was only the reflection of the stars. The old man shook his head, beckoned the Caiyu Donkey to his side, and pointed again at the reflection of the stars on the water. Gazing at this peaceful, serene scene, the Caiyu Donkey seemed to grasp something. "You mean..." "I mean, you look just like that monkey who tried to fish the moon out of the water."\nThis story teaches us to keep our eyes peeled, or else we will be made a monkey of.
journal.document.legends_story.lv_trigger.title=Caiyu Fables 3: The Donkey Goes into the Tiger's Stomach
journal.document.legends_story.lv_trigger.body=The Caiyu Donkey was a donkey living in the mountains. One day it sought out the tiger, boasted that it commanded more awe than the tiger did, and told the tiger to follow behind it and watch. Then, the moment the Caiyu Donkey turned its head, it was eaten.\nThis story teaches us that our animal friends should not get close to their own predators like that fool of a Caiyu Donkey.
