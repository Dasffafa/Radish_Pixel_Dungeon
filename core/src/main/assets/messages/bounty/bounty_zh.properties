bounty.bounties.hint_prey_albino_rat=白化老鼠会在夜间的平原与草地上出没，雪地里则不分昼夜。
bounty.bounties.hint_prey_gray_wolf=灰狼入夜后在苔原、雪原和山麓成群狩猎。
bounty.bounties.hint_prey_brown_wolf=棕狼夜间在森林里狩猎，两三只一起。
bounty.bounties.hint_prey_bat=吸血蝙蝠在黄昏和夜里飞过森林与山麓。
bounty.bounties.hint_prey_yeti=雪怪游荡在雪原、苔原和山地之间。它们数量稀少，出手极重。
bounty.bounties.hint_prey_snake=蛇不分昼夜守着沼泽，入夜后也出没于沙漠。
bounty.bounties.hint_prey_scorpio=巨蝎白天在沙漠里狩猎。
bounty.bounties.hint_prey_slime=史莱姆不分昼夜在沼泽里蠕动。
bounty.bounties.hint_prey_bananaspider=香蕉蜘蛛不分昼夜潜伏在沼泽里。
bounty.bounties.hint_prey_crab=螃蟹白天在海滩上横行。
bounty.bounties.hunt_reach=只有在本村的井%d步以内的击杀才算数。回来这块告示板领赏。

bounty.bounties.good_hide=兽皮
bounty.bounties.good_log=橡木原木
bounty.bounties.good_pine_log=松木原木
bounty.bounties.good_stone=粗石
bounty.bounties.good_thatch=茅草
bounty.bounties.good_clay=黏土
bounty.bounties.good_sand=沙子
bounty.bounties.good_copper=铜矿石
bounty.bounties.good_iron=铁矿石
bounty.bounties.good_fish=鱼
bounty.bounties.good_seeds=种子

bounty.bounties.hint_good_hide=鹿总会留下一张兽皮。狼、山羊和雪怪则只是有时留下。
bounty.bounties.hint_good_log=用斧头伐倒橡树。橡树生长在森林、草地和沼泽里。
bounty.bounties.hint_good_pine_log=用斧头伐倒松树。松树生长在森林和雪原上。
bounty.bounties.hint_good_stone=用镐子或石匠锤敲碎巨石或岩石。
bounty.bounties.hint_good_thatch=用镰刀割下高草。
bounty.bounties.hint_good_clay=用铲子挖开河岸或沼泽地。
bounty.bounties.hint_good_sand=用铲子挖开海滩或沙漠。
bounty.bounties.hint_good_copper=地底洞窟的岩壁间闪着铜矿脉的光。用镐子开采。
bounty.bounties.hint_good_iron=地底洞窟的岩壁间闪着铁矿脉的光。用镐子开采。
bounty.bounties.hint_good_fish=在河桥上干活的渔夫会卖他们的渔获，你自己用钓竿钓上来的生鱼也算数。
bounty.bounties.hint_good_seeds=踩过高草会掉出各种各样的种子。随便哪种都行。
bounty.bounties.gather_hand_in=把它们交到这块告示板上。

bounty.bounties.hint_deliver=把包裹送到%1$s的长老手上。那个村子在%2$s边，两口井之间相距%3$d步，限时约%4$d小时。长老白天坐在屋外，睡得早。走大路和借路石能让你更快到达。

