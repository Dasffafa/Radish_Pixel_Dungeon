bounty.bounties.rank_up_2=%1$s现在信赖你了：它的商人给你%2$d%%的优惠，守卫会告诉你猎物上次是在哪儿被人看见的。
bounty.bounties.rank_up_3=%1$s现在敬重你了：它的商人给你%2$d%%的优惠。

