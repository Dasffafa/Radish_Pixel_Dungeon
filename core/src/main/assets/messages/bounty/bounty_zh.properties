bounty.bounties.hunt_done=狩猎%s已完成：去它的告示板领赏吧。
bounty.bounties.gather_ready=它要的%1$s%2$s已经在你身上了：去它的告示板领赏吧。
bounty.bounties.parcel_due=送往%1$s的包裹还有大约%2$d小时到期。
bounty.bounties.parcel_late=送往%s的包裹已经逾期。那儿的长老仍会收下，却分文不给。
bounty.bounties.parcel_arrived=这里就是%1$s。包裹要交给这儿的长老，他家就在井的%2$s边。
bounty.bounties.delivered_late=你把寄往%s的包裹交了出去，但已经太迟，拿不到报酬。

bounty.bounties.villager_elder_way=那是给我们长老的。他家就是井的%s边那栋。
bounty.bounties.elder_thanks=从%s来的包裹？愿神保佑你，旅人。这是你的报酬。
bounty.bounties.elder_late=从%s来的？这早就该到了。我收下，可迟到的包裹没有报酬。
bounty.bounties.villager_thanks=我们长老不在。我会送到长老手上。是从%s来的吧？这是你的报酬。
bounty.bounties.villager_late=我们长老不在，而且这包裹也迟了。我会转交，但没有报酬。

bounty.bounties.guard_parcel=那包裹是给我们长老的。他家就是井的%s边那栋。
bounty.bounties.guard_rank1_0=又见面了，真好。%s欠你一个人情。
bounty.bounties.guard_rank1_1=啊，就是那位在这儿帮了不少忙的人。欢迎回来。
bounty.bounties.guard_rank1_2=今天挺清静。去看看告示板吧，总有活儿干。
bounty.bounties.guard_rank2_0=%s的朋友！有什么需要，尽管开口。
bounty.bounties.guard_rank2_1=有你在真好。你在的时候，路上都让人安心些。
bounty.bounties.guard_rank2_2=长老们都说你好。我也这么觉得。
bounty.bounties.guard_rank3_0=大家让一让：%s的英雄来了！
bounty.bounties.guard_rank3_1=这儿人人都在念你的名字。欢迎回家。
bounty.bounties.guard_rank3_2=井边有个位子，就是给你留的。
bounty.bounties.guard_prey=在找%1$s？我刚才在%3$s边%2$d步外还看见几只。
bounty.bounties.guard_prey_none=刚才附近没有%s。晚点再来，或者往更远处找找。
bounty.bounties.beast_named=称为%1$s的%2$s
bounty.bounties.beast_wolf=巨狼
bounty.bounties.beast_yeti=雪怪长老
bounty.bounties.beast_scorpion=巨型蝎子
bounty.bounties.hint_beast=一头有自己名号的巨兽正在这个村子周围%1$d个区块内游荡，还会再待大约%2$d小时。在哪儿遇上就在哪儿杀了它，然后回这块告示板领赏。
bounty.bounties.beast_gone=狩猎%s结束了：那头巨兽已经离开。
bounty.bounties.guard_beast=在找%1$s？刚才有人在%3$s边%2$d步外看见它。
bounty.bounties.guard_beast_none=刚才没有%s的踪影。乡亲们说它就在这一带游荡。

bounty.bounties.board_head=%s的告示板。
bounty.bounties.board_empty=所有告示都已经被人揭走了。
bounty.bounties.board_guest=在共享游戏中，只有房主才能揭下告示或领取奖励。

bounty.noticeboard.name=告示板
bounty.noticeboard.desc=%s的告示板，上面搭着一个小小的顶棚。村子把各种活儿钉在这里：要猎的野兽、要收的货物、要送的包裹。走近它就能看。

bounty.parcel.name=包裹
bounty.parcel.name_to=寄给%s的包裹
bounty.parcel.desc=用纸包好、以麻绳捆扎的包裹。
bounty.parcel.desc_due=从%1$s寄来、用纸包好并以麻绳捆扎的包裹，收件人是%2$s的长老。还有大约%3$d小时到期。
bounty.parcel.desc_late=从%1$s寄给%2$s长老的包裹。已经逾期：那儿的长老仍会收下，却分文不给。
bounty.parcel.desc_forgotten=从%1$s寄给%2$s的包裹。已经没人在等它了。

