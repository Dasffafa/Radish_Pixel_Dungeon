###the rooms Warped adds: levels/rooms/warped, the two standard rooms, and everything that lives in them


###black market
actors.mobs.npcs.blackmarketdealer.name=黑市商人
actors.mobs.npcs.blackmarketdealer.desc=兜帽，一盏提得低低的灯，还有一双从不同时露在人前的手。柜台底下的东西是沿着镇上税吏不知道的路来的，而他希望它也从原路离开。
actors.mobs.npcs.blackmarketdealer.net_host_only=商人越过你，看向拿着钱袋的那一位。“一本账。一位客人。让你的朋友过来。”
actors.mobs.npcs.blackmarketdealer.opening=晚上好。把门带上。
actors.mobs.npcs.blackmarketdealer.provoked=这店不做那种事。你完了——在这儿，在任何地方都一样。
actors.mobs.npcs.blackmarketdealer.banned=话传得比你快。再不会有商人替你开张了。
actors.mobs.npcs.blackmarketdealer.gone_dawn=天光起来了。你再回头看去，摊位上已经没有人，也没有东西。
actors.mobs.npcs.blackmarketdealer.gone_hostile=商人走了。他花钱雇来的人没走。

actors.mobs.marketbodyguard.name=雇佣打手
actors.mobs.marketbodyguard.desc=夜里被雇来，就站在那个位置，就盯着你。皮甲是好皮甲，皮甲底下的疤比皮甲更老。他不会先动手，但这并不等于他收不了场。
actors.mobs.marketbodyguard.desc_hostile=不管先前是什么约定，都已经结束了，而且这一部分他是另外拿了钱的。
actors.mobs.marketbodyguard.line_a=要么买点什么，要么接着走。
actors.mobs.marketbodyguard.line_b=把手放到灯照得到的地方。

actors.mobs.collector.name=讨债人
actors.mobs.collector.desc=一个瘦削的身影，穿着催债的红，喉头扣着黄铜搭扣，眼神耐心，像是靠追回欠款吃饭的人。它不是循着踪迹找来的，是有人告诉了它你会在哪儿。\n\n它每落下一击，都会带走金币。它带着的东西——以及你付给这个市场的所有钱里相当可观的一份——此刻都在它身上。
actors.mobs.collector.arrive=你被注意到了。这一层的某处，有人正径直朝你走来。
actors.mobs.collector.lifted=讨债人的手收回时，带走了你%d金币。
actors.mobs.collector.settled=债已结清。不会再有人被派来找你——除非你给他们一个理由。

windows.wndblackmarket.greet=这里每样东西都是从什么地方掉下来的。这里没有一样带着收据。
windows.wndblackmarket.sky_shadowday=影曜日。正合我意。你会发现我很好说话。
windows.wndblackmarket.sky_fullmoon=今晚的月亮太多了。我本来根本不该出门，而你要为我的胆量付钱。
windows.wndblackmarket.sky_newmoon=没有月亮。这样的夜里，连还没有名字的东西也会易手。
windows.wndblackmarket.sky_fog=路上有场好雾。没人看见有东西落下来。来瞧瞧吧。
windows.wndblackmarket.sky_storm=我的人有一半不肯在这种天气里赶路。今晚的摊子很单薄。
windows.wndblackmarket.heat_close=白送你一句：已经有人开始打听你了。再做成一笔，他们就不打听了。
windows.wndblackmarket.heat_hunted=讨债人已经上路了。这不关我的事。你的钱在这儿照样好使。
windows.wndblackmarket.heat_tripped=那是多出来的一笔买卖。市场已经把讨债人派来找你了。
windows.wndblackmarket.wares=柜台底下
windows.wndblackmarket.contract=升品契约
windows.wndblackmarket.fence=销赃
windows.wndblackmarket.wheel=轮盘（%d金币转一次）
windows.wndblackmarket.contract_title=升品契约
windows.wndblackmarket.contract_info=三件_同类_且_同稀有度_的东西送上柜台。换回该类别的一件，_稀有度高一级_。是哪一件由不得你挑。它取三件中最低的升级等级，商人还要收一笔手续费。
windows.wndblackmarket.fence_title=销赃人
windows.wndblackmarket.fence_info=他按合法商店出价_一倍半_的价钱收下你懒得再背的东西，也不问它去过哪儿。若是_传说_级或更好的东西，他不用金币付账，而是用_杰作核心_。
windows.wndblackmarket.wheel_title=轮盘
windows.wndblackmarket.wheel_info=铁匠的稀有度轮盘，格子划得比铁匠本人厚道，而且用金币下注，不用核心。上面有一个格子是_黑_的。落进黑格的东西归庄家所有。
windows.wndblackmarket.fence_prompt=要销赃哪一件？
windows.wndblackmarket.fence_offer_gold=“%1$s。我能出_%2$d金币_，而且我从没见过你。”
windows.wndblackmarket.fence_offer_cores=“%1$s。这可不是论金币的东西。_%2$d颗杰作核心_，而且我从没见过你。”
windows.wndblackmarket.fence_yes=成交
windows.wndblackmarket.fence_no=留着吧
windows.wndblackmarket.fence_done=金币的响声还没停，它就不见了。
windows.wndblackmarket.wheel_prompt=要把哪件放上轮盘？

windows.wndmarketwares.title=柜台底下
windows.wndmarketwares.terms=点一下东西就能查看。你看到的，就是他愿意说的全部。_概不退货。_
windows.wndmarketwares.sold_out=柜台空了。“下周再来。”
windows.wndmarketwares.price=%d金
windows.wndmarketwares.tip_name=关于这一层的一句话
windows.wndmarketwares.tip_desc=他比修这一层的人更懂这一层。只要出个价，他就会替你把这一层每一道_隐藏门_都标出来。
windows.wndmarketwares.tip_found=他头也不抬地在你地图上标出了%d道隐藏门。
windows.wndmarketwares.tip_none=“这一层没有什么是你还没找到的。我不白拿钱。”

windows.wndtradeup.title=升品契约
windows.wndtradeup.info=三件同类，同一稀有度。点格子放入，再点一次取回。
windows.wndtradeup.sign=签约
windows.wndtradeup.empty=柜台上还什么都没有。
windows.wndtradeup.outcome=三件%1$s%2$s，换一件_%3$s_%2$s，等级+%4$d。手续费：%5$d金币。
windows.wndtradeup.signed=三件东西进了柜台底下。换回来的是%s。
windows.wndtradeup.pick_first=把什么放上柜台？
windows.wndtradeup.pick_more=再放一件同类、同稀有度的
windows.wndtradeup.family_weapon=武器
windows.wndtradeup.family_armor=护甲
windows.wndtradeup.family_missile=投掷武器
windows.wndtradeup.family_wand=法杖

windows.wndriggedwheel.info=你的%s就押在上面。有一个格子是庄家的。
windows.wndriggedwheel.spin=转动（%d金币）
windows.wndriggedwheel.seized_odds=庄家 %1$d/%2$d
windows.wndriggedwheel.seized=小球落进了黑格。商人的手合在你的%s上，就这么完了。
windows.wndriggedwheel.seized_result=庄家通吃
windows.wndriggedwheel.result=%s


###rival's gallery
actors.mobs.rivalstatue.name=对手雕像
actors.mobs.rivalstatue.desc=它是照着你的站姿铸出来的。握法是你的，架势是你的，而它手里的武器比你的好。
actors.mobs.rivalstatue.desc_weapon=它握着一件_%1$s_，那握法只有_%2$s_流派的大师才有。


###tempering forge
actors.mobs.npcs.temperinganvil.name=回火铁砧
actors.mobs.npcs.temperinganvil.desc=一张砧面磨得发亮的铁砧，离炉子近得能在上面煎蛋。在这儿干活的人是在事情做到一半时走的。
actors.mobs.npcs.temperinganvil.desc_cold=你的%s横放在上面，黯淡冰冷。
actors.mobs.npcs.temperinganvil.desc_hot=你的%s横放在上面，烧得发白。它不会一直是这个样子，也不该是。
actors.mobs.npcs.temperinganvil.desc_spent=一道裂纹贯穿砧面。它已经干完了最后一件好活。
actors.mobs.npcs.temperinganvil.net_host_only=铁砧上的活儿归主机来做。
actors.mobs.npcs.temperinganvil.place_prompt=把什么放到铁砧上？
actors.mobs.npcs.temperinganvil.placed=你把%s横放在铁砧上。
actors.mobs.npcs.temperinganvil.white_hot=%s在铁砧上烧得发白。
actors.mobs.npcs.temperinganvil.overheating=%s开始溅出火星。它在火里待得太久了。
actors.mobs.npcs.temperinganvil.cooled=%s自己慢慢柔和地冷却了。一无所获。
actors.mobs.npcs.temperinganvil.scorched=%s烧坏了。金属里原本有的某种东西，如今不在了。
actors.mobs.npcs.temperinganvil.blackened=%s发黑起皮。它里面本来也没有什么更精细的东西可失去。
actors.mobs.npcs.temperinganvil.tempered_line=%s在蒸汽的尖啸中淬火。它的一项品质达到了所能达到的极致。
actors.mobs.npcs.temperinganvil.tempered_step=%s在蒸汽的尖啸中淬火，向杰作又近了一步。
actors.mobs.npcs.temperinganvil.spent=砧面已经裂透。它再也吃不住另一件东西了。
actors.mobs.npcs.temperinganvil.opt_quench=在水槽里淬火
actors.mobs.npcs.temperinganvil.opt_take=取回来
actors.mobs.npcs.temperinganvil.menu_cold=你的%s冷冷地躺在铁砧上。冷金属什么也学不会。
actors.mobs.npcs.temperinganvil.menu_hot=你的%s烧得发白。这样的热度，只有在骤然终止时才值点什么。
actors.mobs.npcs.temperinganvil.burnt_hands=你用手把烧得发白的%s从铁砧上拿了下来。你做过更明智的决定。
actors.mobs.npcs.temperinganvil.trough_frozen=水槽冻得结结实实。里面没有能用来淬火的东西。
actors.mobs.npcs.temperinganvil.trough_dry=水槽是干的。
actors.mobs.npcs.temperinganvil.trough_warm=水槽温得像汤。%s叹着气浸了进去，没有尖叫，出来时也没好到哪儿去。

actors.blobs.coalbed.lit=煤燃起来了。
actors.blobs.coalbed.out=煤烧成了灰。


###breaker's bench
actors.mobs.npcs.breakersbench.name=拆解台
actors.mobs.npcs.breakersbench.desc=一张被狠狠砸了很久很久的台子，一端用螺栓固定着台钳，台面上横着一把大锤。台面下是个装着亮闪闪碎屑的漏斗：朝着核心攒了_%2$d份中的%1$d份_。
actors.mobs.npcs.breakersbench.desc_forgeday=今天大锤摸上去是温的。
actors.mobs.npcs.breakersbench.net_host_only=拆解台的活儿归主机来做。
actors.mobs.npcs.breakersbench.prompt=拆解什么？（碎屑 %1$d/%2$d）
actors.mobs.npcs.breakersbench.confirm=要彻底拆掉%1$s吗？可产出%2$s。
actors.mobs.npcs.breakersbench.confirm_upgrades=它的_+%d_也会一并消失。
actors.mobs.npcs.breakersbench.yes=拆了它
actors.mobs.npcs.breakersbench.no=这件不动
actors.mobs.npcs.breakersbench.yield_core=_%d颗杰作核心_
actors.mobs.npcs.breakersbench.yield_scrap=一份碎屑（_%2$d份中的%1$d份_）
actors.mobs.npcs.breakersbench.yield_scrap_core=最后一份碎屑：_%d颗杰作核心_
actors.mobs.npcs.breakersbench.yield_resin=_奥术树脂_
actors.mobs.npcs.breakersbench.yield_metal=_%d份液金_
actors.mobs.npcs.breakersbench.got_scrap=亮闪闪的碎屑哗啦落进漏斗：%2$d份中的%1$d份。
actors.mobs.npcs.breakersbench.got_resin=法杖顺着纹理裂开，渗出树脂。
actors.mobs.npcs.breakersbench.got_metal=它裂解成了%d份液金。
actors.mobs.npcs.breakersbench.got_core=台钳里留下一样又硬又亮的东西：%d颗杰作核心。
actors.mobs.npcs.breakersbench.got_core_forgeday=大锤像钟一样鸣响。台钳里留下了%d颗杰作核心。


###pedigree hall
actors.blobs.pedigreeward.shattered=你的手刚握紧其中一个，另外两个就在原地碎掉了。


###frozen cache
actors.mobs.iceblock.name=冰块
actors.mobs.iceblock.desc=一大块陈年老冰，清得能看进去，硬得敲得出响。
actors.mobs.iceblock.inside_0=里面冻着一样_长条_的东西，离表面只有一掌宽。
actors.mobs.iceblock.inside_1=正中冻着一样_圆滚滚_的东西。
actors.mobs.iceblock.inside_2=里面冻着一样_小巧_的东西，不比拳头大。
actors.mobs.iceblock.stage_0=摸上去是干的，冷得刺骨。
actors.mobs.iceblock.stage_1=它在冒汗，脚边积了一小滩自己的水。
actors.mobs.iceblock.stage_2=它已经塌到只剩一半高。撑不了多久了。
actors.mobs.iceblock.thawed=最后一点冰松开了%s。
actors.mobs.iceblock.broke_out=冰块在%s周围炸裂开来。
actors.mobs.iceblock.broke_potion=冰块炸裂开来——里面的%s也跟着碎了！
actors.mobs.iceblock.broke_scroll=冰块炸裂开来。原本是卷轴的东西，出来时成了纸浆。


###thermal spring
actors.blobs.thermalvent.desc=热水从很深很深的某处涌上来，上方的空气里满是浓重的水汽。
actors.buffs.springsoak.name=泉水的暖意
actors.buffs.springsoak.desc=泉水的热力已经透进了你身体里。只要待在水里，它就缓解你的伤痛，驱散你身上的寒意；离开水后，你带着的这份温暖大约抵得上%1$d度的御寒。它永远不会让暖和的日子更热。\n\n你走出水池时，会和任何人一样浑身湿透。\n\n剩余温暖回合：%2$d。


###the bellows
actors.blobs.bellowsdraft.desc=这里的空气在动，整片的空气，朝着同一个方向，而且已经这样动了很久很久。
actors.blobs.bellowsdraft.enter=一阵稳定的风顺着这条长廊吹下去，从门口直吹到远端的墙。它从不停歇。
actors.buffs.draught.name=身处风道
actors.buffs.draught.desc=你站在一阵吹向_%s_的风里，风势从不减弱。\n\n_顺着_风投出的东西会飞得更准、砸得更狠；_逆着_风投出则相反。\n\n悬在这里空气里的一切——毒气、烟、蒸汽——都会被_吹向下风处_，每回合挪一格，最后堆在远端的墙边。没有一样会再飘回来。
actors.buffs.draught.dir_0=东边
actors.buffs.draught.dir_1=南边
actors.buffs.draught.dir_2=西边
actors.buffs.draught.dir_3=北边
actors.mobs.npcs.bellowsvalve.name=瓦斯罐
actors.mobs.npcs.bellowsvalve.desc=一个齐人腰高的铁罐，接进墙里的管道，顶上有一个黄铜轮，还有一小片玻璃泛着绿光：它是满的。矿工们备着这玩意，用来清空一条长廊里的虫鼠。转动轮子，它就会一口气把自己放空，把长廊从这头到那头填满——然后风会把它造出来的东西带着，从门口那一头吹走。
actors.mobs.npcs.bellowsvalve.desc_spent=轮子已经转到底了，罐上的小玻璃一点读数也没有。它是空的。
actors.mobs.npcs.bellowsvalve.ask=玻璃泛着绿光：罐里装满了矿井瓦斯。转动轮子会把它_全部_一次放出，填满整条长廊——连你脚下站着的地方也算在内。风会从那里把它带走。\n\n务必别让自己站在自己的下风处。
actors.mobs.npcs.bellowsvalve.ask_yes=转动轮子
actors.mobs.npcs.bellowsvalve.ask_no=让它关着
actors.mobs.npcs.bellowsvalve.empty=罐子是空的。里面原本装的东西，已经去了风去的地方。
actors.mobs.npcs.bellowsvalve.opened=轮子在尖响中转开，长廊从这头到那头都绿了。


###elemental lock vault
actors.blobs.elementallock.wake_1=余烬符文饮下热量，醒了过来。
actors.blobs.elementallock.wake_2=白霜沿着第二道符文蔓延，直到它通体发白，它醒了。
actors.blobs.elementallock.wake_3=有绿色的东西在符文上生长，符文在它下面醒了。
actors.blobs.elementallock.wake_4=门前有了水，潮汐符文醒了。
actors.blobs.elementallock.opened=最后一道符文醒了。光之门像蜡烛一样熄灭了。


###hothouse
actors.blobs.hothouseglass.desc=头顶是玻璃，玻璃下的空气柔和得像春天的早晨，不管外面是什么时令。


###incubator nest
actors.blobs.nestbrood.desc_empty=稻草上压出的一个凹坑，两个拳头大小。它在等着什么。
actors.blobs.nestbrood.desc_egg=蛋深深埋在稻草里。在心里把它翻来覆去地想，你会说它经历过火%1$d次、霜%2$d次、毒%3$d次、闪电%4$d次。
actors.blobs.nestbrood.stir_fire=壳里有东西开始把热量顶回去。
actors.blobs.nestbrood.stir_frost=霜花在壳上绽开，壳里的东西翻了个身。
actors.blobs.nestbrood.stir_poison=壳变成了淤青的颜色，壳里的东西正在把那股浊气吸进去。
actors.blobs.nestbrood.stir_spark=壳在你指下噼啪作响。里面的东西醒了。


###counterweight vault
actors.blobs.counterweightplates.raised=地板下某处一块配重落下，栅栏升了起来。
actors.blobs.counterweightplates.dropped=配重从一块压板上移开，栅栏落了下来。


###squirrel's hoard
actors.mobs.hoardsquirrel.name=囤积松鼠
actors.mobs.hoardsquirrel.desc=一只猫那么大的赤褐色松鼠，其中大半是尾巴。这个洞里的每一颗种子都是用它那腮帮子运来的，而它记得每一颗。
actors.mobs.hoardsquirrel.snatch=松鼠醒了！它把腮帮子塞满就窜了出去。
actors.mobs.hoardsquirrel.gone=松鼠不见了，它带走的东西也跟着不见了。


###wayfarer's camp
actors.mobs.npcs.bedroll.name=铺盖卷
actors.mobs.npcs.bedroll.desc=某个人的铺盖卷，留在他们睡过的地方。毯子粗糙而干净，垫布是干的。不会有人回来取它了。
actors.mobs.npcs.bedroll.net_host_only=夜晚属于整支队伍。只有主机才能把它睡过去。
actors.mobs.npcs.bedroll.not_safe=视野里有敌人时，你没法躺下。
actors.mobs.npcs.bedroll.menu_fire=火正烧着，毯子是干的。你可以在这儿睡一觉。
actors.mobs.npcs.bedroll.menu_cold=旁边的火坑是冷的。你可以在这儿睡，不过生起火来会是个更好的主意。
actors.mobs.npcs.bedroll.until_phase=睡到%s
actors.mobs.npcs.bedroll.until_dawn=睡到黎明
actors.mobs.npcs.bedroll.stay_up=不睡了
actors.mobs.npcs.bedroll.phase_dawn=黎明
actors.mobs.npcs.bedroll.phase_day=白天
actors.mobs.npcs.bedroll.phase_dusk=黄昏
actors.mobs.npcs.bedroll.phase_night=夜晚
actors.mobs.npcs.bedroll.rested=你睡着了，在%s醒来，精神饱满。
actors.mobs.npcs.bedroll.rested_clock=你歇了一会儿。日子自有它的时辰。
actors.mobs.npcs.bedroll.woke_cold=你醒来时浑身僵硬、发抖。寒冷跟着你钻进了毯子。
actors.mobs.npcs.bedroll.woke_found=你在声响中醒来——有东西先找到了你！


###floor and furniture (tiles/WarpedRoomTiles)
tiles.warpedroomtiles.stall_name=摊位
tiles.warpedroomtiles.stall_desc=一张支架桌，上面盖着一块布，遮住底下的东西。布的四角都压了重物。
tiles.warpedroomtiles.crates_name=板条箱
tiles.warpedroomtiles.crates_desc=板条箱上的制造者标记都被刨掉了。
tiles.warpedroomtiles.barrel_name=木桶
tiles.warpedroomtiles.barrel_desc=一只木桶，桶口塞得严严实实。它是一路横着滚了很长的路来的。
tiles.warpedroomtiles.sacks_name=麻袋
tiles.warpedroomtiles.sacks_desc=麻袋，缝了两道。
tiles.warpedroomtiles.rug_name=地毯
tiles.warpedroomtiles.rug_desc=一张好地毯，对一间地窖来说好得过分。一卷就能收起来。
tiles.warpedroomtiles.lantern_name=带罩提灯
tiles.warpedroomtiles.lantern_desc=一根柱子上挂着的提灯，除朝向柜台的那一面，四面都遮着。
tiles.warpedroomtiles.fire_ring_name=火坑
tiles.warpedroomtiles.fire_ring_desc=一圈石头围着一层陈年的灰。这火生过很多次，没有一次是在白天。
tiles.warpedroomtiles.ash_spill_name=灰烬
tiles.warpedroomtiles.ash_spill_desc=火坑旁的烟灰踩进了地里，一根烧穿的木棍，灰里还有一点余烬亮着。有人已经守着这堆火有一阵子了。
tiles.warpedroomtiles.log_seat_name=圆木
tiles.warpedroomtiles.log_seat_desc=一截圆木，顶面被坐着的人磨得光滑。
tiles.warpedroomtiles.rival_plinth_name=基座
tiles.warpedroomtiles.rival_plinth_desc=一座矮基座，边缘被蹭花了，好像站在上面的东西并不总是站着不动。
tiles.warpedroomtiles.brazier_name=火盆
tiles.warpedroomtiles.brazier_desc=一只青铜火盆，火压得低低的。
tiles.warpedroomtiles.coals_name=煤床
tiles.warpedroomtiles.coals_desc=一层上好的黑煤，冰凉。要让它变个样，费不了多少事。
tiles.warpedroomtiles.coals_on_desc=一层煤，中心烧得发白。上方的空气在颤动。
tiles.warpedroomtiles.furnace_name=熔炉
tiles.warpedroomtiles.furnace_desc=熔炉的侧壁，造得能把每一分热量都朝前送出。
tiles.warpedroomtiles.tool_rack_name=工具架
tiles.warpedroomtiles.tool_rack_desc=钳子、锤子、一块型砧。全都重得不值得偷。
tiles.warpedroomtiles.scrap_name=碎屑
tiles.warpedroomtiles.scrap_desc=扫起来的锉屑和碎边。里面原本好的部分都已经被取走了。
tiles.warpedroomtiles.rope_post_name=围栏立柱
tiles.warpedroomtiles.rope_post_desc=一根黄铜立柱，系着天鹅绒绳。看看就好，别靠上去。
tiles.warpedroomtiles.pedigree_plaque_name=铭牌
tiles.warpedroomtiles.pedigree_plaque_desc=_“一脉相承。三种命运。一只手只能握住其中之一。”_
tiles.warpedroomtiles.grille_in_name=进风格栅
tiles.warpedroomtiles.grille_in_desc=地板上一道铁格栅。空气从中涌上来的力道足以吹起你的头发。
tiles.warpedroomtiles.grille_out_name=出风格栅
tiles.warpedroomtiles.grille_out_desc=地板上一道铁格栅，房间里的一切都朝着它倾斜。
tiles.warpedroomtiles.warning_sign_name=警示牌
tiles.warpedroomtiles.warning_sign_desc=立柱上钉着一块木板，画它的人不识字，也不需要识字：一个骷髅，一支指向长廊另一端、背朝门口的箭头。在这头放出去的东西，最后都会到那一头去。
tiles.warpedroomtiles.wind_mark_name=粉笔标记
tiles.warpedroomtiles.wind_mark_desc=有人用粉笔在地上画了一个箭头，指着风吹去的方向。下面写着：_“绝不要站在远端。”_
tiles.warpedroomtiles.rune_gate_name=光之门
tiles.warpedroomtiles.rune_gate_desc=一道横在门口的光之格栅，上面哪儿都没有锁孔。它硬得像墙，却能一眼看穿。
tiles.warpedroomtiles.rune_ember_name=余烬符文
tiles.warpedroomtiles.rune_ember_desc=_“我曾是一块煤。让我再做一次煤。”_
tiles.warpedroomtiles.rune_ember_on_desc=符文稳定地燃着，却不散出一点热量。
tiles.warpedroomtiles.rune_rime_name=白霜符文
tiles.warpedroomtiles.rune_rime_desc=_“水在我体内沉睡。让它躺下吧。”_
tiles.warpedroomtiles.rune_rime_on_desc=符文覆着一层不会融化的霜，通体发白。
tiles.warpedroomtiles.rune_bloom_name=绽放符文
tiles.warpedroomtiles.rune_bloom_desc=_“我是光秃秃的石头，我受够了。”_
tiles.warpedroomtiles.rune_bloom_on_desc=符文连边缘都泛着绿，醒着。
tiles.warpedroomtiles.rune_tide_name=潮汐符文
tiles.warpedroomtiles.rune_tide_desc=_“我已经一百年没听见水声在我门前响了。”_
tiles.warpedroomtiles.rune_tide_on_desc=符文泛着湿光，摸上去却是干的。
tiles.warpedroomtiles.planter_name=种植床
tiles.warpedroomtiles.planter_desc=木框里一床黑土，翻整好了，随时可用。种进去的东西似乎不会长久保持同一种植物。
tiles.warpedroomtiles.nest_name=巢
tiles.warpedroomtiles.nest_desc=稻草围着一个两个拳头大的凹坑。下面的石头被旧日的火、以及更久以前的霜冻裂了。
tiles.warpedroomtiles.portcullis_name=铁栅栏
tiles.warpedroomtiles.portcullis_desc=铁栅栏有你的手腕那么粗，从天花板上落下来。上面没有锁，因为它们根本没有被锁住。它们只是落了下来。
tiles.warpedroomtiles.portcullis_on_desc=栅栏升着，由地板下某个其实并不情愿撑着它们的东西撑着。
tiles.warpedroomtiles.plate_name=压力板
tiles.warpedroomtiles.plate_desc=一块高出地面一指的石板。靴子踩上去它会微微下沉，换成任何有分量的东西也一样。
tiles.warpedroomtiles.plate_on_desc=石板在重压下已经沉得与地面齐平。
tiles.warpedroomtiles.camp_fire_name=火坑
tiles.warpedroomtiles.camp_fire_desc=一圈石头围着一堆摆好却没人点的柴火。随便一点火苗就能点着。
tiles.warpedroomtiles.camp_fire_on_desc=一小堆稳定的火。有人把它摆得很好。
tiles.warpedroomtiles.supplies_name=旅人的木箱
tiles.warpedroomtiles.supplies_desc=一只带绳提手的木箱。有人本来打算回来取的。
tiles.warpedroomtiles.bedding_name=铺窝
tiles.warpedroomtiles.bedding_desc=一个深深的窝，铺着碎树皮、苔藓，还有从谁那儿偷来的羊毛。
tiles.warpedroomtiles.husks_name=空壳
tiles.warpedroomtiles.husks_desc=空壳和被啃过的外皮，堆得整整齐齐。
