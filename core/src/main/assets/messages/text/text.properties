text.textchallenges.alchemy_apprentice = Alchemy apprentice
text.textchallenges.alchemy_apprentice_desc = You can no longer learn anything from complex alchemical reactions, and alchemy itself has become harder for you.\n\n- All alchemy recipes cost 2 more alchemical energy\n- Turning potions and scrolls into alchemical energy no longer identifies them\n- When a scroll is broken down into runestones, one of the runestones is replaced with a random runestone, and breaking it down no longer identifies it
