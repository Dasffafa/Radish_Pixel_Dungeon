text.textchallenges.traditional = Classic Challenges
text.textchallenges.expansion = Additional Content
text.textchallenges.test_mode = Test Time
text.textchallenges.test_mode_desc = Additional option\n\nTest time!\n\nYou can freely generate items, move around freely, and spawn enemies.\n\nIn test mode, the version number in the top-right corner changes to indicate test mode.\n\nNote that test mode runs do not count towards the rankings.
text.textchallenges.snake_bite = Snake Bite
text.textchallenges.snake_bite_desc = Every monster's sprite is replaced with a sewer snake. Their names and descriptions are snakes as well, so examining them tells you nothing.\n\nFloors 3 and 4 can both spawn monsters from the second region, and more often. Floors 6 and 7 can both spawn monsters from the first region. The same pattern applies to later floors.\n\nEverything is a snake bite. The names, sprites and descriptions of all weapons, potions and scrolls, and the names of all actions, are replaced with snake bite.\n\nThe snake sprites of different items differ slightly in color, but even for items you have identified, the icon in the top-right corner that normally shows the item type is no longer displayed.\n\nAlso, because of the nature of snake bite, when you travel to the next floor all snakes are kept near the exit!\n\nSince identifying items is extremely difficult, the hero starts with 11 strength while this challenge is active.\n\n_Warning: the author of this challenge cannot beat it either. It may be very unfair to the player!_\n\nThis challenge comes from the Permahallu conduct in NetHack. Very few people in the world have ever completed it.
text.textchallenges.real_intelligence = Real Intelligence
text.textchallenges.real_intelligence_desc = Unbelievable. Compared with the monsters from Swarm Intelligence, these monsters seem to have learned real skills...\n\n_-_ Monsters gain the same five equipment slots as the player!\n\n_-_ Weapons, armor, and rings work for every monster just as they do for the player!\n\n_-_ Some monsters have special interactions with weapons. Inspect a monster for details.\n\n_-_ Some monsters use different AI while wielding specific weapons. Inspect a monster for details.\n\n_-_ Monsters may even randomly carry potions or use scrolls!\n\n_-_ Some monsters behave a little differently while wielding weapons or wearing armor.\n\n_-_ The player gains two artifacts that take up no inventory space and can briefly deprive enemies of the power granted by their equipment.\n\n_-_ Monsters receive an overall stat increase.

