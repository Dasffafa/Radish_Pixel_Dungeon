items.rarity.quality.header=这是一件稀有度为_%1$s_、类型为_%2$s_的物品。
items.rarity.quality.unknown=鉴定之前，它的稀有度与类型带来的效果仍然隐藏。
items.rarity.quality.unknown_lines=鉴定之前，它的加成词条及其数值高低仍然隐藏。
items.rarity.quality.unknown_perk=鉴定之前，这一类型赋予它的效果仍然隐藏。
items.rarity.quality.potency=仅凭稀有度，它自身的伤害、防御或威力就提高_%d%%_。
items.rarity.quality.masterwork=杰作_%1$d/%2$d_：每条加成词条每级提升15%%。它已杀死_%3$d_个敌人。
items.rarity.quality.masterwork_full=_杰作已达满级_。每条加成词条翻倍，它每杀死一个敌人都会为你恢复（武器回生命，法杖回1点充能，护甲给一层护盾）。它已杀死_%3$d_个敌人。

items.rarity.masterworkcore.name=杰作核心
items.rarity.masterworkcore.desc=一团致密的地牢自身之力，从首领的心脏中割取而来。镇上的巨魔铁匠能把它锻入武器、护甲、投掷武器或法杖：每颗核心推进一级杰作；他还会把一件物品的稀有度熔化重铸，在轮上重新纺出——你投入的核心越多，几率越高，最多十颗。\n\n共有五级：前四级各使该物品的所有稀有度加成提升15%，第五级只接受传奇或奇异底材，并使它们翻倍。
items.rarity.masterworkcore.not_enough=这一级需要%d颗核心。
items.rarity.masterworkcore.already=你的%s已达到满级杰作。
items.rarity.masterworkcore.needs_legendary=只有传奇或奇异的%s才能进行最后一级。
items.rarity.masterworkcore.done=你的%1$s现在是杰作%2$d/%3$d。
items.rarity.masterworkcore.done_full=你的%1$s已达成满级杰作！
items.rarity.masterworkcore.rerolled=你的%1$s从锻炉中出炉，稀有度为%2$s。
items.rarity.masterworkcore.opt_masterwork=将一件物品杰作化
items.rarity.masterworkcore.opt_reroll=重掷稀有度（1-%d颗核心）
items.rarity.masterworkcore.pick_masterwork=选择要杰作化的物品
items.rarity.masterworkcore.pick_reroll=选择要重掷稀有度的物品

items.rarity.typeshifter.name=类型转换器
items.rarity.typeshifter.desc=一片不断变形的金属，触到什么便定形成什么。用在武器、护甲、投掷武器或法杖上，可把物品的类型提升一级：伽马升为贝塔需1个，贝塔升为阿尔法需2个。它绝不会降低类型。
items.rarity.typeshifter.ac_shift=转换
items.rarity.typeshifter.prompt=选择要转换类型的物品
items.rarity.typeshifter.already_alpha=你的%s已是阿尔法，最高的类型。
items.rarity.typeshifter.not_enough=提升至%2$s需要%1$d个类型转换器。
items.rarity.typeshifter.shifted=你的%1$s现在是%2$s类型！

items.rarity.quality.tab_rarity=稀有度_%1$s_，带有_%2$d_条加成词条：
items.rarity.quality.tab_type=类型_%s_：
items.rarity.quality.tab_type_current=类型_%s_（本物品的类型）：
items.rarity.quality.tab_type_cost=从当前类型到达这一类型，需要_%d_个类型转换器。
items.rarity.quality.masterwork_next=下一级需要_%d_颗杰作核心。
items.rarity.quality.tab_rarity_other=_%1$s_物品会为其自身的伤害、防御或威力增加_%6$d%%_，并带有_%2$d_条加成词条，数值在最大值的_%3$d%%_到_%4$d%%_之间随机。它们从深度_%5$d_开始掉落。
items.rarity.quality.tab_rarity_other_gear=_%1$s_物品带有_%2$d_条加成词条，数值在最大值的_%3$d%%_到_%4$d%%_之间随机。它们从深度_%5$d_开始掉落。
items.rarity.quality.tab_vestige=它还带有一个_残迹附魔_，那是一缕它始终未能真正掌握的魔法的微弱回响：
items.rarity.quality.tab_rarity_other_vestige=它们的武器还带有一个_残迹附魔_，触发频率只有真品的一小部分。
items.rarity.quality.tab_vestige_glyph=它还带有一个_残迹刻印_，那是一缕它始终未能真正掌握的魔法的微弱回响：
items.rarity.quality.tab_rarity_other_vestige_glyph=它们的护甲还带有一个_残迹刻印_，响应频率只有真品的一小部分。
items.rarity.quality.slot_common=它的词条是一条普通加成。
items.rarity.quality.slot_uncommon=它的词条是一条特性：%s。
items.rarity.quality.slot_rare=其中一条词条是特性（%s），另一条是普通加成。

items.rarity.weaponperk.tile=%d格
items.rarity.weaponperk.tiles=%d格
items.rarity.weaponperk.gun_name=枪手
items.rarity.weaponperk.gun=_%1$s：_对_三格或更远_的敌人射击，伤害最多提高_%2$s_，且_%3$s_的装填不耗时。
items.rarity.weaponperk.gun_twist=每五发就有一发_不消耗回合_。
items.rarity.weaponperk.boomerang_name=弧线
items.rarity.weaponperk.boomerang=_%1$s：_投掷物会继续穿过最多_%2$s_个敌人，返回时沿途击中每一个敌人，造成一次命中的_%3$s_。
items.rarity.weaponperk.boomerang_twist=它会在_2回合_后返回，而非5回合。
items.rarity.weaponperk.scythe_name=收割者
items.rarity.weaponperk.scythe=_%1$s：_每次命中还会_横扫_你身旁的其他敌人，造成这一击的_%2$s_；随身携带时，你割下的作物与高草有_%3$s_的几率额外给出一颗_种子_。
items.rarity.weaponperk.scythe_twist=被横扫的敌人会_流血_。
items.rarity.weaponperk.shot_name=神射手
items.rarity.weaponperk.shot=_%1$s：_对_三格或更远_的敌人射击，伤害最多提高_%2$s_，距离越远增益越大。
items.rarity.weaponperk.shot_twist=从_%1$s格或更远_处射出的箭矢绝不会落空，还能直接穿透目标的一部分护甲。
items.rarity.weaponperk.guard_name=守护
items.rarity.weaponperk.guard=_%1$s：_持握时，你受到的每次打击都被削弱_%2$s_，随武器的阶与等级提高。
items.rarity.weaponperk.guard_twist=原地坚守两回合，下一次打击会被_完全偏转_，其中_%1$s_直接反弹回去。
items.rarity.weaponperk.reach_name=触及
items.rarity.weaponperk.reach=_%1$s：_从_两格或更远_处命中，伤害提高_%2$s_。
items.rarity.weaponperk.reach_twist=这把武器能比自身长度所及_多打出一格_。
items.rarity.weaponperk.swift_name=疾风
items.rarity.weaponperk.swift=_%1$s：_你的攻击速度最高提升_%2$s_，连续命中时累积，一旦落空便立刻失去。
items.rarity.weaponperk.swift_twist=每_第五次命中_完全不耗费时间。
items.rarity.weaponperk.crush_name=粉碎
items.rarity.weaponperk.crush=_%1$s：_每次命中伤害提高_%2$s_，并无视目标_%3$s_的护甲。
items.rarity.weaponperk.crush_twist=命中会_撕裂_残余护甲，对同一敌人最多叠加三次。
items.rarity.weaponperk.wild_name=狂野
items.rarity.weaponperk.wild=_%1$s：_有_%2$s_的命中会变得_狂野_，伤害提高_%3$s_。
items.rarity.weaponperk.wild_twist=狂野命中会造成_流血_。
items.rarity.weaponperk.keen_name=伏击
items.rarity.weaponperk.keen=_%1$s：__突袭_伤害提高_%2$s_，并无视目标_%3$s_的护甲。持握时，你能_感知_到_%4$s_内的敌人，即使隔着墙。
items.rarity.weaponperk.keen_twist=突袭会_处决_任何已濒死的目标，且这一击不耗时。
items.rarity.weaponperk.siphon_name=虹吸
items.rarity.weaponperk.siphon=_%1$s：_每次命中恢复你最大法力的_%2$s_，最多3点。
items.rarity.weaponperk.siphon_twist=法力已满时，这些法力会化为_护盾_，而不是被浪费。
items.rarity.weaponperk.momentum_name=蓄势
items.rarity.weaponperk.momentum=_%1$s：_对同一敌人的连续命中每次伤害提高_%3$s_，从第一击开始，最多叠加四次，共_%2$s_。落空则重新开始。
items.rarity.weaponperk.momentum_twist=在至少三层时击杀会返还这次攻击的时间，并_将层数延续_到下一个敌人身上。
items.rarity.weaponperk.dart_name=镖尖
items.rarity.weaponperk.dart=_%1$s：_目标已受的伤害越多，飞镖造成的伤害越高，最多提高_%2$s_；淬尖的飞镖有_%3$s_的命中会保住镖尖。
items.rarity.weaponperk.dart_twist=被击中的目标会被_定身_，飞镖越重，定身越久。
items.rarity.weaponperk.throw_name=锐利
items.rarity.weaponperk.throw=_%1$s：_有_%2$s_的投掷会精准命中，伤害提高_%3$s_；没有损坏的精准投掷会_飞回你手中_。
items.rarity.weaponperk.throw_twist=你的投掷能_穿过墙壁_击中3格内的敌人。
items.rarity.weaponperk.impact_name=猛掷
items.rarity.weaponperk.impact=_%1$s：_改为_猛掷_：投掷需要_两回合_，伤害提高_%2$s_。
items.rarity.weaponperk.impact_twist=猛掷落地时会产生_冲击波_，击中目标身旁的每个敌人，造成这一击的_%1$s_。
items.rarity.weaponperk.woodsman_name=伐木工
items.rarity.weaponperk.woodsman=_%1$s：_对同一敌人的每次命中都会_劈裂其护甲_，额外无视_%2$s_，最多三次。伐木与劈柴所需的次数减少_%3$s_，且有_%4$s_的伐倒树木会多给一根原木。
items.rarity.weaponperk.woodsman_twist=对同一敌人的每第三次命中是一次_伐倒重击_，将其击退两格。
items.rarity.weaponperk.quarry_name=采石
items.rarity.weaponperk.quarry=_%1$s：_有_%2$s_的命中会使敌人_恍惚_2回合。作为工具，它击碎石头或挖掘所需的次数减少_%3$s_，且有_%4$s_的石头与矿石会多出一块。
items.rarity.weaponperk.quarry_twist=造成恍惚的一击会_震裂地面_，使该敌人及其身旁的每个敌人残废。
items.rarity.weaponperk.bard_name=吟游诗人
items.rarity.weaponperk.bard=_%1$s：_每次命中奏出一个音符，每_第四个音符_奏出一段和弦，交替为：_鼓舞_，祝福你与3格内的盟友，持续_%2$s回合_；然后是_恐惧_，使2格内的敌人恐惧同样长的时间。
items.rarity.weaponperk.bard_twist=每段和弦还会_魅惑_3格内最弱的敌人5回合。
items.rarity.weaponperk.lash_name=鞭笞
items.rarity.weaponperk.lash=_%1$s：_从两格或更远处命中，伤害提高_%2$s_，且有_%3$s_的命中会把敌人向你的方向_拖拽_一格，并使其残废2回合。
items.rarity.weaponperk.lash_twist=每五次命中就有一次_缴械_敌人：它接下来命中一击只造成一半伤害。

items.rarity.gearperk.mending_name=修复
items.rarity.gearperk.mending=_%1$s：_你恢复生命值的速度加快_%2$s_。
items.rarity.gearperk.mending_twist=生命值全满时，治疗会_存为护盾_而非浪费，最多可达你最大生命值的_%1$s_。
items.rarity.gearperk.nimble_name=灵巧
items.rarity.gearperk.nimble=_%1$s：_护甲提供额外_%2$s_闪避。
items.rarity.gearperk.nimble_twist=每次闪避都会叠加_%1$s_闪避，最多三次，直到终于被一击命中。
items.rarity.gearperk.bulwark_name=壁垒
items.rarity.gearperk.bulwark=_%1$s：_坚守原地时，受到的打击最多被削弱_%2$s_；需两回合不移动才能立起，原地挥击可保持。
items.rarity.gearperk.bulwark_twist=这道墙永不彻底倒下，它挡下的伤害会_存入你的下一次攻击_。
items.rarity.gearperk.stalwart_name=坚毅
items.rarity.gearperk.stalwart=_%1$s：_护甲的最低防御绝不低于其上限的_%2$s_。
items.rarity.gearperk.stalwart_twist=_%1$s_点欠缺的力量会被忽略，对你的脚步与闪避皆然。
items.rarity.gearperk.striker_name=强击
items.rarity.gearperk.striker=_%1$s：_你的攻击伤害提高_%2$s_。
items.rarity.gearperk.striker_twist=你的打击能寻到缝隙，无视目标_%1$s_的护甲。
items.rarity.gearperk.ward_name=护佑
items.rarity.gearperk.ward=_%1$s：_有_%2$s_的减益在命中你时滑落，你已承受的减益越多，越容易滑落。
items.rarity.gearperk.ward_twist=被你摆脱的任何减益在_%1$s回合_内无法再次影响你。
items.rarity.gearperk.attune_name=调和
items.rarity.gearperk.attune=_%1$s：_你的法杖与神器充能速度加快_%2$s_，法力池也随之增长。
items.rarity.gearperk.attune_twist=法杖充满后的第一次施放会以_高%1$s级_的效果施出。
items.rarity.gearperk.provision_name=补给
items.rarity.gearperk.provision=_%1$s：_你找到的金币增加_%2$s_，越深的楼层给得越多，饥饿来得慢_%3$s_。
items.rarity.gearperk.provision_twist=金币即食物：你捡起的每一堆都会_喂饱你_一点。
items.rarity.gearperk.resonance_name=共鸣
items.rarity.gearperk.resonance=_%1$s：_有_%2$s_的施放不消耗充能，法杖升级后更高。
items.rarity.gearperk.resonance_twist=不耗充能的施放会让法杖嗡鸣，下一次施放会以_高%1$s级_的效果施出。
items.rarity.gearperk.binding_name=束缚
items.rarity.gearperk.binding=_%1$s：_被击中的敌人有_%2$s_几率_残废_，法杖等级越高持续越久。
items.rarity.gearperk.binding_twist=束缚会以一半的持续时间_蔓延_至最近的另一个敌人。
items.rarity.gearperk.wellspring_name=源泉
items.rarity.gearperk.wellspring=_%1$s：_法杖充能速度加快_%2$s_，升级后更高。
items.rarity.gearperk.wellspring_twist=满充能时施放不再浪费：法杖可保留_超出上限的%1$s点充能_。
items.rarity.gearperk.legion_name=军团
items.rarity.gearperk.legion=_%1$s：_法杖的作用等级提高_%2$s_，升级后更高。
items.rarity.gearperk.legion_twist=它的施放会_为视野内的盟友施加护盾_，数值为其自身最大生命值的_%1$s_。
items.rarity.gearperk.fortune_name=幸运
items.rarity.gearperk.fortune=_%1$s：_随身携带时，你找到的金币增加_%2$s_，升级后更高。
items.rarity.gearperk.fortune_twist=商店卖给你的东西更便宜，且有_%1$s_的金币堆会_重一倍_。
items.rarity.gearperk.omen_name=预兆
items.rarity.gearperk.omen=_%1$s：_随身携带时，你的闪避提高_%2$s_，升级后更高。
items.rarity.gearperk.omen_twist=它的作用等级提高_一级_，直至其上限。
items.rarity.gearperk.vitality_name=活力
items.rarity.gearperk.vitality=_%1$s：_随身携带时，你恢复生命值的速度加快_%2$s_，升级后更高。
items.rarity.gearperk.vitality_twist=生命值低于三分之一时，每次治疗还会_洗去一层流血或中毒_。
items.rarity.gearperk.escape_name=逃脱
items.rarity.gearperk.escape=_%1$s：_神器充能更快，你的移动速度加快_%2$s_。
items.rarity.gearperk.escape_twist=你被一击命中后的数回合内，该速度额外提高_%1$s_。
items.rarity.gearperk.assault_name=强攻
items.rarity.gearperk.assault=_%1$s：_神器充能更快，你的攻击伤害提高_%2$s_。
items.rarity.gearperk.assault_twist=连续回合攻击会叠加_%1$s_伤害，最多三次。
items.rarity.gearperk.insight_name=洞察
items.rarity.gearperk.insight=_%1$s：_神器充能更快，你的攻击精准提高_%2$s_。
items.rarity.gearperk.insight_twist=你的任意一次攻击落空后，下一次_绝不会落空_。
items.rarity.gearperk.sustain_name=维生
items.rarity.gearperk.sustain=_%1$s：_穿戴时，你恢复生命值的速度加快_%2$s_，饥饿来得慢_%3$s_。
items.rarity.gearperk.sustain_twist=当一击首次让你低于三分之一生命值时，你的身体会_动用储备治疗你_。
items.rarity.gearperk.warden_name=守望者
items.rarity.gearperk.warden=_%1$s：_穿戴时，你的闪避提高_%2$s_，受到的打击也会被削弱。
items.rarity.gearperk.warden_twist=它偏转的伤害中有_%1$s_会_直接反弹给攻击者_。
