items.food.flour.name=面粉
items.food.flour.desc=一袋面粉，用石磨把玉米麦磨成。可在壁炉里烤成面包。
items.food.bread.name=面包
items.food.bread.desc=一条烤得金黄的面包，在壁炉里烘制而成。饱腹程度相当于一份半口粮。

###threats on homes: notice, sieges, raids, breaking in, defences, what happened while away (homestead/threats)
homestead.piece.watchtower.name=瞭望塔
homestead.piece.watchtower.desc=一座高高的木板塔。从旁边攀上去，可多看4格远，并能发现30格外来袭的狼群和强盗。建在家园地面上时，家园对强盗的吸引力会降低。它会被烧毁。
homestead.piece.alarm_bell.name=警铃
homestead.piece.alarm_bell.desc=柱上挂着的一口铁铃。当你在家园地面上睡觉或休息时，若有敌意之物踏上家园，或夜里狼群、强盗来袭，它会响铃把你唤醒。没有它，你会一直睡到事情发生之后。建在家园地面上时，家园对强盗的吸引力会降低。
homestead.piece.spike_trap.name=尖刺陷阱
homestead.piece.spike_trap.desc=钉在木板框上的铁刺，铺在空地上。踩上去的怪物会受伤并残废，你和你的盟友则安然无恙；触发后20回合重置。
homestead.threats.notice.part_chests=箱中之物
homestead.threats.notice.part_crops=作物
homestead.threats.notice.part_built=所有建筑
homestead.threats.notice.part_light=夜间灯火
homestead.threats.notice.part_walls=石墙与砖墙
homestead.threats.notice.part_barred=闩上的门
homestead.threats.notice.part_palisade=木栅栏环
homestead.threats.notice.part_watchtower=瞭望塔
homestead.threats.notice.part_bell=警铃
homestead.threats.wolfsiege.came=狼群在%1$s边缘嚎叫，正从%2$s方向逼近！
homestead.threats.homeraider.came=强盗正从%2$s方向朝%1$s而来！
homestead.threats.homeraider.grabbed=一名强盗从你的箱子里抢走了%d样东西，拔腿就跑！
homestead.threats.homeraider.desc=夜里来你家箱子取东西的强盗。它会直奔最富有的箱子，必要时破门而入，抓走能带的东西就跑。打倒它可夺回被拿走的东西。
homestead.threats.threatslice.siege_slain=狼群围攻了%1$s，没有一只活到黎明。
homestead.threats.threatslice.siege_fought=狼群围攻了%1$s。你杀死其中%2$d只，其余的黎明时溜走了。
homestead.threats.threatslice.siege_left=狼群彻夜在%1$s周围徘徊，黎明时溜走了。
homestead.threats.threatslice.raid_stolen=强盗洗劫了%1$s，抢走%3$d样东西后逃走了。
homestead.threats.threatslice.raid_slain=强盗洗劫了%1$s，但被尽数斩杀。
homestead.threats.threatslice.raid_driven=强盗洗劫了%1$s，却两手空空地被赶跑了。
homestead.threats.threatslice.spotted_wolves=从瞭望塔上，你看见狼群正从%s方向逼近！
homestead.threats.threatslice.spotted_raiders=从瞭望塔上，你看见强盗正从%s方向逼近！
homestead.threats.threatsettler.raid_robbed=第%2$d天夜里，强盗闯入了%1$s，搬空了一只箱子：%3$d样东西不见了（%4$s）。
homestead.threats.threatsettler.raid_robbed_door=第%2$d天夜里，强盗强行破开%1$s的%5$s，搬空了一只箱子：%3$d样东西不见了（%4$s）。
homestead.threats.threatsettler.raid_nothing=第%2$d天夜里，强盗来打%1$s的主意，却没找到值得抢的东西。
homestead.threats.threatsettler.raid_again=第%d天夜里强盗又来了，但已没有东西可抢。
homestead.threats.threatsettler.and_more=，还有更多
homestead.threats.threatsettler.siege_gnawed=第%2$d天夜里，狼群围攻了%1$s，啃坏了%3$d处篱笆和门。
homestead.threats.threatsettler.siege_circled=第%2$d天夜里，狼群在%1$s周围徘徊，黎明时离开了。
homestead.threats.threatactions.ledger=账簿
homestead.threats.watchtower.name=瞭望塔
homestead.threats.watchtower.desc=一座高高的木板塔，顶上设有望台。从旁边点击即可攀上去。
homestead.threats.watchtower.ask=从塔顶可多看%1$d格远，并能发现塔周围%2$d格内来袭的狼群或强盗。走开即可下塔。
homestead.threats.watchtower.climb=爬上去
homestead.threats.watchtower.stay=留在原地
homestead.threats.watchtower.climbed=你爬上了望台。
homestead.threats.watchtower.already_up=你已经在瞭望塔上了。
homestead.threats.watchtower.net_host_only=目前只有主机能攀爬瞭望塔。
homestead.threats.alarmbell.name=警铃
homestead.threats.alarmbell.desc=柱上挂着的一口铁铃。当你在家园地面上睡觉或休息时，若有敌意之物踏上家园，或夜里狼群、强盗来袭，它会响铃把你唤醒。点击它即可摇铃。
homestead.threats.alarmbell.rings=警铃响了！有敌意之物踏上了你的土地。
homestead.threats.alarmbell.rings_coming=警铃响了！黑暗中有东西正朝你的家园而来。
homestead.threats.spiketrap.name=尖刺陷阱
