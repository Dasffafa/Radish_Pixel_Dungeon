###travel (homestead/travel): hearthstones, waystones, travel for hunger, the map's marks
homestead.piece.hearthstone.name=家园石
homestead.piece.hearthstone.desc=一块刻有符文的低矮石头。它所在之处便是家园：野生动物会与它保持10格距离，你也能从它出发前往其他家园和已触碰过的路石。最多可保有3座家园。
homestead.piece.hearthstone.remove_warning=拆掉这块家园石？家园会随之消失，你也无法再前往此处。
homestead.travel.hearthstone.name=家园石
homestead.travel.hearthstone.name_of=%s的家园石
homestead.travel.hearthstone.desc=一块刻有符文的低矮石头，家园的核心。野生动物会与它保持%d格距离。天黑后它的符文会发光。点击它可前往其他家园和已触碰过的路石，或为此家园改名。
homestead.travel.hearthstone.guest=这是%s的家园石。在联机游戏中，只有主机能从这里出发或为家园改名。
homestead.travel.hearthstone.founded=这里现在是你的家园：%s。点击家园石即可从这儿出发，或为它改名。
homestead.travel.hearthstone.lost=%s的家园石消失了，家园也随之而去。
homestead.travel.waystone.name=路石
homestead.travel.waystone.name_attuned=苏醒路石
homestead.travel.waystone.desc=立在%s水井旁的一块高大石板，刻着一道沉睡的符文。触碰它可将其唤醒：之后你便能从任意家园和已苏醒的路石前往此处，也能从此处前往它们。
homestead.travel.waystone.desc_attuned=%s的路石。它的符文发着光：你可以从任意家园和已苏醒的路石前往此处，也能从此处前往它们。
homestead.travel.waystone.attuned=%s的路石在你的触碰下苏醒了。你现在可以前往此处。
homestead.travel.waystone.guest=在联机游戏中，只有主机能借石头旅行。
homestead.travel.waystones.town=小镇
