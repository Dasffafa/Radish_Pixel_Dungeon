###the pieces (homestead/pieces/CorePieces)
homestead.piece.wall_log.name=原木墙
homestead.piece.wall_log.desc=层层垒起、开槽咬合的原木。搭起来很快，但怕火。
homestead.piece.wall_plank.name=木板墙
homestead.piece.wall_plank.desc=钉在梁间的木板。比原木墙结实，也同样易燃。
homestead.piece.wall_stone.name=石墙
homestead.piece.wall_stone.desc=分层砌起的粗石。坚固，而且不会燃烧。
homestead.piece.wall_brick.name=砖墙
homestead.piece.wall_brick.desc=以黏土砌起的红砖。是你能建的最坚固的墙，而且不会燃烧。
homestead.piece.window_log.name=原木墙上的窗户
homestead.piece.window_log.desc=嵌在原木间的玻璃板。光线与视线可以穿过，人不行。
homestead.piece.window_plank.name=木板墙上的窗户
homestead.piece.window_plank.desc=嵌在木板间的玻璃板。光线与视线可以穿过，人不行。
homestead.piece.window_stone.name=石墙上的窗户
homestead.piece.window_stone.desc=嵌在石头间的玻璃板。光线与视线可以穿过，人不行。
homestead.piece.window_brick.name=砖墙上的窗户
homestead.piece.window_brick.desc=嵌在砖间的玻璃板。光线与视线可以穿过，人不行。
homestead.piece.door.name=门
homestead.piece.door.desc=一扇普通的木门。谁都能打开，怪物也不例外。
homestead.piece.door_barred.name=铁闩门
homestead.piece.door_barred.desc=装有铁闩的厚门。只有你和你的盟友能打开，怪物得把门砸开。
homestead.piece.floor_plank.name=木地板
homestead.piece.floor_plank.desc=铺在地上的木板。没有东西能破坏地板。
homestead.piece.floor_stone.name=石地板
homestead.piece.floor_stone.desc=铺在地上的石板。没有东西能破坏地板。
homestead.piece.path.name=石板路
homestead.piece.path.desc=嵌进土里铺成小路的石块。没有东西能破坏它。
homestead.piece.fence.name=栅栏
homestead.piece.fence.desc=立柱与横木。动物过不去，但你能越过它张望。
homestead.piece.gate.name=栅栏门
homestead.piece.gate.desc=栅栏上的一扇门。你和盟友能打开，动物和怪物不能。
homestead.piece.palisade.name=尖木栅
homestead.piece.palisade.desc=用绳子捆起的削尖原木。挡住去路，但不挡视线。会燃烧。
homestead.piece.bridge.name=木板桥
homestead.piece.bridge.desc=铺在水面上的木板，浅水深水皆可，让你徒步走过。
homestead.piece.roof_thatch.name=茅草屋顶
homestead.piece.roof_thatch.desc=一格大小的稻草顶。便宜，但闪电可能把它点燃。
homestead.piece.roof_plank.name=木板屋顶
homestead.piece.roof_plank.desc=一格大小的木板顶。会燃烧，但闪电点不着。
homestead.piece.roof_slate.name=石板瓦屋顶
homestead.piece.roof_slate.desc=一格大小的琢石瓦顶。耐用，而且不会燃烧。
homestead.piece.roof_tile.name=陶瓦屋顶
homestead.piece.roof_tile.desc=一格大小的黏土瓦顶。耐用，而且不会燃烧。
homestead.piece.roof_glass.name=玻璃屋顶
homestead.piece.roof_glass.desc=一格大小的玻璃顶。阳光能透下来照到下面的植物。

