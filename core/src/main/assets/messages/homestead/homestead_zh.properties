homestead.travel.wndtravel.title=从%s出发
homestead.travel.wndtravel.intro=旅行只消耗饱腹度：石块之间每格半点，每上下一层60点，最多450点。途中不会流逝时间。你的饱腹度为%1$d：降到%2$d会饥饿，降到%3$d会极度饥饿。
