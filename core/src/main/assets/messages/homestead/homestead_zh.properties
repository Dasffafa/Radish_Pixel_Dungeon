homestead.threats.lookout.name=瞭望塔上
homestead.threats.lookout.desc=你在瞭望塔的望台上。你能比平常多看%1$d格远，并能发现塔周围%2$d格内来袭的狼群和强盗。\n\n走开即可下塔。
