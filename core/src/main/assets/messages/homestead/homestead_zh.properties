homestead.builtterrain.door_name=门
homestead.builtterrain.door_desc=一扇木门。谁都能打开。
homestead.builtterrain.door_open_name=开着的门
homestead.builtterrain.door_open_desc=一扇木门，正敞开着。
homestead.builtterrain.door_barred_name=铁闩门
homestead.builtterrain.door_barred_desc=装有铁闩的厚门。站在旁边点击它即可抬起铁闩。门口清空后它会重新关上。
homestead.builtterrain.door_barred_open_name=开着的铁闩门
homestead.builtterrain.door_barred_open_desc=铁闩已经抬起。门口清空后门会重新关上。
homestead.builtterrain.palisade_name=尖木栅
homestead.builtterrain.palisade_desc=用绳子捆起的削尖原木。能看过去，但走不过去。
homestead.builtterrain.fence_name=栅栏
homestead.builtterrain.fence_desc=立柱与横木。你能越过它张望。
homestead.builtterrain.gate_name=栅栏门
homestead.builtterrain.gate_desc=栅栏上的一扇门。站在旁边点击它即可打开。通道清空后它会重新关上。
homestead.builtterrain.gate_open_name=开着的栅栏门
homestead.builtterrain.gate_open_desc=门正敞开着。通道清空后会重新关上。
homestead.builtterrain.path_name=石板路
homestead.builtterrain.path_desc=嵌进土里的石块。
homestead.builtterrain.bridge_name=木板桥
homestead.builtterrain.bridge_desc=铺在水面上的木板。
homestead.builtterrain.farmland_name=农田
homestead.builtterrain.farmland_desc=翻好的土地，等着播种。
homestead.builtterrain.farmland_wet_name=浇过水的农田
homestead.builtterrain.farmland_wet_desc=翻好的土地，因浇水而湿润。
homestead.builtterrain.stump_oak_name=橡树桩
homestead.builtterrain.stump_oak_desc=一棵被伐倒的橡树留下的全部。
homestead.builtterrain.stump_pine_name=松树桩
homestead.builtterrain.stump_pine_desc=一棵被伐倒的松树留下的全部，还渗着树脂。
homestead.builtterrain.sapling_oak_name=橡树苗
homestead.builtterrain.sapling_oak_desc=一棵年幼的橡树。给它点时间。
homestead.builtterrain.sapling_pine_name=松树苗
homestead.builtterrain.sapling_pine_desc=一棵年幼的松树。给它点时间。
homestead.builtterrain.sapling_shrub_name=幼灌木
homestead.builtterrain.sapling_shrub_desc=由自己的种子长成的灌木，还长得很矮。春夏过上几天它就会长开。
homestead.builtterrain.rubble_wood_name=木质残骸
homestead.builtterrain.rubble_wood_desc=断裂的木板与木屑，是某件建造物留下的全部。
homestead.builtterrain.rubble_stone_name=石质残骸
homestead.builtterrain.rubble_stone_desc=破碎的石头，是某件建造物留下的全部。
homestead.builtterrain.floor_plank_name=木地板
homestead.builtterrain.floor_plank_desc=铺在地上的木板。
homestead.builtterrain.floor_stone_name=石地板
homestead.builtterrain.floor_stone_desc=铺在地上的石板。

###gathering (homestead/gathering): felling, quarrying, digging and reaping, and their tools
homestead.gathering.gathering.guest=共享游戏中，只有房主才能用包里的工具挖掘和收割。
homestead.gathering.gathering.protected_chop=那棵树不归你砍。
homestead.gathering.gathering.protected_quarry=那块石头不归你敲。
homestead.gathering.gathering.protected_dig=这块地不归你挖。
homestead.gathering.gathering.protected_reap=这片草不归你割。
homestead.gathering.gathering.villagers=村民们可不会乐意看到你这么干。
homestead.gathering.gathering.no_axe=那需要一把斧头。
homestead.gathering.gathering.no_pick=要敲开岩砾，你需要镐子、采掘工具，或者石匠锤、战锤、匠师之锤。
homestead.gathering.gathering.no_shovel=你需要一把铲子才能挖掘。
homestead.gathering.gathering.no_sickle=你需要一把短柄镰才能割草。
homestead.gathering.gathering.nothing_to_dig=那里没什么可挖的。铲子能把高草和裸土翻成农田，从沼泽或河流的岸边挖出黏土，从海滩或沙漠里挖出沙子，还能挖起树桩和树苗。
homestead.gathering.gathering.nothing_to_reap=只有高草能割来当茅草。
homestead.gathering.gathering.frozen=地面冻得硬邦邦的。
items.weapon.melee.shovel.dig_prompt=选择要挖的地方
items.weapon.melee.sickle.ac_reap=收割
items.weapon.melee.sickle.reap_prompt=选择要割的高草
items.weapon.melee.woodcuttersaxe.name=伐木斧
items.weapon.melee.woodcuttersaxe.desc=一柄长柄宽刃的伐木斧。砍倒一棵树只要3下，但打斗起来很不趁手。\n\n站在树旁点击它即可砍倒。任何斧头都干得了这活：手斧要8下，斧头6下，战斧5下，巨斧4下。斧类武器的“伐木”类型还能再省下几下。
items.weapon.melee.masonshammer.name=石匠锤
items.weapon.melee.masonshammer.desc=一柄沉重的方头锤，用来敲碎石头。它2下就能把岩砾敲成粗石，而镐子、战锤、匠师之锤或采掘工具要3下。背包里没有镐子时，它也能敲开岩壁，要3下。工具的“采石”类型还能再省下几下。打斗起来很不趁手。\n\n站在岩砾旁点击它即可敲碎。

###the materials (items/materials)
items.materials.log.name=橡木原木
items.materials.log.desc=一段伐倒的橡木。可用来建造原木墙和尖木栅，也能锯成木板。
items.materials.pinelog.name=松木原木
items.materials.pinelog.desc=一段伐倒的松木。用途和橡木原木一样。
items.materials.plank.name=木板
items.materials.plank.desc=锯好的木板。用于木板墙、地板、屋顶、门、栅栏和家具。
items.materials.resin.name=树脂
items.materials.resin.desc=松树流出的黏稠琥珀色树脂。可作胶黏剂，也可作密封剂。
items.materials.roughstone.name=粗石
items.materials.roughstone.desc=一块石头。用于石墙、石地板和石板路。
items.materials.cutstone.name=琢石
items.materials.cutstone.desc=修整成方的石块。用于石板瓦屋顶和更精细的石造建筑。
items.materials.clay.name=黏土
items.materials.clay.desc=从河岸边挖来的湿黏土。可烧制成砖，也用作砌砖墙的灰浆。
items.materials.firedbrick.name=红砖
items.materials.firedbrick.desc=坚硬的红砖。用于砖墙、陶瓦屋顶、壁炉和锻炉。
items.materials.sand.name=沙子
items.materials.sand.desc=一把发白的沙子。可以熔成玻璃。
items.materials.glasspane.name=玻璃板
items.materials.glasspane.desc=一块透明玻璃。用于窗户和玻璃屋顶。
items.materials.thatch.name=茅草
items.materials.thatch.desc=一捆干稻草。用于茅草屋顶、草垫床和绳子。
items.materials.rope.name=绳子
items.materials.rope.desc=一卷绞好的绳子。用于栅栏门和水井，也能牵着动物走。
items.materials.hide.name=兽皮
items.materials.hide.desc=一张生的兽皮。硝制之后就是皮革。
items.materials.leather.name=皮革
items.materials.leather.desc=硝制好的皮革。用于毛皮床、地毯和保暖衣物。
items.materials.charcoal.name=木炭
items.materials.charcoal.desc=一块块木炭。是窑、锻炉和壁炉最热的燃料。
items.materials.ironfittings.name=铁件
items.materials.ironfittings.desc=铰链、铁条和钉子。用于铁闩门和警钟。
items.materials.vulturefeather.name=秃鹫羽毛
items.materials.vulturefeather.desc=一根长长的飞羽，乌黑而带银边，取自秃鹫。在工作台上，2根加上一块木板可做出5支飞镖。
items.materials.gatortooth.name=鳄鱼牙
items.materials.gatortooth.desc=一颗弯牙，色如陈年象牙，有一指长。在工作台上，一颗加上一块木板可做出2支捕鱼矛的矛尖。
items.bags.builderssatchel.name=建造者挎包
items.bags.builderssatchel.desc=一个结实的帆布挎包，用来装建材、便携箱子和建筑工具，也装石头里出来的东西：各类矿石、宝石、矿石、暗金、诺恩石和杰作核心。原木、石头、木板、箱子、工具、矿石之类的都会放进这里而不是你的背包，建造时会优先从这里取用。

###rooms: what a room is, its comfort, beds and the rest they give (homestead/rooms, pieces/RoomPieces)
homestead.rooms.roomkinds.bedroom=卧室
homestead.rooms.roomkinds.bedroom_line=卧室：在里面的床上睡觉。当所有门都关着、墙也没有破损时，没有什么能趁你睡着找到你。
homestead.rooms.roomkinds.kitchen=厨房
homestead.rooms.roomkinds.kitchen_line=厨房：能让你吃饱的饭菜，在这里吃下时饱腹时间会延长一半。
homestead.rooms.roomkinds.storehouse=仓库
homestead.rooms.roomkinds.storehouse_line=仓库：这里的每个箱子能多装10件物品。
homestead.rooms.roomkinds.shrine=神龛
homestead.rooms.roomkinds.shrine_line=神龛：在这里过夜，醒来时会带着祝福，一天内治疗速度快10%。
homestead.rooms.roomkinds.comfort=舒适度：%1$s（%2$d/%3$d）。
homestead.rooms.comfort.bare=简陋
homestead.rooms.comfort.plain=朴素
homestead.rooms.comfort.cosy=温馨
homestead.rooms.comfort.comfortable=舒适
homestead.rooms.comfort.fine=精致
homestead.rooms.homebed.name_straw=草垫床
homestead.rooms.homebed.name_wood=木床
homestead.rooms.homebed.name_fur=毛皮床
homestead.rooms.homebed.desc_straw=一张粗毯子底下的一堆稻草。总比光秃秃的地面强。
homestead.rooms.homebed.desc_wood=木架床上铺着草垫和羊毛毯。
homestead.rooms.homebed.desc_fur=木架床上堆满毛皮。哪怕在寒夜里也能让你暖和。
homestead.rooms.homebed.desc_heal=在这里过一夜可恢复%1$d%%的生命值。房间的舒适度：%2$s。
homestead.rooms.homebed.menu_heal=在这里过一夜可恢复%d%%的生命值。
homestead.rooms.homebed.menu_sealed=房间密闭完好：没有东西能趁你睡着找到你。
homestead.rooms.homebed.menu_open=这张床没有任何围合，夜里可能有东西找到你。
homestead.rooms.homebed.menu_open_fire=这张床没有任何围合，夜里可能有东西找到你，不过有火在，可能性会小些。
homestead.rooms.homebed.menu_fur=毛皮能让你保持温暖，除非房间冷得刺骨。
homestead.rooms.homebed.blessed=你带着神龛的静默祝福醒来。
homestead.rooms.homebed.not_tired=你仍休息得很好，还不能再次入睡。
homestead.rooms.wellrested.name=休息充分
homestead.rooms.wellrested.desc=你在像样的床上睡得很好。获得的经验值增加了10%%，治疗速度快了10%%。\n\n剩余回合数：%s。
homestead.rooms.shrineblessing.name=神龛祝福
homestead.rooms.shrineblessing.desc=你在神龛中睡下，醒来时带着静默的祝福。你的治疗速度快了10%%。\n\n剩余回合数：%s。
items.food.food.kitchen_made=在厨房里烹制的：饱腹时间延长一半。
homestead.piece.bed_straw.name=草垫床
homestead.piece.bed_straw.desc=毯子底下的一堆稻草。在这里过一夜可恢复四分之一的生命值，在舒适的房间里更多。会燃烧。
homestead.piece.bed_wood.name=木床
homestead.piece.bed_wood.desc=木架床配着草垫。在这里过一夜可恢复三分之一的生命值，在舒适的房间里更多。会燃烧。
homestead.piece.bed_fur.name=毛皮床
homestead.piece.bed_fur.desc=木架床上堆满毛皮。在这里过一夜可恢复一半的生命值，而且除非房间冷得刺骨，毛皮能让你保持温暖。会燃烧。
homestead.piece.rug.name=地毯
homestead.piece.rug.desc=铺在地上的皮革地毯。能让房间更舒适。
homestead.piece.bookshelf.name=书架
homestead.piece.bookshelf.desc=一个空木书架。能让房间更舒适。它前方需要有空地，所以不能紧贴着墙摆放。会燃烧。
homestead.piece.statue.name=雕像
homestead.piece.statue.desc=一尊雕琢的石像。能让房间更舒适，而有雕像的房间就是神龛。

###the stations (homestead/stations, homestead/pieces/StationPieces, windows/WndCraft)
homestead.piece.workbench.name=工作台
homestead.piece.workbench.desc=一张放着锯子和锤子的台子。能把原木锯成木板，把茅草搓成绳子，还能做火把。同一房间里还有另一座工作设施时，房间会成为工坊，所有工作设施都快四分之一。
homestead.piece.masons_bench.name=石匠工作台
homestead.piece.masons_bench.desc=一张石面台子，配一把木槌。能把粗石修整成琢石。
homestead.piece.kiln.name=窑
homestead.piece.kiln.desc=一座圆顶黏土窑。用原木或木炭点火，可把黏土烧成砖、把沙子熔成玻璃、把木头烧成木炭。
homestead.piece.hearth_brick.name=砖砌壁炉
homestead.piece.hearth_brick.desc=砖砌的壁炉。点燃后能温暖所在的房间、驱赶野兽，还能烤面包、烤肉。
homestead.piece.hearth_stone.name=石砌壁炉
homestead.piece.hearth_stone.desc=粗石砌成的壁炉。点燃后能温暖所在的房间、驱赶野兽，还能烤面包、烤肉。
homestead.piece.cooking_pot.name=炖锅
homestead.piece.cooking_pot.desc=架在余烬上的大锅。无需任何炼金能量就能炖菜，还能烹制无味果和肉馅饼。
homestead.piece.tanning_rack.name=硝皮架
homestead.piece.tanning_rack.desc=用来硝制兽皮的木架。能慢慢把兽皮变成皮革。
homestead.piece.forge.name=锻炉
homestead.piece.forge.desc=带风箱的砖砌锻炉。用原木或木炭点火，可把铁矿石锻成铁件。它做不了杰作核心。
homestead.piece.quern.name=石磨
homestead.piece.quern.desc=两扇磨盘加一个把手。能把玉米麦磨成面粉。
homestead.piece.alchemy_pot.name=炼金釜
homestead.piece.alchemy_pot.desc=属于你自己的炼金釜。功能与其他炼金釜相同。无物可毁，但拆掉时不会退还金币。
homestead.piece.enchanting_pedestal.name=附魔基座
homestead.piece.enchanting_pedestal.desc=属于你自己的附魔基座。功能与其他附魔基座相同。无物可毁，但拆掉时不会退还金币。

homestead.stations.workbench.name=工作台
homestead.stations.workbench.desc=一张结实的台子，放着锯子和锤子。点击可查看它能做什么。
homestead.stations.masonsbench.name=石匠工作台
homestead.stations.masonsbench.desc=一张石面台子和一把修整石料的木槌。点击可查看它能做什么。
homestead.stations.kiln.name=窑
homestead.stations.kiln.desc=一座圆顶黏土窑。只有火点着时才会工作。点击可为它添柴、点火并安排工作。
homestead.stations.hearth.name=壁炉
homestead.stations.hearth.desc=带烟罩的壁炉。燃烧时能温暖所在的房间、驱赶野兽，还会烤熟丢进火里的东西。点击可为它添柴、点火并安排工作。
homestead.stations.cookingpot.name=炖锅
homestead.stations.cookingpot.desc=架在三脚架上、底下余烬自燃不熄的大锅。点击可查看它能烹饪什么。
homestead.stations.tanningrack.name=硝皮架
homestead.stations.tanningrack.desc=用来撑开并硝制兽皮的木架。点击即可开始工作。
homestead.stations.forge.name=锻炉
homestead.stations.forge.desc=带烟罩和风箱的砖砌锻炉。只有火点着时才会工作。点击可为它添柴、点火并安排工作。
homestead.stations.quern.name=石磨
homestead.stations.quern.desc=两扇磨盘加一个把手。点击即可开始工作。
