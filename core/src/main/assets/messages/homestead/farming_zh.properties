###homesteads: the fields and the animals (homestead/farming, homestead/animals)

###the pieces (homestead/pieces/FarmPieces)
homestead.piece.farm_plot.name=农田
homestead.piece.farm_plot.desc=翻整成农田的土地，可以播种。免费，且能一次开垦整片区域。在上面播下种子即可长出作物。
homestead.piece.channel.name=灌溉渠
homestead.piece.channel.desc=从河流、池塘、水井或另一条灌溉渠引出的水沟。免费，可沿直线开挖。水边的作物生长更快、更不易枯萎。拆除后会被重新填平。
homestead.piece.well.name=水井
homestead.piece.well.desc=一口石砌的水井。2格内的农田视为已浇水，也可从井边挖出灌溉渠。
homestead.piece.compost_bin.name=堆肥箱
homestead.piece.compost_bin.desc=放入种子、浆果、作物和生肉。每5样东西会在500回合后变成一份植物肥料，即使你不在也一样。
homestead.piece.tie_post.name=系桩
homestead.piece.tie_post.desc=带铁环的矮桩。可以把牵着的动物系在上面，就像系在篱笆上一样。

