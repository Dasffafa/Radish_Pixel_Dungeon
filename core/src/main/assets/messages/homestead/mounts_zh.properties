###taming a wild horse
homestead.mounts.taming.shied=野马受惊跑开了。给它留下点吃的，它进食时你保持距离。
homestead.mounts.taming.no_food=野马盯着你空空的双手。茅草、一截玉米麦茎、一枚阿普里科或一颗生淡味果也许能赢得它的信任。
homestead.mounts.taming.eats=野马吃掉了%s。
homestead.mounts.taming.trust_1=它看你的眼神放松了些。
homestead.mounts.taming.trust_2=它允许你靠近些了。
homestead.mounts.taming.trust_3=它不再躲避你了。亲手喂它吧。
homestead.mounts.taming.tamed=马儿从你手中吃食，还用鼻子蹭你。它现在属于你了。

###the village stable
homestead.mounts.stables.closed=马夫已经歇下了。
homestead.mounts.stables.offer=一匹健壮、温顺且已配鞍的马，售价%1$d金币。你有%2$d。
homestead.mounts.stables.do_buy=购买（%d金币）
homestead.mounts.stables.too_poor=金币不足（%d）
homestead.mounts.stables.bought=这匹马归你了，连马鞍一并。
actors.mobs.npcs.overworldshopkeeper.name_12=马夫
actors.mobs.npcs.overworldshopkeeper.talk_stable=这儿都是好马，全都驯服好了。看上哪匹就点哪匹。马鞍和干草在架子上，马吃茅草、玉米麦或果子。

###the rope on a horse (homestead/animals/Roping)
homestead.animals.roping.too_wild=野马躲开了绳子。先用食物赢得它的信任。
homestead.animals.roping.not_yours=那匹马是马夫的。
