###the horses and riding (actors/mobs/Horse, items/misc/Saddle, homestead/mounts)

###the horse
actors.mobs.horse.name=野马
actors.mobs.horse.name_tame=马
actors.mobs.horse.desc=草原上的马，迅捷而强壮。野马白天小群啃食青草，一见有人靠近便四散奔逃。
actors.mobs.horse.desc_trust_0=它警惕地打量着你。给它留下点吃的（茅草、一截玉米麦茎、一枚阿普里科或一颗生淡味果），然后退开让它吃。
actors.mobs.horse.desc_trust_1=它吃过一次你给的食物，允许你靠近一点了。
actors.mobs.horse.desc_trust_2=它吃过两次你给的食物，只有你紧贴着它时才会逃开。
actors.mobs.horse.desc_trust_3=它不再躲避你了。亲手喂它，它就是你的了。
actors.mobs.horse.desc_tame=你的马。你把它留在哪里，它就在哪里等你。它还没有马鞍：装上马鞍就能骑乘。
actors.mobs.horse.desc_saddled=你的马，已装好马鞍。点击即可骑乘，长按则打开它的菜单。
actors.mobs.horse.desc_sale=马夫的马，温顺且已备好马鞍。点击即可购买。
actors.mobs.horse.died=你的马死了。

###the saddle
items.misc.saddle.name=马鞍
items.misc.saddle.desc=铺着红毯的骑乘马鞍。在马匹菜单里或直接用这个马鞍给属于你的马装上，你便能在地表和山上骑乘它。两张兽皮加一根绳子可在鞣革架制成马鞍，马夫也有出售。
items.misc.saddle.ac_saddle=配鞍
items.misc.saddle.prompt=选择你身旁的马

###on horseback
homestead.mounts.riding.name=骑乘中
homestead.mounts.riding.desc=你正骑在你的%1$s上。在地表和山上，你的速度加倍，每步只消耗一半时间和一半饱腹度。你的马会替你承受每次击中你的伤害的三分之一。点击自己即可下马；近战攻击敌人时会先下马。\n\n你的马生命值：%2$d/%3$d。
homestead.mounts.riding.desc_none=你正在骑马。
homestead.mounts.riding.hurt=你的%s伤得很重！

