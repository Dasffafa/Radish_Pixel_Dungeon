# --- pages added with the guide remake ---
guide.hs_overview=在地表世界里，你随处都能建造：地表、每一块山地和每一块矿洞。地牢和镇子里不能建，楼梯上或区域之间的通道上不能建，封闭的陵墓和村庄田地上不能建，构成村庄或世界景物的任何东西上也不能建。\n\n镇上的_杂货店_出售_建筑工具_（150金币）和_建造者挎包_（120金币），按镇上的价格，而价格会随你到达过的最深层数上浮。两样都到手后，店里的工具架便会摆出来：_伐木斧_和_石匠锤_（各200金币），一把铲子、一把短柄镰，以及12金币一卷的绳子。挎包能装30组：建材、便携箱子和建筑工具，还有石头里出产的东西（矿石、宝石、石矿、暗金、诺恩石和杰作核心）。建造时会优先从里面取用。\n\n每个村庄的水井旁都有一位_木匠_，按价值的两倍出售木板、绳子、茅草、铁件和玻璃板。任何商人都按价值回收建材。\n\n你建起的东西，历经每一次存档、每一次远行都还在。放下_家园石_，就能把一处地方变成你的家：你可以在家园之间往来，而家园也会招来麻烦。
guide.hs_gathering=_砍伐_：带着斧头点击身旁的树。伐木斧要砍3下，巨斧4下，战斧5下，斧头6下，手斧8下；优先用你手里的斧头，否则用你带着的最快的那把。每把斧头都是“伐木”类武器：类型每高一阶，砍倒所需的挥砍就少约五分之一，有时还能多给一根原木。每一下都会惊醒8格内的怪物，把它们引过来。树会朝背离你的方向倒下，站在落点的人会失去剩余生命值的三分之一。橡树给3到4根橡木原木；松树给2到3根松木原木，并有十分之三的机会给树脂。橡树会掉下_橡实_，松树会掉下_松果_，有一半的机会。树桩会重新长起来：经过4个春季或夏季的日子长成树苗，14天长成树。你可以从树桩上走过去；拿着斧头长按身旁的树桩，就能把它刨出来（再多一根原木），它就不会再长了。斧头也能砍掉_灌木_，所需的挥砍只有砍树的一半，留下草地，并有一半的机会留下_灌木种子_。村庄里的树木和灌木不能砍。\n\n_种植_：橡实、松果或灌木种子能种进你身旁的草地或裸土里。它会长成树苗或幼灌木，在春季和夏季里生长：经过14个这样的日子长成树，灌木则要6天。\n\n_石头_：岩砾能敲成2到3块粗石，用镐子、战锤、匠师之锤或采掘工具要3回合，用石匠锤只要2回合——取你携带的工具中最快的那件。你开采的岩壁给1到2块粗石；石匠锤也能开采岩壁，要3回合。带“采石”类型的锤、镐或铲敲石头、挖掘时更省几下，有时还能多挖出一块石头或矿石。在矿洞里，敲碎岩砾和任何镐击一样，都可能引起塌方。\n\n_铲子_：把草地或裸土挖成农田（十次中有一次会翻出一颗种子），从沼泽和河流的泥岸边挖黏土，从海滩和沙漠里挖沙子（这两样只在地表才行），或把树桩刨出来，再多得一根原木。\n\n_短柄镰_或战镰：割高草可得1到2份茅草；震落出来的种子有时会翻倍。\n\n砍树和敲岩砾会让你稍微有点饿。鹿和野牛总会留下_兽皮_，山羊、雪人、骆驼和鳄鱼有一半的机会，狼则三次中有一次。
guide.hs_building=使用建筑工具。建造会打开建造菜单；拆除、修理和查看会直接切到建造栏。你在所处位置4格范围内、看得见的格子上建造。联机游戏中只有房主能建造。\n\n_菜单_把部件分门别类，“最近”一组放着你最近建过的8件。每张卡片都会用绿色或红色显示你现有的数量与所需数量，以及你负担得起几件。选一张卡片即可放置该部件。\n\n_建造栏_会取代工具栏的位置。绿色的虚影表示可以建，琥珀色的表示材料不足，红色的表示那里不能建。一次放置一个部件，沿_直线_（8个方向，最多64格）或在一片_区域_上（最多64格：地板、屋顶和道路会填满它，墙和栅栏则围出中空的轮廓）。第三次点击便会按这个形状开工，一件一件地建；一旦有怪物进入视野、你受伤，或你点击地图，它就会停下。点击够不到的地方，你会走过去。\n\n_拆除_返还一半材料；设施会先向你确认，并把它装着的东西掉出来。_修理_花费该部件材料的四分之一。_查看_会显示部件的耐久，以及它属于哪个房间。\n\n_墙_：原木（2根橡木原木，耐久40）、木板（3块木板，60）、石头（3块粗石，120）、砖（2块红砖加1份黏土，160）。窗户花费一块玻璃板，外加它所在墙体的一份材料（耐久20）。门花费4块木板；_铁闩门_要4块木板和2个铁件，只有你和你的盟友能打开。木板地板或石地板，以及石板路，花费1块木板或1块粗石。栅栏1块木板，栅栏门3块木板加一根绳子，尖木栅2根橡木原木，木板桥3块木板，铺在水面上。\n\n_屋顶_（茅草、木板、石板瓦、陶瓦、玻璃）可以铺在地板和墙上，但须在支撑它的墙4格之内。你在屋里时，头顶的屋顶会淡出。\n\n原木墙和木板墙、门、栅栏、栅栏门、尖木栅，以及茅草或木板屋顶都会燃烧。炸弹、镐、火和闯进来的怪物都会让部件损耗；毁掉的部件会留下残骸，用拆除清理。只有长按，镐子才会敲到你自己的建筑；普通点击不会伤到它。闪电打到屋顶时会击中屋顶而非你，并点燃茅草或木板屋顶。\n\n_火把_：在地表世界里，用“放置”把火把插进身旁的地面。它会一直烧着，照亮周围地面，并且和点燃的壁炉一样，让野生动物不在10步内落脚。点击它就能收回。
guide.hs_stations=_设施_要花10回合建造：工作台（6块木板）、石匠工作台（4块粗石、2块木板）、窑（8块粗石、4份黏土）、壁炉（6块红砖，或8块粗石）、炖锅（2个铁件、2块红砖）、硝皮架（4块木板、2根绳子）、锻炉（10块红砖、4个铁件）和石磨（4块琢石）。自建的_炼金釜_要800金币和4块红砖，_附魔基座_要1,500金币和4块琢石，均按镇上的价格。金币从不退还。\n\n点击设施，最多可排队4项工作，每项最多20批；一项工作所需的材料会被一次取走。你不在时设施也会继续工作。\n\n- 工作台：1根原木出3块木板；3份茅草出1根绳子；树脂加1根橡木原木，或木炭加1块木板，出2支火把；2根秃鹫羽毛加1块木板出5支飞镖；1颗鳄鱼牙加1块木板出2支捕鱼矛。\n- 石匠工作台：2块粗石出1块琢石。\n- 窑：2份黏土出2块红砖；2份沙子出1块玻璃板；1根原木出2块木炭。烧毁的树也会在灰烬里留下1到2块木炭。\n- 硝皮架：1张兽皮出1份皮革，需300回合。\n- 锻炉：1块铁矿石出4个铁件；2个铁件加2块木板出1把伐木斧或1柄石匠锤。\n- 石磨：2根玉米麦茎出1份面粉。\n- 壁炉：面粉烤成面包，饱腹度相当于一份半口粮；生肉烤成烤肉。\n- 炖锅，无需炼金能量：炖肉、用你选定的一种种子烹制的无味果，以及肉馅饼。\n\n窑、锻炉和壁炉只在点燃时工作。往燃料槽（最多20块）里放入原木（能烧200回合）或木炭（能烧400回合），然后点燃。点燃的壁炉能让所在房间升温16度，锻炉8度，窑6度；野生动物会与点燃的壁炉保持10格距离。\n\n_工坊_（同一房间里有工作台和另一座设施）工作速度快四分之一。
guide.hs_rooms=_房间_是被墙、窗户和门四面围合起来的一片地板（矿洞自身的岩石也算），其中至少有一件是你建造的，面积不超过600格，且至少十分之八有屋顶；在矿洞里，头顶的岩层就足以当屋顶。栅栏、栅栏门、尖木栅和树木都会留下缺口。当每扇门都关着、且没有一面你建的墙低于一半耐久时，房间就是_密闭_的。\n\n_床_会燃烧。草垫床（4份茅草）恢复四分之一生命值，木床（6块木板、2份茅草）恢复三分之一，毛皮床（4块木板、3份皮革）恢复一半。睡到当天的下一个时段或天亮，和睡在铺盖上一样；饥饿以四分之一的速度增长。在密闭的房间里，没有什么能趁你睡着找到你。在其他地方则可能被找到；若房间里有火取暖，或2格内有营火，被找到的几率减半。毛皮床能让你保持温暖，除非房间冷过-10度；睡上一觉还能驱散冻寒。\n\n在床上睡上一整夜直到天亮，会让你_休息充分_：到黄昏前经验值多10%，治疗速度快10%；房间越简陋，这一天里能享受它的时间就越短。\n\n_舒适度_，0到20：每6格1点（最多4点）；墙壁的材质（原木1，木板和岩石2，石3，砖4）；建造的地板和地毯最多4点；每块地毯、每个书架、雕像或装饰1点（最多5点）；房间里有火取暖时3点。0起显示为“简陋”，4起为“朴素”，8起为“温馨”，12起为“舒适”，16起为“精致”。舒适度能让床的恢复效果最多再提高一半，但绝不会超过你最大生命值的一半。\n\n_房间类型_：有床就是卧室。有壁炉或炖锅就是厨房：在那里吃下肉馅饼，或在那里用锅烹制肉馅饼，能让饱腹时间延长一半。两个箱子组成仓库，其中每个箱子能多装10件。一座雕像或祭坛组成神龛：在那里睡上一整夜，会祝福你一天内治疗速度快10%。工作台加另一座设施组成工坊；超过一半地板铺上玻璃则是温室。\n\n一块地毯要2份皮革，一个书架要4块木板（南侧需留出空地），一尊雕像要4块琢石。
guide.hs_shelter=在_屋顶_下，雨雪落不到你身上，不过茅草屋顶会让每5滴雨漏进1滴；风却照样吹得进来。\n\n在_房间_里，没有风，也没有雨雪，只要墙壁挡得住，气温就会向15度靠拢：原木0.3、木板0.4、石0.5、岩石0.6、砖0.7、窗户0.2、门0.3，按房间四周的墙壁取平均。屋里的火会加上它的热量：营火之类的燃烧余烬6度，点燃的壁炉16度，锻炉8度，窑6度。查看可以显示房间有多暖。在有火取暖的房间里，你会感到_舒适_，寒冷和酷热都伤不到你。\n\n在屋顶下或房间里，野生植物不会生长，野生动物也不会生成。闪电绝不会劈中房间露天的地板，而击中屋顶的闪电会停在屋顶。野生动物绝不会生成在距家园石或点燃的壁炉10格以内。在屋里能听见雨打在屋顶上的声音，而建造的墙像岩石一样隔音。\n\n在地表世界里，寒冷和酷热造成的伤害取决于你到达过的最深层数。
guide.hs_farming=用铲子或建造菜单里的农田地块（免费，2回合，可铺一片）做出_农田_，然后在上面播下任意种子。它会长成_作物_，即使你离开也会继续生长。\n\n_季节_：作物在春季生长快四分之一，秋季只有四分之三的速度，冬季完全不长。罩在玻璃下（作物上方有玻璃屋顶，或身处_温室_：至少一半地板铺了玻璃的房间）则全年按夏季的速度生长，且永不冻死。\n\n_水_：作物旁每有一格水（最多4格），就能缩短它的生长周期、降低它枯萎的几率，2格内的水井按2格计算。喜水的作物得到的加成翻倍。从水边挖一条_灌溉渠_（免费，4回合，沿直线开挖），或建一口_水井_（8块粗石加一根绳子）。\n\n作物的第一个周期会让它成熟。用背包里的_短柄镰_或战镰收割成熟的作物：无味果树丛给1到2个无味果，玉米麦给2到3根玉米麦茎，杏丛给一枚阿普里科，哥布林葡萄给2颗葡萄，蛋花给一枚植物蛋，番茄丛给1到2个引信番茄，其他作物则给自己的种子；镰刀的类型有时会让这份收获翻倍。若不收割，之后每个周期都会在旁边掉下一颗种子，或者让它枯萎。\n\n_霜冻_：露天的作物在所在格降到-2度以下时会死。你不在时，任何冬季的日子都会杀死露天的作物，但房间里的、玻璃下的和矿洞里的不会。\n\n_害虫_：夜里，12格内的兔子和鹿会去吃任何没有篱笆圈住的作物。走到5格以内就能把它们吓跑。你不在时，冬季之外的每个夜里，它们会吃掉家园石20格内的一株没有圈住的作物。\n\n_植物肥料_能补上作物当前周期剩余生长的四分之一。_堆肥箱_（4块木板）每5颗种子、浆果、作物或块生肉能变成一份肥料，填料后500回合可取。
guide.hs_animals=鹿、山羊、兔子、野牛和骆驼永远无法驯服：你只能用绳子牵住一头带着走。马只有被驯服之后才肯接受绳子（见“马与骑乘”）。绳子的“牵引”可以套住6格以内、你看得见且中间没有阻挡的鹿、山羊、兔子、野牛或骆驼。被牵着的它会跟着你，绝不逃跑。你最多只能牵2只。若有一只落在6格之外，绳子就会滑脱，回到你的背包里。\n\n把牵着的动物_系_到身旁的篱笆、尖木栅或_系桩_（2块木板）上，它就会待在一格之内。点击系住的动物，可以重新牵着走、放它走或把它宰了。\n\n站在_围栏_里的动物——四周被篱笆、尖木栅、建造的墙和关着的栅栏门围起来的区域——会一直待在里面，只在里头走动。点击它就能宰杀。\n\n_屠宰_会立刻杀死它，不给经验值：鹿、山羊、野牛或骆驼留下2块神秘肉，兔子留下1块，各带一张兽皮。\n\n牵在身旁的动物会跟着你穿行于各区域之间，也会随你通过路石旅行；系住的动物则留在它的桩旁。联机游戏中，只有房主能牵引、系住和屠宰。
guide.hs_horses=成群的_野马_白天在草原与草甸上吃草，两到四匹一处。你走进3格以内，野马便会逃走；8格内有狼也一样。它不肯让人套绳。\n\n_驯服_：在4格内给它在地上留些吃的，然后退开。它一次吃一点_茅草_、一截_玉米麦茎_、一枚_阿普里科_或一颗生_淡味果_，每吃一顿，你就能靠近一格。三顿之后它不再躲你：点击它，用手喂食，第四顿便让它归你所有。被逼到角落或关在圈里的马，从一开始就能用手喂。打一匹野马，它就会忘掉之前吃过的每一顿。\n\n驯服的马会待在你留下它的地方，从不乱走。像对待其他动物一样，用_绳子_牵着它，或把它拴在_系桩_上，点击它可打开菜单。\n\n_马鞍_可以在_鞣革架_上做（2张兽皮加一根绳子），也可以找村里的_马夫_买。凡有5座房子以上的村子，水井旁都有一位马夫，出售马鞍、干草和配好鞍的马，要价200金币；你在地牢里走得越深，价钱越高。\n\n_骑乘_：点击身旁已配鞍的马即可上马（长按可打开它的菜单），点击自己即可下马。你只能在地表和群山上骑行，速度加倍，所以每格只花一半时间和一半饱腹度。马从不越过落差。遇到门、屋顶或房间，以及洞穴、古冢、地牢或镇上建筑的入口，你会下马，你的马就在那里等你。没有马会上船：放船下水或上船时，你会在水边下马，它在岸边等你。上下山间台阶，经由通往地表或群山的石头时，它都会跟来。\n\n你不能在马背上攻击：近战攻击会让你先下马，你的马会退到一边。骑行时可以射击、投掷和施放。你的马会替你承受每次击中你的伤害的三分之一；若它的生命值耗尽，它就会死去，你则落回步行。它每10回合恢复1点生命值，你喂它时则恢复其生命值的四分之一。联机游戏中，只有主机能驯服、配鞍和骑乘。
guide.hs_homes=一座_家园_是其家园石周围15格以内的土地，位于各自所在的层。\n\n每座家园都有一个_注意值_：它招来多少麻烦。家园进入视野时、黄昏时，以及你在那里时每20回合，都会重新计算一次；家园石的账簿会逐项列出。箱子里的财物每100金币加1点（袋子按袋中之物计算），最多40点；每2株作物加1点，最多15点；每20件建筑加1点，最多15点；夜间，每处燃烧的火和每扇温暖房间的窗户各加5点，最多20点。石墙与砖墙最多减25点，每扇闩上的门减5点（最多减10点），四周环有木栅栏减15点，瞭望塔减10点，警铃减5点。\n\n_狼群围攻_会在冬夜降临到露天之下、位于森林、雪原或冻原的家园：每4夜一次；注意值超过30时每2夜一次。3到5只狼组成的一群会来猎你。若它们够不到你，便会在4到8格外盘旋，啃咬篱笆和栅栏门，绝不碰墙壁、窗户、门或木栅栏，天亮时离去。\n\n_强盗劫掠_只在注意值超过30时到来：每6夜一次，若靠近强盗营地则每3夜一次。3到6人组成的一伙会冲着最富有的箱子来，从最薄弱处破入，每人最多拿走4样东西，先拿最值钱的，然后逃跑；杀掉一个，它抢走的东西就会掉落。天亮时，或箱子被搬空后，它们便离去。强盗、雪人、暴徒以及任何手持斧头或锤子的东西都会打破你建的东西；其他怪物只在外头等着。\n\n_你不在时_什么也不会发生；夜晚会在你回来时结算。一次离家期间的第一场劫掠会搬空最富有的箱子，并强行破开最近的门或栅栏门，且一次离家最多只损失一只箱子。围攻之夜会磨损最外圈的4道篱笆或栅栏门。账簿会记下发生过的事。\n\n_防御_：_瞭望塔_（8块木板、4根橡木原木、2根绳子）：爬上去可多看4格远，并能发现30格内的狼和强盗。_警铃_（2件铁件、2块木板、1根绳子）会在你睡觉时，任何敌意之物踏上家园土地时把你唤醒；有围攻或劫掠来临时，它会提前结束你的睡眠；没有铃，你会一觉睡过去，醒来只看到它们干的事。_尖刺陷阱_（2件铁件、1块木板）只会刺穿并残废怪物，20回合后重新装好。世界地图上，遭到攻击的家园会显示为一个闪烁的红点。
guide.hs_travel=一块_家园石_（10块粗石加2块琢石；200点生命值，不会燃烧）能把所在之处变成家园，并以最近的地名命名。点击它可以旅行、给家园改名或查看账簿。你最多可保有3座家园；拆下家园石会终结它的家园，建造菜单会先向你确认。\n\n_路石_立在镇广场旁，也立在每个有9座房子以上聚落的水井旁。触碰一块路石，即可在这一局余下的时间里将它唤醒。\n\n站在家园石或已苏醒的路石旁，你可以前往自己的任意家园和已苏醒的路石，无论在哪一层。途中不会流逝时间，也不会有东西拦路。它只消耗_饱腹度_：两块石头之间直线每格半点，每上下跨越一层再加60点，最多450点。吃饱状态下的饱腹度会先被扣除。旅程若会让你越过极度饥饿，就会消耗生命值；若会致你于死地，则会被拒绝。浮空、定身或敌人进入视野时，你无法旅行。联机游戏中，只有主机能旅行，队伍会一同前往。你用绳子牵着、就在身旁的动物也会跟来。\n\n世界地图会标出你的家园和你已知的路石。道路、村道、石铺路和桥梁走起来快十分之一。
guide.hs_catching=一张_捕虫网_能捉住你身边的小生命。朝3步以内、你看得见的小虫挥网：它会以自己的几率落进_罐子_里，也可能逃掉。挥一次网要花一回合；空处不能挥网。小虫见你靠近便会躲开，所以挥网前先停在几步之外。\n\n在地表，这张网能捉到_蝴蝶_：春夏风清日朗的日子里，在草甸与草原上空；也能捉到_萤火虫_：夏夜在草甸和林地上空，以及任何干燥的夜晚在沼泽上空。在地牢里，它捉的是各层自己的小生命：火把边飞绕的_蛾子_、蛛巢网里的_苍蝇_、_甲虫_与火炭甲虫、蟑螂、蜈蚣、衣鱼、蜘蛛、_蜗牛_、水黾、_青蛙_、蝾螈和蜥蜴。鸟、野兔、老鼠、鱼、蝙蝠和火蝾螈，要么太大，要么太快，网捉不住。\n\n_机警的小虫_：在同一片土地上，一天里你网住的前3只小虫按各自几率到手；第4只降到四分之三，第5只降到一半，第6只降到四分之一，之后到第二天为止一只也捉不到。一片土地，是世界某一层上64×64格的正方形，或是地牢的整整一层。\n\n罐子里的小虫是_钓鱼竿_的鱼饵，每一种都是某一种鱼的最爱。放生能让它重获自由。\n\n在_工作台_上用一块_木板_和一卷_绳子_可以做一张捕虫网，也可以向村里的种子商人买，有时食物商人也卖。联机游戏中，只有主机能捉小虫。
guide.hs_fishing=抛竿：把_钓鱼竿_抛进你看得见的开阔水面，最远4步：河流、湖泊、海洋、沼泽的水洼、洞穴里的水潭或山间的小湖，站在岸上、桥上或船上都行。朝身旁的_冰面_抛竿，你会凿开一个洞，把线垂下去。只有地表世界的水里才有会咬钩的鱼：地牢里的水里什么也没有。\n\n每次抛竿都会在钩上挂一份_鱼饵_：你在挂饵时选中的那份，否则就是你随身带的第一份，_蚯蚓_优先于罐装小虫。你的_铲子_翻挖高草或裸土时，十次里有三次能翻出蚯蚓，雨天则是十次里有六次；_捕虫网_能捉小虫装进罐子。每种鱼都有自己最爱的饵。\n\n然后你歇下来，盯着_浮漂_。等待要4到8回合：此处此刻的鱼越活跃，等得越短；若饵、时辰、季节或天气对它们不合适，就等得更久；但绝不少于2回合，也不超过18回合。咬钩前一回合，浮漂会抖一下。鱼一咬钩你便会惊觉：3回合内收线把它捞上来，否则它就连饵一起逃掉。只要离开你所在的格子，线就会被收回。无论结果如何，饵都会消耗掉。\n\n生鱼只能稍填肚子。在点着的_壁炉_或任何火堆上烤，或在_炖锅_里炖，就能填饱得多，还能少量治疗你。水边的村子都有自己的_渔夫_：趁他干活时搭话，就能把你所有的生鱼按原价一倍半卖给他，也可以买一根钓竿或一把蚯蚓。你还能在工作台上用一块木板、一卷绳子和_铁件_做一根钓竿。联机游戏中，只有主机能钓鱼。
guide.hs_fish=什么鱼咬钩，取决于水域、鱼饵、时辰、季节和天气。在洞穴的水潭里，只有水域和鱼饵起作用。\n\n_溪鳟_：河流与山间小湖，偶尔也在湖泊。最爱带翅的昆虫，在黎明与黄昏、春季与秋季，以及雨中咬钩。\n_河鲈_：湖泊、河流、沼泽和冰洞。吃蚯蚓和幼虫，白天、夏季和晴朗天气里咬钩。\n_狗鱼_：湖泊与沼泽，偶尔也在河流和冰面下。吃活青蛙、蝾螈或蜥蜴，在黄昏与黎明、秋季咬钩。最丰盛的一餐。\n_鲶鱼_：首推沼泽，其次是河流与湖泊，偶尔也在洞穴水潭。吃蚯蚓，在夜里与黄昏、夏季、雨中或暴风雨中咬钩。\n_鲭鱼_：只在海里。什么饵都吃；白天和夏季最好。\n_北极红点鲑_：冰洞与山间小湖。吃蚯蚓和发光的饵，在冬季咬钩。\n_洞穴鱼_：眼盲而苍白，只存在于世界深处洞穴的水潭里。发光的饵能把它们引来：一只萤火虫或一只火炭甲虫。\n\n偶尔还会钓上别的东西：_旧靴子_，除了洞穴，哪里都可能；_湿透的钱袋_，会在你脚边洒出几枚金币，有时还带一块符石；或者_瓶中信_，多半出自海洋与河流。在地表的天光下读那张纸条：它写着某处埋着东西，深40到120步，你的_世界地图_会标出那个地点。在远海或群山深处，没有一处与它的草图对得上：换个地方再读一次。用铲子在那里、或就在旁边挖，会挖出一只装着金币、戒指或法杖的_箱子_，有时还有一瓶药剂。冻土解冻前挖不动。
guide.boss_demonlord=300点生命值；他的攻击造成18到36点伤害，且每三次命中就有一次让你冻寒。他醒来时，这一层会被封锁，直到他死去。\n\n_吐息_：当你在4格以内并处于他的视野中时，他可能会吸气。朝你方向的扇形区域会结霜，他头顶会显示倒计时；3回合后他吐息，造成20到40点伤害并施加冻寒，还会冻结扇形区域里的水。离开那片扇形，或用六根冰柱中的一根隔在你们之间。距离超过4格，他绝不会吐息。\n\n生命值低于一半时，他吐息得更频繁，还会有两只_冰霜恶魔_（110点生命值，攻击造成20到35点伤害）从他身旁爬出来。它们会随他一同死去。\n\n睡眠、恐惧和眩晕对他无效；燃烧只造成一半伤害。\n\n他会掉落_磨损钥匙_，用来开他王座后那扇锁着的门，门后通回22层；他还会掉落_气候水晶_：一件在恶劣天气里充能的神器，放下后能让两格内的每一格保持温和温度，持续300回合。
guide.boss_dragon=地图上每一处龙巢里都有一条巨龙。它有8,000点生命值，移动速度是你的两倍。它的咬击造成150到300点伤害，且只要看得见你，无论多远都能吐出毒液，造成300到600点伤害。\n\n若它看见了你，就用岩石隔在你们之间，然后离开；在开阔地上你跑不过它。\n\n它的宝藏是三堆200到600枚金币。被杀死的巨龙不会回来，也没有别的巨龙会占据它的巢穴。带着古冢装备、等级也够高时，才去与一条巨龙交战；而且只在你逃得掉的地方打。
guide.boss_spiderqueen=_蜘蛛女王_有120点生命值，咬击造成12到20点伤害，且每两次命中就有一次下毒。火焰伤不了她。她看见你时，这一层会被封住，直到她死去。\n\n她在猎杀时，只要活着的蜘蛛少于六只，大约每20回合就会在身边产下一枚卵。一枚卵有2点生命值，若你看得见它，约20回合后便会孵化：边走边把卵打碎。\n\n生命值低于一半时，她不再攻击，而是向后退，让她的子嗣来打。别跟着她扎进虫堆里。清掉卵和蜘蛛，把她逼到角落，再结果她。\n\n她会掉落一瓶治疗药剂、一根随机法杖和_蜘蛛护符_，后者能召唤一只友方蜘蛛仆从，代价是你最大生命值的四分之一。若这代价会要你的命，它便不会回应。
guide.deep_hazards=从第四层洞穴往下，低矮封闭的地方会积着_瓦斯_。身处其中，你能闻到气味，并看见一层淡淡的雾气；三回合后你会头晕。瓦斯里一旦有明火（你的火把、燃烧的生物、火焰弹、燃烧的地面），它便会嘶嘶作响，并在你的下一个行动之后爆炸。爆炸会伤及瓦斯内和旁边的所有东西，你最多损失约三分之一的生命值，还会留下火焰。先把火把弄灭，或者先出去。爆炸过的瓦斯窝会空上三天。\n\n挖掘可能弄塌顶板。挖掉支撑顶板的岩石，或松动区域的岩石，可能让顶板发出呻吟；越往深处，松动的岩石越多。在你的下一个行动之后，岩石会落到那一格及其周围：你最多损失三分之一的生命值、陷入残废，部分区域还会堆满碎石。要在顶板有支撑的地方挖。\n\n洞穴里的水几乎从不结冰：无论地表是什么天气，深层洞窟都保持温和。
guide.deep_overview=地表之下共有十二层洞穴，越往深处，洞室越大。一处洞口——开阔地上一个黑沉沉的洞——通往第一层。梯子和竖井通向下面，透过竖井你能看见下一层的地面。用镐子“向下挖掘”，可以挖出一条永久竖井，供你上下攀行；若没有镐子，矿工营地里的矮人会卖你一把。\n\n深层洞窟没有天空、天气，也没有白天。你能看见8格远；提灯、火光、发光蘑菇和水晶碎片能照到16格。\n\n第1到3层：蝙蝠、老鼠、史莱姆、蛇、虫群和蜘蛛。第4到6层：豺狼暴徒、萨满、黏土魔像、死后会爆开的石化骷髅、水晶矿脉旁的水晶灵簇，以及深潭里的白化食人鱼（它们被计入海螺壳的击杀数）。第7到9层：魔像、成对的暴徒、菌生蜘蛛。第10到12层，即深渊：成对的魔像、怨灵、偶尔出现的牛头人或灰色巨魔，以及灼热地面上的火元素与迷失之魂。\n\n岩石里闪着矿脉的光：铜在靠近顶层处，铁和银在更深处，黄金从第6层起，深银从第9层起。水晶矿脉里可能藏有宝石，钻石只在第3层以下才有。镇上的铁匠每天能把一批矿石熔炼成一颗杰作核心：100块铜、50块铁、30块银、20块金，或10块深银或天铁。
guide.deep_places=深层洞窟里的地点，一旦被你看见，就会记到你的地图上。\n\n_旧矿坑_（第1到6层）：一处场院，以及一条带轨道和矿车的木支架巷道。骷髅看守着一堆矿石，有时还带着火把或一把镐子。有些矿坑有通往下面的竖井。\n\n_蘑菇洞窟_（任何一层，潮湿岩层中更常见）：巨大的发光蘑菇、菌类守卫，还有一堆蘑菇与种子。\n\n_水晶洞窟_（第3到12层）：水晶墙壁与发光的碎片。水晶灵簇看守着一堆宝石，每天会重新出现一次。从第8层往下，还会有一名水晶守卫睡在那里。\n\n_矿工营地_（第2到8层）：一堆火、几个铺盖卷和一位矮人商人。他收购矿石和宝石，出价比镇上的商店高一半；也卖火把、口粮，若你没有镐子还会卖你一把，并会告诉你营地附近有什么地方。\n\n_湖畔神龛_（第2到10层）：深潭边的一尊神像。每天你可以往水里投金币，换取祝福；金币越多，祝福持续越久。潭里住着一条食人鱼。\n\n_燃烧裂隙_（第5到12层）：一道横贯洞室的岩浆，发出警示后一回合便会骤然喷发。裂隙元素守卫着一座古老的矮人锻炉。它的熔炼与镇上铁匠相同，但熔一颗核心只需7块深银或天铁，而非10块。所有锻炉加起来，每天只能熔炼一次。\n\n_封印古墓_（第8到12层）：一圈石墙，配一扇铁门，里面有一具石棺、一只箱子和一个巫妖。钥匙就在附近一具骷髅的遗骸里。这些墙既挖不开，也炸不开。
guide.wet_swamps=_沼泽_很罕见：那是温暖潮湿的低地，一半地面是水，芦苇长得很高。_低雾_时时刻刻都浮在沼泽上。白天它是一层薄霭，让你的视野减少1格；黄昏后它加厚到2格，临近黎明、雾气最浓时会到3格。从黄昏稍晚直到日出后不久，它浓得足以算作迷雾。站在雾里的东西也看得更少，唯有亡灵、恶魔和火性生物例外。_沼泽提灯_冰冷的绿光能烧穿它。\n\n沼泽的_水_会拖住你的腿：每一步踏入水中都要多花三分之一的时间，除非你在飞行。在靴子上抹_涉水膏_，或得到_沉没的神龛_的祝福，就能让你的脚步保持轻快。\n\n几乎每一片够大的沼泽都有一处去处：_沼泽女巫_的小屋，或一座沉没的神龛。_世界地图_会标出它们并注明名字。
guide.wet_witch=沼泽的泥沼里立着_沼泽女巫_的小屋：一座小房子，四周环着一圈泥沼水沟，一条_木栈道_从门口通到岸边，她的灯彻夜亮着，烟囱总冒着烟。她跟商店一样按点营业：夜里不做买卖，因为夜里她要出去采摘。\n\n她的架子上摆着只有沼泽才出产的东西，价钱比商店贵四分之一；另外还有这几样：_女巫解药_（能拔除毒素、淤泥和寄生虫，还能止住流血的伤口）、_沼泽提灯_（一盏能烧穿沼泽浓雾的灯）和_涉水膏_（涂上之后，泥沼的水不再拖慢你）。她每周补货一次。\n\n她还会_熬药_：往她的锅里随便放三样_草药_（种子）、_蘑菇_或_小动物部件_（生肉、兽皮、一枚鹰蛋、一根秃鹫羽毛、一颗鳄鱼牙、一只罐装小动物），草药决定熬出哪种_药剂_。同一种放三份，就一定熬出那一种，她会把名字标在瓶子上；否则她会从这几样里随机挑一种来熬，哪样放得多，出哪种的可能就大。锅里不放草药，就能熬出任意一种药剂。每放一份蘑菇，熬出的药剂就有三分之一的几率成为_合剂_。她的酬劳是90金币，锅里每有一份小动物部件，就少收30金币。\n\n花250金币，她能解除一件物品上的_诅咒_。你要是拿一件没有受诅咒的物品给她看，她会告诉你它没受诅咒，不收钱。
guide.wet_shrine=沼泽里半沉着一座_沉没的神龛_：一座古神庙的残墙围成残缺的一圈，每个角落立着一尊_雕像_，地面泡在水里，正中间是沼泽古老神明的_沉没神像_。在它脚下的水面上留下一份_供品_——120_金币_，或一件商人肯出20金币以上收购的物品——_泥沼的祝福_就会降临到你身上：毒素、淤泥和寄生虫都无法在你身上扎根，沼泽的水也不再拖慢你的脚步。金币能买500回合；物品越好，换来的回合越多，价值200金币的物品能换1000回合。神像每3天只收一份供品。\n\n夜里，神龛有人看守。天黑后走进它10格之内，就会有两三个_溺亡侍僧_从它四周的水里升起，每夜一次。他们涉水很慢，不过和所有亡灵一样，在黑暗中会变快；他们的攻击每三次就有一次把泥沼的寄生虫留进你体内，追击你时，最远也不会离开神龛10格。日出时他们会沉回水里，除非正打着仗脱不开身。
guide.wet_tidepools=海边沙滩的礁石之间，散布着多处_潮池_。_潮水_一天涨落两次，每天略晚一点，有一半的时间是退潮。退潮时，海在潮池里留下_贝壳_，偶尔还留下一颗_珍珠_（九次里有一次）：池里最多同时有6枚贝壳，海每天再送来2枚。潮水回来时，还留在池里的贝壳和珍珠会被它收回去。商人收一枚贝壳8金币、一颗珍珠75金币。\n\n白天退潮时，会有一两只_螃蟹_在礁石间匆匆爬过，偶尔还有一只_珍珠牡蛎_在潮池里安下身来，最多三天一次。站在它旁边点它，就能撬开它取珍珠；三次中有一次，它会先合上壳夹住你的手指。涨潮时，海浪会拍过潮池；到了严霜天，潮池会冻得结实，里面什么也没有。
guide.frozen_overview=深度22处有一个结着霜的裂口，通向冰封大厅：四层洞窟，编号21到24，第25层是恶魔领主的竞技场。从最上面一层爬出去，就回到深度22。\n\n空气常年在-15度上下，冷得足以让人失温（见“天气与季节”）。涉水会打湿你的靴子，让你更冷，脚步声也更响。\n\n刷新：棕狼和灰狼（惊动一只，整群都会扑上来）、雪怪、黏土魔像、寒霜之灵和狗头人冰法师。\n\n第一层有一只_笼中狗头人_，它想要_寒冰钥匙_，报酬是一支_灵视蜡烛_。钥匙在深度23的_冰之守卫核心_身上：核心有1,000点生命值，速度只有一半，身边四名守卫被打碎后会重新凝聚。你每打碎一名守卫，核心就掉150点生命值。它一死，所有守卫会同时崩解；它还会掉出钥匙和一根+1冰霜法杖。
guide.nest_overview=监狱深度6有一个结满蛛网的洞，掉下去就是蜘蛛巢穴：五层（6到10），越深越宽。它是个环线：从深度10往下走楼梯，会回到它的第一层；从第一层往上走楼梯，就回到监狱。\n\n前四层每层都有一枚_卵囊_扎根在某处。只要你看得见它，它每20回合就孵出一只蜘蛛，最多同时有六只。它有10点生命值，不能移动也不会攻击：先把它打掉。\n\n这一窝子嗣：_蜘蛛_（咬人时可能让你中毒）、_蜘蛛守卫_（能让你麻痹3回合）、_肿胀蜘蛛_（速度加倍，打中你时会爆开，随机产生一种植物的效果）；从第8层起还有_蜘蛛主脑_，它们缩在后面，把其余子嗣激得发狂。从大约10级起，蜘蛛只给原本四分之一的经验值。\n\n第10层由蜘蛛女王镇守。
guide.peaks_heights=从第七层山地往上，空气就稀薄了。待得越久，_气促_叠得越多，最多五层：每层让自然恢复速度降低15%，饥饿也来得更快。往下走会慢慢消掉它；在火堆旁或屋顶下歇一歇——比如隐士的小屋或石棚——消得很快。\n\n在强风里走上窄窄的山脊，阵风就会袭来。从你眼前掠过的灰色风痕就是警告。你下一个行动之后，阵风会把你往背风方向推出一格；要是你动不了，它就让你恍惚。它从不会把你推下断崖。\n\n山上的湖冰，只有在-10度或更冷时才结实。没那么冷的时候，岸边的冰很薄；到-2度以上，整片冰都薄。薄冰在你站上去的第二回合开始呻吟，第三回合过后就裂；踩回一道裂缝上，它当场就破。你会掉进水里，浑身湿透、冻得发抖。地表的冰冻河流与湖泊总是撑得住你。
guide.peaks_overview=地表之上耸立着十层山地，越往上越冷。崖阶把一层山地连到下一层。雪线以下是草甸；雪线以上是积雪，长着松树，散落着巨石。洼地里蓄着山间小湖。更高的地面是岩石，可以用镐子凿开。更低的地面是断崖：站在崖边能看见下方的大地、湖泊与河流及其两岸；要是掉下去，你会落在下面那一层。\n\n带点暖意上路：火、布甲、一瓶温暖秘药。\n\n第1到3层：白天有野兔和山地山羊，黄昏后是灰狼群。要是你身后就是断崖时打中一只山羊，它会一头把你顶下崖去。第4到7层：狼、雪怪、能在远处让你减速的狗头人冰法师、能把你冻住的寒霜之灵。第8到10层：雪怪（夜里更多）、冰霜恶魔、冰霜元素和寒霜之灵。\n\n岩层里有铜、铁、银和金，最高的峰顶则藏着天铁。
guide.peaks_places=山上的地点，你一旦看见就会标在地图上。\n\n_隐士小屋_（第1到5层，雪线以下）：他卖几样货物，每周免费鉴定三件物品，还会告诉你附近的一个地点，每天换一个新的。\n\n_鹰巢_（第3到8层，悬崖边缘）：巢里有金币、两三枚鹰蛋，每三个巢里有一个还有一颗宝石。两只鹰会攻击靠近到3格以内的一切，追起窃贼来能追出12格。\n\n_石堆_（每座峰顶，第2到10层）：添一块石头（只能添一次），就能揭示周围40格的地形、获得祝福，并得知自己的海拔。\n\n_温泉_（第1到6层，雪地里）：泡着能慢慢回血，解除冻寒与冰冻，出来时你暖烘烘的，也湿淋淋的。\n\n_冻僵的登山者_（第4到10层）：他的遗骸上有一瓶温暖秘药、几瓶辣椒药剂、食物和金币，有时还有一把镐子。站在他旁边，就能读他那一页日志。\n\n_瞭望塔_（第1到4层，山脊上）：每次登上塔顶，都能望见周围26格的大地。有些星期里，一头雪怪或两个强盗会在里面做窝。\n\n_石棚_（第1到9层，山口近旁）：一炉永不熄灭的火，还有一条暖和的铺盖。在那里休息；它也能很快消掉气促。
guide.sea_islands=_岛屿_孤悬在开阔的大洋深处，那里的海水从不结冰，离最近的其他陆地也有五十格以上。暖水里的岛是椰林岛；别处的岛上长着树林。只有乘船才能到。\n\n岛屿第一次被你看见时，会带着名字标在世界地图上。守塔人的_海图_能一次标出他的灯光周围400格内的每一座岛，连同岛上的沉船和灯塔。\n\n有些岛上藏着_埋藏的宝箱_：找一找沙地上划出的十字，四周围着一圈贝壳。用冒险者的铲子在那里挖下去，就能挖出一只海箱，里面有金币，还有一枚戒指、一根法杖或一件神器。有些岛上还有自己的沉船或灯塔。
guide.sea_lighthouses=_灯塔_立在海岸的岬角上，有些岛上也有：白色的塔身箍着一道红环。夜里灯火亮起，两道光束在水面上缓缓扫过。灯塔第一次被你看见时，会带着名字标在世界地图上。\n\n它的_守塔人_站在门前的石板地上。和地表的每一家商店一样，他夜里关门，每周补货一次：\n\n_海图_：在开阔天空下读它，就能把他的灯塔周围400格内的每一座岛标在世界地图上，连同岛上的沉船和灯塔。海图会就此用掉。\n\n_海灯_：点亮后，燃烧时间是火把的两倍，照亮你的路，还能给你一点暖意。它燃烧时，刺眼的光和油料苦涩的烟会把鲨鱼挡在你身外。\n\n把守塔人赶走，他就再也不会回来，可他的灯还亮着。
guide.sea_sailing=船浮在地表的水面上——浅水、深水都行，但必须在开阔天空下。家园的_工作台_能用四根橡木或松木原木加两根绳子扎出一只_木筏_；点燃的_锻炉_能用十二块木板、三根绳子、两个铁件和两张兽皮或皮革造出一艘_帆船_。海边的村庄里，渔夫两种都卖。\n\n_下水_：站在开阔的水边，使用背包里的船。它会落到你身旁的水面上（先试深水），你随即登船。同一时间只能有一艘船在水上：要是第一艘停在走不过去的地方，你再放一艘下去，第一艘就交给大海了。\n\n_在船上_，你能在浅水和深水上移动。踏上船旁的土地就能上岸：船会停在原处，并标在你的世界地图上。点它，你就会走回去登船；站在它旁边，你也可以把它拖出水面，收进背包。在船上时点击陆地上的某一处，你会先驶到最近的登陆点，再步行过去。\n\n_速度_：木筏和步行一样快。帆船快出五成；风与航向的夹角在60度以内时，快出一倍。\n\n_天气_：下雨或刮大风时，海面起浪；起暴风雨时，海面翻涌。这时浪时不时打过船来，把你浇透——深水上比浅滩上更常，暴风雨里则很频繁。每一道浪都会磨损木筏的绑索，暴风雨的浪磨损得厉害；帆船只会在暴风雨里受损。木筏有40点船体，帆船有120点。船体掉了一半时你会得到警告，只剩四分之一时再警告一次。船体归零，船就沉了，一两块木板漂到岸上，而你落进了水里。用木板_修理_背包里的船：木筏一块木板修8点船体，帆船10点。\n\n_游泳_：在没有船的深水里，你以一半的速度游泳，并且一直湿透。12回合之后，海开始消耗你：每两回合失去二十五分之一的生命值，直到你游到浅滩或岸边。
guide.sea_sharks=_鲨鱼_在开阔的深海里猎食。靠近远海时，总有两头在近旁，夜里则是三头。第一次看见它时，划破水面的背鳍就是警告。\n\n鲨鱼只在深水里游，所以在陆地上你是安全的。凡是水里或水面上的，它都会扑上去：游泳的人、在深水边上涉水的人、还有船。它咬得很重，四次里有一次会让游泳的人流血。\n\n咬在船上的攻击，落在船体上。木筏会吃下全部伤害，还有三分之一的几率分出一半伤到你。帆船的木板吃下一半，你一点也伤不到。咬得够多，船就会在你脚下沉下去。\n\n守塔人出售的_海灯_，点亮后能把鲨鱼挡在你身外。鲨鱼一旦被困在深水之外，就会死去。
guide.sea_wrecks=_沉船_搁在海岸的沙滩上和浅滩里，有些岛上也有。每一艘都曾是有名字的船；你第一次看见一艘沉船时，它会带着名字标在世界地图上。\n\n破损的船体是实心的，只有_货舱_在一侧裂开了口。走进去，就能找到大海给货物留下的东西：一只宝箱，装着4到8块木板、1到3根绳子和60到200金币；每三艘沉船里有一艘还有一枚戒指、一根法杖或一件神器。一艘沉船只会交出一次货物。\n\n那些木板和绳子，正是水手修船或再造一艘船要用的东西。
guide.surface_barrows=把Yendor护身符带出地牢，这一局还会继续：古冢会为它敞开。每次下去，护身符都得带在背包里。\n\n一座古冢是4到15层的地牢，照着地牢的某个区域建造，再从那里往下延伸。它的等级大体随离城镇的距离升高，不过远处的古冢也可能很轻松，近处的却可能要人命。世界地图上标着每座古冢的名字和等级；进去之前，门口也会显示它的等级和层数。从它最上层往上走，就会把你送回门口。\n\n最深的一层没有下楼的楼梯。它的守卫是该区域最后一种怪物，生命值三倍，还带着精英之力。它会掉金币、2到8件未受诅咒的武器、护甲、法杖、戒指或神器——古冢越深，升级越多——最强的古冢里还有杰作核心。这座古冢便算作已清除，会升起你的旗帜。它的楼层你可以再走一遍；守卫不会回来。\n\n古冢里没有任何东西能让你永久变强：力量药剂、升级卷轴之类都会变成金币。怪物的强度随古冢提升，没有上限，而你照样能拿到经验值。
guide.surface_oasis=有些沙漠里藏着一处_绿洲_：一汪淡水，四周围着草地和_椰枣树_。世界地图上，每一处绿洲都用蓝色标出。\n\n它的树荫与水能让气温降下10度，但不会低于22度，所以白天最热的时候，绿洲正是甩掉_中暑_的地方。在池边灌满你的_空瓶_，不要钱。\n\n每隔一天，几棵椰枣树下就会落下成熟的_椰枣_。_绿洲商人_把地毯铺在水边；夜里他睡觉，不做买卖。他卖_沙地护目镜_、_沙漠围巾_、椰枣和空瓶；要是他知道有被掩埋的神庙，还会告诉你在哪个方向。\n\n黄昏时，趁水边没有人，会有几只_鹿_下来饮水。你不能在绿洲上建造，不能把它挖开，也不能砍它的椰枣树。
guide.surface_sandstorm=当风以每秒10米以上的速度刮过沙漠，就会把沙子卷成_沙尘暴_；它扑在你身上时，日晷会把它记作当前的天气。暴风雪里、矿洞里和山上，都不会刮沙。\n\n在开阔处，它让你的视野缩短一半；风速到每秒20米时，只剩四分之一。你走路慢五分之一，风速每秒20米时慢三分之一；每回合，沙子有3%到8%的几率钻进你的眼睛，让你_失明_2回合。陷在沙尘暴里的怪物视野也会变短，除非它们能在黑暗中视物。\n\n躲在_背风处_就安全：迎风一侧一两格之内有结实的东西——一块岩石、一棵棕榈、一尊雕像或一堵墙——或者待在你建成的房间里。带上_沙地护目镜_或_沙漠围巾_，沙尘暴就完全碰不到你。绿洲商人两样都卖；工作台能用一块_玻璃板_和一块_皮革_做成护目镜，用三捆_茅草_织出围巾。
guide.surface_temples=_被掩埋的神庙_顶部从沙漠的沙丘里探出来：楼梯井四周立着雕花的石板，还有镀金的_方尖碑_和黑色的_豺狼雕像_。世界地图上，每一座的名字和等级都用金色标出。\n\n谁都能下去，不需要护身符。一座神庙有2到4层，每层都不长，陷阱却比地牢里更多；它的等级随离城镇的距离升高。浅层游荡着_蛇_、_木乃伊_和成群的苍蝇；中层是木乃伊、_骷髅_、蝙蝠、蜘蛛和黏土魔像；最深处是木乃伊、食尸鬼、_蝎子_、_武僧_和魔像。木乃伊的强度随层数加深，它的一抓能让你变得虚弱，火对它造成的伤害多出五成。\n\n最深的一层没有下楼的楼梯。它的守卫是一尊_雕像_，生命值三倍，还带着精英之力，在你出手之前一动不动。它会掉金币、装备和神庙的圣物_太阳圣甲虫_：带在身上时，你对亡灵的打击增强15%；用炼金能量把它升得越高，加成越大。\n\n和古冢一样，神庙里也没有任何东西能让你永久变强；从它最上层往上走，就会回到它的楼梯井口。
guide.surface_events=当你听说附近有事件发生时，日志会告诉你它在哪个方向，世界地图也会在事件持续期间把它的位置标出来。\n\n一颗_坠星_会在夜里落到开阔地上。它的_星辰碎片_会在陨坑里留上三天。镇上的铁匠能把两块碎片打成一颗杰作核心，商人也愿意为一块碎片出高价。\n\n一座_巡回集市_会在人类村庄的井边扎起营来，停留三天。它的两三个摊子出售村子店铺里没有的戒指、法杖、神器、合剂和秘卷，价格比平常贵四分之一。\n\n强盗会_劫掠_一座人类村庄，持续一天；老远就能看见黑烟。在当天结束前杀光所有掠袭者，村庄会付你60金币，外加每栋房屋15金币，还有一件上好的武器、护甲、法杖或戒指；它的商贩也会在当天和之后三天里，以四分之三的价格把东西卖给你。如果劫掠持续了整整一天，它的店铺就会关两天。\n\n有些夜里，_狼群_会在你附近追猎一头鹿，你能听见嚎叫。狼不会理你，除非你靠得太近或打中一只；那时整群狼都会扑向你。它们放倒的鹿会留下肉。
guide.surface_beasts=_野牛_（140点生命值）白天在平原和草地上成群吃草，一群两到五头。它们不理你，可你要是打中一头，8格内的每头野牛都会朝你冲来，速度比你快上五成。一头朝你奔跑的野牛，撞来的力道比它16到30的伤害重上五成，还会把你撞退一格。等你死了、走了，或者离开它们的视线8回合，牛群才会平静下来。每头留下_兽皮_和2份_神秘的肉_。\n\n_骆驼_（80点生命值）白天在沙漠里游荡，或单独一头，或两三头一起；你走到2格以内，它就慢悠悠地走开。打它一下，它会从最多3格远朝你吐口水：口水若落在你身上，你会_恍惚_3回合。然后它就逃开了。每头留下2份神秘的肉，还有一半几率留下一张兽皮。你可以像套鹿那样用绳子套住野牛或骆驼。\n\n_秃鹫_（45点生命值）白天在沙漠上空飞翔。它们会围着8格内生命值低于60%的英雄打转，也会落到地上的生肉上，每3回合吃一块。生命值低于30%的英雄，它们会扑下来攻击，造成8到16点伤害，并在两次攻击之间飞高一格，直到那英雄的生命值回到40%以上。你比它健康时打它一下，它就会飞走。每只留下1到2根_秃鹫羽毛_。\n\n_鳄鱼_（130点生命值）不分昼夜伏在沼泽的水池里，只有眼睛露在水面。你走到它旁边，它就会猛窜出来：第一口从不落空，伤害比它20到36的基础重上五成，还会把你拖进水里。它在陆上追你追得很慢；一旦你离它超过6格、离开它的视线3回合，或者它的生命值降到30%，它就会回到水里。它留下神秘的肉，还有各有一半几率留下的一张兽皮和一颗_鳄鱼牙_。\n\n_狗鱼_（60点生命值）不分昼夜潜伏在河流的开阔水面下，谁涉水而入就咬谁，造成12到24点伤害，速度是你的两倍。一根_捕鱼矛_至少能打掉它一半的生命值。\n\n在工作台上，2根秃鹫羽毛加一块木板能做出5支_飞镖_，一颗鳄鱼牙加一块木板能做出2根捕鱼矛。
guide.surface_overview=小镇四周是草地、森林、平原、沼泽、沙漠、苔原、河流与海洋。浅水可以蹚过去；深水会挡住步行的人，但船能载你渡过（见“海洋”）。严寒时，河流与湖泊会结冰，那层冰能托住你。霜冻会冻住它触及的任何水面，无论什么季节；等空气回暖，那层冰又会融化。\n\n山上的雪线随季节移动。雨会把你淋透，风会让你发冷；按要去的地方穿戴，并带上火。\n\n道路连接着各个村庄。在路上你会遇到旅人和商队，有时还有强盗。离开道路，狼会在天黑后出没。\n\n世界地图显示你见过的地方和你听说过的地方。崖边的石阶通向山地，洞口向下通往深层洞窟。小镇位于地图中央。
guide.surface_nature=天气炎热时，只要半天没下过雨，树林或草地里就可能烧起_野火_。一堆没熄灭的营火能引燃它，一两天前雷暴中遭雷劈的树也能。它会慢慢烧上一两天，把树烧成_树桩_，把草烧成焦黑的地面。站在火里的人会着火，野生动物会四散逃开。道路、水面和裸露的地面能挡住它，它也从不进入村庄或小镇。雨水会把它浇灭。\n\n把_水瓶_倒在或扔到着火的地方，就能浇灭它，并让火避开那一格及周围四格。你建造、挖掘或耕种的东西都不会烧着。火靠近你的家园时会发出警告；火经过时，会损坏紧挨火焰的木制部件，但绝不会弄塌任何一件，也会烧死那里的作物。烧过的土地会重新长起来：六天后长出_树苗_，十八天后长成树；燃烧的树有时会留下_木炭_。\n\n春秋两季连日大雨之后，河水会_泛滥_。两天里浅水漫过低矮的河岸，淹在水下的道路会变成_泥地_，每一步都要多花三分之一的时间。低岸上的作物会被淹死；地势较高的田地则安然无恙。水退之后，泥浆会在河岸上留四天，那片地上的作物在十二天里会长快五成。\n\n有些新月之日会出现一次_日食_。最近村庄的长老会在前一天通告此事。正午前后约三个小时，天光暗得像黄昏，星星现出，夜行动物四处游荡。太阳黯淡期间，_腐化法杖_的威力强上五成。
guide.surface_festivals=世上有一些事件是跟着季节来的。\n\n每个季节一次，每座人类村庄都会举办_节庆_，从一天早晨持续到第二天早晨，你在三个区块内就能听说。井边会立起一根五朔节花柱，挂上彩旗，纸灯笼从黄昏亮到天明。两名_节日厨子_白天半价卖饭食；入夜后，村民围着井、伴着乐队跳舞。_村庄勇士_会接受任何人的友好切磋：跟他说两次话就能开始。谁先被打到只剩三分之一的生命值就算认输，这样谁都不会伤得更重；他会以你的等级与你交手。赢了他，他会给你一件上好的武器、护甲、法杖或戒指，每次节庆只能拿一次。\n\n春秋两季，一群二十到三十六头的_鹿_会用四天穿过一个区域：春天向北，秋天向南。两三只_狼_会尾随鹿群，你不靠近、不打它们，它们就不理你；天黑后，它们会扑倒掉队的鹿。你在三个区块内就能听说鹿群的消息，地图也会跟着标出它的位置。\n\n偶尔会有一头有自己的名号的_巨兽_在一个区域里游荡八天：大多数地方是_巨狼_，寒冷之地是_雪怪长老_，沙漠里是_巨型蝎子_。它的生命值是同类的四倍，出手也更狠。它周边三个区块内的村民会告诉你它曾在哪儿出现，它新鲜的_踪迹_会把你引向它。杀了它，就能拿到它的_战利品_、大约250金币，以及一件上好的武器、护甲、法杖或戒指。
guide.surface_villages=村庄坐落在平原与草地上。大多数是人类村庄，约四分之一是和平的豺狼人部族，约八分之一是强盗窝。\n\n人类村庄有商贩（村子越大商贩越多），还有过日子的家庭；有九栋房屋或更多的村庄会在井边设守卫。豺狼人部族和平，但没有店铺。强盗窝是三到五名会攻击你的强盗。\n\n任何房屋的门你都能打开。一半的屋子里有人在家，但里面都没有战利品。室内，失温和中暑会立刻结束，也无法侵袭你；所以天气跟你作对时，就进屋去。\n\n巡回集市和强盗劫掠都只会来到人类村庄。
guide.surface_bounties=每座人类村庄都在井边立着一块_告示板_，上面搭着一个小小的顶棚。板上挂着三张告示，小村只有两张；每三天会贴出新告示。走近它就能读。你一次最多能带五张告示。它们会列在日志的笔记里，你可以在那里或告示板上放弃一张。\n\n_狩猎_要求你杀死几只住在村庄附近的野兽，比如_灰狼_或_白化老鼠_。只有村庄的井128步以内的击杀才算数；在共享游戏中，其他英雄的击杀也算。_收集_要求交付这片土地出产的东西：_兽皮_、_橡木原木_、松木原木、粗石、茅草、黏土、沙子、铜矿石，或下方洞窟里的_铁矿石_，还有桥边渔夫手里或你自己钓竿钓上来的_鱼_，或者种子。两种告示都要回到板前领报酬：有报酬可领时，板下会挂着一枚金币。\n\n_送达_会交给你一个_包裹_，要送给附近另一座村庄的_长老_。长老白天坐在屋外，睡得很早；那个村子里的人都会给你指路。迟到的包裹什么也换不到。\n\n告示付的是_金币_，你到过的地方越深，报酬越多；大约三分之一的告示还会外加一瓶药剂、一张卷轴或一块符石。你每完成一项悬赏，在那座村庄的声望就会提高。完成一项，它与你相识；三项，它信赖你；六项，它敬重你：每一步都让它的商人多给你5%的优惠，村里的_守卫_也会更友善；一旦他们信赖你，就会告诉你狩猎目标上次是在哪儿被人看见的。\n\n当一头巨兽在一个村庄周边三个区块内游荡时，它的告示板还会挂出一张猎杀这头巨兽的告示：在它的日子结束前在任何地方杀了它，然后回告示板领赏。\n\n在共享游戏中，只有房主才能揭告示和领报酬。
guide.surface_wilds=世界地图上标出的不只是村庄。下面每一处都只出一次战利品。\n\n_废墟_（森林、山麓、苔原、沙漠）：塌陷的地牢入口，由两三个骷髅守着。中间的楼梯通向地牢第一层，从地牢里爬出来，就会回到那里。\n\n_废弃营地_（森林、草地）：一只宝箱，装着食物、一瓶药剂、投掷武器或一些金币。\n\n_大橡树_（森林）：树根的空洞里放着三颗种子和一颗露珠。\n\n_立石_（平原、苔原、雪原）：石环中央有一张卷轴。\n\n_龙巢_（山麓、山地）：三堆200到600金币，还有一条巨龙。走过去就好。\n\n_古冢_：干燥平整的地面上立着方形石门，门里有一道楼梯。只有你带着_Yendor护身符_时，它们才会打开。
guide.temple_overview=第14层的一道楼梯通向神庙。进入之前游戏会先问你，你也可以再爬出来。里面，入口与尽头的一道楼梯之间，十二个房间排成两列，顺序随机：十间试炼、一间补给室和一间空房。\n\n试炼有：藏着最多32只宝箱怪的高草；一个有四条食人鱼的池子；沿直线射击的神殿哨卫；四名哨卫守着四只需要水晶钥匙的宝箱；隐藏的爆炸陷阱；一间放着17块闪现符石的房间；十二名豺狼人守卫；一座迷宫；喷出致眩气体的气孔；雷云下的一片水。补给室里放着食物、两堆6到10颗能量晶体和三瓶药剂。\n\n每个房间的中央都有一具骷髅，带着一两瓶药剂、卷轴、食物或金币。尽头的楼梯旁放着一张_升级卷轴_。那道楼梯只通向一间空荡荡的小屋。
guide.topic_rarity=每件武器、护甲、投掷武器、法杖、戒指、饰物和神器都有_稀有度_：普通、罕见、稀有、传说或异域，由名称的颜色显示。传说装备从第5层起出现，异域装备从第15层起出现，越往下两者都越常见。在武器、护甲和法杖上，稀有度会增加该件自身伤害、格挡或法术伤害的一份，从二十分之一（普通）到十分之三（异域）。每件装备还会获得词条：普通和罕见一条，稀有及以上两条；越稀有，掷出的数值越高。戒指、饰物或神器的词条在你佩戴或携带时起作用：伤害、精准、闪避、再生、速度、充能、抵抗有害效果、饥饿或金币。在武器和护甲上，普通装备的词条是朴素的加成，罕见装备的词条是一条_特性_，稀有及以上的装备则两者各有一条。朴素加成是数字：武器上是精准、伤害、攻击速度或更低的力量需求；护甲上是格挡、闪避或更低的力量需求。特性随装备的种类而定。任何武器都可能掷出暴击，或从一击中吸取生命；每一类还各有两个专属特性：斧类对生命值低于一半的敌人伤害更高；锤类和镐类对某一族类（亡灵、恶魔、构装体、元素、野兽或人形）伤害更高；乐器类和轻型刃类在夜里伤害更高，正午则略低；链枷类和盾牌在你生命值低于一半时伤害更高；魔杖类和矛类在下雨或下雪时伤害更高；弓类和飞镖类在风中瞄得更准，或能从杀死的野兽身上取肉。有些还能在寒冷中让你的手保持温暖。枪械和弓还能节省弹药，枪械能免费装填，火焰喷射器和激光枪的射程更远。轻甲可能掷出寒冷中的保暖、炎热中的降温、防雨、步伐更快或脚步更轻；较重的护甲则可能掷出保暖、抵御寒风、更轻的坠落伤害或抵抗有害效果。图鉴会列出每一类能掷出的特性。传说和异域的武器与护甲一出炉就已附魔或刻印，并且还带有一道_残迹_：一道微弱的额外附魔（护甲上则是刻印），触发频率是真正附魔的五分之一到十分之三，完成全部杰作后可达五分之三。它不占用基座插槽，当该件带有同一附魔或刻印时也不会发动。\n\n每件装备还有一个_类型_（伽马、贝塔或阿尔法），显示在它的角上。它决定该件固有特长的强度：贝塔翻倍，阿尔法三倍，阿尔法还附带一种变化。特长随武器种类而定：枪械和弓在远处伤害更高；斧类更快劈开护甲、伐倒树木；锤类和镐类能致眩敌人、更快敲碎石头；乐器类每第四个音符会变成和弦，祝福己方或惊吓敌人；长鞭类会把敌人拖向你；战镰类会横扫并多收种子；回旋镖会穿过多名敌人；重型投掷武器能被全力掷出；锋利的轻型投掷武器会飞回你手中；轻型刃类能隔着墙感知敌人。一件_类型转换器_能把它提升：一件把伽马提到贝塔，两件把贝塔提到阿尔法。没有任何东西能降低类型。类型转换器是稀有的击杀掉落，也在地下集市出售。\n\n_杰作_要用杰作核心来支付，地点是矿洞里的铁匠或镇上的铁匠。共五步，每步一颗核心：前四步各把每一条加成词条提高15%，第五步需要传说或异域装备，会把它们翻倍。完成全部杰作的武器在你每次击杀时回复你二十分之一的生命值，护甲则给出等量的护盾，每10回合至多触发一次；法杖每次击杀回复五分之一的充能。每个首领掉落1到2颗核心；镇上的铁匠还能用挖来的矿石或两块星辰碎片浇铸核心；破拆台能把稀有及以上的装备拆解成核心。
guide.topic_rooms=从第2或第3层到第24层，这些房间每2到3层出现一间，绝不会出现在首领层；每种房间都会先各出现一次，之后才会重复。\n\n_对手画廊_（铁钥匙）：一尊雕像拿着一把与你相似、稀有度高一级的武器与你战斗，倒下时会掉落那把武器。\n_回火炉_：把装备放到铁砧上，点起炭火，让它保持白热3回合，然后在淬火槽里或用冰霜淬火；它最弱的加成词条会提升到最强的水平，或者免费推进一次杰作。白热超过14回合，会烧毁一条词条，残迹最后才烧。每座铁砧只能用一次。\n_破拆台_：传说或异域装备会变成一颗杰作核心，稀有装备则变成三分之一颗。一叠投掷武器会整叠拆解，按一件计算。\n_族谱厅_（铁钥匙）：你的装备会出现三件复制品（普通·阿尔法、稀有·贝塔、传说·伽马）；拿走一件，其余都会碎裂。\n_冰封宝匣_：奖品封在冰里；用火融化它，或把它砸开——砸开响声很大，还可能毁掉里面的一瓶药剂或一张卷轴。\n_风箱_：风会把气体沿着长廊吹下去，也会帮助顺着风向的投掷。\n_元素锁_：用热、冰霜、植物或水唤醒三枚符文，就能打开大门。\n_温室_：四季如春。\n_孵化巢_：炭火上孵着一枚蛋。\n_配重宝库_：用一具尸体、一件护甲、一件武器、一只宝箱或300金币压住两块压板。\n\n任何一层都可能有_温泉_（每4回合回复1点生命值，解除冻伤与冻结，之后让你暖和150回合），或一座_旅人营地_。在铺盖上睡下之前先点起营火：它能把怪物趁你睡着抓住你的几率减半，也能让你醒来时不会冻僵。一处秘密的松鼠藏宝里有种子，秋天8颗，其他季节更少。\n\n每个区域一次，在它的第二、第三或第四层，会有一扇密门通向_地下集市_。夜里，一名商人出售传说装备、杰作核心、类型转换器和一把能打开任何锁的金骷髅钥匙，他收购的价格比商店高五成。每做一笔交易都会增加热度；热度到3，就会有一名收藏家追猎你——他会在每一层出现，直到你杀了他。攻击那名商人或他的守卫，之后这一局里所有市场都会关门。
guide.topic_skills=天赋和技能共用同一池点数：开局2点，之后每升一级+3点。一点天赋点消耗1点。一级技能的花费等于其层级，所以分支里更深的技能更贵，而每个技能有3级。有些分支里成对出现两项技能，选了其中一项，另一项在本局中就锁死了。旅店里的佣兵会按你已杀死的首领数，每个首领卖给你3点。\n\n大多数技能是需要消耗法力的动作。当你有可花的点数或有可用的技能时，技能标签才会显示：点击它挑选技能，长按它打开技能树。取消指向性技能不消耗任何资源。\n\n战士裂地、跃击、猛砸。法师让火焰与寒冰法球绕身盘旋，并召唤陨石。盗贼与自己的暗影映像并肩作战。女猎手放出箭雨，催生缠人的荆棘。决斗家突进，旋起一阵刀锋风暴。牧师治疗，升起光柱，召唤守护之灵。\n\n矮人国王的皇冠赐予你护甲的那项能力，也可以放在技能槽里。
