# Warped Pixel Dungeon — Descent Guide (a dead delver's journal; pages found on the dungeon floor)
guide.basics_alchemy=_炼金釜_能把你不用的东西变成你用得上的东西。每个区域的第3层或第4层都有一间锁着的实验室，里面有一口炼金釜和5颗_能量晶体_，你还缺的炼金指南书页也可能在那里找到；那份指南就是日志里的“炼金指南”页签。你也可以在家园里自建一口炼金釜。\n\n在炼金釜旁，可以把多余的物品充能成炼金能量：药剂或卷轴6点，符石3点，种子1点。为未知的药剂或卷轴充能也会顺便鉴定它。三颗种子能熬出一瓶药剂，炼金釜会从你的背包里取一只空瓶或一瓶水来装；喝下药剂后瓶子会还给你。其他大多数配方则消耗能量。\n\n_魔能触媒_藏在1到3层的某处。在炼金釜使用它需要6点能量，可让你从4件_饰物_中选择一件：这些装备会在整局游戏中助你一臂之力，还能在炼金釜消耗更多能量升至+3。
guide.basics_defeat=死亡会终结这一局。你的英雄会进入排行榜，而这一局所拥有的一切也会随之消失，包括家园在内。你学到的东西会留下：这本指南、图鉴、单位图鉴和你的徽章都会带入之后的每一局，而后来的英雄可能会在你倒下的那一层、或更深的地方找到你的_遗骸_，有时还握着你的某件物品。\n\n_重生十字架_能让你复活。普通的十字架会让你在同一层的别处醒来，并带上你选的两件物品；其余物品则留在一个背包里，放在你死去的地方。用装满的水袋祝福它，它就会改为当场救你，并以四分之一的生命值复活。地牢里的每家商店都卖一个。\n\n在第26层拿起_Yendor护身符_也不会结束这一局：带着它离开第1层，它就会打开地表各处封闭的古墓。大多数英雄都会死很多次，才有一个最终获胜。
guide.basics_enchanting=只有已鉴定的武器和护甲才能附魔。一件武器最多容纳2个_附魔_，护甲最多容纳2个_刻印_，每个都有0到5级；每级为其效果增加40%，为其触发几率增加20%。物品栏位上的蓝色数字显示这些等级。\n\n_附魔基座_能消耗炼金能量来加工装备。_编织_：往空槽里编入一个新附魔，20点能量会展示3个，你选中的那个不再额外收费；不选就离开，它们便消失了。_强化_：把一个附魔提升一级，依次需要10、20、30、40，之后是50点能量。_重掷_：同样如此，20点能量会展示3个可替代它、并保持其等级的附魔。或者分解这件装备，返还10点能量，并保留它的升级。在那里也能像在炼金釜旁一样把多余物品充能。被诅咒的装备会被拒绝。\n\n附魔基座立在地牢的藏书室里，四周围着书架，也立在镇上的教堂里，你还可以在家园里建一座。奥术_刻笔_、_注魔秘卷_和_附魔符石_也能附魔。
guide.basics_examining=先看再走。按工具栏上的_放大镜_，或按查看键，然后点任意格子：怪物、物品、植物、陷阱，或你自己。\n\n怪物的窗口会显示它的生命值、它的能力，以及它所在格子和它身体的温度。查看你遇到的第一条_下水道巨蛇_：它几乎能闪开每一击，而它的窗口会告诉你该怎么打中它。查看_植物_或_陷阱_能让你不必踩上去就知道它的作用。\n\n点击头像旁的_状态_图标，或怪物窗口里的状态图标，可以查看其效果和剩余时间。连按两次放大镜，或长按它，则会改为搜索。\n\n每次命中都会在被打中的目标上方显示一张卡片：伤害数值；若是暴击，还有一个红色X；另一些小图标表示同时发生的其他事：附魔以其颜色显示（若是武器的残迹则为空心），武器类型发挥作用时显示银色图标，装备上的某条词条为这一击加成、或让风不影响射击准头时显示金色图标，以及它留下的任何效果图标。同一攻击者对同一敌人的连续快速命中会累加在一张卡片上。未命中也会显示一张卡片，带有闪避、格挡或招架的图标，以及未命中的原因。你的某个技能触发时，它的图标会加入被击中者的卡片；紧接这一击之后生效的效果也会加入那张卡片。
guide.basics_farming=在地表世界里，你可以自己种植食物和种子。用_铲子_或建造菜单里的农田地块做出_农田_，然后在上面播下任意_种子_。它会长成_作物_，即使你离开也会继续生长。\n\n作物在春季生长快四分之一，秋季只有四分之三的速度，冬季则完全不长；罩在玻璃下则全年保持夏季的速度。作物旁边的水会加快它的生长。成熟后，用背包里的_短柄镰_或战镰收割：无味果树丛产出无味果，玉米麦产出麦秆，大多数其他作物则产出自己的种子。\n\n露天的作物在其所在格温度降到-2度以下时会死亡。夜里，兔子和鹿会去吃任何没有_篱笆_圈住的作物，而_植物肥料_能催作物生长。其余内容见家园的“农耕”页。
guide.basics_hunger=你的_饥饿_每2回合增加1点。到300点你就饿了，约在吃饱后600回合；到450点你就_极度饥饿_。极度饥饿会让生命值停止恢复，并每回合夺走你最大生命值的千分之一；而饥饿或疲惫的心智会看见并不存在的怪物。休息或魔法睡眠会让速度减半，中暑会加快它，_饱腹之戒_会减慢它，首领层被封住时则停止增长。\n\n一份_口粮_值300点，一个_馅饼_值450点，一份_小包口粮_值150点。每个非首领层都有一份食物。在饿死之前，你每10回合恢复1点生命值，所以在满血时吃东西会浪费你本可恢复的生命：饿了又受伤时再吃。\n\n睡眠也很重要。醒着一天半后你会变得_困倦_，视野变差；三天后你会在下一次夜幕降临时倒下。休息，或在床上睡一觉，就能消除它。
guide.basics_identifying=药剂颜色、卷轴符文和戒指宝石每一局都会重新洗牌：红色药剂在一局里可能治好你，在下一局却可能烧伤你。用掉一瓶，这一局剩下的时间里你就知道它的种类了，而日志里的_图鉴_会记住你鉴定过的每一种。\n\n装备会在你使用并获得经验的过程中自行显露：武器约20次命中后，护甲约承受10次打击后，戒指戴够一级的经验后。在那之前，它的升级是隐藏的，而且它可能被诅咒，会拒绝被取下。\n\n_鉴定卷轴_能立刻说出物品的名字。_感知符石_让你猜测未知的药剂、卷轴或戒指是什么：猜对了它就变为已知。_祛邪卷轴_能解除诅咒，而在镇上，_占卜师_每周能为你鉴定三件物品，每件约50金币。附魔只对已鉴定的装备有效。
guide.basics_intro=这本指南出自一位死去的探窟者之手，书页散落在世界各地。一层的书页位于它所描述的那一层下方一层，所以它永远不会提前透露；分支区域的书页则在该分支内部。在你第一次下到地牢之前，什么都不会自行书写。从那以后，关于上方世界的书页会在你第一次到达某处或做某件事时自行写出，首领的书页则在其战斗开始时写出。你找到的每一页都会留在指南里，供你之后的每一局阅读。\n\n本章“第一步”会随着你的游玩逐步补齐：其中每一页都会在其课程第一次出现时自行写出，_日志按钮_会闪烁。按下它，就能读到契合当下的那一页：这些基础页中的一页，或你刚找到的一页。\n\n整本指南可以从_放大镜_打开，也可以从日志的最后一个页签打开，还能从标题画面的日志打开。未读的书页会发光，搜索能按页中的任何词找到它。在你读过它之前，这一页会在你抵达处旁边的镇广场等你，也会在第1层的入口房间等你。
guide.basics_levelling=击杀能获得经验值。1级升到2级需要10点，之后每级比上一级多5点，直到30级。超过30级后没有上限：每级要求略多一点，但绝不超过500。被你甩开等级的怪物只提供其四分之一经验。\n\n每升一级，最大生命值+5（并回复等量生命），精准与闪避+1，法力+2，并获得3点用于_天赋_和技能的点数。一瓶_经验药剂_能直接给你一整级。\n\n目标是每层升大约一级。一味往下冲会让你比等在那里的怪物更弱。点击头像可以查看你的等级、经验值和属性。它的伤害页签会保留你最近100次造成和承受的命中，未命中也算：打开其中一条，就能看到构成那个数字的每一步。
guide.basics_looting=每个五层的区域都有2瓶_力量药剂_、3张_升级卷轴_、1支奥术_刻笔_和1条_弹带_。数一数它们，就知道你搜得多仔细：前3层没给你的，都在第4层。\n\n锁着的门或障碍后面的房间通常有更好的战利品。每把钥匙只能用在它被发现的那一层：_铁钥匙_开门，_金钥匙_开锁着的宝箱，_水晶钥匙_开水晶宝箱。日志的“探险手册”页签会列出你找到的每把钥匙和每处地标。有些宝箱是_宝箱怪_。\n\n每个区域藏着2到3个密室。主题“战利品”和主题“房间”会告诉你还有什么散落在各处。
guide.basics_magic=_法杖_从不失手，护甲也挡不住它的光束。法杖初始有2点充能（魔法飞弹为3点），每升一级+1，最多10点；用掉的充能会自行恢复：最后一点约需45回合，越空的法杖其余充能恢复得越快。法杖的稀有度会提升其施放威力与充能速度。\n\n针对你的魔法也大体如此：怪物的光束以两倍于其近战攻击的精准瞄准，护甲同样挡不住。像_豺狼萨满_和_矮人术士_这样的施法者，只要视线通畅，就能从任意距离轰你，但贴身时它们会用拳头战斗。断开它们的视线，再逼近。
guide.basics_positioning=附近有_走廊_时，别在开阔处战斗。跨过门走进走廊一步，怪物就只能一个个来打你；在房间里，或者站在门口，一次能有三只够到你。\n\n_高草_会双向挡住视线，但走过的人会把它踩平，追击者能顺着你踩出的路看见你。_女猎手_走过时不会踩倒它，你_蹲伏_时（半速）也不会：这样草就始终隔在你和追击者之间，它可能跟丢你。躲在没有被人踩过的草后等待，就能打出突袭。踩进_水_里能扑灭你身上的火。掉进_深渊_至少会损失当前生命值的一半，而已经发现的_陷阱_可以绕过去。昏暗的楼层会把你的视野缩到八分之五。\n\n施法者和弓箭手需要与你视线通畅：把拐角挡在你们之间，再逼近。
guide.basics_searching=密门和隐藏的陷阱看起来和普通的墙、地面一样。连按两次_放大镜_，或长按它，就能搜索：这要花2回合和少量食物，并显示你身边所有隐藏的门和陷阱。_盗贼_能搜到2格外；一项天赋和_搜索之戒_能搜得更远（戒指只在你主动搜索时生效），而_危险预知_会显示你周围的一切。搜索还会翻空你身旁的书架，每个书架有8%的几率藏着一张卷轴：鉴定、祛邪、充能、嬗变或魔法地图。\n\n你光是从旁边走过也会注意到一些东西。身边的隐藏陷阱在浅层有十分之四的几率自己显露，到第25层降为十分之三；隐藏的门则是十分之二，到第20层降为零，而且越深的楼层藏起的门越多。在死路和地图的缺口处搜一搜。\n\n在第1层，入口房间的门在每一局里都是隐藏的，直到你拾起这一页——它就躺在那间房里：在那里搜索，找到出去的路。
guide.basics_skills=_天赋_和_技能_共用同一池点数：开局2点，之后每升一级+3点。一点天赋点消耗1点。一级技能的花费等于其层级，所以分支里更深的技能更贵，而每个技能有3级。\n\n天赋按层级开放：第一层立刻可用，第二层在6级，第三层在12级且你已有子职业，第四层在20级且你的护甲已有技能。_天狗的面具_用来选择子职业，_矮人国王的皇冠_用来选择护甲技能。\n\n大多数技能是需要消耗_法力_的动作，法力条位于生命值和经验值之间。你初始有5点，每升一级+2点。旅店里的_佣兵_会在你每击杀一个首领后出售3点。其余内容见主题“技能”。
guide.basics_strength=你以10点_力量_开局。每瓶_力量药剂_+1点：每个五层的区域都有2瓶，而三颗_腐莓种子_加一个瓶子能熬出一瓶。把它嬗变，就得到一瓶_根骨药剂_。\n\n武器和护甲按阶要求力量：1阶要10点，之后2、3、4、5阶分别要12、14、16、18点。升级会在+1、+3、+6和+10时各降低1点要求，而一次好的稀有度判定还能再减最多2点。\n\n每缺1点，武器的精准就除以1.5，攻击也会变慢，护甲的闪避除以1.5，你的脚步也会变慢，而对你来说太重的武器永远打不出突袭。每多出1点，近战或投掷武器的每次命中就额外造成0到1点伤害。
guide.basics_surprise=怪物在没看见你时会被打个措手不及：睡着时、游荡而没注意到你时、跟丢你之后，或你处于_隐形_状态时。此时它的闪避为0，所以你的一击不会落空；被麻痹的怪物也无法闪避。对你力量来说太重的武器，或者_链枷_，永远打不出突袭。\n\n_下水道巨蛇_几乎能闪开所有针对它的攻击。让它追着你穿过一道门，你闪到一边，在它穿门时出手：它已经跟丢了你，这一击便会命中。\n\n一局中打出10次突袭，就能解锁_盗贼_。
guide.basics_upgrades=一张_升级卷轴_能把一件物品提升1级，每个五层的区域都有3张。用在武器或护甲上，它会解除诅咒，并有三分之一的机会烧掉一个被诅咒的附魔或刻印；法杖或戒指则有三分之一的机会失去诅咒。升级永远不会剥离良好的附魔或刻印。\n\n把它们花在你打算长期保留的装备上：武器和护甲随升级还会降低力量要求。_法杖_、_戒指_和_神器_完全不需要力量，而法杖每升一级就获得1点充能，最多10点。\n\n地牢里每家商店都卖的_强化符石_并不升级：它用武器的速度换伤害，或用护甲的闪避换防御。_回火炉_能把一件装备最弱的加成词条提升到它最强的水平，或免费让它推进一次杰作，而主题“稀有度”会讲到杰作核心和类型转换器。
guide.boss_crabking=_螃蟹王_有300点生命值，能沿任意距离的通畅直线造成20到50点伤害，并以双倍速度移动。他从不走到你面前：他会传送到视野内的另一处，而如果你够到他，他会在几次攻击后跳开。带上远程攻击。\n\n他的力量来自大厅顶端的_闪电贝壳_：600点生命值，不能移动也不能闪避。四只_贝壳蟹_（20点生命值）会发射闪电，造成15到30点伤害。贝壳活着时，对蟹造成超过5点的伤害都会被削减为1点，被削减的伤害会作为充能存入贝壳，且不会自行消退。国王靠这份充能治疗，贝壳则消耗它来电击你。贝壳存有充能时，从旁边攻击它会电击它周围的一切。\n\n所以先用远程打死贝壳；如果它没有充能，近战就是安全的。它一死，充能便清空，螃蟹们此后承受完整伤害。如果你非得在那之前打螃蟹，就让每次命中不超过5点伤害。\n\n他抵抗毒素、毒气和死神附魔。
guide.boss_dm300=DM-300有300点生命值，攻击造成15到25点伤害。生命值降到200和100时，它会_超载_：无法被伤害，移动速度翻倍，能挖穿墙壁，并且除了离你最近的那座之外，还会启动一座能量塔。摧毁那座能量塔即可结束超载。第二座能量塔倒下后，它再也不会超载，最后100点生命值就是一场硬碰硬的战斗，此时水和电线都带电。\n\n未超载时，它使用两种技能之一，通常每次交替。_毒气_：离开毒云。_落石_：你若离得近，它会把你击退，然后在你周围标记出7×7的区域。紧邻中心的一格永远安全。落石会造成伤害并眩晕3回合。\n\n竞技场里与它并立的还有一座_机器人制造机_。它不参与战斗，但时不时会在身旁造出至多2台损坏的机器人，攻击它则会引来本层所有怪物。它有130点生命值，可以像普通怪物一样被攻击。等DM-300死后砸碎它，它会掉落一把骷髅钥匙和3,000到6,000金币；若先被砸碎，则两样都不掉。\n\n别让它站上_裸露的电线_。睡眠对它无效；恐惧、魅惑、眩晕、残废、冻寒、冰霜、定身和缓慢的持续时间减半。\n\n它会掉落2到4块邪能碎片、推羊传送门书页，以及（若你从未捡到过）_欧提鲁克日志_。你携带的劳埃德信标会获得一次免费升级。在既没挨能量塔电击、也没被带电的水伤到，且它超载期间你从未被攻击的情况下杀死它，即可获得首领挑战徽章。
guide.boss_dwarfking=矮人国王有300点生命值，分三个阶段作战。前两个阶段他杀不死。\n\n_第一阶段_：他攻击造成15到25点伤害，并在四座基座上召唤仆从：大多是尸群，每第四个是一名武僧或矮人术士。他能把自己的生命与一名仆从相连，让它替你分担伤害；也能退后一步，同时把一名仆从传送到你身边。你对他造成的伤害会加快他的召唤。先杀仆从，但在他接近50点生命值时别管它们：生命值到50时他会走向王座，所有仆从一并死亡。\n\n_第二阶段_：一层300点的护盾，什么都打不破；别再打他了。此时每名被召唤的仆从死亡都会削去护盾25点，所以杀满十二个即可结束该阶段。最后一波会同时带来一名术士、一名武僧和两个尸群。尸群会互相复活，复活不计入击杀数，所以要把它们分开杀。若召唤完成时你正站在它的基座上，它会改为出现在你身旁；只有当周围每一格都被堵住时，你才会受到20到40点伤害，护盾减25。\n\n_第三阶段_：他不停地召唤，而你的伤害会在接下来几个回合里陆续传到他身上，而不是立刻生效。继续打；伤害一点都不会丢。\n\n他会掉落_矮人国王的皇冠_（把你的护甲变成带有特殊技能的职业护甲）、推羊难题书页，以及（若你从未捡到过）欧提鲁克日志。你携带的劳埃德信标会升一级，你装备上由术士造成的劣化也会解除。
guide.boss_dwarftomb=这座坟墓位于王座以北两格，在矮人国王活着时不会受到任何伤害。\n\n国王死后，坟墓每一面敞开的边上都会走出一名_矮人巫妖_，最多四名。每名有100点生命值，射出20到32点伤害的弹矢，但只能在远处开火：一旦贴到你身边，巫妖就无法攻击，并会试图后退。与此同时楼层解封，你可以离开。\n\n砸碎坟墓会杀死本层所有巫妖和怨灵。它从不攻击，任何效果也无法附着在它身上，但它有600点生命值和最高18点护甲。\n\n坟内：4,900到9,999金币、一把_骷髅钥匙_和一套_护甲配件包_，后者能像王冠那样把任意护甲变成职业护甲。
guide.boss_goo=_黏咕_有100点生命值，站在水里时每回合回复1点生命。要在干燥的地面上和它打。\n\n它第一次看见你时，至多四只_毒泥_会从它身旁渗出来。每只有50点生命值，移动速度翻倍，每次命中都会使你中毒，随后跑开并留下蛛网。它们在水里会回血，而只要黏咕还活着，它们每次受击都会分裂；先杀黏咕，它们就不再分裂。前四只每只都会掉落一瓶小型治疗药剂。\n\n黏咕鼓胀并大吼时，是在蓄力一记猛砸：两回合后它会沿直线砸向至多2格外的目标，造成三倍伤害。走出攻击范围，或躲到墙、柱子后面；如果它不得不移动，蓄力就会中断。\n\n生命值低于一半后，它打得更重、闪避更多、蓄力也频繁得多。把药剂和卷轴留到这一半用；若它回血回到一半以上，就会平静下来。它三分之一的命中会给你留下_淤泥_，每回合都造成伤害，直到你走进水里为止。\n\n楼层封闭期间，你若太久没有伤害黏咕，生命回复就会停止，而它在水里每回复一点生命，这个时限都会缩短。\n\n它会掉落_磨损钥匙_、2到4团黏咕黏液、可供欧提鲁克日志使用的推羊练习书页、一半概率掉落一台毁灭先生炮塔，以及_电锯_：一件受诅咒的5阶武器，装备后便再也无法取下。开启后，每次命中都会烧掉水袋里的露水，以换取额外的切割。
guide.boss_otiluke=别在没有_遗物武器_的情况下去打它。这尊石魔像有7,000点生命值，除遗物武器的攻击外，任何伤害——法杖与宠物也不例外——都只造成其伤害的1到四分之一。先去小镇祭坛锻造一件遗物。\n\n它受击前一动不动，所以第一击之前先选好落脚点：与每座闪电塔至少相隔5格。你的每一次命中都可能唤醒一名守卫。\n\n它的近战攻击造成250到350点伤害，几乎从不落空。远程则射出100到160点伤害的弹矢，弹矢会从守卫之间穿过，其中一半会削弱你。它免疫恐惧、魅惑、睡眠、眩晕、火焰和毒气，并对毒素有抗性。\n\n它死后楼层解封，闪电塔停止运作，它通常还会掉落一瓶药剂。_真知之球_能把你送到第99层，再送回你使用它的地方；没准备好面对Zot之前别用它。欧提鲁克本人只有在Zot死后才会回来。
guide.boss_shadowyog=十只暗影Yog。每只拥有英雄等级×50点生命值（至少1,000），攻击造成45到125点伤害，移动速度翻倍，且很少落空。本层每有一只生物，每只暗影Yog就获得1点护甲，所以要先清空洞窟，并避开隐藏的召唤陷阱。\n\n它们一开始处于睡眠状态。从看不见的地方发起攻击，守住房间的门口，一次只打一只。\n\n生命值低于八分之一后，每次命中都有一半几率让它传送逃走；若本层怪物不够，它落地的位置会出现幽灵鼠。对暗影Yog的每次命中，还会把你视野内至多四个已用过的陷阱重新激活为隐藏召唤陷阱。速战速决，每只都要尽快解决。\n\n它们无视恐惧、狂乱、魅惑、睡眠、火焰、毒气、眩晕和死神，也无法被引诱。定身、残废、缓慢、冰冷和定命仍然有效。\n\n只有最后一只会掉落_邪神之球_，每次冒险仅此一次：投出它可部署一座炮塔，或砸开它取得欧提鲁克日志的小镇书页。它的死亡会杀死所有剩余的老鼠和巨魔，而三相之力能带你回家。
guide.boss_skeletonking=_骷髅王_（550点生命值，攻击造成20到40点伤害，护甲最高25）与两只巨手并肩作战（每只200点生命值，攻击造成10到30点伤害）。三者都会飞行，地形从不会拖慢它们。\n\n每次命中都有一半几率诅咒你：骷髅王使你虚弱，燃烧之手点燃你，定身之手把你定身20回合。随后出手的那一个会飞走，直到诅咒解除才回来。尽快解除诅咒，它们一回来就会落在你选定的地面上。不要在灌木丛里追着三个飞行单位跑。\n\n击杀顺序：定身之手（被定身时你逃不开另外两个）、燃烧之手、骷髅王。\n\n三者都免疫火焰，但灌木丛会烧起来：用墓室里的液态火焰把它们清掉。墓室里的水能扑灭你身上的火。重击比快速轻击更能穿透骷髅王的护甲。
guide.boss_tengu=天狗有200点生命值，能沿任意无遮挡的直线远程攻击。任何单次攻击最多只能打掉他25点生命值，所以高伤害的大招纯属浪费。与他贴身站的人，他的命中率会减半。\n\n_第一阶段，他的牢房：_每失去25点生命值，他就会跳到新位置，并在牢房各处埋下隐藏的毒镖陷阱，越虚弱埋得越多。每个陷阱埋下时会闪一下，且无法通过搜索发现，所以要记住闪光的位置。远程攻击能让你一直站在已知安全的格子上；追着他跑则会踩上陷阱。\n\n生命值减半时他会消失，监狱重新构建。这段停顿里没有东西攻击你：先回血，然后沿大厅往回走，开始第二阶段。你留在牢房里的物品会在战斗结束后回来。\n\n_第二阶段，一座没有掩体的椭圆形竞技场：_每失去25点生命值，他就跳开，并额外使用两三个花招。第一个总是一枚3回合后爆炸的炸弹；离开它的爆炸范围。第二个总是一根闪电柱，会持续电击周围的格子直到战斗结束。他还会朝你喷出一道锥形火焰：向侧面走开。速战速决。\n\n楼层封闭期间，你若停止伤害他，生命回复就会停止。定身、失明和恐惧对他无效。镜像能替他挡下普通攻击。
guide.boss_thiefking=_小偷王_（500点生命值）会飞行，能沿任意无遮挡的直线、在任何距离上造成20到70点伤害。深渊格挡不住他的攻击；只有墙壁能挡。从侧面接近他，绝不要横穿开阔的通道。\n\n两名_强盗王_护送着他：200点生命值、双倍速度、会飞行。若你身上还没有_倒数_，它们的每次命中都会给你挂上倒数，随后它们便飞走。6回合后，倒数会夺走你最大生命值的四分之一，而每一名存活的强盗王都会回复相当于你最大生命值八分之一的生命。用定身把它们钉住，或退到只有一名能打到你的角落作战。这里的强盗王从不掉落叉勺。\n\n闪电对他只造成一半伤害，而把他推向深渊毫无作用，因为他会飞。如果大厅变得拥挤，就退到入口门口，别在洞口附近硬打。
guide.boss_yog=1,000点生命值。Yog从不移动，只要有拳头存活就无法被伤害。每被打掉300点生命值就会召出一只拳头，并使竞技场变暗：一共三只，每对中随机一只（燃烧或大地、腐烂或锈蚀、辉耀或暗影）。第三只死后，它会用仆从淹没竞技场，并在最后100点生命值时行动快得多。\n\n_光束_：目标格子会先亮起，随后光束穿透一切、绝不落空（每道20到30点）。离开亮起的格子。它越虚弱射出的光束越多，但总会留出一格紧邻你的空格。\n\n_召唤_：每个仍存活的恶魔血巢召出一只恶魔撕裂者，其余召出幼虫。\n\n_拳头_在距Yog 4格以内无法被伤害，所以先把每一只引开。\n_燃烧_：免疫冰霜；站在水里能压制它的火焰，不过它会把水烧干。\n_大地_：它周围每有一格高草，你的伤害就减少六分之一；烧掉那些草。\n_腐烂_：在水里回血，且你的攻击会转为流血，所以只有最重的一击才算数。\n_锈蚀_：无法进入走廊；你的伤害会延迟生效，但分毫不缺。\n_辉耀_：生命值减半时使你失明并传送离开。\n_暗影_：生命值减半时熄灭你的光并传送离开；带上一支备用火把。
guide.boss_zot=10,000点生命值和最高100点护甲。除遗物武器的攻击和_主神的鬼魂_之外，他对任何攻击只承受其1到四分之一的伤害。他每回合回复50到100点生命值，而你佩戴_自动药水护符_时只回复1点。\n\n他以双倍速度移动，近战或沿任意无遮挡的直线造成300到400点伤害。要接近时，他会传送到你视野内的一格，在你身边攻击5次后再次传送。每次传送都会留下一个_Zot分身_，最多7个（女猎手则为11个）：1,000点生命值、同样的伤害减免、每回合两次115到160点的攻击或一道80到160点的闪电（在水中伤害再增一半）。每三个分身中有一个会掉落一张卷轴。\n\n不要麻痹他，也当心主神鬼魂的爆炸会麻痹他：每被麻痹一回合，他回复200点并召唤一只_附魔邪眼_到你身边（400点生命值、会飞行、50到100点光束）。女猎手每次命中也会召唤一只邪眼。\n\n他免疫火焰、毒气、睡眠、恐惧、狂乱、魅惑、眩晕和吸血武器，并对毒素有抗性。走廊会限制他出现的位置。他的死亡会杀死所有分身和邪眼。
guide.caves_f1=_吸血蝙蝠_速度很快、会飞行，每次咬中你都会回血。在门口和它们打，或让它们变慢。它们有时会掉落一瓶_小型治疗药剂_；这类掉落累计到第七瓶后就不再出现。\n\n_豺狼暴徒_在生命值归零时不会死。它们会狂暴，获得一层约相当于其一半生命值的护盾，攻击力翻倍。护盾每回合消耗4点，所以退开六个回合就能熬死它们。掉进深渊摔死的暴徒会跳过狂暴阶段。恐惧对它们无效。稀有的披甲暴徒会狂暴60回合，但必定掉落护甲。\n\n_豺狼萨满_会远程诅咒你：红色使你虚弱，蓝色使你脆弱，紫色（最稀有）会诅咒你的命中和闪避。它们是本层最脆弱的怪物；断开视线再贴身解决。\n\n本层有这一区域的_商店_，还有一朵可供发明家用的伞菌。铁匠从第12层开始出现。
guide.caves_f2=_巨魔铁匠_在第12层（三分之一几率）、第13层（二分之一几率）或第14层（必定）。他的房间里有放在基座上的两件免费物品，以及通往他矿洞的梯子。他会给你一把_镐子_，并要求你去矿洞开采_暗金矿_。矿洞只放你进去一次：离开就代表活儿结束，所以下去时要带足食物、治疗手段和背包空间。他无法被伤害。把_三相之力_的三块碎片都带来，他会把它们锻造成一体。\n\n镐子需要3阶力量才能打出2阶伤害。决斗家使用它的技能绝不落空，对无机怪物以及螃蟹、蜘蛛、蝎子、蜜蜂和蝇群造成双倍伤害，并让目标陷入脆弱。\n\n_矿洞蜘蛛_从这一层开始出现。它们会朝你正要走进去的那一格吐网，所以要改变方向，不要直线猛冲。被咬一口可能中毒；随后蜘蛛会后退，从远处向你吐网。\n\n极少数情况下，一台_损坏的机器人_会提早出现在这里（见第13层）。
guide.caves_f3=_DM-200_登场：80点生命值，体形太大，进不了走廊或门口。够不着你时，它会朝你喷出毒气。在开阔处和它打，并避开毒气。它的第一次掉落有五分之一几率是矮人都市阶的武器或护甲；此后每次掉落，几率都是上一次的三分之一。\n\n_损坏的机器人_每三回合发射一道光束，击中直线上的所有东西，怪物也不例外。一旦它看见你，每回合都有五十分之一的几率自爆，伤及身旁的一切，所以别待在它旁边。它提供13点经验值，是矿洞里最多的，还经常掉落一张充能卷轴。\n\n稀有的_DM-201_从不移动。远程攻击它，它会朝你投掷腐蚀性气体；若你只在相邻格攻击它，它绝不会这么做。它会掉落一块邪能碎片，除非你的等级高于19。\n\n实验室有一半几率在这一层，否则就在第14层。如果铁匠没在第12层，他可能在这里。
guide.caves_f4=最后一个常规楼层，也最忙碌：7到9只怪物，其中有两台DM-200，还有_黏土魔像_（40点生命值、厚重的护甲、攻击缓慢，免疫恐惧和睡眠）。极少数情况下会有尸群从矮人都市游荡上来；落单时，它无法复活同类。\n\n如果你还没遇见巨魔铁匠，他就在这一层；如果第13层没有实验室，实验室也在这里。本区域还欠你的力量药剂、升级卷轴或奥术刻笔都会出现在这一层。通往_神庙_的楼梯也在本层。\n\n如果你还没有_矿洞古代钥匙_，本层有一条_巨型食人鱼_会掉落它（你在到达第11层之后杀死的首条食人鱼必定掉落）。如果那条食人鱼生成在干燥地面上，它就已经死了，钥匙会躺在它倒下的地方。\n\n如果你打算买铁匠的升级，要在你自己对该物品读卷轴之前买：他只升级+2以下的物品。
guide.caves_f5=在你靠近能量塔三格以内之前，什么都不会攻击你；之后竞技场便会封闭。用那段时间熟悉地形。\n\n_裸露的电线_：DM-300站在电线上时会获得一层30点、外加其已损失生命值十分之一的护盾，所以别让它站上去。水：只要有能量塔处于激活状态，所有水和电线都会带电，每回合对不飞行的东西造成6到12点伤害。第二座能量塔倒下后，它们会在战斗余下的时间里一直带电。\n\n激活的_能量塔_（50点生命值）会电击两侧相对的两格，造成10到20点伤害，并且每回合顺时针转一步；站在它没指向的位置。任何超过14点的伤害都会被大幅削减，所以要用快速轻巧的攻击。每座能量塔都有一条干燥的路可以走到，而漂浮的火花会飘向当前激活的那座。\n\nDM-300死后大门开启，楼梯通往矮人都市。
guide.caves_mine=矿场大部分是坚硬的岩石：用镐子挖掘。挖开一格岩石消耗4点饥饿度；水晶、巨石和金币只消耗1点。矿场里有一份食物，豺狼人版本里有两份。\n\n你是为了_暗金矿_而来。每块暗金矿值50点人情，最多40块（2,000点）。矿场里有45到47块，所以挖到40块就停手。两间藏在暗门后的密室各有4到5块。杀死矿场的首领额外增加1,000点人情。离开矿场就会结束这份差事。\n\n矿场分为三种：\n_豺狼人_：每个大房间都有一名豺狼工兵和一名豺狼守卫。只要工兵还活着，守卫就只承受你伤害的四分之一，所以先杀工兵。守卫的长矛在远处伤害更高；贴着它打。工兵的落石会击晕命中的一切，对守卫是10回合，所以设法让守卫被落石砸中。在路障旁边，工兵改为投掷巨石。首领豺狼地卜师在岩甲未破时只有镐子能伤到它，而当有工兵为它效力时则完全无法伤到。\n_水晶_：水晶守卫在大房间里沉睡；别吵醒它们。它们杀不死，只会被打晕，在狭窄通道里速度只有四分之一。首领水晶尖塔只有镐子能伤到。它的尖刺会使守卫残废，而当它碎裂时，它视野内的所有守卫也会一同碎裂。\n_菌菇_：菌菇哨卫无法移动，但一看到你就会远程给你下毒（每个200点生命值）。菌生蜘蛛在高草旁边受到的伤害更低。首领蘑菇菌核（300点生命值）从不移动，也从不攻击。\n\n回到地面后，人情可以换到：赎回镐子（250点，若你已赚到2,500点则免费）、把同类的两件物品重铸成一件更好的（500点，之后每次再加1,000点）、硬化，使升级更不容易抹掉附魔（500点，涨幅相同）、将一件低于+2的物品升级（1,000点，涨幅相同），或进行一次锻造：从两把武器中选一把，外加一件投掷武器和一件护甲，有时附带隐藏附魔（2,000点）。剩余的人情会折算成金币。
guide.caves_overview=深度11到15层，一座废弃的矮人矿场。这些墙里的矿脉只是装饰；你在这里唯一能挖到的矿石是暗金矿，位于_铁匠矿场_中，从12到14层之间某一层进入。\n\n这里的怪物身披重甲，攻击凶狠。请带着升级过的装备前来。\n\n每层都比上一层更大：11层最小，有本区域的_商店_，也是16层之前的最后一家；14层最大，同时容纳7到9只怪物。当两个洞穴相接时，地面常常塌陷成深渊。生命值超过五分之四的怪物掉进去后会活着落到下一层，但会残废并流血；更弱的会摔死，只给一半经验值，掉落物则落到下层。\n\n雨雪仍会落进矿洞；15层以下不再有天气。满月之夜，红色幽灵会从黄昏开始出现，入夜后更多。大多数陷阱是火焰、毒镖、冰霜、风暴和酸蚀；稀有的陷坑会让你掉下一层。
guide.city_f1=商店出售鳞甲、一件4阶武器和一件投掷武器、带尖的飞镖、袋子、一个黄金便携宝箱、一块_强化符石_、一个_重生十字架_、一瓶治疗药剂，以及鉴定卷轴、祛邪卷轴和魔法地图卷轴。\n\n_食尸鬼_成对出现。若一只被杀时它的同伴能看见它，或就在4格之内，它会倒下，并在5回合后以十分之一的生命值爬起来（之后的倒地分别是10回合、15回合）。把两只一起杀掉、拆散它们，或把受伤的一只扔进深渊。\n\n_元素_会飞行，并射出火焰、冰霜或电击。冰霜打火元素，或火焰打冰霜元素，会立刻削掉它一半生命值。稀有的混沌元素总会掉落一张嬗变卷轴。\n\n_术士_的魔法弹会在一段时间内降低你的装备；切断它们的视线。六个里有五个会掉落药剂。\n\n_发明家_会远程投掷，你一靠近就后退，并且总会掉落一张注魔卷轴。黏土魔像和蜘蛛机器人补充着这一层。
guide.city_f2=_武僧_每回合攻击两次，每12次命中就有1次把你的武器打落在地（被诅咒的武器则留在手中）。狩猎中的武僧会积攒专注，并格挡你的下一次攻击，无论它有多精准。用一次廉价的攻击消耗掉格挡，然后再下重手；法杖和火焰无视格挡。放风筝会让他更快重新凝聚专注。稀有的武僧大师伤害高出一半，还能把你击晕一回合。\n\n这一层刷出的_元素_最多。在水里，冰霜元素总会把你冻住，电击元素的电弧能够到你，而火焰元素无法点燃你。\n\n_野心勃勃的小恶魔_每三局会有一局出现在这里。他的差事是去他房间下方的矮人金库行窃：见“古代矮人金库”。
guide.city_f3=_魔像_登场：120点生命值，每次攻击造成20到60点伤害，免疫恐惧、睡眠和狂乱，且很少闪避。它们体型太大，进不了一格宽的走廊，所以在走廊里打。够不到你的魔像会把你拉到它身边，或自己传送过来；在开阔地带你跑不过它。它的首次掉落有五分之一的概率是恶魔大厅品质的护甲或武器，之后每次掉落的概率降到三分之一。\n\n_牛头人_（120点生命值）有三分之一的攻击会用角顶你，使你流血并残废，然后后退，直到流血停止。\n\n偶尔会有一只_矮人巫妖_在18或19层出现。它远程攻击造成20到32点伤害，会后退，而你站在它旁边时它无法攻击你：把它逼进角落。它给的经验值是全城最多的，还有五分之一的概率掉落一瓶治疗药剂。\n\n如果小恶魔跳过了17层，那么他每两局会有一局在这里。
guide.city_f4=刷新的怪物由三只魔像、两名武僧、两名术士、一个元素和一头牛头人组成。在走廊里战斗。\n\n如果还没有任何金色小偷交出_都市古代钥匙_，这里会守着一个_金色疯狂小偷_。他每回合攻击两次，每次造成30到50点伤害，偷走100到500金币然后逃跑；他逃跑时打中他会震落几枚金币，被逼到角落时他会反击。他掉落你的金币、一枚手里剑和那把钥匙（见“黄金宝库”）。本局你每杀死一个金色小偷，下一个都会更强。\n\n偶尔会有_魅魔_从恶魔大厅爬上来。\n\n如果小恶魔还没出现，他就在这里。城市还欠你的力量药剂、升级卷轴或刻笔都放在这一层，而20层没有任何战利品：现在就把它们用掉。
guide.city_f5=一条摆满书架的长廊通向王座厅：王座位于中央，四角各有一个召唤基座。你一走进去，门就会锁上，直到矮人王死去。这里不会刷新任何东西；唯一的战利品是某位倒下的英雄留在入口附近的遗物。\n\n请满血前来，并带上一个_重生十字架_。仆从出现之前，它的基座会显示即将出现的东西：骨头代表食尸鬼，绿色火焰代表武僧，阴影代表术士（在“绝命头目”挑战下，火花代表魔像）。\n\n国王死后，北门会打开，通向一条横跨深渊的步道；掉下去会落到21层。如果小恶魔给你的评分超过2,000，他的商店就在步道上：板甲、三支火把、5阶武器、一个重生十字架、一个水晶便携宝箱，以及《死者之书》《生者之书》《天界之书》。\n\n徽章：在不使用武器、法杖（闪电除外）、武力之戒或牧师法术击中他的情况下杀死他。
guide.city_overview=深度16到20层。食尸鬼、术士和武僧是城中的亡灵；元素、魔像、牛头人和发明家的机械与它们同行。\n\n16层有一家_商店_，是矮人王之前的最后一家。_野心勃勃的小恶魔_会出现在17、18或19层，最迟19层。20层是国王的王座厅。\n\n雨雪到不了这么深的地方，空气也比矿洞更暖。炎热的日子里站在火边，你会中暑。\n\n常见陷阱：冰霜、风暴、酸蚀、爆炎、分解。较稀有：落石、闪光、守卫、虚弱、召唤、扭曲、诅咒、陷坑等。\n\n满月之下，蓝色幽灵会在黄昏和夜晚在这里出现，矮人巫妖则在夜间出现。
guide.city_vault=_野心勃勃的小恶魔_房间里的深坑通向一座封闭的矮人金库。先和他谈谈：他想要里面的_黑曜石雕像_。\n\n进去时你会回满生命值。你的装备和金币留在小恶魔那里；你只穿着布甲进去，并带着一颗_逃脱棱晶_，它可以随时把你送出去。里面的楼梯没有作用。飞升期间你无法进入。\n\n守卫缓慢地游荡，视野是身前的一道锥形。待在他们背后；只是瞥见你一眼的守卫只会过来看看。被杀死的守卫会掉落_矮人徽记_，可以用来打开徽记门。四处散落着可供战斗的装备，起点附近还有一瓶治疗药剂。\n\n在最后一个房间远处的门边，入口会锁上，并出现一个金库元素；它在火焰、冰霜和电击之间切换。它身后等着雕像和小恶魔的奖品：一件神器或戒指、第二枚戒指、两把武器、板甲和一根法杖，全部为+2或更好且未被诅咒。\n\n离开时，你的装备会归还，而金库里的所有东西都会失去，只能带走一件。拿到雕像，小恶魔会给你4,000分，你可以保留任意一件物品。没有雕像，他则按探索（最多1,000分）、徽记或已打开的徽记门（最多1,250分）以及召唤出的元素（杀死它得满750分；若它活着，你伤它越多得分越少）计分，分数越高，你能保留的物品越好；低于500则什么都带不走。超过2,000分，他会在矮人王的王座之后开一家商店。
guide.den_crab=海螺壳会把你送到一座干燥的密室，而它上方的大厅里全是水。_闪电贝壳_和它的螃蟹发出的闪电，对站在水里的目标造成的伤害会多出五成；_浮空药剂_可以避免这一点。\n\n大厅顶端坐落着闪电贝壳，四只_贝壳蟹_环绕着它，_螃蟹王_则在大厅里绕圈。战斗细节见螃蟹王那一页。\n\n螃蟹王掉落1,900到4,000金币和_精金护甲_。每只贝壳蟹掉落一把_金骷髅钥匙_，可以打开任意楼层上的任意一把锁，用后即消失。杀死螃蟹王后，海螺壳就能送你回家；海螺壳会被用掉。
guide.den_infest=三相之力会把你放到一座带围墙的小房间的基座上，房间位于一片巨大黑暗洞窟的中央。你的视野是6格。房间唯一的门在南侧。你一踏出门，十只_暗影Yog_就会在视线之外的某处沉睡出现。\n\n已有二十只怪物在游荡：_灰色巨魔_（500点生命值，攻击造成55到115点伤害）和_幽灵鼠_（速度是你的四倍，发射20到45点的魔法弹并使你虚弱，不给经验值）。大约每50回合还会有更多怪物到来，所以洞窟从不会空着。这一层每有一只生物，每只暗影Yog就多1点护甲。\n\n你的起始房间顶部排着一列可见的召唤陷阱，洞窟里还散落着隐藏的召唤陷阱；每个都会召来更多怪物。这里没有水、没有草，也没有战利品。\n\n在房间门口战斗，让它们一个个上来。时空道标在这里有效。
guide.den_skeleton=你来到一座狭窄的石室，上方是长满灌木和高草的雕像大厅。石室两侧的柱间都是水。门边放着一瓶_液火药剂_：这个巢穴里的一切都免疫火焰，所以用它烧掉灌木、打开视野。\n\n一踏进门，_骷髅王_和两只巨大的_骷髅手_就会醒来，三者都会飞行。战斗细节见骷髅王那一页。\n\n骷髅王掉落1,900到4,000金币和_精金武器_；三者每个都可能掉落一瓶液火药剂。杀死骷髅王后，铭文骨就能送你回家；铭文骨会被用掉。
guide.den_tengu=最小的巢穴：一处有水有草的潮湿洞窟，_天狗_已经在猎杀你。这只天狗有400点生命值，以双倍速度移动，攻击造成15到25点伤害，并且每次受击都会挡下前20点伤害，所以轻型武器几乎伤不到他。用重击。\n\n没有阶段，也没有陷阱。生命值低于一半时他会用一招，通常是炸弹；走出爆炸范围，继续战斗。定身、失明和恐惧对他无效，他还抗毒素和毒气。在走廊里战斗；你跑不过他。\n\n他掉落1,900到4,000金币和一枚_精金戒指_。只有到那时，钥匙才会送你回家；时空道标在这里无效。\n\n一扇暗门通向鼠王的宝藏室。里面的宝箱装有金币、种子、一个蛋、食物、集束炸弹或毁灭先生，其中一个宝箱是_宝箱怪_。这把钥匙不会被用掉，所以你可以等天狗死后回来安心搜刮；他不会回来。
guide.den_thief=古代钱币会打开一座金库，大厅里纵向排着两列单格深渊。掉进深渊会落到41层，那里无路可出（见“盗贼困局”）。把每一格深渊都当作本局的终点，当有任何东西可能推你或让你混乱时，离它们远一点。\n\n_小偷之王_和他的两个强盗王在这里等着；见他那页。火焰和毒素在这里的一切身上都正常生效。\n\n他掉落1,900到4,000金币、一枚_精金戒指_，还有三分之一的概率掉落一张卷轴。杀死他后，钱币就能送你回家；钱币会被用掉。这枚钱币称他为“强盗王”；那些强盗王是他的护卫。
guide.den_thiefcatch=41层是个陷阱。你只能从40层的深渊掉下来到达这里，而没有任何东西能把你送出去：这一层被算作首领层，所以时空道标、三相之力和所有巢穴钥匙都无法使用，而且这里没有楼梯。本局只能在这里继续，无路可回。\n\n这一层仿照天狗巢穴：几个有水有苔藓的房间，还有一处本该是出口、却被铺平的地方。这里没有任何物品。如果你落地时巢穴里的天狗（36层）还活着，这里还会刷出一个强盗王。
guide.dens_overview=首领巢穴（35、36、37、38和40层）没有楼梯。每个巢穴只能用它专属的物品打开，且必须在主地牢2到24层之间的非首领层使用（三相之力可在1到26层使用）。同一件物品能把你送回来，但必须等巢穴的首领死后才行。铭文骨、海螺壳和古代钱币在返程时会被用掉；天狗古代钥匙和三相之力会保留。\n\n它们的来源：\n_天狗古代钥匙_（36）：天狗死后你杀死的第一个豺狼弓箭手。\n_铭文骨_（37）：长满苔藓的骷髅。从第51次击杀起，每个有十分之一的概率掉落；第101个必掉。\n_海螺壳_（38）：白化食人鱼，同样的计数。\n_古代钱币_（40）：金色小偷，同样的计数。\n_三相之力_（35）：由矿洞里的铁匠用它的三块碎片锻造而成。\n\n奖励：36层和40层各一枚精金戒指，37层精金武器，38层精金护甲，每个首领1,900到4,000金币，以及35层的_邪神之球_。镇上的铁匠会用精金强化对应的武器、护甲、戒指或法杖。\n\n建议顺序：天狗、骷髅王、小偷王、螃蟹王，然后是35层。除天狗巢穴外，时空道标在每个巢穴都能用。没有39层。40层的深渊会把你送到41层，那里无路可出。空气炎热。
guide.halls_end=一座横跨虚空的桥，几支蜡烛，以及基座上的_Yendor护身符_。这里不会刷新任何东西。\n\n拿起它并不会结束本局。在25层的楼梯处，你可以选择是否开始_飞升_。若开始，楼层间的传送会停止（商店的传送门也一样），护身符无法丢弃，怪物会变得强得多，越浅的楼层越明显。每进入一层新楼层，诅咒就加2：达到2时，它会把远处的怪物召向你；达到4时，它们移动得更快；达到6时，你会被减速；从8开始，它每回合都会伤害你。杀死被强化的怪物会降低诅咒。旧的首领层不会增加诅咒，还会恢复你的生命值和饥饿值。\n\n诅咒只在地牢的楼层上生效：在其他任何地方，它都会等你回来再发作。铁匠、制杖师、小恶魔、幽灵和店主都留在原地。\n\n带着护身符走上1层的楼梯，诅咒就会永久解除。回到地表后，护身符会打开那些封闭的古墓。\n\n你也可以把它留在原地，不带诅咒地爬上去。
guide.halls_f1=_魅魔_（80点生命值）会从2格开外传送到你身边。她们三分之一的攻击会魅惑你；你被魅惑时，她们的攻击会治疗自己，治疗超过满血的部分会变成护盾。贴近她们打，尽快打破魅惑。三分之一会掉落一张卷轴，绝不会是鉴定或升级卷轴。\n\n_邪眼_蓄力2回合，然后沿直线朝你当时所站的位置发射一道30到50点的光束，直到第一面墙。蓄力期间它们只受四分之一伤害。走出光束的路线，然后再打它们。分解对它们只造成一半伤害。\n\n_混沌法师_以双倍速度移动，从自己造成的伤害中回血，且它们的攻击会使你混乱、中毒、燃烧、失明或减速。五十分之一会掉落一瓶_经验药剂_。\n\n_恶魔血巢_的门从不隐藏。它有120点生命值，无法移动或攻击，但超过20点的伤害会失去大部分力道（85点只算30点），而且每受到一点伤害，下一个撕裂者都会来得更早。先清空房间。它掉落一瓶治疗药剂。
guide.halls_f2=刷新：一只魅魔、一只邪眼和一名混沌法师。\n\n第二个恶魔血巢每53回合（第21层为60回合）生成一只恶魔撕裂者。清空它的房间，关上门，慢慢磨死它；恶魔撕裂者只能一只接一只地从门口进来，正好适合用炸弹和火焰对付。它还会掉落一瓶治疗药剂。\n\n本层还有一处结着霜的裂口，通往_冰封大厅_，那是一条五层分支。其中的怪物与恶魔大厅的怪物一样强。
guide.halls_f3=_巨蝎_（110点生命值）会发射尖刺，造成20到52点伤害，并有一半几率使你残废；你靠近时它会后退。你站在它旁边时它无法攻击你，所以贴身站住别走。毒素与吸血武器对其造成的伤害减半。每5只中有1只会掉落物品，通常是治疗药剂，而且越往后掉落几率越低。稀有的淡绿色_酸液巨蝎_会反弹每次近战或投掷命中造成的一部分随机伤害，并在贴身时让你沾染腐蚀淤泥；对它用法杖。\n\n_迷失之魂_每三次命中就有一次点燃你。火焰会治疗它们；冰霜或冻寒最多能削去其三分之二的生命值，在水里甚至能直接杀死它们。\n\n偶尔会冒出_恶魔黏咕_：200点生命值，双倍速度，攻击造成30到60点伤害并让你沾染腐蚀淤泥。它每承受一次未死的攻击就会分裂出一团黏液，每团黏液都会掉落一瓶小型治疗药剂。水能治疗它，而低温岩浆也是水。\n\n第三个恶魔血巢每47回合生成一只恶魔撕裂者。实验室在本层或下一层。
guide.halls_f4=视野已缩到2格。刷新：三只巨蝎、两只邪眼、一只魅魔、一个迷失之魂，以及_恶魔黏咕_。它们大多从你的视野之外发起攻击，所以贴着墙走，在开阔地带使用隐形。\n\n最后一个恶魔血巢每40回合生成一只恶魔撕裂者。在第25层之前摧毁全部四个：每留下一个活着的血巢，Yog-Dzewa的召唤里就会保留一只完整的恶魔撕裂者，而不是幼虫。\n\n下楼梯之前：用掉最后几张升级卷轴，备足治疗手段，并至少带上两支火把。
guide.halls_f5=走过入口两步，楼梯就会坍塌，本层随之封锁，直到Yog-Dzewa死去。这里不会有任何刷新；唯一的战利品是某位陨落英雄留下的东西。在你看见Yog之前，它一直沉睡着。\n\n你的视野起初是4格，Yog每损失300点生命值就缩减1格，最低到1格。点燃的_火把_能让视野保持在6格。\n\nYog的光束会穿墙且绝不落空，所以掩体毫无用处：盯住被标记的格子，及时走开。\n\n竞技场里有水。水能阻挡燃烧之拳的火焰，却会治疗腐烂之拳。\n\n任何卷轴或信标都无法离开封锁的楼层。当你带着Yendor护身符返回上层时，这些楼梯会询问你是否开始飞升。
guide.halls_overview=第21到26层，没有商店。你的视野每层缩减1格：21层5格，22层4格，23层3格，24层2格。这几个楼层每层都有_两支火把_；一支能照亮你周围6格，持续250回合。留几支到第25层用。\n\n21到24层每层都有一间_恶魔血巢_房间，会不断生成恶魔撕裂者。你每摧毁一个血巢，Yog-Dzewa的召唤中就有一只恶魔撕裂者变成弱小的幼虫。日志会标出仍然活着的血巢。\n\n气温接近35度，正是中暑的临界线；附近的火焰会把你推过这条线。那些被称为低温岩浆的红色水池其实是普通的水。\n\n23层和24层中有一层是实验室。陷阱沿用矮人都市那一套，另加即死陷阱。满月时，蓝色幽灵会在黄昏和夜晚刷新，幽灵鼠则只在夜晚刷新。\n\n第25层是Yog-Dzewa的竞技场。第26层放着Yendor护身符。
guide.mines_boss=一走下梯子，本层就会封锁，一条信息会解释缘由：欧提鲁克把疯狂的巫师Zot困在了_真知之球_里，并把自己变成了守护它的石魔像。魔像死后，本层才会解锁。\n\n梯子所在的大厅被两扇锁着的门封住；大厅里的一只宝箱装着铁钥匙。门后，88名_矿洞守卫_分两群沉睡。每名守卫都持有一把+10的附魔武器，命中造成双倍伤害，对非遗物伤害只承受1到四分之一，当你距离超过2格时会出现在你身边，并在生命值低于四分之一时传送离开去治疗。醒着的守卫能唤醒相邻的同伴。每名守卫都会掉落自己的武器；第一个被杀的守卫会掉落_恶魔大厅古代钥匙_，全游戏仅此一把，能把你从第2到24层的任意非首领层直接送到第25层Yog-Dzewa的竞技场，也能送你回来；回来时会消耗你携带的一把骷髅钥匙。\n\n八座_闪电塔_环绕着西侧区域。它们无法被伤害，只要你在4格以内就会对你造成300到600点伤害，直到魔像死去。真知之球就在那片区域的中央。\n\n魔像在东侧区域里一动不动，直到被击中；详见欧提鲁克。
guide.mines_f1=这里的视野只有2格；带上光源。房间被木制_路障_隔开，路障可以烧掉，从而开出捷径。每层地上有9块_矿石_，在镇上每块值1,000金币。\n\n_库帕_遍布这些楼层：550点生命值，双倍速度，攻击造成70到160点伤害，护甲最高50点。除遗物武器的攻击外，它们对任何伤害只承受1到一半。单次削减后仍超过68点的伤害会让它在脚下释放腐蚀酸雾；库帕对此免疫，你却不免疫，所以打出重击后要后退。每10只中有9只携带一块矿石。\n\n稀有的_古林_有750点生命值，攻击造成100到200点伤害，对非遗物伤害只承受1到四分之一，但比库帕更容易失手。它是_诺恩石_的唯一来源（见矿场-第3层）。\n\n矿场楼层永远不会重建：你打开的东西、杀死的怪物、丢弃的物品都会保持原样。
guide.mines_f2=循环流程：清空一层，收集矿石，用_返回小镇信标_回到镇上，以每块1,000金币卖掉矿石，然后再用信标回到你离开的确切位置。白天第一次与镇卫或村民交谈时，其中一人会送你信标，每局仅一次；它在地牢里毫无作用。\n\n身边有生物或身处封锁楼层时，信标无法使用。第65层在你抵达时就会封锁，所以在它的首领死去之前，你无法用信标离开。\n\n欧提鲁克日志在矿场和地表任何地方都不会充能；让它在两次探索之间在地牢里或镇上建筑内慢慢充满吧。
guide.mines_f3=_诺恩石_只由古林掉落：每杀一只掉一颗，每局最多五颗。大约每四个矿场楼层会出现一只古林。一件遗物需要三颗，所以预计能做出一件遗物武器。\n\n把三颗或更多诺恩石（不要放别的东西）放到镇广场东边神庙的祭坛上。同色三颗会做出该颜色的遗物；混放则会从这些颜色中随机挑选。每件遗物都自带附魔。蓝色：阿瑞斯之剑（吸血）。橙色：死神大斧（幸运）。紫色：火神链枷（毒素）。黄色：海神三叉戟（闪电）。绿色：_主神的鬼魂_，唯一的投掷类遗物（恐惧）。\n\n对付库帕、古林、矿洞守卫、魔像和Zot时，遗物的攻击无视它们的伤害减免，而遗物近战武器还会额外追加一次相当于其伤害一到两倍的攻击。五颗诺恩石全部掉落后，古林就不再掉落任何东西。
guide.mines_f4=没有遗物，库帕和古林要花很长时间才能杀死。它们的护甲（库帕最高50，古林最高145）会在伤害减免之前从每次命中中扣除，所以几次重击远比许多次轻击有效。\n\n腐蚀酸雾来自单次削减后仍超过其八分之一生命值的命中：库帕为69点，古林为94点。打出这一击后，就走出毒雾。\n\n矿场里没有门。在隧道里战斗，这样一次只有一只怪物能够到你；需要时就回镇上。
guide.mines_f5=除了9块矿石，每层矿场还有3到5件随机物品（其中四分之一在宝箱里，少数在骷髅上——若物品被诅咒，骷髅会站起来）和1到3堆金币。盗贼每层有三分之一几率找到一枚炸弹。算上库帕携带的矿石，清空一层价值远超10,000金币。\n\n墙上的矿脉只是装饰；你无法在这些矿场里挖掘。路障会燃烧，周围的苔藓也会跟着烧起来，所以点燃之前先想好退路。
guide.mines_f6=在_满月_之夜，从黄昏开始，_幽灵鼠_会加入每层矿场的刷新，天黑后更多。它们有80点生命值，每深入一层再加3点（这里约260点），以四倍正常速度移动，在这里咬一口造成30到61点伤害，还能发射暗影箭造成20到45点伤害；每五道暗影箭中就有一道会使你虚弱。它们不提供经验值，也不掉落战利品。\n\n你跑不过它们，而且天亮后已经出现在楼层里的幽灵鼠仍会留下。断开视线，让它们不得不来找你；或者在满月之夜干脆别进矿场。
guide.mines_f7=库帕的攻击造成70到160点伤害，而宠物的咬击也像你的攻击一样会被削减，所以年幼的宠物在这里死得很快。把脆弱的宠物留在镇上：只有站在你身边的楼梯上它才会跟你下去，而_口哨_能从任何地方把它唤到你身边。\n\n_蛋_来自推羊关、天狗藏身处或孵化巢房间。带在身上时，它只计算回合数；放在地上时，它经历的事情会决定孵出什么（见任务、NPC与宠物）。摇晃它就能检查里面是否有活物，然后把它打开；打开得太早，你只能得到蛋黄。
guide.mines_f8=欧提鲁克的两页书页来自书架：_藏宝室_与_龙穴_。当你有灵视时被烧毁的书架，或者被你刻意搜空的书架，各有五十分之一的几率给出每一页；每局各有一页。龙穴书页通往第67层，暗影龙的蛋就在那里。矿场里没有书架，镇上的图书馆也没有。
guide.mines_f9=第65层在你抵达时就会封锁：上行的梯子和_返回小镇信标_都会失效，直到那里的魔像死去。先去镇上卖掉矿石、休息一下。\n\n检查清单：一件_遗物武器_（魔像对其他任何伤害只承受1到四分之一）、返回小镇信标、充足的治疗手段，以及一只强壮的宠物或干脆不带宠物。\n\n下面等着你的：88名沉睡的_矿洞守卫_、8座只要你在4格以内就会造成300到600点伤害的_闪电塔_，还有魔像。
guide.pg_battle=你杀死的第一个覆满苔藓的骷髅会掉落_监狱古代钥匙_；如果你从未持有过这把钥匙，第9层也会有一把。它可用于第2到24层的任意非首领层，再用一次就能回来；钥匙不会消耗，所以你可以反复往返。\n\n先打开宝箱：里面有200枚_圣水手雷_。每一枚爆炸都会对2格内的所有亡灵造成75到155点伤害，并让它们陷入恐惧。它不会伤害你、活物或物品，所以被围住时可以直接往自己脚下扔一枚。\n\n这些骷髅身披护甲、攻击凶狠，而且你每杀死一只，其余骷髅的攻击就会更狠、更快：杀到50只时，它们每回合攻击一次；从100只起，每回合攻击两次。每只骷髅死亡时都会爆开，对站在旁边的任何东西造成少量伤害。有时会有一只_墓地守卫_飞在它们中间发射光弹。它不是亡灵，手雷对它无效；只能亲手杀死它。\n\n从你杀死的第51只骷髅开始，每次击杀都有十分之一的几率掉落_铭文骨_（第37层的巢穴）；第101只必定掉落。骷髅会掉落黄色露珠，有时是红色。你第一次带着100次击杀离开时，会额外获得20枚手雷。金色地牢坚果也需要100次骷髅击杀。
guide.pg_catacomb=如果小恶魔的藏宝室任务得分超过2,000，他在第20层的商店就会出售三本书。在你拿起Yendor护身符之前，每本售价225,000金币；之后_死亡之书_售价7,500，生命之书12,500，天堂之书15,000。在第1到26层的任意非首领层阅读一本书，就能前往它对应的楼层。要离开，就站到该楼层另一端的基座上再读一次。书不会消耗。\n\n死亡之书会打开地下墓穴：12到18个房间由狭窄的走廊相连。你会落在其中一个基座上，而_三相之力死亡碎片_躺在另一个基座上。\n\n_蓝色幽灵_在这里游荡：195点生命值，攻击沉重，四倍于你的速度，所以你跑不过它们。每10次命中就有1次会让你眩晕并陷入恐惧。在走廊里一只一只地打。它们是亡灵，所以两三枚圣水手雷就能杀死一只。每只都会掉落红色露珠，那是最高级的露珠。\n\n有时会出现一只_矮人巫妖_。它只会远程射击并后退；贴在你身边时它无法攻击。它同样是亡灵，还可能掉落一瓶治疗药剂。\n\n房间里藏着宝箱、遗骸、金币，有时还有一瓶力量药剂或一张升级卷轴。离开之前先把它们搜一遍。
guide.pg_chasm=_天堂之书_会打开一座布满深坑的楼层。一瓶漂浮药剂躺在你的落点附近，楼层各处散落着嬗变花之种。\n\n_守卫_站在楼层各处。每尊都持有一把随机的+3附魔武器（永不被诅咒），死后掉落它。守卫在你伤害它之前不会移动，所以每场战斗都由你决定何时开始。它醒来后很难打中，并用那把武器攻击。一次只唤醒一尊，也别让范围攻击波及一群。\n\n唯一游荡的怪物是_飞行守卫_。它们飞过深坑，发射光弹，什么都不掉落。\n\n掉进深坑至少会损失你当前生命值的一半，并让你流血、残废；当生命值只剩最大值的四分之一或更少时，它可能直接杀死你。下面的房间只有一道楼梯，直通放着_三相之力天堂碎片_的出口基座。如果你迷路且生命值充足，就往下跳。\n\n集齐三块碎片后，去矿洞找铁匠。他会锻出_三相之力_，它能把你送到第35层，而在那里所有暗影Yog死光之前，它不会把你带出去。
guide.pg_field=你杀死的第一个豺狼弓箭手会掉落_下水道古代钥匙_。你遇见悲伤幽灵的那一层（第2、3或4层）必定会刷出一只。在2到24层之间任意非首领层使用钥匙，就能进入猎场；在猎场使用它则能回来。\n\n贴在你身边的弓箭手无法射击，而且在这里它们走得比你慢。你每杀过一只弓箭手，它们的箭就伤得更重，所以尽早来。大约三分之一的刷新是_森林守卫_：会沿任意通畅直线射出闪电的飞行怪。先杀它们；贴身时它们很弱。\n\n这里的每只弓箭手都会掉落三枚_森林之箭_，对活物造成其伤害的三到六倍。从你的第21只弓箭手起，每次击杀都有十分之一的几率掉落欧提鲁克日志的_安全屋书页_。天狗死后，你杀死的下一只弓箭手会掉落_天狗古代钥匙_（第36层的巢穴）。踩过高草会得到种子、坚果、浆果和露珠。\n\n你第一次带着100次或更多弓箭手击杀离开猎场时，会额外获得30枚森林之箭。
guide.pg_fishing=到达第11层之后你杀死的首条食人鱼会掉落_矿洞古代钥匙_；第14层总会多出一条食人鱼。在2到24层之间任意非首领层使用钥匙，就能进入一座由沙岛组成的被水淹没的楼层。\n\n三十条_白化食人鱼_生活在水中。它们以你两倍的速度游动，攻击凶狠，闪避出色，并免疫火焰、冰霜、毒气、麻痹和定身。你站在岸边时，它们能从水里咬到相邻的你；后退一格，它们就够不着了。\n\n你的落点旁边有一只宝箱，里面有99枚_捕鱼炸弹_和一瓶漂浮药剂。捕鱼炸弹不造成伤害：它周围2格内的每条白化食人鱼都会被送到本层的干燥地面上并死在那里，掉落物也落在那里。它们不给经验值，但会掉落食物，你杀得越多，掉落越频繁。\n\n危险来自偶尔出现的_水域守卫_。它的光弹造成25到59点伤害，你若站在水里则再加一半，墙壁能挡住它。贴身时它的攻击反而更轻。\n\n从你的第51条白化食人鱼起，每次击杀都有十分之一的几率掉落_海螺壳_（第38层的巢穴）；第101条必定掉落。你第一次带着100次击杀离开时，会得到40颗浆果。火神链枷在这里无法让你隐形。
guide.pg_fortress=_生命之书_会打开一座矮人堡垒。它的走廊有两格宽，所以没有可以守住的门口。\n\n_巨魔_住在这里：520点生命值，攻击造成50到90点伤害，免疫恐惧和狂乱。它们不是亡灵，所以手雷毫无作用。它们攻击缓慢，每1.5回合一次，而且全都一开始就在沉睡。轻声移动，你就能穿过整层而不吵醒任何一只。\n\n一粒_魔法大米_躺在你的落点附近。捡起它会唤醒本层所有巨魔并把它们引向你，所以准备好了再拿。它能做成_大米球_，让未受伤的目标昏昏欲睡并被送到本层别处；或者做成_饺子炸弹_，让3×3范围内的一切昏昏欲睡，并把未受伤的那些送走。两者都对亡灵无效。这粒大米大约做出200个大米球或40枚饺子炸弹后就会碎掉。\n\n_发明家_等在一面魔法屏障后面。把本层的那朵伞菌带给他，背包里还要有水袋，他就会永久改造你的水袋：容量从100滴变成300滴，加装一个从空气中汲取露水的冷凝器，以及一个能精确喝下指定滴数的吸嘴。然后他就死了。\n\n_三相之力生命碎片_躺在出口基座上，你就是在那里读书离开的。
guide.pg_vault=你杀死的第一个金色小偷会掉落_城市古代钥匙_；若你从未拿到过这把钥匙，19层会有一把。在2到24层之间任意非首领层使用它，就能进入宝库：黄金雕像之间散着50堆100到300金币，总共约10,000。\n\n金色小偷每回合攻击两次。首次命中会偷走你100到500金币，然后小偷拔腿就跑。在它逃跑时打中它，会掉出几枚金币；杀死它则归还剩下的。被逼到死角的小偷会还手。每只都会掉一枚手里剑，而你每杀一只，后面的小偷生命值和护甲都会更高。\n\n有时会有一只_宝库守卫_漂在它们中间。它生命值不高，但光弹能造成30到70点伤害，是所有守卫里最狠的。先杀它，并用雕像和墙挡住它的视线。\n\n从你杀死的第51个小偷起，每次击杀都有十分之一概率掉落_古代钱币_（40层的巢穴）；第101个必定掉落。当你带着豺狼弓箭手、苔藓骷髅、白化食人鱼和金色小偷各100次击杀的记录第一次离开宝库时，你会得到_金色地牢坚果_：吃下后+2力量和+20最大生命值，或有一半概率给+5和+50。宝库里没有任何补给，自带干粮。
guide.postgame_overview=27到33层没有楼梯。钥匙或书能把你从普通地牢层送去，再把你带回来。钥匙和书会留在背包里，可以反复使用。有宠物跟着你时，任何钥匙和书都用不了。\n\n前四层（猎场、战场、渔场、宝库）是屠杀场：只有一种怪物，会不断刷新，地上除了战场和渔场的补给箱以及宝库的金币之外没有战利品。这类击杀无论在哪儿完成都计数，而你每杀一只，弓箭手、骷髅和小偷都会更强。它们的奖品能打开首领巢穴。\n\n后三层（地下墓穴、堡垒、深渊）是迷宫，地上有战利品，有时是一瓶力量药剂或一张升级卷轴。每层的出口石台上都放着一块_三相之力_碎片。把三块都带到矿洞的铁匠那里；他会把它们锻成通往35层的路。\n\n这里没有陷阱，空气四季干热，水从不结冰。满月之夜会出现幽灵鼠：行动迅速的亡灵，会发射光弹，还能使你虚弱。
guide.prison_f1=先找_商店_，这是6到10层唯一的商店。尽量买下_欧提鲁克日志_：黏咕和天狗掉落的书页会夹进去，每张书页都能让它带你进入欧提鲁克的一间密室。若一直没拿到，15层的DM-300会掉落一本。商店还卖_重生十字架_（值得带进10层天狗之战）和这一局唯一的_劳埃德信标_：它能记住一处地点并把你送回去；只要它在你背包里，天狗、DM-300和矮人国王各会让它升一级。店主身旁的传送门已经点亮；11、16和20层商店的传送门分别要花1,500、2,300和3,500金币才能点亮。点亮的传送门能让你在它们之间往来，也能通往镇广场那座常亮的传送门，每走一趟消耗150点饥饿。\n\n这层到处是骷髅。它们死后会爆炸；护甲能减轻爆炸，但生命值低时别站在旁边打出最后一击。疯狂小偷每回合攻击两次，会偷走一件未装备、未升级的物品。每打中逃跑的小偷一次，它都会掉些金币；若它跑到6格外脱离视线，东西就没了。\n\n如果从你第一次抵达这层起没有任何敌人死亡——不论是谁杀的——杖匠会在报酬里外加一根_精金法杖_；他的差事里只有乱冢能做到这一点。镇上的铁匠可以用它强化法杖。法师总会拿到。
guide.prison_f2=_DM-100_只要与你视线通畅，就会从任意距离电你；用拐角断开视线。它有四分之一概率掉一张卷轴。_监狱守卫_能用锁链把你拉到身边一次，然后使你残废4回合。_石化骷髅_造成12到25点伤害，攻击缓慢，身披重甲，并像普通骷髅一样死后爆炸。_僵尸_也从这一层开始出现。\n\n偶尔（7层和8层各有五十分之一）会有_刺客_追杀你：双倍速度，能沿任意通畅直线投掷，造成10到23点伤害。绕着拐角打。\n\n_杖匠_可能在这里（三分之一；否则在8层或9层）。报酬是你从两根不同的、未被诅咒的+1法杖中挑一根。他的三个差事：\n_乱冢：_用躺在这层的液火药剂烧掉路障。携带尸尘会招来怨灵，所以拿到就立刻送回去。\n_仪式地点：_把四根蜡烛放在标记格的四边，杀死新生火焰元素并带回它的余烬。冻寒或冰霜能一次削去它一半生命值。\n_腐莓园：_腐莓核心喷吐毒气，腐莓触手藏在草里。火能烧死触手，但千万别烧核心：烧死的核心不会掉腐莓之种。
guide.prison_f3=_死灵法师_从这一层开始出现。死灵法师从不攻击：它会在你身旁唤起一具骷髅，你逃跑时就把骷髅移向你，从远处治疗它，等它完好后再激怒它。杀死死灵法师，它的骷髅就会崩解。站在它召唤的位置会被挤开，没有空位则会受伤。死灵法师起初有五分之一概率带着治疗药剂，每掉一次之后概率降低。\n\n偶尔会出现苍白的_幽魂法师_，改为一只接一只地召唤怨灵。怨灵很难打中；杀死死灵法师，它们便会全部消散。它掉落一张祛邪卷轴。\n\n这是石化骷髅和刺客出现的最后一层。若你还没遇到杖匠，他有一半概率在这里，否则在9层。炼金实验室同样有一半概率在这里，否则在9层。
guide.prison_f4=监狱还欠你的升级卷轴、力量药剂和刻笔都在这一层；10层只有天狗。若还没找到杖匠和实验室，他们都在这里。\n\n若你从未拿到过_监狱古代钥匙_，这一层某处会守着一只_苔藓骷髅_。它有105到135点生命值和厚重护甲，很少失手，造成20到45点伤害，每1.5回合攻击一次。毒素和毒气对它无效，它死后会爆炸。你可以不去招惹它。\n\n它必定掉落监狱古代钥匙，能在2到24层之间任意非首领层把你送去战场（28层）。在那里使用钥匙就能回来，而钥匙会保留。
guide.prison_f5=一条走廊向南经过四间牢房，通向天狗锁着的牢房。_铁钥匙_就在这四间牢房之一。开门前先休息、回血、整理背包：一踏进天狗的牢房，整层就会封闭，直到战斗结束。带一个_重生十字架_是不错的保险。\n\n这里没有别的怪物，也不会有怪物刷新。一切伤害你的东西都属于天狗：隐藏的毒镖陷阱、炸弹、闪电柱和火焰。在不被他的任何陷阱或花招击中的情况下击败他，即可获得一枚徽章。\n\n如果你还没有子职业，他会掉落_天狗的面具_（使用后可以选择子职业），以及欧提鲁克日志的推羊城堡书页。背包里的劳埃德信标会升一级。战斗结束后这层会改变：绕过深渊走到下楼楼梯。11层有商店。
guide.prison_overview=6到10层，比下水道难了一大截。骷髅死后会炸成骨片，监狱守卫用锁链把你拉过去，DM-100从远处电你，而从8层起死灵法师会唤起骷髅。\n\n6层有本区域唯一的商店，还有一个结满蛛网、向下通往蜘蛛巢的洞。6到9层藏着2到3个密室。10层属于天狗。\n\n这是主地牢最冷的区域。水能灭火，也能洗掉淤泥。站在水里会让闪电传得更远、打得更狠，冰霜也会困住你更久。常见陷阱是冻寒、电击、毒气、燃烧和毒镖；较稀有的会报警、缠住你或把你传送走。\n\n满月之夜，怨灵从黄昏开始出现，入夜后还有幽魂法师。
guide.sewers_f1=上楼楼梯随时能把你送回镇上。\n\n这层正好有8只怪物，都不在入口附近，且不会刷新。大多是老鼠；遇到成对的就在门口打。_下水道巨蛇_几乎能闪开每一击，但突袭绝不会落空：让它跟着你穿过一道门，在它穿门时出手。_棕色蝙蝠_以双倍速度飞行，能让你失明，死时还可能尖啸，把半层的怪物引向你。_灰色老鼠_不受毒素、火焰、睡眠和恐惧影响。\n\n每50局有1局，这里住着一只_老鼠王_。它发现你时会召唤至多四只老鼠；退进走廊。\n\n唯一的陷阱是始终可见的老化飞镖陷阱，也没有密室，只是入口房间的门会一直藏着，直到你拾起指南里讲搜索的那一页——它就躺在那间房里。一般会有食物，四分之三概率有一张升级卷轴，有时还有一块感知符石或一枚魔能触媒。触媒放在上锁的宝箱里，它的_金钥匙_在这一层的别处。
guide.sewers_f2=这层躺着一朵_伞菌_，修补匠J·梅尔滕斯守在一道无法打破的屏障后面。把伞菌带在身上、水袋放进背包，再去和他交谈，他会把水袋改造一次，然后离开。二选一：\n_凝露器：_水袋会从潮湿的空气中自行补水，空气饱和时约每100回合一滴，雨天或雾天更快，干燥空气中则不会。\n_定量饮水：_可以精确喝下指定滴数；每一滴回复最大生命值和最大法力的二十分之一。\n\n下楼前把每一颗露珠都捡起来：留下的会干涸。\n\n从这里开始，同时有5到7只怪物游荡，死去的会被补上。豺狼巡查会出现。宝箱可能是宝箱怪，有些门是隐藏的，召唤陷阱会召来1到3只本层怪物。\n\n悲伤幽灵有三分之一概率在这里，派你去追一只腐臭老鼠。她的那一层必定刷出一只_豺狼弓箭手_；你杀死的第一个弓箭手会掉落_下水道古代钥匙_（见猎场）。对你视而不见的豺狼是_流寇_：只有被攻击才会还手，并带着额外的战利品。
guide.sewers_f3=这里新出现：_蝇群_、_下水道螃蟹_和_迅猛龙公鸡_。\n\n蝇群有80点生命值，不给经验。每次武器命中，无论近战还是投掷，都会把它分裂，分出的两半会保留它身上的火焰或毒素。法杖、火焰和毒气不会使它分裂。第一只蝇群有六分之一概率带着一瓶小型治疗药剂；由它分裂出的蝇群概率更低。\n\n螃蟹和迅猛龙公鸡都以双倍速度移动，你跑不过它们。螃蟹的壳每击最多挡下4点伤害：一次重击胜过多次轻击。偶尔有螃蟹顶着木桶：这只_寄居蟹_更慢也更硬，必定掉落护甲。\n\n若还没遇到幽灵，她有一半概率在这里。她的目标是一只_豺狼诡术师_，它会投掷飞镖；连续命中会一次比一次毒得更重，还可能点燃你。贴身逼近：它一旦被迫移动，连击就重置了。\n\n若感知符石或魔能触媒还没出现，它们就在这一层。炼金实验室有一半概率在这里，否则在4层。
guide.sewers_f4=黏咕之前最后一个普通楼层。下水道还欠你的升级卷轴、力量药剂和刻笔都在这里；若3层没有实验室，它也在这里。\n\n若还没遇到幽灵，她就在这里，她的目标是_巨钳螃蟹_。它盯着你时，那只巨钳会挡下你的近战攻击、投掷武器和法杖光束。在你隐形或它被麻痹时打它，或让同伴吸引它的注意。它移动缓慢。报酬是你从一件2到5阶武器或护甲中挑一件，等级+0到+3，有五分之一概率带隐藏附魔或刻印。就算两样都不想要，也要把任务做完：幽灵安息之前，干枯玫瑰不会长出一片花瓣。\n\n这层满是螃蟹和史莱姆，有棕色和红色史莱姆（红色的会使你中毒）。史莱姆会把每次超过5点的伤害缩小（10变7，25变10），所以快速轻武器最有效。史莱姆有五分之一概率掉一件2阶武器，每掉一次后概率降到四分之一。\n\n每40局有1局，会有个疯狂小偷从监狱爬上来。它偷走一件未装备、未升级的物品就跑；若它跑到6格外脱离视线，东西就没了。
guide.sewers_f5=没有陷阱、没有游荡怪物，除了黏咕掉落的东西也没有战利品。_黏咕_蹲在房间中央的水池里，半层都是水。它一发现你，整层就会封闭，上楼楼梯被水淹，直到黏咕死去；所以先做好准备。\n\n杀死黏咕，拿_磨损钥匙_打开下楼楼梯；没有别的路。房间可能是菱形、带内墙的方形，或由粗细柱子构成的大厅。看清它的形状，用墙、柱子和门洞断开黏咕的视线。严冬结冰时水池会冻住，黏咕在冰上无法回血。\n\n一道暗门通向老鼠王的房间，地上堆着金币。它不会受伤。穿着护甲、带上国王的皇冠（20层矮人国王掉落）去找它，它就能给你的护甲赋予鼠化术技能。
guide.sewers_overview=1到5层。老鼠、豺狼和螃蟹越往深处遇到，生命值和伤害越高。2到4层某处藏着两个密室。\n\n镇上的商店在1层往上走一层楼梯处（夜间关门）；地牢里的第一家商店在6层。\n\n地表的天气会传进这些隧道，只是弱一些：雨、雪和风。严冬结冰时水会冻上，最底层的黏咕在冰上无法回血。满月之夜入夜后会有怨灵出现，有时两只。
guide.sok_castle=这里的羊大多是拐角羊。这层的蓝色陷阱是所有解谜层里最多的，其中还混着转换陷阱，所以别让拐角羊踩上转换陷阱。\n\n十二个奖励格，首次到访有十二件奖励。前六件是铁钥匙，出现在你的落点上，每把开一扇锁着的门。其余六件顺序随机：一颗嬗变花之种、一颗星陨花之种、两张注魔卷轴、一张草木再生卷轴，以及_眼镜_。戴上眼镜，日志的充能消耗减半。第11、12件奖励落在最西南角，要经第三口传送井过去；那口井在羊被推上南边的开关前一直失效。\n\n东边立着一尊_活化石像_：500点生命值，一把+5的附魔武器，速度为正常的一半。它只有看见你或被击中时才会醒来；噪音吵不醒它。它若醒来，就走开。它什么都不掉，抵抗毒素，也不受吸血武器影响。\n\n首次到访时，宝箱里有400到800金币，或有五分之一概率是一张升级卷轴。有一个宝箱每次到访都装着一瓶液火药剂。
guide.sok_portals=踩上已激活的传送井会把你传送走。把羊推上开关会改变一口井的去向，日志会显示“咔哒！”。两口井一开始是失效的。多处开关可以改接同一口井，以最后触发的为准。南边一排里有一处开关相反，会让一口井失效。推任何羊之前，先把各口井走一遍。\n\n首次到访有十三件奖励。前六件是铁钥匙，就在入口旁，用来开五扇锁着的门。其余七件落在中心东侧一格：两颗星陨花之种、一颗嬗变花之种、两张注魔卷轴、一张草木再生卷轴，以及别处都找不到的_自动药水护符_。戴上它后，若一次受击让你生命值降到十分之一以下，而你身上带着治疗药剂，它会让你喝下一瓶。\n\n两尊活化石像：一尊在中心附近，一尊在最东南角。传送井可能把你送到石像旁边；它若醒来，就改走另一口井。首次到访时，宝箱里有300到500金币，或有五分之一概率是一张升级卷轴。
guide.sok_practice=羊有四种。你走向_普通羊_时，它会沿直线远离你一格，绝不走斜线。_拐角羊_也会沿斜线移动。_开关羊_推不动；走向它会与你交换位置。_黑羊_被推动后会跳到5格内的蓝色陷阱上并触发它；范围内没有陷阱时则消失。\n\n把羊推上奖励格（四个蓝色铆钉），奖励就会出现：这一层先是开锁门的铁钥匙，然后是一条_毛巾_（可用10次，能解除你或宠物身上的流血与腐蚀黏液）。三个奖励格，两件奖励。\n\n你的路线会绕开蓝色陷阱；踩上去只能是自愿。_转换陷阱_会把普通羊变成拐角羊，把开关羊变成普通羊，把拐角羊变成再也动不了的羊。别让拐角羊踩上去。\n\n传送井在羊被推上它的开关前是失效的。搜墙找隐藏的门。首次到访时，五个宝箱里有300到500金币，或有五分之一概率是一张升级卷轴。
guide.sok_puzzles=这里的羊大多是换位羊，推不动。要转换一只，就站到变羊陷阱上再走进去：你们交换位置，羊落在陷阱上，变成一只直线羊。每个陷阱只能用一次。让对角羊远离它们。\n\n第一次来时共有十五件奖品。六把铁钥匙出现在固定位置，第一把在入口，最后一把在活化石像旁边。第一件宝物出现在入口附近，其余八件堆在东北角的一格上。宝物顺序随机：两张注魔卷轴、两颗嬗变花之种、两颗升级吞噬草之种、一颗星陨花之种、一个_蛋_，还有_口哨_，它能从任何地方把你的宠物召到身边。把十五个格子全部填满，才能确保拿到口哨。\n\n西南角的开关会让一口井落在奖品堆旁边。两个开关控制着同一口死井；后按下的那个生效。有一个开关没接任何东西，按了不会响。西侧的宝箱每次来访都装着一瓶液火药剂。
guide.sok_vault=这里没有羊、陷阱、锁，也没有怪物。难的是怎么进来：你在灵视状态下烧掉的每个书架，或被一次刻意的搜索翻空的每个书架，都有五十分之一的几率给出藏宝室书页，而每局只有一张。\n\n一座巨大的洞窟，长满高草和灌木，把宝箱遮了起来。第一次来时大约有130个宝箱，每个装着300到500金币，少数（五十分之一）装着升级卷轴，而最北边的那个宝箱里必定有一枚_财富之戒_。之后的来访每个宝箱只给1到10金币，所以带上空背包，一趟清空。魔法地图能帮上忙。\n\n龙穴书页也以同样的方式来自书架；见小镇一章的“龙穴”。
guide.sokoban_overview=_欧提鲁克日志_会把你带进他折叠出的房间。第6层的商店有卖；如果你始终没捡到，DM-300会掉一本，再不然就是矮人国王。\n\n每个目的地都需要对应的书页，用“添加书页”加进去。黏咕、天狗、DM-300和矮人国王分别掉落推羊练习、推羊城堡、推羊传送门和推羊难题的书页。藏宝室和龙穴的书页来自书架（见藏宝室）。打碎邪神之球会得到小镇书页。\n\n阅读需要满充能：1,000回合除以你的书页数加一，戴着眼镜时减半。添加书页会重新充满。在编号低于26的楼层和镇上的建筑里，它每回合恢复1点，并且可以在这些楼层阅读，首领层除外。“返回”会把你送回阅读它的地方。有宠物跟着时两样都不行。\n\n谜题楼层每次来访都会重建，所以卡住的羊只要离开就能解开。它们的奖品和丰厚的宝箱只在你第一次来访时存在，你带出去的钥匙也会被收走。_剪毛陷阱_会夺走你当前生命值的一半，若你的生命值只剩最大值的十分之一或更少，则会直接杀死你；把羊推上去，它会变成一块地毯。有三层由活化石像看守。
guide.topic_bestiary=清空一层之后，怪物还会回来：夜间速度翻倍，昏暗楼层再快一半。每一层都有自己的怪物阵容，还有罕见的迷途者：第1层的老鼠首领，第7、8层的刺客。\n\n大约每50只普通怪物中就有1只会生成成更强壮的孪生体：咬一口就让你流血的白化老鼠、滴着腐蚀淤泥的史莱姆、以木桶为甲的寄居蟹，更深的地方还有别的。饰物_巨鼠头骨_会让孪生体更常见。\n\n骷髅死亡时会炸开；别站在它旁边。监狱里的窃贼和守卫是亡灵，所以任何伤害亡灵的手段对它们都有效，而亡灵在夜间伤害高四分之一。\n\n满月之夜，亡者会走动：天黑后下水道里有怨灵，监狱里从黄昏起有怨灵和幽魂法师，矿洞里有红色幽灵，矮人都市和恶魔大厅里有蓝色幽灵，小镇矿场和封闭楼层里则有幽灵鼠。大约每100只怨灵里有1只是_咒缚灵_。在它身旁读一张祛邪卷轴，它就会留给你一件附魔武器或刻印护甲。\n\n食人鱼可能出现在任何一片8格中有5格临水的水池里。
guide.topic_endings=拿起_Yendor护身符_并不会结束这一局。\n\n在第25层杀死Yog-Dzewa，在第26层拿起护身符，然后在它的诅咒下爬出去（见“护身符”）。带着它离开第1层，诅咒就会解除；从此以后，护身符会打开地表各处的封闭古墓。\n\n另一个目标从镇上开始。广场的楼梯通往矿场（56到64层），你在那里用诺恩石锻出一件_遗物武器_。在65层，一尊石魔像看守着_真知之球_，那是通往99层Zot的唯一道路。杀死Zot，欧提鲁克便获得自由。\n\n古代钥匙和三本书打开封闭楼层（27到33层）：见“封闭楼层”。它们的奖品和三相之力打开首领巢穴（35到40层）。来自第35层的邪神之球会碎成一页日志书页，把你送回镇上的家。
guide.topic_heroes=一开始只有战士可选。其他人要在多次冒险中解锁：读完一张_升级卷轴_解锁法师，打出10次突袭解锁盗贼，用投掷武器命中10次解锁女猎手，拿起一件你力量足够的2阶或更好近战武器时解锁决斗家，解除一次诅咒时解锁牧师。\n\n战士的_破损纹章_在他生命值降到一半时提供护盾，并能带着一项升级和一个刻印在护甲之间转移。法师的魔杖可以容纳一根法杖。盗贼的_暗影斗篷_能让他隐形。女猎手用手套和一张_灵能弓_作战，箭矢永不耗尽，并随她的等级成长，她走过的高草也不会倒下。决斗家的细剑可以突刺。牧师从神圣法典中施法。每个职业开局就认得一种药剂和一张卷轴。\n\n等级没有上限；30级之后每一级都需要更多经验，直到某个极限。每一级给3点，由天赋和技能共用，另外再加2点法力。第10层的天狗会掉落一张面具，用来选择你的子职业；第20层的矮人国王会掉落一顶皇冠，赋予你的护甲一项技能。在使用之前把皇冠拿给第5层的鼠王看，他会改为提供自己的能力。\n\n法力会自行回复：站着不动时每回合回复法力池的百分之一，移动时减半，饱腹时再快一半，饥饿时完全不回复。巫术之戒会同时提高法力池和回复速度。\n\n蹲伏可以半速移动换来4点额外潜行，并让你穿过高草而不踩倒它；起身需要2回合。醒着一天半后你会变得困倦，视野变差；三天后你会在下一次夜幕降临时倒下。休息，或在旅店的床上睡一觉，就能消除它。
guide.topic_loot=每个五层的区域都有2瓶_力量药剂_、3张_升级卷轴_、1支奥术刻笔和1条弹带；前3层没给你的，都落在第4层。每个非首领层都有一份食物。每个区域的第3层或第4层有一间实验室，里面有5颗能量晶体。1到3层里有一颗感知符石和一块魔能触媒；6到14层里有一颗附魔符石。附魔和刻印只对已鉴定的装备有效。1阶武器和布甲从不会随机掉落。\n\n有些宝箱是宝箱怪；金色的咬得最狠。墓穴、水池和献祭室给出再深一个区域的装备。\n\n6、11和16层的商店总会出售一个重生十字架、一块强化符石、本区域的护甲、一把未被诅咒的近战武器和一件投掷武器、一瓶治疗药剂、鉴定卷轴、祛邪卷轴和魔法地图卷轴，以及一件稀有物品：通常是刻笔，有时是法杖、戒指或神器。地牢、小镇和各个聚落的每家商店还都备着一叠5只空瓶：在你站着或身旁的任何水边，或在炼金釜旁装满一只，就得到一瓶水。倒在自己身旁或身上（瓶子会留给你），或投掷出去，水能灭火、淋湿站在那里的人，并在裸露的地面上留下一滩水。\n\n黏咕会掉落一把能夹在手臂上、靠露水运转的电锯，还有一半几率掉落一台_毁灭先生_。把它投出去就能架成一座炮塔；它损坏之后，可以在蜕变之泉里充能，或者用一朵伞菌找镇上的发明家充能。每个首领掉落1到2块杰作核心。\n\n魔法井的水遵循它被发现时的月相：满月会治愈你并祝福一个重生十字架，新月会鉴定你的物品并揭示本层，四分之一月会把投入其中的东西嬗变。嬗变一瓶力量药剂会得到一瓶_根骨药剂_，这是它唯一的来源。祭坛房间按星期给出奖励：石曜日给护甲，锻曜日给武器，潮曜日给药剂，风暴曜日给法杖，影曜日给戒指，收获曜日给种子，光曜日给神器。\n\n把一件可升级的物品、一张卷轴或一瓶药剂丢在升级吞噬草上，它会吃掉：带升级的物品可能以升级粘咕的形式回来（等级越高越可能），卷轴或药剂有十分之一的几率回来，其余变成种子。别的东西它不碰。搜索会翻空你身边的书架；被搜过的书架，或你在灵视时烧掉的书架，偶尔会藏着藏宝室或龙穴的日志书页。
guide.topic_meta=这本指南出自一位死去的探窟者之手，书页散落在世界各地。一层的书页位于它下面一层的楼层里，所以你永远不会提前看到。捡起一页，它就会留在指南里，供之后的每一局阅读。首领的书页会在你第一次面对该首领时自行写出；地表、群山或深窟中的某处，则在你第一次到达时写出它的书页。未读的书页会发光，搜索能按页中的任何词找到它。“第一步”一章讲授基础，每一页都在它的课程第一次出现时写出。在你第一次下到地牢之前，什么都不会自行书写。\n\n每一局都从地表的镇上开始；北门通往第1层。每个区域是五层，第五层有首领（5、10、15、20、25），而_Yendor护身符_在第26层。商店位于第6、11和16层，第20层那家则由小恶魔在金库差事顺利时开设。\n\n首领掉落_欧提鲁克日志_的书页；见那一章。\n\n从第2层起，一半的楼层带有一种氛围，在你抵达时命名：水淹、丛生、昏暗、宽阔、布满陷阱、隐秘或深渊。昏暗楼层会把你的视野缩到八分之五，怪物回来的速度也快一半。宽阔楼层的房间多一半，怪物多三分之一，物品多两件，还多一份食物。\n\n一层在顶部附近有2到3个隐藏陷阱，到第20层最多7个；布满陷阱的楼层会多得多，多出来的那些是可见的。房间之间的门越深越常隐藏；到第20层几乎所有门都是隐藏的。在死路和地图的缺口处搜一搜。每个区域有2到3间密室。一把铁钥匙只能开它自己那一层的门。\n\n掉进深渊至少会损失你当前生命值的一半，并让你流血。
guide.topic_plants=植物随季节变化。野生植物在春季蔓延最快，冬季最慢，而冬季里喜暖的（烈焰花、阳春草）会最先枯死。你播下的植物永远不会被剔除。被踩倒的高草除了冬季，每个季节都会重新长出来。\n\n踩上野生植物时，大约有十分之三的几率它会被扯脱，反过来攻击你，而不是发动效果：在墙边和高草旁几率更低，在水边更高。无味果树丛、腐莓和你播下的一切都不会如此。杀死这样一株植物通常会掉落它的种子。\n\n种子可以种下、吃掉（效果作用在你身上），或涂抹在近战武器上：接下来的5次命中，外加每级升级1次，都会带上它的效果。同一种的三颗种子能熬出那种植物的药剂；除了无味果树丛的种子，每种种子都能熬出点什么。混合种子会熬出随机的东西。三颗腐莓种子能熬出一瓶力量药剂。\n\n烈焰花会温暖周围的地面，冰冠花则让它变冷。_黑洞花_会把附近的水冻结成一座桥，火系植物能把它化开。踩上去会夺走你当前生命值的一半，把你抛到本层的别处，并使你冻寒（守望者会留在原地，改为获得时空之力）。踩上去的怪物会损失一半生命值，并摔死。\n\n割高草可能掉落露珠、种子和浆果。一颗彩色露珠会一次给你的水袋装满好几滴。火会使植物枯萎，冰霜不会。枯萎的植物可能留下它的种子，春季最常见。\n\n踩上时钟柏会冻结你周围的时间；吃掉它的种子会让你陷入4回合的停滞。踩上_催眠麻_的怪物会倒戈到你这边。野地（27层）长满了阳春草、地缚根和星陨花。
guide.topic_quests=找你有事的人不会受伤，所以你要么帮他们，要么别理他们。在多人游戏里，每位英雄各自独立完成差事。\n\n_悲伤幽灵_会出现在第2、3或4层（最迟第4层），而她的楼层里总会刷出一个豺狼弓箭手。她会派你去对付一只腐臭老鼠（2层）、一个豺狼猎手（3层）或一只巨钳螃蟹（4层）。杀掉它，然后选择一件武器或一件护甲；你拒绝的那件就没了。\n\n_老杖匠_在第7、8或9层等着，用法杖付账。如果你自首次到达第6层以来没有敌人死亡，他会额外给一根精金法杖，这只有在他的万人冢差事中才允许；法师无论如何都能拿到。镇上的铁匠用它来强化法杖。第12、13或14层的_铁匠_会派你去他的矿场开采暗金矿。第17、18或19层的_野心勃勃的小恶魔_会派你进一座矮人金库；干得好，他会在第20层开一家商店。_鼠王_睡在第5层的一间密室里。\n\n_伞菌_长在第2层、第11层和要塞（32层）。把它们拿去和发明家交换。第2层的发明家（镇上还站着一个）会改造你的水袋：一个能从潮湿空气中汲取露水的冷凝器，或一个吸嘴，每一滴回复你二十分之一的生命值和法力。镇上的另一个发明家升级或充能毁灭先生。要塞的发明家会把水袋容量增为三倍，并补上你缺的那个改造。\n\n_蛋_会因搁在地上时遭遇的事情而定型：5次冰冻孵出一条蓝龙，5次中毒孵出一条紫龙，5次闪电劈中孵出一条绿龙，30次燃烧孵出一条红龙（只烧一次则孵出公鸡），10次召唤孵出精灵。带在身上则按回合计：2,000回合孵出蜘蛛，10,000回合孵出蝎子。在这些之前把它敲开，你只会得到蛋黄。\n\n你一次只能养一只宠物。它靠击杀升到20级，并缓慢回复。你上楼梯时，身旁的宠物会跟来；而当它跟着你时，钥匙、书、欧提鲁克日志和真知之球都不起作用。打它三次，它就会永远离开。最后一个谜题楼层里的_口哨_能把它从任何地方召到你身边。
guide.topic_weather=历法跟现实一致：季节、月相和星期几都按现实来。天气会顺着楼梯井渗进第1到15层，越往下越弱；从第16层起不再有雨雪落下。更深的区域各自定下温度：矮人都市温暖，恶魔大厅炎热，冰封大厅则在冰点以下。\n\n在地表，天气随地形而变：锋面的冷锋一侧下冰雹和雨夹雪，积雪之上起暴风雪，沙漠里刮沙尘暴。在开阔天空下的雷暴里，每3到8回合就有一道闪电落在你10格之内，很少正中你。树木会引雷：只要你够得到的地方立着树，就有一半的闪电打在树上（绝不会是你身旁那棵），树会被烧成焦炭。被击中者会失去五分之一到三分之一的生命值，并被击晕1回合；电击会跳到它身旁的人身上，附近的草也会起火。室内不会落雷。在第1到15层，雷云会飘进来，每一朵至少会劈一次：别站在它下面。\n\n你的身体有温度。在夜里、刮风下雪时，或你浑身湿透时，体温一旦降到-5度以下，你就会_失温_：移动变慢、闪避变差、每20回合受到一次伤害，有时还会冻得动弹不得。取暖、着火，或站在壁挂火把旁都能解除。超过35度就会_中暑_：饥饿增长更快，并且持续受到伤害，越热越重；超过45度可能昏倒。走进小镇的建筑或村里的房屋都能解除这两者，在旅店过一夜也一样。布甲最保暖，皮甲稍差一些；链甲会很快随气温变化，板甲则变化缓慢。_狱火_刻印能增添暖意。护甲上的保暖词条和手中武器上的暖握只能对抗寒冷；降温护甲能让你在炎热中更凉快，而挡风则能削弱寒风的刺骨。\n\n大雨会把你淋透，朝你泼来或扔来的一瓶水也一样：你读的卷轴每20次会失败3次，你身上的火会熄灭，下一次本会烧到你的火只会把你烘干，寒冷对你的伤害多出五成，闪电则多出五分之一。湿透的怪物也一样。涉水会打湿你的靴子：靴子干透之前，潜行降低2点，而且更冷。静步护甲能让湿靴子不发出声响，防雨护甲能挡几回合的雨，也让你更少打湿靴子。强风会打乱远程的准头。夜晚、暴风雪和浓雾会缩短你的视野。\n\n夜里怪物刷新快一倍（新月时更快，满月时更慢），你的潜行+2（新月时+1），亡灵的伤害则高四分之一。亡灵和恶魔在黑暗中加速，在烈日下减速，月光则能灼伤它们。血月时亡灵伤害翻倍，敌人瞄你更准五分之一，怪物刷新快四倍；但你打恶魔的伤害高四分之一，它们的掉落也更频繁。日食给你+3潜行和更好的闪避，但准头变差，亡灵的伤害增加五成；日食期间生成的宝库不会上锁，金币还多出100到200。晴朗冬夜的_极光_能把掉落几率提高约四分之三，也让你的准头略升；雨后的彩虹则让掉落提高五分之一。极光、彩虹和日食的祝福只及于地表和第1到15层。\n\n夏天所有攻击都强约15%，无论是你的还是它们的；冬天则变弱。秋天战利品和金币最多，夏天最少。锻曜日和风暴曜日增强攻击，潮曜日加快治疗，影曜日增加潜行，收获曜日增加战利品。\n\n_季节更替_法术（用一张魔法地图卷轴和一瓶大地护甲合剂调制）会把这一层每一种植物变成它的种子。紫外药剂或食日花放出的原初阳光会致盲其中的一切，敌人每在里面站一回合，就有一半的几率死去。
guide.town_dolyahaven=小镇广场四周有六栋建筑开门营业。大多数镇民白天干活，晚上睡在旅店；商店和商贩入夜便关门。\n\n广场上的传送门始终亮着，也不收费。它能把你送到你点过的任意一道亮着的商店门旁，而每一道亮着的门也能把你送回它旁边，每趟消耗150点饥饿。\n\n_商店_有两名店主：柜台一侧卖卷轴，另一侧卖杂货。存货每五天轮换一次，你买走多少就补多少；升级卷轴、植物肥料和枪械弹药则常年有货。他们几乎什么都收；矿洞里挖出的石矿每块能卖1,000金币。\n\n_教堂_：主教每天为你祝福一次，持续100回合，代价是一笔什一税；基座则能消耗炼金能量来强化、重掷或添加附魔与刻印。_占卜师_每周收金币为你鉴定三件物品。_图书馆_出售矿工日记书页，每页大致对应一层，而且一次比一次贵。_电影院_出售一种门票，能带来100回合的好运，满月下时长翻倍。\n\n_旅店_：在床上睡到天亮，能解除寒冷、炎热和湿靴子，并恢复三分之一的生命值。仆人的热饭菜能填饱你，并让你暖和30回合。吟游诗人每天免费演奏一次，能缓解你的疲惫。雇佣兵则按你已杀死的首领数，每个首领卖给你3点技能点。\n\n街上：卫兵每天悬赏一只怪物，它来自你最深楼层下方不远处。一位衣着体面的本地人每天以两倍商店价收购一件已升级的装备。卫兵或村民，你先跟谁说话，谁就在每局给你一个_返回信标_；它只在镇上往下、从矿洞开始的地方才管用。两名工匠收购伞菌：一人翻新你的水袋，另一人升级或给你的毁灭先生充能。镇上的铁匠能用杰作核心为你打造精品装备，也能用矿石或星辰碎片浇铸核心，还能花50块暗金矿用精金强化一件物品。镇子周围立着九个宝箱；每个里面装的可能是蛋、种子、食物、一个毁灭先生、一颗炸弹或几枚金币。
guide.town_dragoncave=只有欧提鲁克日志里的龙穴书页能把你带到这里（怎么找到它，见“宝库”）。你会出现在西侧。这里没有楼梯，也没有怪物；读日志就能离开。\n\n中间填满了一片_蓝色陷阱_，那是通往东侧的唯一道路。每个陷阱在你踩上去时夺走你当前生命值的一半，随后失效；当你的生命值只剩最大值的十分之一或更少时，它会直接杀死你。浮空没有用。踩一个陷阱，休息回满，再踩下一个；你清出来的那条路在返回时依然安全。\n\n第一次来时，每具骷髅带着400到800金币，有时则是一张升级卷轴；之后的来访只给1到100。_暗影龙蛋_在东南方，位于东侧通道旁一扇密门之后，只在第一次来访时出现。\n\n带着蛋走10回合，然后在你身旁有一格空地、且没有其他宠物时把它敲开。暗影龙的吐息威力是它咬击的三倍。
guide.town_overview=每一局都从这里开始。小镇的北门往下通往第1层。广场上的楼梯通向库帕矿洞：九层（第56到64层），以及第65层一道封闭的楼层，通往Zot监狱的_真知之球_就在那里。矿洞里你只能看到2格远，而且没有陷阱。\n\n除_遗物武器_的攻击外，库帕只会承受1点到一半的伤害，古林只会承受1点到四分之一的伤害。用古林掉落的_诺恩石_在广场以东神殿的祭坛上锻造一件遗物武器。矿洞整局都开着，即使你救出了欧提鲁克也一样。\n\n满月的夜里，幽灵鼠会在矿洞中游荡，天黑之后更多。\n\n龙穴的日志书页会打开第67层，那里有一只暗影龙蛋在等着。
guide.zot_level=你出现在一间有围墙的小屋里的基座上。这里没有楼梯，而且这一层在Zot死前一直锁着，所以在那之前真知之球没法把你带回去。\n\n小屋的北墙是一排五个看得见的召唤陷阱，每个会召出1到3只邪眼。从南门离开。\n\n你一走出那间屋子，Zot就会出现在你看不见的地方，日志里冒出一句“...”。这里不会刷出别的东西，这一层也没有战利品。\n\nZot死后，他造出的一切都随他而死，欧提鲁克会出现在他倒下的地方。跟他说话：如果你没有_返回信标_，他会给你一个。然后用真知之球回去。
guide.zot_overview=Zot的监狱在第99层，只能通过_真知之球_抵达。它位于第65层，就在小镇广场下矿洞的最底部，由石魔像欧提鲁克看守。\n\n对付Zot你需要一件_遗物武器_：在小镇的祭坛上扔下三块_诺恩石_锻造一件。矿洞里的古林会掉落诺恩石，每局最多五块。\n\n真知之球只能往返一次：先去第99层，再回到你使用它的地方。它拒绝首领层、封闭的楼层，也会拒绝在有宠物跟随你时使用。\n\n杀死Zot并不会结束这一局。之后跟欧提鲁克谈谈，他会搬到小镇去；矿洞仍然开着。

