###Descent Guide demos: the sewers, the prison, the caves (journal/guidedemos/EarlyDemos). English only.
###A key is guidedemo.<page>.<word>; a caption is one short line (48 characters at most).

guidedemo.sewers_f1.follow=引它跟着你穿过门
guidedemo.sewers_f1.strike=趁它过门时出手：它无法闪避

guidedemo.sewers_f3.split=每次武器命中都会把它劈成两只
guidedemo.sewers_f3.wand=法杖、火焰与毒气不会让它分裂

guidedemo.boss_goo.swells=它鼓胀大吼：要猛砸了
guidedemo.boss_goo.reach=最远2格外，沿无遮挡直线
guidedemo.boss_goo.slam=咆哮后两回合：三倍伤害
guidedemo.boss_goo.hide=再次蓄力：躲到柱子后面
guidedemo.boss_goo.lost=它必须移动，蓄力便中断

guidedemo.prison_f1.burst=它的骨头会炸伤周围一切
guidedemo.prison_f1.armor=护甲有用；残血时别在身边杀它

guidedemo.prison_f2.chain=它有一次会用锁链把你拉到身边
guidedemo.prison_f2.cripple=随后你残废4回合

guidedemo.prison_f3.raise=它在紧挨你的位置召唤骷髅
guidedemo.prison_f3.heal=它在远处治疗骷髅，再使其激怒
guidedemo.prison_f3.kill=杀死死灵法师：骷髅随之崩散

guidedemo.boss_tengu.jump=每掉25点生命，他就跳走
guidedemo.boss_tengu.sow=他布下陷阱，每个只闪一次
guidedemo.boss_tengu.hidden=记住位置：搜索找不到它们
guidedemo.boss_tengu.range=从远处攻击，站在已知安全的格子
guidedemo.boss_tengu.chase=追他就会踩上陷阱
guidedemo.boss_tengu.bomb=炸弹：3回合后炸开周围2格
guidedemo.boss_tengu.clear=在爆炸范围外就毫发无伤

guidedemo.boss_spiderqueen.bite=她的撕咬造成12~20，半数带毒
guidedemo.boss_spiderqueen.egg=约每20回合她在身边产一枚卵
guidedemo.boss_spiderqueen.break=卵只有2点生命：孵化前打碎
guidedemo.boss_spiderqueen.flee=生命低于一半她退后；蜘蛛出战

guidedemo.caves_f1.rage=生命归零时它狂暴：得护盾，攻击翻倍
guidedemo.caves_f1.drain=护盾每回合耗4点：别留在其攻击范围
guidedemo.caves_f1.gone=六回合后护盾消失，它也一并消亡

guidedemo.caves_f2.web=它把蛛网铺向你前进的格子
guidedemo.caves_f2.turn=改变方向：蛛网就落空
guidedemo.caves_f2.bite=它的咬可能带毒，随后退开织网

guidedemo.caves_f3.beam=它的光束击中直线上一切
guidedemo.caves_f3.wait=之后要过3回合才会再开火

guidedemo.caves_f5.pylon=它电击相对的两格，并顺时针旋转
guidedemo.caves_f5.step=站到它未对准的位置
guidedemo.caves_f5.cut=30点伤害只打出19：改用轻快连击

guidedemo.boss_dm300.thrown=站在它身旁会被甩出2格
guidedemo.boss_dm300.area=标记7×7范围；只有一格安全
guidedemo.boss_dm300.rocks=落石：6~12伤害，眩晕3回合
guidedemo.boss_dm300.charge=生命200与100时它会超载
guidedemo.boss_dm300.immune=超载时无法受伤；远处能量塔亮起
guidedemo.boss_dm300.run=摧毁亮起的能量塔即可结束超载
guidedemo.boss_dm300.fast=超载时它移动速度翻倍
guidedemo.boss_dm300.lost=能量塔倒下，超载也结束
