challenges.no_food=缩餐节食
challenges.no_food_desc=食物本就稀缺，但你还需要注意节食！\n\n・使用各类食物与丰饶之角的饱腹效果为原本的三分之一。\n・其他恢复饥饿的机制不受影响。
challenges.bad_point=弱点洞悉
challenges.bad_point_desc=怪物们总是有机可乘，可能会在你没发现的各种地方。\n\n・你在每区受到被防御减免过的物理伤害最低为1/3/6/10/15

challenges.damage_no=伤痛难愈
challenges.damage_no_desc=你尝试了大部分办法，但是伤口迟迟不能愈合。\n\n・英雄受到来自外界的治疗值最多为1\n\n治疗药水及其制品（阳春草）的效果被削弱为原来的1/5

challenges.no_herbalism=荒芜之地
challenges.no_herbalism_desc=草本身也不是很能在地牢里长的多好……\n\n-在每区，有_50%/60%/70%/80%/90%_的草变为枯草，额外生成的草也遵循此规律。\n\n_露珠仍然会正常掉落，种子也能够生根发芽。_
challenges.swarm_intelligence=集群智能
challenges.swarm_intelligence_desc=要小心了，地牢里的怪物们也在学习进步！\n\n- 当你被敌人发现时，附近的其他敌人也会被吸引到那里。
challenges.darkness=没入黑暗
challenges.darkness_desc=地牢毕竟是在地下嘛！\n\n- 视野范围显著缩小\n- 每层都会出现一根火把\n- 照明效果持续时间缩短
challenges.no_scrolls=禁忌咒文
challenges.no_scrolls_desc=一种卷轴会变得更稀有。不幸的是，总是最有用的那一种。\n\n- 移除地牢中半数的升级卷轴
challenges.champion_enemies=精英强敌
challenges.champion_enemies_desc=道高一尺魔高一丈，变强可不是你的特权！\n\n・普通敌人刷出时有 1/10 的机率拥有特殊的精英属性\n・精英敌人刷出时会立即醒来\n・有精英敌人出现时英雄会感知到\n・精英敌人免疫腐化效果\n\n精英敌人有六种：\n_烈焰（橙色）：_ 近战伤害 +25% 且带有点燃效果，免疫火焰，死亡时引燃周围\n_索敌（紫色）：_ 近战伤害 +25%，近战范围 +3\n_敌法（绿色）：_ 受到伤害 -50%，拥有魔法免疫\n_巨型（蓝色）：_ 受到伤害 -80%，近战范围 +1，无法进入门与过道\n_祝福（黄色）：_ 精准与躲避 +300%\n_成长（红色）：_ 精准、躲避、攻击伤害与有效生命值 +20%，且每过 4 回合会再增长 1%
challenges.stronger_bosses=绝命头目
challenges.stronger_bosses_desc=这项挑战让挑战 Boss 变得更有挑战性了！\n\n_粘咕：_生命值 +20%\n_-_ 水中恢复量增长，每回合恢复 3 点生命\n_-_ 爆发攻击蓄力时间由 2 回合缩短至 1 回合\n_天狗：_生命 +25%\n_-_ 第一阶段：陷阱更加致命\n_-_ 第二阶段：技能频率更高\n_DM-300：_生命 +33%\n_-_ 能量塔更坚固，并且需要击毁 3 座\n_-_ 技能频率更高，威力也更强大\n_-_ 超载时移动速度更高\n_-_ 地表导线数量为原先的两倍\n_矮人国王:_生命 +50%\n_-_ 整场战斗内召唤的随从都更强大\n_-_ 第一阶段：技能与召唤频率都更高\n_-_ 第二阶段：每轮额外召唤两个随从\n_-_ 第三阶段：生命值 +100%，召唤频率更高\n_Yog-Dzewa:_\n_-_ 同时召唤两个古神之拳！\n_-_ 激光攻击伤害 +60%\n_-_ 召唤更强大的随从
challenges.snake_bite=蛇咬
challenges.snake_bite_desc=所有怪物的贴图都会被替换为下水道巨蛇。3、4层都有可能生成二区怪物，且生成概率提升。6、7层都有可能生成1区怪物。\n\n怪物的描述和名字也都是蛇，所以查看它们的细节并没有用。\n\n所有的东西都是蛇咬。所有的武器、药水和卷轴的名字、贴图和描述，所有的动作名称也会换成蛇咬。不同的物品的蛇贴图颜色会略有不同，但是即使你之前鉴定过物品，其右上角也不再会显示原有表示物品种类的图标了。\n\n因为蛇咬的保留特性，你每次回到上一层的时候，所有的蛇都会出现在上一层的出口处。\n\n警告：该挑战未经测试，可能对玩家很不公平！
challenges.test_mode=测试时间
challenges.test_mode_desc=追加选项\n\n测试时间！\n\n你可以自由生成物品，自由移动，生成敌人。\n\n在测试模式下，右上角的版本号会发生变化以指示测试模式。\n\n注意，测试模式不计入排行榜。
challenges.real_intelligence=智能怪物
challenges.real_intelligence_desc=喷不了，和集群智能的怪物相比，这些怪物似乎学会了真正的技能……\n\n_-_怪物们获得了与玩家一样的5个装备栏！\n\n_-_所有的怪物手持武器和护甲、穿戴戒指的时候，效果均与玩家相同！\n\n_-_部分怪物会和武器有特殊联动，可点击怪物详情查看。\n\n_-_部分怪物在手持特定武器的时候，AI会有所不同，可点击怪物详情查看。\n\n_-_怪物甚至会随机携带药水或者使用卷轴！\n\n_-_部分怪物手持武器或者穿戴护甲的时候，行为会和原来稍有不同。\n\n_-_玩家获得2个不占据格子的神器，可以短暂剥夺敌人从装备中获得的力量。\n\n_-_怪物整体的数值加强。
challenges.alchemy_apprentice=炼金学徒
challenges.alchemy_apprentice_desc=你无法从复杂的炼金反应中获得什么知识了，炼金术对你而言也变得更难了。\n\n- 所有炼金配方的炼金能量消耗+2\n- 将药水与卷轴转化为炼金能量将无法再鉴定它们\n- 将卷轴拆解为符石时，将其中的一颗符石替换为随机符石，拆解无法再鉴定它们
challenges.alchemy_apprentice_stone_preview=_炼金学徒：_拆解这张卷轴会得到 %1$d 颗%2$s，另有 1 颗会被替换为随机种类的符石。
challenges.alchemy_apprentice_guide_stones=_炼金学徒：_拆解不再鉴定卷轴，得到的符石中有一颗会被替换为随机种类的符石。
challenges.alchemy_apprentice_guide_energy=_炼金学徒：_将药水与卷轴转化为炼金能量不再鉴定它们。

