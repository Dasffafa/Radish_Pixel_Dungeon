challenges.hongbao_desc=每层开局会生成 5 个红包，其中 2 个在玩家附近，其余 3 个在随机位置。\n\n_-_ 红包可能给出道具、金币或永久属性变化。\n\n_-_ 怪物会抢红包并立即使用所得装备、卷轴、药水和法杖；有害药水会砸向你。\n\n_-_ 无法移动的怪物不受红包影响。
