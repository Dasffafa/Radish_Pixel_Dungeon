###the bug net and the fishing rod (items/catching)

items.catching.catching.guest=在共享游戏中，只有房主才能捕捉小动物和鱼。

items.catching.bugnet.name=捕虫网
items.catching.bugnet.ac_swing=挥网
items.catching.bugnet.prompt=选择挥网的位置
items.catching.bugnet.desc=一张细密的网，绷在弯藤箍成的圈上，接着一根足以探出三步远的网柄。朝你看得见的蝴蝶、萤火虫或任何小虫挥去，它便落进罐子里：可作钓鱼竿的鱼饵，也可当作漂亮的小东西再放走。\n\n小虫会对网生出戒心。在同一片地方，一天里头三只容易捉到；之后每只都更难捕，捉到六只以后，其余的对你会避而远之，直到第二天。
items.catching.bugnet.reach=网只够得到%d步远，而且只能罩住你看得见的东西。
items.catching.bugnet.nothing=那里没有可捉的东西。
items.catching.bugnet.caught=落网：%s。
items.catching.bugnet.missed=它从网边溜走了：%s。
items.catching.bugnet.flitted=网还没落下，它就已经不在那儿了：%s。
items.catching.bugnet.wary=它躲开了你的网：%s。这一带的小虫已经起了戒心。换个地方试试，或者明天再来。

items.catching.fishingrod.name=钓鱼竿
items.catching.fishingrod.ac_cast=抛竿
items.catching.fishingrod.ac_reel=收线
items.catching.fishingrod.ac_bait=挂饵
items.catching.fishingrod.prompt=选择抛竿的位置
items.catching.fishingrod.desc=一根有弹性的竿子，配着钓线、鱼钩和一枚红白相间的浮漂。站在岸上、桥上或船上，把线抛进你看得见的开阔水面，最远四步；也可以在你紧挨着的冰面上凿个洞，把线垂下去。每次抛竿都会在钩上挂一份饵：蚯蚓，或是罐里的小动物。\n\n等待时你会歇着，看着浮漂。鱼一咬钩你便会惊觉：要在三回合内收线，不然它就连饵一起逃掉。走开的话，线自会收回。
items.catching.fishingrod.no_fish_here=这片水里没有东西会咬钩。去地表世界的河流、湖泊与海洋里钓吧，还有它洞窟与群山中的水潭。
items.catching.fishingrod.not_water=你只能把线抛进开阔水面或抛到冰面上。
items.catching.fishingrod.ice_reach=你只能在紧挨着自己的冰面上凿洞。
items.catching.fishingrod.reach=钓线只够得到%d步远，而且只能抛进你看得见的水面。
items.catching.fishingrod.occupied=那里的水里有东西。
items.catching.fishingrod.no_bait=你没有鱼饵。铲子翻土时会翻出蚯蚓，村里的渔夫也卖蚯蚓，捕虫网还能捉小动物来挂钩。
items.catching.fishingrod.cast=你把钓线抛进%s，钩上挂着%s。
items.catching.fishingrod.cast_ice=你在冰面上凿了个洞，把挂着%s的钓线垂了下去。
items.catching.fishingrod.water_river=河流
items.catching.fishingrod.water_lake=湖泊
items.catching.fishingrod.water_sea=海洋
items.catching.fishingrod.water_swamp=沼泽
items.catching.fishingrod.water_ice=冰面
items.catching.fishingrod.water_cave=洞穴水潭
items.catching.fishingrod.water_tarn=山间小湖
items.catching.fishingrod.bait_prompt=选择要用的鱼饵
items.catching.fishingrod.bait_chosen=只要还有，你就会用%s作饵。
items.catching.fishingrod.bait_none=你身上没有鱼饵。
items.catching.fishingrod.bait_next=下一份饵：%s。

items.catching.fishingline.pulled=你把钓线收了回来。
items.catching.fishingline.escaped=鱼带着你的饵逃掉了。
items.catching.fishingline.nothing=没有鱼咬钩，饵也漂走了。
items.catching.fishingline.bite=有东西咬钩了！快收线！
items.catching.fishingline.empty=你收回了一只空钩。
items.catching.fishingline.landed=你捞起了渔获：%s！
items.catching.fishingline.boot=你拽上来一只旧靴子，里面塞满了水草。
items.catching.fishingline.bottle=你拽上来一只瓶子，里面塞着信！
items.catching.fishingline.purse=你拽上来一只湿透的钱袋：%d枚金币撒在你脚边！

items.catching.earthworm.name=蚯蚓
items.catching.earthworm.desc=一条扭动的蚯蚓，最朴素的鱼饵：河流、湖泊和沼泽里的大多数鱼都吃它。铲子翻草皮或裸土时会翻出它们，雨天更多，村里的渔夫也成把地卖。

items.catching.critterjar.name=罐装小动物
items.catching.critterjar.ac_release=放生
items.catching.critterjar.released=你把它放了：%s。
items.catching.critterjar.bait_fly=挂在钩上就是一只带翅的虫：鳟鱼最爱浮上来咬它。
items.catching.critterjar.bait_grub=挂在钩上就是一条蠕动的幼虫：河鲈和鲶鱼很爱吃。
items.catching.critterjar.bait_live=挂在钩上就是活饵，狗鱼的最爱。
items.catching.critterjar.bait_glow=挂在钩上，它的幽光会引来黑暗中的鱼：洞穴水潭里的盲鱼，还有冰面下的北极红点鲑。
items.catching.critterjar.cabbage_white=菜粉蝶
items.catching.critterjar.cabbage_white_desc=一只翅尖带灰色的白蝴蝶，在夏日的草地上捕到的。
items.catching.critterjar.brimstone=钩粉蝶
items.catching.critterjar.brimstone_desc=一只黄得像新硫磺的蝴蝶。
items.catching.critterjar.orange_tip=橙尖粉蝶
items.catching.critterjar.orange_tip_desc=一只翅尖橙黄鲜亮的白蝴蝶。
items.catching.critterjar.common_blue=蓝灰蝶
items.catching.critterjar.common_blue_desc=一只天蓝色的小蝴蝶。
items.catching.critterjar.firefly=萤火虫
items.catching.critterjar.firefly_desc=一只萤火虫在罐中明明灭灭，用短促的绿金色闪光把罐子照亮。
items.catching.critterjar.moth=蛾子
items.catching.critterjar.moth_desc=一只米白色的蛾子，从火把的焰边捉来。
items.catching.critterjar.cinder_moth=烬蛾
items.catching.critterjar.cinder_moth_desc=一只橙色的蛾子，出自殿堂深处，摸上去还带着余温。
items.catching.critterjar.frost_moth=霜蛾
items.catching.critterjar.frost_moth_desc=一只淡蓝色的蛾子，出自冰封的深处，双翅上结着霜。
items.catching.critterjar.fly=苍蝇
items.catching.critterjar.fly_desc=一只肥苍蝇，刚从蛛网里脱身，就又落进了罐子。
items.catching.critterjar.beetle=甲虫
items.catching.critterjar.beetle_desc=一只深色的甲虫，在罐底一圈圈地打转。
items.catching.critterjar.ember_beetle=火炭甲虫
items.catching.critterjar.ember_beetle_desc=一只背甲像炭火般发亮的甲虫。
items.catching.critterjar.roach=蟑螂
items.catching.critterjar.roach_desc=一只蟑螂。鱼并不嫌弃。
items.catching.critterjar.centipede=蜈蚣
items.catching.critterjar.centipede_desc=一条蜈蚣，满身是腿，正找着出去的路。
items.catching.critterjar.silverfish=衣鱼
items.catching.critterjar.silverfish_desc=一只敏捷的银色小虫，出自古旧的石缝之间。
items.catching.critterjar.spider=蜘蛛
items.catching.critterjar.spider_desc=一只从地牢墙上捉来的蜘蛛，正在罐子内壁上一圈圈地结丝。
items.catching.critterjar.spiderling=幼蛛
items.catching.critterjar.spiderling_desc=一只幼蛛，从巢的丝网里捉来。
items.catching.critterjar.snail=蜗牛
items.catching.critterjar.snail_desc=一只蜗牛，紧紧缩在壳里。它压根没想过要逃。
items.catching.critterjar.strider=水黾
items.catching.critterjar.strider_desc=一只水黾，长腿蜷在干燥的罐子里。
items.catching.critterjar.frog=青蛙
items.catching.critterjar.frog_desc=一只小青蛙，时不时叫一声。
items.catching.critterjar.newt=蝾螈
items.catching.critterjar.newt_desc=一只腹面橙红的蝾螈，出自洞穴的冷水。
items.catching.critterjar.lizard=蜥蜴
items.catching.critterjar.lizard_desc=一只敏捷的蜥蜴，先前正在城中通风口冒出的暖烟里晒太阳。

items.catching.caughtfish.name=生鱼
items.catching.caughtfish.raw=生吃也能稍填饱肚子。在炉灶或任何火堆上烤过，或在锅里炖过，则能填饱得多，并少量治疗你。村里的渔夫会为一条新鲜的鱼出好价钱。
items.catching.caughtfish.trout=溪鳟
items.catching.caughtfish.trout_desc=一条斑斑点点的溪鳟，背部橄榄色，体侧泛粉，出自寒冷的流水。
items.catching.caughtfish.perch=河鲈
items.catching.caughtfish.perch_desc=一条带条纹、鳍呈橙色的河鲈，静水水域最常见的鱼。
items.catching.caughtfish.pike=狗鱼
items.catching.caughtfish.pike_desc=一条细长的狗鱼，满嘴利牙，湖泊与沼泽里的猎手。抵得上一顿半。
items.catching.caughtfish.catfish=鲶鱼
items.catching.caughtfish.catfish_desc=一条长着须的鲶鱼，出自泥泞的水底，夜里出来捕食。
items.catching.caughtfish.mackerel=鲭鱼
items.catching.caughtfish.mackerel_desc=一种光滑的海鱼，银亮而迅捷，背部有绿黑相间的条纹。
items.catching.caughtfish.char=北极红点鲑
items.catching.caughtfish.char_desc=一条体色深暗、腹部绯红的红点鲑，是从冰洞里钓上来的，或出自高山上的小湖。
items.catching.caughtfish.cavefish=洞穴鱼
items.catching.caughtfish.cavefish_desc=一条苍白、没有眼睛的鱼，出自世界深处的水潭。它是循着钩上的光找来的。

items.catching.cookedfish.name=熟鱼
items.catching.cookedfish.grilled=烤%s
items.catching.cookedfish.poached=炖%s
items.catching.cookedfish.grilled_desc=在火上烤到鱼皮酥脆。能好好填饱肚子，并少量治疗你。
items.catching.cookedfish.poached_desc=在锅里小火慢炖，肉质细嫩，一碰就散。能好好填饱肚子，并少量治疗你。

items.catching.oldboot.name=旧靴子
items.catching.oldboot.desc=一只湿透的旧靴子，塞满水草，鞋带也没了。某个地方的某个人，至今还在惦记它。它值一枚金币，也值一个故事。

items.catching.messagebottle.name=瓶中信
items.catching.messagebottle.ac_read=阅读
items.catching.messagebottle.desc=一只塞着木塞的瓶子，里面卷着一张纸条，是从水里捞上来的。在地表的天光下读它：纸条上写着某处埋着东西，你的世界地图会标出那个地点。
items.catching.messagebottle.no_surface=纸条上的方位，只有在地表的天光下才说得通。
items.catching.messagebottle.no_match=这附近没有一处与纸条上的草图对得上。换一个更靠近开阔地的地方再读一次。
items.catching.messagebottle.marked=你的世界地图已标出了那个地点。
items.catching.messagebottle.note_title=瓶中的纸条
items.catching.messagebottle.note_0=“若有人捡到此信：风暴夺走小船之前，我把能带走的东西都埋了起来。我再也回不去取它了。”
items.catching.messagebottle.note_1=“给我兄弟：奶奶的积蓄不在地板底下，不管她怎么跟你说的。我把它挪走了。在我做过记号的地方挖。”
items.catching.messagebottle.note_2=“我从强盗营地里拿走的东西已经藏好了，然后我就跑了。若这信到你手上，东西就是你的。他们不会停止追查。”
items.catching.messagebottle.note_3=“一个渔夫最后的渔获：一只小箱子，埋在地下，离任何水面都很远。鱼没能拿走它，税吏也永远别想。”
items.catching.messagebottle.where=下面潦草地画着一幅粗略的草图：在你读信处向%s约%d步远的地方。你的世界地图已标出该处。用铲子去那里挖。
items.catching.messagebottle.north=北
items.catching.messagebottle.northeast=东北
items.catching.messagebottle.east=东
items.catching.messagebottle.southeast=东南
items.catching.messagebottle.south=南
items.catching.messagebottle.southwest=西南
items.catching.messagebottle.west=西
items.catching.messagebottle.northwest=西北

items.catching.bottlecaches.found=你的铲子碰到了木头：一只小箱子，就埋在纸条上说的位置！
items.catching.bottlemarks.mark=瓶中信的记号
items.catching.bottlemarks.mark_surface=瓶中信的记号（地表）

homestead.stations.stationrecipe.raw_fish=生鱼
homestead.stations.stationrecipe.grilled_fish=烤鱼
homestead.stations.stationrecipe.poached_fish=炖鱼

