windows.wndfisher.offer=“有鱼要卖，还是想买点钓鱼的家什？”
windows.wndfisher.sell=卖掉渔获：%d条鱼换%d金币
windows.wndfisher.sell_none=没有鱼可卖
windows.wndfisher.rod=钓鱼竿：%d金币
windows.wndfisher.worms=%d条蚯蚓：%d金币
windows.wndfisher.sold=渔夫为你的渔获付了%d枚金币。
