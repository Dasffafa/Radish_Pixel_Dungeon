actors.hero.dicemage.spells.reapspell.cast=Reap! %s was reaped, granting 3 MP.
actors.hero.dicemage.spells.mendspell.name=Mend
actors.hero.dicemage.spells.mendspell.desc=Emergency L1. Costs 2 MP: set HP to 50, 500 turn cooldown; the value decays by 3 before entering a new area.
actors.hero.dicemage.spells.mendspell.cast=Mend! Restored %d HP. (Next heal value: %d)
actors.hero.dicemage.spells.mendspell.no_heal=Mend! Your HP is already high. (Next heal value: %d)
actors.hero.dicemage.spells.mendspell.exhausted=Mend is exhausted.
actors.hero.dicemage.spells.refreshspell.name=Refresh
actors.hero.dicemage.spells.refreshspell.desc=Emergency L2. Costs 1 MP: set HP to 40, 250 turn cooldown; the value decays by 2 before entering a new area.
actors.hero.dicemage.spells.refreshspell.cast=Refresh! Restored %d HP. (Next heal value: %d)
actors.hero.dicemage.spells.refreshspell.no_heal=Refresh! Your HP is already high. (Next heal value: %d)
actors.hero.dicemage.spells.refreshspell.exhausted=Refresh is exhausted.
actors.hero.dicemage.spells.surgeryspell.name=Surgery
actors.hero.dicemage.spells.surgeryspell.desc=Emergency L3. Costs 3 MP: summon one hero (a recently slain mob becomes an ally) to attack enemies, max 1; 250 turn cooldown after it dies.
actors.hero.dicemage.spells.surgeryspell.cast=Surgery! %s was summoned as an ally.
actors.hero.dicemage.spells.surgeryspell.no_corpse=No recently slain enemy to summon.
