actors.hero.dicemage.spells.blazespell.invalid_target=You must select an enemy.
actors.hero.dicemage.spells.blazespell.cast=Deflagration! Dealt %d damage.
actors.hero.dicemage.spells.cutspell.name=Cut
actors.hero.dicemage.spells.cutspell.desc=Blades L1. Costs 3 MP: all enemies in view take 7-11 physical damage.
actors.hero.dicemage.spells.cutspell.cast=Cut! Hit %d enemies.
actors.hero.dicemage.spells.cutspell.no_enemy=No enemies in view.
actors.hero.dicemage.spells.hackpassive.name=Hack
actors.hero.dicemage.spells.hackpassive.desc=Blades L2 (passive). While paralyzed, automatically attack surrounding enemies each turn.
actors.hero.dicemage.spells.bladerainspell.name=Blade Rain
actors.hero.dicemage.spells.bladerainspell.desc=Blades L3. Costs 4 MP: fires a fan of blades, each dealing 20-30 physical damage; each enemy can be hit up to 3 times, extra projectiles cannot be blocked.
actors.hero.dicemage.spells.bladerainspell.cast=Blade Rain! Landed %d hits.
actors.hero.dicemage.spells.bladerainspell.none=Blade Rain! No hits.
actors.hero.dicemage.spells.executespell.name=Execute
actors.hero.dicemage.spells.executespell.desc=Conjuration L1. Costs 3 MP: kill one enemy in view with 29-31 HP. 15 turn cooldown.
