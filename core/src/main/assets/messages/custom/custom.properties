actors.hero.dicemage.spells.lightbeamspell.name=Light Beam
actors.hero.dicemage.spells.lightbeamspell.desc=Special school. Costs 5 MP: fire a beam of light dealing heavy magical damage (equivalent to a +10 disenchanting staff).
actors.hero.dicemage.spells.lightbeamspell.prompt=Select an enemy
actors.hero.dicemage.spells.lightbeamspell.invalid_target=You must select an enemy.
actors.hero.dicemage.spells.lightbeamspell.cast=Light Beam! Dealt %d magical damage.
actors.hero.dicemage.spells.markspell.name=Mark
actors.hero.dicemage.spells.markspell.desc=Special school. Costs 4 MP: deal 17-31 magical damage and make the target take +7-11 extra damage within 20 turns.
actors.hero.dicemage.spells.markspell.prompt=Select an enemy
actors.hero.dicemage.spells.markspell.invalid_target=You must select an enemy.
actors.hero.dicemage.spells.markspell.cast=Mark! Dealt %d damage and applied a mark.
actors.hero.dicemage.spells.chargespell.name=Charge
actors.hero.dicemage.spells.chargespell.desc=Special school. Costs 4 MP: gain 10-18 shield and +30% damage for 10 turns.
actors.hero.dicemage.spells.chargespell.cast=Charge! Gained %d shield and +30% damage.
actors.hero.dicemage.spells.heatspell.name=Heat
actors.hero.dicemage.spells.heatspell.desc=Special school. Costs 2 MP: remove debuff stacks equal to shield value / 3 turns.
actors.hero.dicemage.spells.heatspell.cast=Heat! Removed %d debuffs.
actors.hero.dicemage.spells.shinespell.name=Shine
actors.hero.dicemage.spells.shinespell.desc=Special school. Costs 4 MP: target any point (even in fog), dealing 30-50 light damage and blinding; gains area vision and blinds monsters within 5.
actors.hero.dicemage.spells.shinespell.prompt=Select shine point
actors.hero.dicemage.spells.shinespell.cast=Shine! Hit and blinded %d enemies.
actors.hero.dicemage.spells.abyssspell.name=Abyss
actors.hero.dicemage.spells.abyssspell.desc=Special school. Costs 40 MP: kill an enemy below half HP (ignores lock-HP), 10 turn cooldown.
actors.hero.dicemage.spells.abyssspell.prompt=Select enemy for the abyss
actors.hero.dicemage.spells.abyssspell.invalid_target=You must select an enemy.
actors.hero.dicemage.spells.abyssspell.not_half=Target is not below half HP.
actors.hero.dicemage.spells.abyssspell.cast=Abyss! %s was consumed.
actors.hero.dicemage.spells.infinityspell.name=Infinity
actors.hero.dicemage.spells.infinityspell.desc=Special school. Costs 100 MP: directly kill an enemy, 10 turn cooldown.
actors.hero.dicemage.spells.infinityspell.prompt=Select enemy to erase
actors.hero.dicemage.spells.infinityspell.invalid_target=You must select an enemy.
actors.hero.dicemage.spells.infinityspell.cast=Infinity! %s was erased.

