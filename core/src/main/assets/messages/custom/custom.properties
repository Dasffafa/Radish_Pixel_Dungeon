# ============ Dice Mage Schools ============
actors.hero.talent.school_fire.title=Fire
actors.hero.talent.school_fire.desc=Invest points to level the Fire school. Level determines the usable spell: +1 Scorch, +2 Scald, +3 Deflagration (only the spell matching the school level is usable).
actors.hero.talent.school_blades.title=Blades
actors.hero.talent.school_blades.desc=Invest points to level the Blades school. +1 Cut, +2 Hack (passive), +3 Blade Rain.
actors.hero.talent.school_conjuration.title=Conjuration
actors.hero.talent.school_conjuration.desc=Invest points to level the Conjuration school. +1 Execute, +2 Lightning, +3 Evil Curse. Holding this school lets you see monsters' actual HP.
actors.hero.talent.school_mana.title=Mana
actors.hero.talent.school_mana.desc=Invest points to level the Mana school. +1 Gather (passive), +2 Prophecy, +3 Starfire.
actors.hero.talent.school_blood.title=Blood
actors.hero.talent.school_blood.desc=Invest points to level the Blood school. +1 Laceration, +2 Combustion, +3 Drain.
actors.hero.talent.school_nature.title=Nature
actors.hero.talent.school_nature.desc=Invest points to level the Nature school. +1 Hemlock, +2 Vine, +3 Miasma.
actors.hero.talent.school_medical.title=Medical
actors.hero.talent.school_medical.desc=Invest points to level the Medical school. +1 Bandage, +2 Inject, +3 Soothe.
actors.hero.talent.school_physical.title=Physical
actors.hero.talent.school_physical.desc=Invest points to level the Physical school. +1 Light Poke, +2 Flick, +3 Reap.
actors.hero.talent.school_emergency.title=Emergency
actors.hero.talent.school_emergency.desc=Invest points to level the Emergency school. +1 Mend, +2 Refresh, +3 Surgery.
actors.hero.talent.school_special.title=Special
actors.hero.talent.school_special.desc=Invest points to level the Special school. Three special spells are randomly assigned to its levels each run; after picking the first special spell you can view this run's assignment.

# ============ Dice Mage Spells ============
actors.hero.dicemage.spells.scorchspell.name=Scorch
actors.hero.dicemage.spells.scorchspell.desc=Fire L1. Costs 2 MP: 3-10 fire damage in a 3x3 area and ignites. 100 turn cooldown.
actors.hero.dicemage.spells.scorchspell.prompt=Select scorch center
actors.hero.dicemage.spells.scorchspell.cast=Scorch! Hit %d targets.
actors.hero.dicemage.spells.scaldspell.name=Scald
actors.hero.dicemage.spells.scaldspell.desc=Fire L2. Costs 3 MP: enemies in view below 80% HP take 15-21 fire damage.
actors.hero.dicemage.spells.scaldspell.cast=Scald! Burned %d enemies.
actors.hero.dicemage.spells.scaldspell.none=Scald! No enemies below 80% HP in view.
actors.hero.dicemage.spells.blazespell.name=Deflagration
actors.hero.dicemage.spells.blazespell.desc=Fire L3. Costs 6 MP: projectile deals 100-150 fire damage.
