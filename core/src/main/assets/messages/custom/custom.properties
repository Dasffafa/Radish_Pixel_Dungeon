actors.hero.dicemage.spells.reapspell.desc=Physical L3. Costs 1 MP: kill an enemy with 9-11 HP, gaining 3 MP.
actors.hero.dicemage.spells.reapspell.prompt=Select enemy to reap
actors.hero.dicemage.spells.reapspell.invalid_target=You must select an enemy.
