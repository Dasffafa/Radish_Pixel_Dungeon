actors.hero.dicemage.spells.vinespell.shield=Vine! Target gains %d shield.
actors.hero.dicemage.spells.vinespell.attack=Vine! Dealt %d damage.
actors.hero.dicemage.spells.miasmaspell.name=Miasma
actors.hero.dicemage.spells.miasmaspell.desc=Nature L3. Costs 3 MP: a 5x5 special poison gas that both poisons monsters and deals poison damage.
actors.hero.dicemage.spells.miasmaspell.prompt=Select miasma center
actors.hero.dicemage.spells.miasmaspell.cast=Miasma! Affected %d targets.
actors.hero.dicemage.spells.bandagespell.name=Bandage
actors.hero.dicemage.spells.bandagespell.desc=Medical L1. Costs 2 MP: allies in view restore 5-9 HP and gain 5-9 shield. 100 turn cooldown.
actors.hero.dicemage.spells.bandagespell.cast=Bandage! %d allies restored %d HP and %d shield.
actors.hero.dicemage.spells.injectspell.name=Inject
actors.hero.dicemage.spells.injectspell.desc=Medical L2. Costs 2 MP: allies in view gain 5-9 shield.
actors.hero.dicemage.spells.injectspell.cast=Inject! %d allies gain %d shield.
actors.hero.dicemage.spells.soothespell.name=Soothe
actors.hero.dicemage.spells.soothespell.desc=Medical L3. Costs 4 MP: allies in view restore 5-9 HP and gain +0.2 natural regen for 500 turns or until the next floor.
actors.hero.dicemage.spells.soothespell.cast=Soothe! %d allies restored %d HP and gain regen.
actors.hero.dicemage.spells.lightpokespell.name=Light Poke
actors.hero.dicemage.spells.lightpokespell.desc=Physical L1. Costs 1 MP: guaranteed hit on adjacent target, 8-16 damage and knockback 2. 20 turn cooldown.
actors.hero.dicemage.spells.lightpokespell.prompt=Select adjacent enemy
actors.hero.dicemage.spells.lightpokespell.invalid_target=You must select an enemy.
actors.hero.dicemage.spells.lightpokespell.not_adjacent=Target must be adjacent.
actors.hero.dicemage.spells.lightpokespell.cast=Light Poke! Dealt %d damage and knocked back.
actors.hero.dicemage.spells.flickspell.name=Flick
actors.hero.dicemage.spells.flickspell.desc=Physical L2. Costs 1 MP: guaranteed hit on adjacent target, 8-16 damage (double vs full HP), knockback 100. 20 turn cooldown.
actors.hero.dicemage.spells.flickspell.prompt=Select adjacent enemy
actors.hero.dicemage.spells.flickspell.invalid_target=You must select an enemy.
actors.hero.dicemage.spells.flickspell.not_adjacent=Target must be adjacent.
actors.hero.dicemage.spells.flickspell.cast=Flick! Dealt %d damage and sent flying.
