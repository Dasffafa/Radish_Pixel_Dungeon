actors.hero.dicemage.spells.lightningspell.name=Lightning
actors.hero.dicemage.spells.lightningspell.desc=Conjuration L2. Costs 1 MP: a lightning bolt kills one enemy with 19-21 HP. 50 turn cooldown.
actors.hero.dicemage.spells.lightningspell.prompt=Select lightning target
actors.hero.dicemage.spells.lightningspell.invalid_target=You must select an enemy.
actors.hero.dicemage.spells.lightningspell.out_of_range_hp=Target HP (%d) is not in lightning range.
actors.hero.dicemage.spells.lightningspell.executed=Executed
actors.hero.dicemage.spells.lightningspell.cast=Lightning! %s was killed.
actors.hero.dicemage.spells.evilcursespell.name=Evil Curse
actors.hero.dicemage.spells.evilcursespell.desc=Conjuration L3. Costs 3 MP: kill one enemy in view with 59-61 HP. 50 turn cooldown.
actors.hero.dicemage.spells.evilcursespell.prompt=Select curse target
actors.hero.dicemage.spells.evilcursespell.invalid_target=You must select an enemy.
actors.hero.dicemage.spells.evilcursespell.not_in_view=Target not in view.
actors.hero.dicemage.spells.evilcursespell.out_of_range_hp=Target HP (%d) is not in curse range.
actors.hero.dicemage.spells.evilcursespell.executed=Executed
actors.hero.dicemage.spells.evilcursespell.cast=Evil Curse! %s was killed.
actors.hero.dicemage.spells.gatherpassive.name=Gather
actors.hero.dicemage.spells.gatherpassive.desc=Mana L1 (passive). While crippled, frostbitten, paralyzed or frozen, gain 0.3 MP per turn.
actors.hero.dicemage.spells.prophecyspell.name=Prophecy
actors.hero.dicemage.spells.prophecyspell.desc=Mana L2. Costs 3 MP: channel for 2 turns, then gain 4 MP after 20 turns.
actors.hero.dicemage.spells.prophecyspell.cast=Prophecy! You begin channeling...
actors.hero.dicemage.spells.starfirespell.name=Starfire
actors.hero.dicemage.spells.starfirespell.desc=Mana L3. Costs 4 MP: for 3 turns, when enemies in view take spell damage, every 10 damage grants 1 MP. 50 turn cooldown.
actors.hero.dicemage.spells.starfirespell.cast=Starfire! You begin siphoning spell energy.
actors.hero.dicemage.spells.lacerationspell.name=Laceration
actors.hero.dicemage.spells.lacerationspell.desc=Blood L1. Costs 1 MP: you take 8-12 damage, dealing 17-31 to a random topmost enemy in view. 20 turn cooldown.
actors.hero.dicemage.spells.lacerationspell.cast=Laceration! You take %d, dealing %d to the target.
actors.hero.dicemage.spells.lacerationspell.no_enemy=No enemies in view.
actors.hero.dicemage.spells.combustionspell.name=Combustion
actors.hero.dicemage.spells.combustionspell.desc=Blood L2. Costs 1 MP: you take 8-12 damage, dealing 7-14 fire to all enemies in view.
actors.hero.dicemage.spells.combustionspell.cast=Combustion! You take %d, burning %d enemies.
actors.hero.dicemage.spells.drainspell.name=Drain
actors.hero.dicemage.spells.drainspell.desc=Blood L3. Costs 1 MP: kill a blood-bearing ally (no mirror or earth/stone), restoring 19-38 HP.
actors.hero.dicemage.spells.drainspell.prompt=Select an ally with blood
actors.hero.dicemage.spells.drainspell.invalid_target=You must select an ally with blood.
actors.hero.dicemage.spells.drainspell.cast=Drain! %s was drained, restoring %d HP.
actors.hero.dicemage.spells.hemlockspell.name=Hemlock
actors.hero.dicemage.spells.hemlockspell.desc=Nature L1. Costs 2 MP: 3-7 green poison damage and equal poison stacks. 20 turn cooldown.
actors.hero.dicemage.spells.hemlockspell.prompt=Select hemlock target
actors.hero.dicemage.spells.hemlockspell.invalid_target=You must select an enemy.
actors.hero.dicemage.spells.hemlockspell.cast=Hemlock! Dealt %d poison damage.
actors.hero.dicemage.spells.vinespell.name=Vine
