custom.testmode.animationtweaker.name = Animation Tweaker
custom.testmode.animationtweaker.desc = In-game tool to build & preview character skin animations.\nLoad any sprite sheet (default frame 12x16), pick arbitrary frames into a playable sequence, and bind an affix image + offset to each frame (affix = an extra image that may be larger than the frame, attached at a pixel offset on top of the character frame).\nIn the editor window: prev/next frame steps manually (paused) to bind affixes per frame, arrows nudge the current frame's affix offset (Shift = x10, Ctrl = x0.1), [ / ] change step, Enter prints offset, Backspace zeroes it.\nThe console prints copy-pasteable Java code when you hit \"output code\".
