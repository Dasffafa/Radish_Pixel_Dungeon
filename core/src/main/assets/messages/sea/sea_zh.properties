sea.seafaring.launch_aboard=你已经在船上了。
sea.seafaring.launch_swimming=游泳时没法让船下水。
sea.seafaring.launch_one=你另一艘船还浮在水上。想再放一艘，得先把它拖上岸。
sea.seafaring.launch_left=你另一艘船漂在你走不过去的地方。你只能把它留给大海。
sea.seafaring.launch_shore=站到开阔水边的岸上，才能让它下水。
sea.seafaring.launch_raft=你把木筏推下水。
sea.seafaring.launch_sail=你把帆船推入水中。
sea.seafaring.hauled=你把船拖出水，收进背包。
sea.seafaring.ashore_raft=你上了岸。木筏仍停在原处的水面上。
sea.seafaring.ashore_sail=你上了岸。帆船仍停在原处的水面上。
sea.seafaring.aboard=你爬上了船。
sea.seafaring.swimming=你正在深水里游泳！快游向浅水或岸边。
sea.seafaring.overboard=你离开了船，它就在原处漂着。
sea.seafaring.beached=你的船触底搁浅了。
sea.seafaring.storm_raft=风暴起了，海面翻涌。木筏在这里撑不了多久：快靠岸！
sea.seafaring.storm_sail=风暴起了。这样的海面，连帆船也要挨打。
sea.seafaring.wave=一个浪头打上船舷，把你浇透了。
sea.seafaring.wave_hull=一个浪头砸在船上，船木发出呻吟。
sea.seafaring.leaking_raft=木筏在进水。一半的捆绳已经散了。
sea.seafaring.leaking_sail=帆船在漏水，船体已经缺了一半。
sea.seafaring.sinking_raft=木筏正在你脚下散开！快上岸！
sea.seafaring.sinking_sail=帆船要沉了！快上岸！
sea.seafaring.capsized_raft=木筏散架，把你抛进了海里！
sea.seafaring.capsized_sail=帆船在你脚下沉了下去！
sea.seafaring.moored_ask=你的船泊在原处。船体：%1$d/%2$d。
sea.seafaring.opt_board=登船
sea.seafaring.opt_haul=拖上岸

###a boat afloat (sea/Afloat)
sea.afloat.name_raft=在木筏上
sea.afloat.name_sail=在帆船上
sea.afloat.desc_raft=你站在一艘用绳索捆成的木筏上。它能载你越过浅水与深水，速度与步行相同。踏上旁边的陆地即可上岸；木筏会停在原处的水面上。\n\n木筏吃水浅。下雨或强风掀起的浪会打上来把你淋湿，也会磨损它的捆绳，一场风暴更可能把它撕散。船体损失一半时你会收到警告，损失四分之三时还会再警告一次。\n\n船体：%1$d/%2$d。
sea.afloat.desc_sail=你站在一艘帆船上。它能载你越过浅水与深水，比步行快上一半，顺风时则快一倍。踏上旁边的陆地即可上岸；帆船会停在原处的水面上。\n\n帆船不怕下雨。只有风暴会缓慢地磨损它的船体。船体损失一半时你会收到警告，损失四分之三时还会再警告一次。\n\n船体：%1$d/%2$d。

###swimming (sea/Swimming)
sea.swimming.name=游泳
sea.swimming.heromsg=你在深水里！
sea.swimming.tiring=你的手臂越来越沉。海水正在消耗你的体力！
sea.swimming.ondeath=你溺死了...
sea.swimming.rankings_desc=溺死于大海
sea.swimming.desc=你正在深水里游泳，脚下空无一物。移动速度只有平时的一半，而且始终浑身湿透。\n\n你能撑上一阵，但之后海水每两回合就会损耗你一点体力。游向浅水或岸边，还要当心背鳍：水里的任何人都是鲨鱼的目标。\n\n离体力耗尽还有%d回合。

###a sea lantern's glare (sea/LanternGlare)
sea.lanternglare.name=海灯强光
sea.lanternglare.desc=点燃的海灯发出的强光，以及灯油呛人的烟，让鲨鱼不敢靠近你。

###the boats (items/sea), and what the homestead's stations build them from (homestead/stations/StationRecipes)
homestead.stations.stationrecipe.raft_logs=橡木或松木原木
homestead.stations.stationrecipe.sail_hides=兽皮或皮革
items.sea.boat.ac_launch=下水
items.sea.boat.ac_repair=修补
items.sea.boat.no_planks=你需要木板来修补船体。
items.sea.boat.repaired=你用%1$d块木板修补了船体。船体：%2$d/%3$d。
items.sea.boat.hull=船体：%1$d/%2$d。
items.sea.raft.name=木筏
items.sea.raft.desc=用绳索捆在一起的原木：家园的工作台能用四根原木和两根绳子做一艘，海边的村子里，渔夫也有出售。在开阔水边的岸上_下水_，凡是有水的地方你都能去：穿过湖泊、沿着海岸、直抵海岛。\n\n木筏慢，吃水也浅。雨和风都会磨损它，一场风暴则可能让它沉没。把它收回背包后，可以用木板修补。
items.sea.sailboat.name=帆船
items.sea.sailboat.desc=木板拼成的船体，一根桅杆，一面缝制兽皮做的帆；可以在家园点着火的锻炉上打造，也可以向海边村子里的渔夫购买。在开阔水边的岸上_下水_。它比步行快上一半，顺风时快一倍。\n\n它不怕下雨。只有风暴会缓慢地磨损船体。把它收回背包后，可以用木板修补。

###the keeper's goods (items/sea)
items.sea.seachart.name=海图
items.sea.seachart.ac_read=阅读
items.sea.seachart.desc=%s一带海域的守塔人海图，每座岛都标了出来。\n\n在开阔天空下_阅读_，就能把这些岛描到你的世界地图上。海图会被用掉。
items.sea.seachart.desc_plain=附近海域的水手海图，每座岛都标了出来。\n\n在开阔天空下_阅读_，就能把这些岛描到你的世界地图上。海图会被用掉。
items.sea.seachart.no_surface=到开阔天空下再读，世界地图在那里才管用。
items.sea.seachart.charted=你把海图描到了地图上：%d座你原先不知道的岛。
items.sea.seachart.nothing_new=海图上标出的，你的地图上都已经有了。
items.sea.sealantern.name=海灯
items.sea.sealantern.ac_light=点燃
items.sea.sealantern.desc=一盏黄铜与厚玻璃制成的防风灯，里面装满了守塔人的灯油。\n\n点燃后，它烧的时间是火把的两倍，能照亮道路，也能给你一点暖意。它燃烧时，强光与呛人的油烟会让鲨鱼不敢靠近你。
items.sea.sealantern.lit=你点燃了海灯。强光在水面上铺开。

###the shark (actors/mobs/Shark)
actors.mobs.shark.name=鲨鱼
actors.mobs.shark.desc=外海里的灰色猎手，比人还长。它守在深水里，袭击水里和水上的一切：游泳的人、在深水边缘涉水的人，甚至船只。它的牙能把木筏咬碎。\n\n点燃的海灯能让它不敢靠近。
actors.mobs.shark.fin=一道背鳍划开了近处的水面！
actors.mobs.shark.rams_raft=鲨鱼猛地撞上你的木筏！
actors.mobs.shark.rams_sail=鲨鱼撞上了船体！

###a lighthouse's keeper (actors/mobs/npcs/LighthouseKeeper)
actors.mobs.npcs.lighthousekeeper.name=守塔人
actors.mobs.npcs.lighthousekeeper.desc=一位老水手，外套上满是盐渍，每夜都让灯塔亮着。他出售描绘他灯火周围岛屿的海图，也卖适合外海用的海灯。
actors.mobs.npcs.lighthousekeeper.talk_0=从这里到世界尽头，每一座岛都在我的海图上。至少我见过的每一座都在。
actors.mobs.npcs.lighthousekeeper.talk_1=今天浅滩外面有背鳍。要是往那边航行，记得点着海灯。
actors.mobs.npcs.lighthousekeeper.talk_2=一场风暴能把木筏拆散。天色一暗，就往最近的陆地走。
actors.mobs.npcs.lighthousekeeper.talk_3=这一带岸边沉船不少。大海拿走的东西，总会还回来一些。
actors.mobs.npcs.lighthousekeeper.flee=守塔人跑了。灯还在他身后亮着。

###a village's fisher (actors/mobs/npcs/VillageFisher)
actors.mobs.npcs.villagefisher.name=村中渔夫
actors.mobs.npcs.villagefisher.desc=村里的渔夫，穿着油布外套，戴着油布帽。她一边打鱼一边造船，捕鱼的间隙就把船卖掉：沿岸用的木筏，外海用的帆船。
actors.mobs.npcs.villagefisher.talk_spring=鱼群跟着暖水回来了。这时候买船正合适！
actors.mobs.npcs.villagefisher.talk_summer=这个季节海面平静。就算只有木筏，也能划到岛上去。
actors.mobs.npcs.villagefisher.talk_autumn=多看看天。秋天的风暴来得快，木筏可扛不过一场。
actors.mobs.npcs.villagefisher.talk_winter=水冷，手也冷。不过鲨鱼好像并不在乎。

###the sea's places (levels/overworld/SeaWorld)
levels.overworld.seaworld.wreck_name=%s的残骸
levels.overworld.seaworld.light_name=%s灯塔
levels.overworld.seaworld.found_island=你望见一座岛：%s。
levels.overworld.seaworld.found_wreck=岸边躺着一艘沉船：%s。
levels.overworld.seaworld.found_light=海上立着一座灯塔：%s。
levels.overworld.seaworld.deep_water_desc=这里的水底陡然变深，深得无法涉过。徒步只能走过岸边的浅水，但有船就能渡过去。
levels.overworld.seaworld.wreck=沉船
levels.overworld.seaworld.wreck_desc=一艘船破开的船体，船木被太阳晒得发白，外面结满了藤壶。
levels.overworld.seaworld.wreck_hold=沉船货舱
levels.overworld.seaworld.wreck_hold_desc=船体在这里裂开了。海里剩下的那些货物都在里面。
levels.overworld.seaworld.wreck_shore=岸边
levels.overworld.seaworld.wreck_shore_desc=被潮水搅动的湿沙，通往沉船货舱的入口就在这里。
levels.overworld.seaworld.lighthouse=灯塔
levels.overworld.seaworld.lighthouse_desc=一座白塔，塔身有一道红环，顶上是一间灯室。它的光整夜扫过海面。
levels.overworld.seaworld.apron=石板空地
levels.overworld.seaworld.apron_desc=灯塔门前铺的石板，被守塔人的靴子磨得光滑。
levels.overworld.seaworld.dig_spot=记号沙地
levels.overworld.seaworld.dig_spot_desc=有人在这里的沙上划了个十字，周围堆了一圈贝壳。下面一定埋着什么。用铲子挖挖看。
levels.overworld.seaworld.moored_raft=停泊的木筏
levels.overworld.seaworld.moored_raft_desc=你的木筏，泊在原处。踏上去即可登船。
levels.overworld.seaworld.moored_sail=停泊的帆船
levels.overworld.seaworld.moored_sail_desc=你的帆船，泊在原处。踏上去即可登船。
levels.overworld.seaworld.treasure=铲子碰到了木头：一只很久以前埋下的水手箱！
