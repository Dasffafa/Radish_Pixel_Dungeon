actors.hero.skills.branchskill.invested=你在此分支中累计投入了%1$d点。
actors.hero.skills.branchskill.invested_all=在整棵技能树中，你一共投入了%1$d点，技能与天赋合计。
actors.hero.skills.branchskill.invested_tree=你在这棵技能树中投入了%1$d点：%2$d点用于技能，%3$d点用于天赋。
actors.hero.skills.branchskill.column=_%1$s_列：%2$d点。
actors.hero.skills.branchskill.next_cost=下一次提升将消耗你%1$d点技能点。
actors.hero.skills.branchskill.branch_maxed=你无法再沿此路线提升

###warrior

actors.hero.skills.warriorpassivea.name=战士
actors.hero.skills.warriorpassivea.desc=战士的躯体拒绝倒下：它承受伤害，合拢伤口，然后继续屹立。

actors.hero.skills.endurance.name=忍耐
actors.hero.skills.endurance.desc=坚守原地，受伤会让你愈发坚韧。若你上一回合没有移动，每承受一次伤害便积累一层；层数足够时你会扎稳脚跟并跺地：地面开裂，周围敌人被定身_3回合_，同时升起一道护盾。移动会清空层数。\n\n_+1：_承受_5次伤害_后跺地：定身_1格_内的敌人，护盾值为你最大生命值的_4%_。\n\n_+2：_承受_4次伤害_后：范围_2格_，护盾_7%_。\n\n_+3：_承受_3次伤害_后：范围_3格_，护盾_10%_，开裂的地面还会使敌人_残废__6回合_。

actors.hero.skills.regeneration.name=再生
actors.hero.skills.regeneration.desc=杀死视野内最后一个敌人会让你得以喘息，并恢复部分已损失的生命值。\n\n_+1：_恢复已损失生命值的_15%_。\n\n_+2：_恢复_25%_。\n\n_+3：_恢复_35%_，且喘息还会清除_流血、中毒与残废_。

actors.hero.skills.toughness.name=坚韧
actors.hero.skills.toughness.desc=当一次攻击使你失去最大生命值的_10%_或更多时，你会咬紧牙关将痛楚压下：伤害不会立刻结算，而是在接下来数回合内逐渐渗入你的身体。同一时间只能压制一次攻击。\n\n_+1：_该伤害在_2回合_内结算。\n\n_+2：_在_3回合_内。\n\n_+3：_在_4回合_内击杀造成该伤害的敌人会_清除_剩余部分。

actors.hero.skills.laststand.name=背水一战
actors.hero.skills.laststand.desc=当一次攻击将你的生命值降为四分之一时，你会站稳脚跟并升起一道护盾。此效果_40回合_后可再次触发。\n\n_+1：_护盾值为你最大生命值的_5%_。\n\n_+2：_护盾为_10%_。\n\n_+3：_护盾为_15%_，且你会跺击地面，_眩晕_身边所有敌人_2回合_。

actors.hero.skills.stoneskin.name=石肤
actors.hero.skills.stoneskin.desc=石甲覆盖你的皮肤。每片石甲可从一次攻击中挡下至多_10%_最大生命值的伤害，随后碎裂，将碎片喷向相邻的攻击者，造成你伤害的_40%_；碎裂的石甲每_10回合_再生一片。\n\n_+1：__1片石甲_。\n\n_+2：__2片石甲_。\n\n_+3：__3片石甲_，且被石甲完全挡下的攻击会使攻击者_眩晕__2回合_。

actors.hero.skills.bloodthirst.name=挫志
actors.hero.skills.bloodthirst.cast=击溃意志
actors.hero.skills.bloodthirst.desc=你的近战攻击会削弱敌人的勇气，使其攻击造成的伤害降低。\n\n_+1：_伤害降低_5%_。\n\n_+2：_伤害降低_10%_。\n\n_+3：_伤害降低_20%_，且_连续命中5次_后敌人会陷入_恐惧_。未命中会重置计数。

actors.hero.skills.warriorpassiveb.name=近战
actors.hero.skills.warriorpassiveb.desc=战士凭借蛮力与手中的武器取胜。

actors.hero.skills.firmhand.name=铁腕
actors.hero.skills.firmhand.desc=你对未受伤敌人的首次近战攻击会使其_踉跄_：下次你用推撞使其移动时（击退、裂地、跃击等），它会飞得更远，并撞上阻挡它的任何东西而爆裂。\n\n_+1：_踉跄_3回合_，多飞_1格_。\n\n_+2：_踉跄_5回合_，多飞_2格_，且撞击会使被撞到的目标也踉跄。\n\n_+3：_踉跄_7回合_，且击杀踉跄的敌人会使_其身边每个敌人_都踉跄。

actors.hero.skills.aggression.name=好战
actors.hero.skills.aggression.desc=当一次近战攻击击杀目标时，这一击会顺势劈向身边的另一个敌人。\n\n_+1：_顺劈造成该击_40%_的伤害。\n\n_+2：_顺劈造成_60%_。\n\n_+3：_顺劈造成_80%_，且顺劈击杀目标时会_再次顺劈_。

actors.hero.skills.mastery.name=专精
actors.hero.skills.mastery.desc=你的武器让敌人不敢近身：当敌人走到你身边时，你有机会在其进攻前先出手。\n\n_+1：_先制攻击几率_30%_。\n\n_+2：_几率_45%_。\n\n_+3：_几率_60%_，且被击中的敌人会被击退_1格_。

actors.hero.skills.warbreaker.name=破军
actors.hero.skills.warbreaker.cast=架势已破！
actors.hero.skills.warbreaker.desc=近战攻击可以击碎敌人的防御：这一击造成_30%_额外伤害，并使敌人陷入易伤。\n\n_+1：_几率_6%_，易伤_4回合_。\n\n_+2：_几率_12%_，易伤_5回合_。\n\n_+3：_几率_18%_，易伤_6回合_，且目标身边每个敌人也会陷入易伤。

actors.hero.skills.warrioractive.name=武技
actors.hero.skills.warrioractive.desc=战士以蛮力施以沉重的惩罚。

actors.hero.skills.smash.name=摔投
actors.hero.skills.smash.cast=给我趴下！
actors.hero.skills.smash.desc=抓住一个相邻敌人然后选择将其投掷到何处。落地时对其造成_100%武器伤害_。将其掷向另一个敌人可伤害_双方_并_使双方麻痹1回合_；被投掷的敌人会紧挨着对方落地。\n\n_+1：_最远投掷_3格_。\n\n_+2：_最远_5格_。\n\n_+3：_最远_7格_。\n\n无法影响首领，包括碰撞。巨大或无法移动的敌人会在原地承受这一击。投掷无法穿墙。被掷入深渊的敌人会正常坠落，敌人落在陷阱上时陷阱会触发。

actors.hero.skills.knockback.name=击退
actors.hero.skills.knockback.cast=击退！
actors.hero.skills.knockback.desc=持续期间，你的近战攻击会将目标推开1格。只有推撞实际发生时才会消耗魔力。\n\n_+1：_推撞攻击造成_10%_额外伤害。\n\n_+2：_造成_20%_额外伤害。\n\n_+3：_造成_30%_额外伤害，且身后无路可退的敌人会改为被_碾压_，再额外造成_25%_的伤害。

actors.hero.skills.rampage.name=暴走
actors.hero.skills.rampage.cast=暴走！
actors.hero.skills.rampage.desc=持续期间每次近战攻击都会命中你周围的所有敌人，包括主要目标，并消耗魔力。\n\n_+1：_每个被命中的敌人受到_60%_伤害。\n\n_+2：_受到_80%_伤害。\n\n_+3：_受到_全额_伤害并陷入_流血_。

actors.hero.skills.earthshatter.name=裂地
actors.hero.skills.earthshatter.cast=碎裂！
actors.hero.skills.earthshatter.desc=猛击地面。_2格_内的所有敌人受到伤害并被定身，随后石矛之环向外扩散，每一环伤害更高并推动前方敌人，因此处于波前的敌人会被每一环击中。\n\n_+1：_猛击造成你伤害的_200%_并定身_3回合_。随后扩散_2环_，首环为你伤害的_100%_，每环递增_20%_。\n\n_+2：_猛击造成_280%_并定身_4回合_。随后扩散_3环_，首环_140%_，每环递增_40%_。\n\n_+3：_猛击造成_360%_并定身_5回合_。随后扩散_4环_，首环_180%_，每环递增_60%_，并_残废_命中的敌人。

actors.hero.skills.ironstance.name=铁壁架势
actors.hero.skills.ironstance.cast=稳住！
actors.hero.skills.ironstance.desc=摆出防御姿势。持续期间你造成的伤害降低_15%_，被你格挡的近战攻击会完全落空，并消耗魔力。魔力耗尽时架势解除。无法与蛮勇之怒同时选择。\n\n_+1：_格挡近战攻击的几率为_15%_。\n\n_+2：_格挡几率为_30%_。\n\n_+3：_格挡几率为_45%_，且攻击者会向后趔趄，_晕眩__3回合_。

actors.hero.skills.recklessfury.name=蛮勇之怒
actors.hero.skills.recklessfury.cast=放弃防御！
actors.hero.skills.recklessfury.desc=卸下防御：持握期间你受到的伤害增加_10%_，每次落在你身上的攻击都会积攒怒气。你的下一次近战攻击会消耗全部怒气转化为伤害，并消耗魔力。无法与铁壁架势同时选择。\n\n_+1：_怒气积攒你所受伤害的_50%_。\n\n_+2：_积攒_75%_。\n\n_+3：_积攒_100%_，如果含怒一击杀死了目标，未用尽的怒气会_延续_到你的下一次攻击。

actors.hero.skills.warriorfourth.name=督军号令
actors.hero.skills.warriorfourth.desc=督军打断敌人的腿与意志，然后召来持盾卫士守住阵线。

actors.hero.skills.hamstring.name=断筋
actors.hero.skills.hamstring.cast=别站起来
actors.hero.skills.hamstring.desc=你的近战攻击可以斩断敌人的腿，使其残废。\n\n_+1：_有_8%_几率残废_4回合_。\n\n_+2：_有_16%_几率残废_5回合_。\n\n_+3：_有_24%_几率残废_6回合_。攻击已残废的敌人会打断其腿骨，使其定身_2回合_。

actors.hero.skills.demoralize.name=挫志
actors.hero.skills.demoralize.cast=击溃意志
actors.hero.skills.demoralize$demoralized.name=士气低落
actors.hero.skills.demoralize$demoralized.desc=这个生物的战意正在崩溃：其攻击造成的伤害降低%1$d%%。\n\n剩余回合数：%2$s。
actors.hero.skills.demoralize.desc=你的近战攻击会削弱敌人的勇气，使其攻击造成的伤害降低。\n\n_+1：_伤害降低_5%_。\n\n_+2：_伤害降低_10%_。\n\n_+3：_伤害降低_20%_，且_连续命中5次_后敌人会陷入_恐惧_。未命中会重置计数。

actors.hero.skills.shieldbearer.name=持盾卫士
actors.hero.skills.shieldbearer.cast=来我身边！
actors.hero.skills.shieldbearer.desc=召来一名立誓的持盾卫士到你身旁。视野内所有敌人都会转而攻击他。他拥有独立生命值（为你最大生命值的一定比例），其攻击造成你伤害的一定比例。他会坚守岗位一个游戏内白昼，然后消散。\n\n_+1：_最大生命值为你的_40%_；攻击造成你伤害的_40%_。\n\n_+2：_最大生命值为你的_55%_；造成_50%_。\n\n_+3：_最大生命值为你的_70%_；造成_60%_，且落地时以盾击将相邻敌人击退_1格_。
actors.hero.skills.shieldbearer.no_summons=你无法控制更多召唤物。

###mage

actors.hero.skills.magepassivea.name=法师
actors.hero.skills.magepassivea.desc=法师的内在之泉：更深的魔力池，以及消耗魔力让他屹立不倒的守护。

actors.hero.skills.spirituality.name=灵性
actors.hero.skills.spirituality.desc=命中你的攻击会震出魔力，但不会超过该打击的伤害。\n\n_+1：_每次受击恢复至多_2点魔力_。\n\n_+2：_至多_3点魔力_。\n\n_+3：_至多_4点魔力_。魔力已满时，震出的魔力会改为鞭笞攻击者。

actors.hero.skills.meditation.name=冥想
actors.hero.skills.meditation.desc=原地等待且视野内没有敌人时，每_5回合_会有一道平静的脉动恢复魔力。\n\n_+1：_每次脉动恢复_2点魔力_。\n\n_+2：_恢复_3点魔力_。\n\n_+3：_恢复_4点魔力_，并治疗视野内你的召唤物，恢复其最大生命值的_10%_。

actors.hero.skills.spiritarmor.name=灵魂护甲
actors.hero.skills.spiritarmor.desc=激活期间，一道由魔力形成的蓝色护甲会抵消受到的一部分伤害（每次至少消耗1点魔力）。每消耗_3点魔力_便形成一颗环绕你的微光，光环满时会由每颗微光向最近的敌人放电。\n\n_+1：_魔力能将受到伤害的_10%_抵消；光环容纳_2颗微光_。\n\n_+2：_抵消_20%_；_3颗微光_。\n\n_+3：_抵消_30%_；_4颗微光_，且每轮齐射都会赋予你_2回合_的充能。

actors.hero.skills.transcendence.name=超凡
actors.hero.skills.transcendence.desc=激活期间你化为半光体：走向敌人会径直穿过它，抵达其后的空格，消耗_3点魔力_，而你留在其体内的光会爆发成一柄光矛。\n\n_+1：_穿过_1个敌人_；光矛造成你伤害的_60-120%_。\n\n_+2：_穿过最多_2个敌人_的直线；每个受到_80-160%_。\n\n_+3：_最多_3个敌人_，每个_100-200%_，且光矛离开你背后时会_一分为三_，对你前方的敌人造成一半伤害。

actors.hero.skills.serenefocus.name=静心专注
actors.hero.skills.serenefocus.desc=当你的魔力不低于_四分之三_时，你的法杖施放会减缓命中的敌人。无法与钢铁意志同时选择。\n\n_+1：_减缓_2回合_。\n\n_+2：_减缓_3回合_。\n\n_+3：_减缓_4回合_，且目标身边的敌人也会被减缓。

actors.hero.skills.willofiron.name=钢铁意志
actors.hero.skills.willofiron.desc=枯竭的魔力池会硬化你的意志。当你的魔力低于一半时，来自敌人、至少为你最大生命值_5%_的伤害会被格挡，每回合一次，且格挡下的力量会储存在你的魔杖中：你下一次造成伤害的法杖施放或弹幕法术会将其释放。无法与静心专注同时选择。\n\n_+1：_格挡_5%_最大生命值的打击；储存的力量增加你_40%_的伤害。\n\n_+2：_格挡_10%_；增加_80%_。\n\n_+3：_格挡_15%_；增加_120%_，且你可以同时储存_2次格挡_。

actors.hero.skills.magepassiveb.name=魔法
actors.hero.skills.magepassiveb.desc=法杖、纯粹的魔法，以及法师以意志束缚的仆从。

actors.hero.skills.wizard.name=巫师
actors.hero.skills.wizard.desc=当你施放法杖时，消耗的充能有几率从目标身上弹开，对最近的另一个敌人施放同一法术。若无人可跳转，它会弹回法杖之中。\n\n_+1：_几率_15%_。\n\n_+2：_几率_25%_。\n\n_+3：_几率_35%_，且若附近还有其他敌人，法杖的_最后一点充能_必定弹射。

actors.hero.skills.sorcerer.name=术士
actors.hero.skills.sorcerer.desc=你造成伤害的法杖施放会使命中的敌人过载：它噼啪作响一回合，然后向自身及身边每个敌人放电，造成法杖伤害的一半。\n\n_+1：_过载几率_20%_。\n\n_+2：_过载几率_35%_。\n\n_+3：_几率_50%_，且过载的敌人若在放电前死亡会_立刻爆裂_，范围2格。

actors.hero.skills.summoner.name=召唤师
actors.hero.skills.summoner.desc=你可以同时让更多召唤仆从留在场上。\n\n_+1：_你的召唤上限提高_1_。\n\n_+2：_提高_2_。\n\n_+3：_提高_3_，且你召唤的每个仆从都会以_高一级_的等级出现。

actors.hero.skills.soultether.name=灵魂缚链
actors.hero.skills.soultether.desc=你每让一个召唤仆从存活，都会为你的法杖注入力量。上限_3个_，。场上空无一物时则毫无所得。\n\n_+1：_每个仆从增加_3%_法杖伤害，充能速度加快_2%_。\n\n_+2：_增加_6%_伤害，加快_4%_。\n\n_+3：_增加_9%_伤害，加快_6%_：三个仆从时_+27%_伤害、充能加快_22%_。

actors.hero.skills.mageactive.name=召唤
actors.hero.skills.mageactive.desc=法师召唤老鼠与骷髅并肩作战，可同时维持3个召唤物，外加来自召唤师的%1$d个。

actors.hero.skills.summonrat.name=召唤老鼠
actors.hero.skills.summonrat.cast=现身吧，鼠辈！
actors.hero.skills.summonrat.desc=一只老鼠在你身边扒土钻出，为你作战。它拥有独立生命值（为你最大生命值的一定比例），其啃咬造成你伤害的一定比例。与所有召唤物一样，它存在一个游戏内白昼，然后消散。\n\n_+1：_最大生命值为你的_8%_；啃咬造成你伤害的_25%_。\n\n_+2：_最大生命值为你的_10%_；啃咬_30%_。\n\n_+3：_最大生命值为你的_12%_；啃咬_35%_。

actors.hero.skills.spark.name=电火花
actors.hero.skills.spark.cast=电火花！
actors.hero.skills.spark.desc=向路径上的第一个目标发射一道魔法弹。它会随你的伤害增强。\n\n_+1：_魔法弹造成你伤害的_20-60%_。\n\n_+2：_造成_40-120%_。\n\n_+3：_造成_60-180%_，且它会_穿过_你的盟友，并命中其直线上直到第一堵墙为止的每个敌人。

actors.hero.skills.summonskeleton.name=召唤骷髅
actors.hero.skills.summonskeleton.cast=亡者听令！
actors.hero.skills.summonskeleton.desc=一具骷髅在你身边立起，这是能硬抗部分伤害的结实仆从。它拥有独立生命值（为你最大生命值的一定比例），其攻击造成你伤害的一定比例。与所有召唤物一样，它存在一个游戏内白昼，然后消散。\n\n_+1：_最大生命值为你的_50%_；攻击造成你伤害的_50%_，并可格挡至多其自身最大生命值的_5%_。\n\n_+2：_最大生命值为你的_60%_；造成_60%_，格挡至多_10%_。\n\n_+3：_最大生命值为你的_70%_；造成_70%_，格挡至多_15%_。

actors.hero.skills.summoncrab.name=召唤螃蟹
actors.hero.skills.summoncrab.cast=夹碎他们！
actors.hero.skills.summoncrab.desc=一只螃蟹横着爬到你身边，为你作战。它拥有独立生命值（为你最大生命值的一定比例），其钳击造成你伤害的一定比例。它的甲壳可格挡每次打击的一部分。与所有召唤物一样，它存在一个游戏内白昼，然后消散。\n\n_+1：_最大生命值为你的_20%_；钳击造成你伤害的_35%_。\n\n_+2：_最大生命值为你的_30%_；钳击_40%_。\n\n_+3：_最大生命值为你的_40%_；钳击_45%_。

actors.hero.skills.souldetonation.name=灵魂引爆
actors.hero.skills.souldetonation.cast=为我最后效劳一次！
actors.hero.skills.souldetonation.desc=牺牲一个可见的召唤物，或一次牺牲至多三个，令其在灵魂之火中爆炸。老鼠会使周围敌人中毒；骷髅会炸开更大的范围。\n\n_+1：_每次爆炸对附近敌人造成_7点伤害_。\n\n_+2：_造成_10点伤害_。\n\n_+3：_造成_13点伤害_，并留下一颗灵魂微光，持续_6回合_。踩上去可恢复魔力。
actors.hero.skills.souldetonation.no_summons=你没有可以引爆的东西。

actors.hero.skills.magefourth.name=元素掌控
actors.hero.skills.magefourth.desc=元素使向地牢本身投掷纯粹的火焰、冰霜与风暴。

actors.hero.skills.cindertrail.name=元素之环
actors.hero.skills.cindertrail.cast=聚拢！
actors.hero.skills.cindertrail.desc=召唤_5_颗火焰或冰霜宝珠环绕你，再次施放便可将它们逐一发射至最远_7格_外。每颗宝珠会在3x3范围内爆开，灼烧或冻寒敌人，并留下可能伤到你的火焰或暴风雪。宝珠环绕越久，便越大越强。\n\n_+1：_宝珠爆开造成你伤害的_60-140%_，完全成长时翻倍。\n\n_+2：_造成_100-200%_，完全成长时翻倍。\n\n_+3：_造成_120-260%_，完全成长时翻倍。发射一颗完全成长的宝珠会使其余每颗宝珠成长一个阶段。

actors.hero.skills.frostnova.name=冰霜新星
actors.hero.skills.frostnova.cast=不许动。
actors.hero.skills.frostnova.desc=一圈寒冰从你身上迸发，伤害并冻伤_3格_内的所有敌人。\n\n_+1：_造成你伤害的_60-140%_，并冻伤_5回合_。\n\n_+2：_造成_80-200%_，冻伤_7回合_。\n\n_+3：_造成_100-260%_，冻伤_9回合_。冰刺会覆盖地面_4回合_，对踩上去的敌人造成伤害并冻伤。
actors.hero.skills.frostnova.no_targets=附近没有足够近的目标可以冻结。

actors.hero.skills.stormcall.name=唤雷
actors.hero.skills.stormcall.cast=天空回应了！
actors.hero.skills.stormcall.desc=从天空召下闪电击向目标。闪电随后在附近敌人之间跳跃，造成_60%_伤害。\n\n_+1：_造成你伤害的_120-240%_，并跳向_1_个额外敌人。\n\n_+2：_造成_160-320%_，跳向_2_个额外敌人。\n\n_+3：_造成_200-400%_，跳向_3_个额外敌人。所有被击中的目标都会眩晕_1回合_。
actors.hero.skills.stormcall.no_target=选择一个你能看见的敌人，让闪电击向它。

actors.hero.skills.pyreaffinity.name=炎术
actors.hero.skills.pyreaffinity.desc=你的法杖施放与弹幕法术可以点燃被其伤害的敌人。无法与冰术同时选择。\n\n_+1：_点燃几率_12%%_。\n\n_+2：_点燃几率_24%%_。\n\n_+3：_点燃几率_36%%_，且火焰会蔓延到一个相邻敌人。

actors.hero.skills.rimeaffinity.name=冰术
actors.hero.skills.rimeaffinity.desc=你的法杖施放与弹幕法术可以将被其伤害的敌人冻结_2回合_。无法与炎术同时选择。\n\n_+1：_冻结几率_10%%_。\n\n_+2：_冻结几率_20%%_。\n\n_+3：_冻结几率_30%%_，且对已冻结敌人的施放会_击碎_冰层，额外造成该次施放一半的伤害。

###rogue

actors.hero.skills.roguepassivea.name=盗贼
actors.hero.skills.roguepassivea.desc=盗贼靠一双快手与无声脚步谋生：钱币、锁具与阴影。

actors.hero.skills.bandit.name=强盗
actors.hero.skills.bandit.desc=你的突袭会扒窃敌人的口袋，每个敌人一次，偷到的东西会直飞向你。\n\n_+1：_偷取一袋_金币_。\n\n_+2：_改为夺取敌人携带的_物品_，它会落在你脚边。它不会再次掉落。\n\n_+3：__投掷武器与箭矢_也能隔屋扒窃。

actors.hero.skills.stealth.name=潜行
actors.hero.skills.stealth.desc=你的脚步悄然无声。当你发现新敌人时，身边会升起一个烟雾替身，每个敌人一次。清醒的敌人会先追猎替身；沉睡的敌人则继续沉睡。替身在时间耗尽或被任何攻击击中的瞬间消散。\n\n_+1：__+1潜行_；替身持续_2回合_。\n\n_+2：__+2潜行_；持续_3回合_。\n\n_+3：__+3潜行_；持续_4回合_，且击中替身的敌人会_失明_2回合。

actors.hero.skills.locksmith.name=锁匠
actors.hero.skills.locksmith.cast=哇啊！！
actors.hero.skills.locksmith.desc=你感觉到陷阱的压板松动，在它弹起前将其卡住。\n\n_+1：_有_33%_几率卡住你踩到的陷阱。\n\n_+2：_有_66%_几率卡住。\n\n_+3：_有_99%_几率卡住，且读懂被卡住的机关会_揭示__3格_内的所有隐藏陷阱。

actors.hero.skills.masterthief.name=神偷
actors.hero.skills.masterthief.desc=你从每次所得中私藏一部分。你拾起的每堆金币和扒窃的每个口袋都会让_2_枚钱币在你身边旋转。当敌人击中你时，你会将一枚钱币弹进它的眼睛，使其_失明__2回合_。\n\n_+1：_最多持有_2枚钱币_。\n\n_+2：_最多_4枚_。\n\n_+3：_最多_6枚_，且每枚钱币会_弹射_向附近另一个敌人，使其也失明。

actors.hero.skills.roguepassiveb.name=刺客
actors.hero.skills.roguepassiveb.desc=盗贼依靠毒素与偷袭，造成迅捷而痛苦的死亡。

actors.hero.skills.venom.name=剧毒
actors.hero.skills.venom.cast=用毒是我的强项
actors.hero.skills.venom.desc=你的刀刃涂有毒素，能毒害被它割伤的敌人。\n\n_+1：_近战攻击有_10%_几率使敌人中毒_3回合_。\n\n_+2：_有_20%_几率中毒_4回合_。\n\n_+3：_有_30%_几率中毒_5回合_，且突袭近战_必定_使敌人中毒。

actors.hero.skills.scorpion.name=蝎子
actors.hero.skills.scorpion.desc=你的毒素持续更久，且攻击中毒的敌人可以将其蜇到残废。\n\n_+1：_毒素延长_2_回合。攻击中毒敌人有_10%_几率使其残废。\n\n_+2：_延长_4_回合，_20%_几率。\n\n_+3：_延长_6_回合，_30%_几率，且蜇刺已残废的敌人会使其_麻痹_1回合。

actors.hero.skills.silentdeath.name=无声之死
actors.hero.skills.silentdeath.cast=永眠
actors.hero.skills.silentdeath.desc=你对沉睡敌人的近战攻击会直取咽喉。若这一击使其生命值降至其最大生命值的某个比例或以下，它便会无声无息地死去。boss与小boss免疫此效果。\n\n_+1：_可杀死生命值降至最大生命值_15%_或以下的沉睡敌人。\n\n_+2：_改为_25%_或以下。\n\n_+3：_改为_35%_或以下，且无声击杀会让整个房间安静下来：_4格_内的沉睡敌人除非受伤，否则_3回合_内无法醒来。

actors.hero.skills.necrotoxin.name=死灵毒素
actors.hero.skills.necrotoxin.cast=腐朽
actors.hero.skills.necrotoxin.desc=毒素在敌人身上每跳一次，都会为你提供_7点魔力_。\n\n攻击中毒的敌人还可以引爆毒素：其剩余伤害的_150%_会立刻结算。\n\n_+1：_引爆几率_20%_。\n\n_+2：_引爆几率_35%_。\n\n_+3：_几率_50%_，且引爆会使相邻敌人中毒_5回合_。

actors.hero.skills.rogueactive.name=忍术
actors.hero.skills.rogueactive.desc=诡计、炸弹与一条绳索：盗贼从不在敌人预料之处作战。

actors.hero.skills.doublestab.name=暗影链接
actors.hero.skills.doublestab.cast=太慢了
actors.hero.skills.doublestab.desc=开启：每次攻击消耗_6点魔力_，将你的目标与_3格_内最近的敌人相连_8回合_，对一方造成的伤害会渗入另一方。附近无人时，目标会改为再承受一次斩击。魔力不足时，链接断开。\n\n_+1：_相连敌人共享_40%_伤害。落单目标额外承受_35%_。\n\n_+2：_共享_60%_。落单目标额外_50%_。\n\n_+3：_共享_80%_。落单目标额外_70%_。

actors.hero.skills.ninjabomb.name=忍者炸弹
actors.hero.skills.ninjabomb.cast=躲进烟雾！
actors.hero.skills.ninjabomb.desc=投出一枚烟雾弹。烟雾会遮蔽你，并使附近敌人陷入睡眠。\n\n_+1：__1格_内的敌人陷入睡眠。\n\n_+2：__2格_内。\n\n_+3：__3格_内，且会留下一个_烟雾分身_持续_5回合_来引开他们。

actors.hero.skills.shadowclone.name=抓钩
actors.hero.skills.shadowclone.cast=来吧！
actors.hero.skills.shadowclone.desc=射出绳索，将自己拉向落点。钩住敌人可飞向它并造成_150%武器伤害_，或钩住墙壁荡过房间。\n\n_+1：_射出_1条绳索_。\n\n_+2：_连射_2条绳索_。\n\n_+3：_连射_3条绳索_，且可钩住_任何你看见的格子_：空地、深渊对岸。
actors.hero.skills.shadowclone.too_many=你无法控制更多召唤物。

actors.hero.skills.phantomstrike.name=暗影军团
actors.hero.skills.phantomstrike.cast=无处可逃
actors.hero.skills.phantomstrike.desc=从地下唤出受缚的暗影与你并肩作战。它们能看见自身周围，并将视野与你共享，即使隔着墙壁。每道暗影都拥有独立生命值（为你最大生命值的一定比例），其攻击造成你伤害的一定比例。\n\n_+1：_最多唤出_2道暗影_，每道最大生命值为你的_15%_，攻击造成你伤害的_30%_。\n\n_+2：_最多_3道暗影_，每道为你的_30%_，造成_40%_，视界更敏锐。\n\n_+3：_最多_4道暗影_，每道为你的_40%_，造成_50%_，且对其中一道施放可与其_交换位置_，无需消耗。
actors.hero.skills.phantomstrike.too_far=那太远了。
actors.hero.skills.phantomstrike.no_target=那里没有人可以攻击。
actors.hero.skills.phantomstrike.no_room=你的标记身边没有空余位置了。

actors.hero.skills.blink.name=闪现
actors.hero.skills.blink.cast=太慢了
actors.hero.skills.blink.desc=激活期间你快如闪电：走向敌人会径直穿过它抵达其后的空格，并在经过时攻击它，消耗_4点魔力_。若你落在另一个尚未攻击过的敌人身边，你会再次闪现穿过它，如此连续。\n\n_+1：_最多连穿_3个敌人_，每个受到你武器伤害的_60%_。\n\n_+2：_最多_4个_，每个_80%_。\n\n_+3：_最多_5个_，每个_100%_。\n\n对首领同样有效；只有敌人身后的格子被阻挡时才会中断连锁。

actors.hero.skills.blooddance.name=猩红华尔兹
actors.hero.skills.blooddance.cast=别离我太远
actors.hero.skills.blooddance.desc=你不再退让。获得激素涌动，其持续期间每次近战攻击都会撕开一道流血伤口。\n\n_+1：__7回合_的激素涌动。攻击造成_2点流血_。\n\n_+2：__10回合_。攻击造成_3点流血_。\n\n_+3：__13回合_。攻击造成_4点流血_，且舞步会在一面相当于你最大生命值_9%_的护盾后展开。

actors.hero.skills.roguefourth.name=恐惧
actors.hero.skills.roguefourth.desc=恐惧会先搅乱整片区域，再收割生命，并从这份恐慌之中汲取力量。

actors.hero.skills.creepingdread.name=蔓延恐惧
actors.hero.skills.creepingdread.cast=嘘。
actors.hero.skills.creepingdread.desc=你的近战攻击可以使目标对你心生恐惧。\n\n_+1：_有_8%_几率使目标恐惧_4回合_。\n\n_+2：_有_16%_几率恐惧_5回合_。\n\n_+3：_有_24%_几率恐惧_6回合_，且恐惧会_蔓延_到目标身边的每个敌人。

actors.hero.skills.predation.name=掠食
actors.hero.skills.predation.desc=对生命值不高于_40%_的敌人命中时，可以将其撕裂，使其流血。\n\n_+1：_有_25%_几率撕裂。\n\n_+2：_有_35%_几率撕裂。\n\n_+3：_有_45%_几率，且杀死流血的敌人会为你恢复最大生命值的_3%_。

actors.hero.skills.blackout.name=黑幕
actors.hero.skills.blackout.cast=熄灯
actors.hero.skills.blackout.desc=向一处投掷黑暗。_2格_内的敌人会失明并陷入恐惧，烟雾会遮蔽该处。烟雾存续期间，看不见你的敌人会被引向那里，而你从烟雾中打出的第一击还会斩中附近另一个敌人，造成一半伤害。\n\n_+1：_失明_6回合_，恐惧_3回合_。\n\n_+2：_失明_8回合_，恐惧_4回合_。\n\n_+3：_失明_10回合_，恐惧_5回合_，且黑暗会_修补你附近的暗影_，恢复其最大生命值的_8%_。

actors.hero.skills.panicharvest.name=恐慌收割
actors.hero.skills.panicharvest.desc=击中逃跑、恐惧、狂乱或被魅惑的敌人时，会将其恐惧收割为魔力，每回合一次。\n\n_+1：_恢复_1点魔力_。\n\n_+2：_恢复_2点魔力_。\n\n_+3：_恢复_2点魔力_，且你杀死的恐慌敌人会使相邻敌人恐惧_3回合_。

actors.hero.skills.dreadhowl.name=恐惧嚎叫
actors.hero.skills.dreadhowl.cast=自相残杀
actors.hero.skills.dreadhowl.desc=一声把恐惧推向疯狂的嚎叫。_5格_内视野中已陷入恐惧的敌人会转而攻击离自己最近的人。\n\n_+1：_狂乱持续_4回合_。\n\n_+2：_持续_5回合_。\n\n_+3：_持续_6回合_，且尚未恐惧的敌人会被_恐惧_3回合，为下一次嚎叫做好准备。
actors.hero.skills.dreadhowl.no_targets=这里还没有东西怕你。

###huntress

actors.hero.skills.huntresspassivea.name=女猎手
actors.hero.skills.huntresspassivea.desc=女猎手通晓荒野：敏锐的感官、无声的脚步，以及等待猎物的耐心。

actors.hero.skills.fletching.name=制箭
actors.hero.skills.fletching.cast=好箭杆。
actors.hero.skills.fletching.desc=你回收每一支落地箭矢的箭羽：每次远程命中都会在环绕你的羽环中添上一根羽毛。羽毛达到_3根_时，你会制成一支分裂箭，你的下一次远程命中会分裂成带倒钩的箭杆，飞向目标附近的敌人，各造成该次命中的_30%_。\n\n_+1：_分裂出_2根箭杆_。\n\n_+2：_分裂出_3根箭杆_。\n\n_+3：_分裂出_4根箭杆_，且击杀目标的箭杆会把它的羽毛还回羽环。

actors.hero.skills.awareness.name=警觉
actors.hero.skills.awareness.cast=太简单了..
actors.hero.skills.awareness.desc=每个敌人袭来时你都能看穿它：每个敌人对你发起的第一次攻击，无论近战还是远程，都可能被你闪开，同时一支箭会径直回射过去，造成弓伤害的_一半_。\n\n_+1：_闪开的几率_20%_。\n\n_+2：_几率_30%_。\n\n_+3：_几率_40%_，且回射的箭会把攻击者_钉住__2回合_。

actors.hero.skills.hunting.name=狩猎
actors.hero.skills.hunting.cast=措手不及。
actors.hero.skills.hunting.desc=击中沉睡或游荡的敌人会让它震惊得无法动弹。\n\n_+1：_眩晕_2回合_。\n\n_+2：_眩晕_3回合_。\n\n_+3：_眩晕_4回合_，且杀死该猎物会揭示最近的隐藏敌人_10回合_。

actors.hero.skills.sixthsense.name=第六感
actors.hero.skills.sixthsense.desc=森林会预警最沉重的打击：本会夺走你四分之一以上生命值的一击，会在四分之一处被拦下。预警的恢复会显示在你的增益栏中。\n\n_+1：_预警每_40回合_恢复一次。\n\n_+2：_每_30回合_恢复一次。\n\n_+3：_每_20回合_恢复一次，且攻击者会陷入_恍惚3回合_。

actors.hero.skills.lonewolf.name=孤狼
actors.hero.skills.lonewolf.desc=身边没有盟友、本层也没有你的召唤物时（你自己的残影不算），每次击杀都会让你发出一声长嚎，2格内的敌人会逃跑。\n\n_+1：_逃跑_2回合_。\n\n_+2：_逃跑_3回合_。\n\n_+3：_逃跑_4回合_，且该次击杀会恢复你_5%_的生命值。

actors.hero.skills.poacher.name=偷猎者
actors.hero.skills.poacher.desc=远程击杀会把尸体留作诱饵：_5回合_内，它的气味会吸引看不见你的敌人。\n\n_+1：_气味传播_4格_。\n\n_+2：_传播_5格_。\n\n_+3：_传播_6格_，且尸体里藏着一道_陷阱_：第一个走近的敌人会被定身_3回合_。

actors.hero.skills.huntresspassiveb.name=远程
actors.hero.skills.huntresspassiveb.desc=每一支箭都各得其的：女猎手把距离化为自己的优势。

actors.hero.skills.accuracy.name=准头
actors.hero.skills.accuracy.desc=你的远程命中可以直取双眼：正中靶心会使目标失明3回合。\n\n_+1：_正中靶心的几率_10%_。\n\n_+2：_几率_20%_。\n\n_+3：_几率_30%_，且你对每个敌人的首次远程命中必定正中靶心。

actors.hero.skills.kneeshot.name=膝射
actors.hero.skills.kneeshot.cast=活靶子
actors.hero.skills.kneeshot.desc=你瞄准双腿：远程命中可以使敌人残废。\n\n_+1：_有_10%_几率残废_4回合_。\n\n_+2：_有_20%_几率残废_5回合_。\n\n_+3：_有_30%_几率残废_6回合_，且射中已残废的敌人会使其_流血_。

actors.hero.skills.irontip.name=铁箭头
actors.hero.skills.irontip.cast=别忘了分享...
actors.hero.skills.irontip.desc=铁箭头能穿透：远程命中可以继续射入目标身后的敌人。\n\n_+1：_有_50%_几率穿透进正后方的_1个敌人_。\n\n_+2：_有_67%_几率穿透2格内至多_2个敌人_。\n\n_+3：_有_75%_几率穿透3格内至多_3个敌人_，且每次远程命中都会使目标陷入_易伤3回合_。

actors.hero.skills.heartseeker.name=觅心箭
actors.hero.skills.heartseeker.cast=穿透心脏。
actors.hero.skills.heartseeker.desc=使敌人生命值降至一半以下的远程命中会把一支箭钉进它的心脏。心脏会在它上方跳动，到_第三拍_时爆开。首领与次级首领只承受一半。\n\n_+1：_爆开造成其最大生命值的_8%_。\n\n_+2：_造成_15%_。\n\n_+3：_造成_22%_，且爆开若击杀目标，箭会被拔出并飞向_4格_内最近的半血以下敌人。

actors.hero.skills.huntressactive.name=箭术
actors.hero.skills.huntressactive.desc=女猎手让她的弓说话：箭矢从不落空，或一分为二，或轰然爆开，或如雨落下。

actors.hero.skills.aimedshot.name=瞄准射击
actors.hero.skills.aimedshot.cast=我看到他了
actors.hero.skills.aimedshot.desc=开启期间，每次远程命中都会消耗魔力，把目标钉在地上。瞄准射击、双重射击与一路爆破只能同时开启一个。\n\n_+1：_钉住_2回合_。\n\n_+2：_钉住_3回合_。\n\n_+3：_钉住_4回合_，且击杀目标的瞄准射击会返还其魔力。

actors.hero.skills.doubleshot.name=双重射击
actors.hero.skills.doubleshot.cast=一箭双雕
actors.hero.skills.doubleshot.desc=开启期间，你的远程命中可以望向视野内另一个敌人再射一箭；若附近没有别的敌人，则射向同一目标。瞄准射击、双重射击与一路爆破只能同时开启一个。\n\n_+1：_第二支箭有_50%_几率射出。\n\n_+2：_有_75%_几率射出。\n\n_+3：_第二支箭_每次_都会射出，且你可以_标记_它要射向的敌人。

actors.hero.skills.bombvoyage.name=一路爆破
actors.hero.skills.bombvoyage.cast=一路爆破！
actors.hero.skills.bombvoyage.desc=开启期间，你的投掷武器与箭矢命中时会像炸弹一样爆开，伤害目标周围的每个敌人，但不会破坏墙体。瞄准射击、双重射击与一路爆破只能同时开启一个。\n\n_+1：_爆炸伤害_1格_内的每个敌人。\n\n_+2：_爆炸伤害提高_35%_。\n\n_+3：_击杀目标的爆炸会在该敌人所在处引发_第二次更小的爆炸_，每次射击一次。

actors.hero.skills.arrowstorm.name=箭雨
actors.hero.skills.arrowstorm.cast=箭如雨下！
actors.hero.skills.arrowstorm.desc=一只幽灵猛禽会向你选定的地点降雨般射下箭矢，持续_3回合_，伤害并残废其下每个敌人。\n\n_+1：_每轮齐射覆盖_3x3_范围，造成你弓伤害的_25%_。\n\n_+2：_每轮齐射造成_35%_，并沿十字延伸至_2格_外。\n\n_+3：_每轮齐射造成_45%_，且箭矢会留在地上_4回合_，伤害并残废踩上它们的任何东西。

actors.hero.skills.frostarrows.name=冰霜箭
actors.hero.skills.frostarrows.cast=冻住。
actors.hero.skills.frostarrows.desc=开启期间，你的远程命中会冻寒目标。\n\n_+1：_命中冻寒_3回合_。\n\n_+2：_冻寒_4回合_，且对已冻寒目标的伤害提高_15%_。\n\n_+3：_冻寒_5回合_，对已冻寒目标提高_15%_，并有_20%_几率改为将目标彻底冻结_2回合_。

actors.hero.skills.emberarrows.name=余烬箭
actors.hero.skills.emberarrows.cast=燃烧吧。
actors.hero.skills.emberarrows.desc=开启期间，你的远程命中会点燃目标。\n\n_+1：_目标_燃起火焰_。\n\n_+2：_火焰还会蔓延到目标身边的_1个敌人_。\n\n_+3：_被你射杀的燃烧敌人会_爆开_，点燃它身边的每个敌人。

actors.hero.skills.huntressfourth.name=绊线
actors.hero.skills.huntressfourth.desc=绊线让地面为你而战，总会在有东西踏入前一回合布好。

actors.hero.skills.groundwork.name=桩阵
actors.hero.skills.groundwork.desc=被你困住的敌人（定身、残废、眩晕、冰冻或沉睡）会被你绊线的木桩环住。击中它会扯动绊线，木桩便弹向它身边的每个敌人。\n\n_+1：_木桩造成该次命中的_20%_。\n\n_+2：_造成_35%_。\n\n_+3：_造成_50%_，并使其残废_2回合_。

actors.hero.skills.beartrap.name=捕熊夹
actors.hero.skills.beartrap.cast=小心脚下。
actors.hero.skills.beartrap.desc=在空地上布置钢齿；该格仍可通行并会反光，让你知道它等在哪里。第一个踩进去的地面敌人会流血、跛行并被锁在原地，每次挣动锁链都会受伤，直到锁链断裂。\n\n_+1：_咬合造成_4点_流血，锁链维持_7回合_。\n\n_+2：_咬合造成_6点_流血，锁链维持_9回合_。\n\n_+3：_咬合造成_8点_流血，锁链维持_11回合_，且锁链断裂时，钢齿咬合处会醒起一片_荆棘床_。
actors.hero.skills.beartrap.no_ground=那里没有地方布置钢齿。
actors.hero.skills.beartrap.occupied=那里已经布置了东西。

actors.hero.skills.deadfall.name=落木
actors.hero.skills.deadfall.cast=砸下来了。
actors.hero.skills.deadfall.desc=在一处你能看见的3x3区域上方架起重物。支架会在其中心吱嘎作响，维持_30回合_；第一个走到它下方的敌人会把它拉下，碾压并眩晕其下每个敌人。再次施放可提前砍断绳索。\n\n_+1：_造成你伤害的_140-280%_，眩晕_1回合_。\n\n_+2：_造成_200-400%_，眩晕_1回合_。\n\n_+3：_造成_260-520%_，眩晕_2回合_。已定身或残废的敌人承受_双倍_伤害。
actors.hero.skills.deadfall.no_vision=你看不见那个位置。

###duelist

actors.hero.skills.duelistpassivea.name=决斗家
actors.hero.skills.duelistpassivea.desc=决斗家依靠无懈可击的身法与体魄。

actors.hero.skills.conditioning.name=体魄
actors.hero.skills.conditioning.desc=当一次打击把你的生命值打到三分之一以下时，你的身体会奋起自愈。它永远不会救下致命一击。\n\n_+1：_每层一次，恢复最大生命值的_10%_。\n\n_+2：_每层一次，恢复_20%_。\n\n_+3：_恢复_30%_，且每层可以触发_两次_。

actors.hero.skills.poise.name=沉稳
actors.hero.skills.poise.desc=每次击杀都会稳定你的呼吸与脚步。\n\n_+1：_每次击杀恢复最大生命值的_1%_。\n\n_+2：_恢复_2%_。\n\n_+3：_恢复_3%_，并赋予你_短暂的疾速_。

actors.hero.skills.parrystance.name=招架架势
actors.hero.skills.parrystance.desc=用剑刃接住相邻敌人的打击，将其完全拨开，并立即反击，造成_60%武器伤害_。\n\n_+1：_有_10%_的打击被招架。\n\n_+2：_有_15%_被招架。\n\n_+3：_有_20%_被招架，且反击会横扫你身边的_每个敌人_。

actors.hero.skills.aplomb.name=从容
actors.hero.skills.aplomb.desc=生物软弱无力的打击会从你身上弹开，不留痕迹。\n\n_+1：_造成至多你最大生命值_3%_的打击会弹开。\n\n_+2：_至多_5%_，且近战攻击者的打击弹开后会陷入_恍惚_，持续_2回合_。\n\n_+3：_至多_7%_，且攻击者还会踉跄，_失去下一回合_。

actors.hero.skills.duelistpassiveb.name=剑术
actors.hero.skills.duelistpassiveb.desc=决斗家手握利刃时最为出色。

actors.hero.skills.precision.name=精准
actors.hero.skills.precision.desc=你对未受伤敌人的首次近战命中会找到其防御的破绽：一道钢光会标记它，你对它的打击会无视其护甲。\n\n_+1：_标记_2回合_。\n\n_+2：_标记_3回合_。\n\n_+3：_标记_4回合_，且杀死被标记的敌人会使钢光跃向_3格_内最近的敌人。

actors.hero.skills.weaponbond.name=武器羁绊
actors.hero.skills.weaponbond.desc=近战击杀会滋养你的刀刃：它会发光，直到你下一次施放武器技能，那一击会更重。\n\n_+1：_该技能伤害提高_20%_；光芒在_10回合_后消退。\n\n_+2：_提高_35%_；_10回合_后消退。\n\n_+3：_提高_50%_，光芒会持续到被消耗，且可_叠加两次_。

actors.hero.skills.blademastery.name=剑刃精通
actors.hero.skills.blademastery.desc=你击中的每个敌人都会被你看穿：一道小小的刀刃标记会显示出来，它对你出手时更容易落空。\n\n_+1：_它的打击落空几率提高_10%_。\n\n_+2：_提高_20%_。\n\n_+3：_提高_30%_，且看穿一个敌人也会看穿它身边的敌人。

actors.hero.skills.trueedge.name=真刃
actors.hero.skills.trueedge.desc=近战暴击会多造成_50%_伤害，其斩击还会继续切向身后的敌人，造成一半伤害。\n\n_+1：_暴击几率_5%_。斩击延伸至身后_1格_。\n\n_+2：_几率_10%_，延伸至_2格_。\n\n_+3：_几率_15%_，延伸至_3格_，且被斩到的一切都会_流血_。

actors.hero.skills.finessegrip.name=巧劲握法
actors.hero.skills.finessegrip.desc=徒手或使用1-3阶武器时，你的近战命中可以飞快地补上第二刀，造成该次命中的_40%_。\n\n_+1：_几率_15%_。\n\n_+2：_几率_25%_。\n\n_+3：_几率_35%_，且命中的第二刀可以同样的几率再补上_第三刀_。

actors.hero.skills.brutalgrip.name=蛮力握法
actors.hero.skills.brutalgrip.desc=使用4-5阶武器时，你的近战命中可以重压目标，多造成_50%_伤害并使其_残废_。\n\n_+1：_几率_15%_。\n\n_+2：_几率_25%_。\n\n_+3：_几率_35%_，且被重压的敌人会被抛退_2格_。

actors.hero.skills.duelistactive.name=剑技
actors.hero.skills.duelistactive.desc=突入、旋过人群，让剑刃脱手飞出，再转回手中。

actors.hero.skills.lunge.name=突刺
actors.hero.skills.lunge.cast=突刺！
actors.hero.skills.lunge.desc=跃向一个敌人，以_125%武器伤害_攻击它，武器效果也包含在内。突刺之后你需要片刻恢复才能再次突刺。\n\n_+1：_可突刺最远_3格_外的敌人。\n\n_+2：_可达_4格_，并可在2回合内对不同敌人连用_2次突刺_，之后才需恢复。\n\n_+3：_可达_5格_，并可在恢复前连用_3次突刺_。每次疾冲都会留下一道_剑痕_，一回合后闭合，使敌人流血。

actors.hero.skills.ripostestance.name=还击
actors.hero.skills.ripostestance.cast=还击！
actors.hero.skills.ripostestance.desc=摆出决斗架势。开启期间，每次落空你身上的近战挥击都会立刻换来你剑刃的一记还击，消耗魔力。\n\n_+1：_还击造成一次武器伤害的_50%_。\n\n_+2：_还击造成_70%_。\n\n_+3：_还击造成_90%_，且被还击的敌人会陷入_易伤_2回合。

actors.hero.skills.whirlingflurry.name=回旋连斩
actors.hero.skills.whirlingflurry.cast=连斩！
actors.hero.skills.whirlingflurry.desc=原地旋身，斩向周围的每个敌人。\n\n_+1：_对每个相邻敌人造成_70%武器伤害_。\n\n_+2：_造成_90%武器伤害_，且斩击会使敌人_流血_。\n\n_+3：_造成_110%武器伤害_，并有_幽灵军刀_环绕你3回合，切割相邻敌人。

actors.hero.skills.impalingthrust.name=贯穿突刺
actors.hero.skills.impalingthrust.cast=贯穿！
actors.hero.skills.impalingthrust.desc=朝一条直线刺出，贯串触及范围内每个敌人，造成_80%武器伤害_并使其流血。\n\n_+1：_突刺可达_3格_。\n\n_+2：_可达_4格_。\n\n_+3：_可达_5格_，且_幽灵长枪_会在接下来2回合沿其路径喷涌而出。
actors.hero.skills.impalingthrust.no_target=触及范围内空无一物。

actors.hero.skills.duelistfourth.name=步法
actors.hero.skills.duelistfourth.desc=步法让决斗家始终在动：绕到敌人身侧，忽进忽退，并斩倒任何想后退的东西。

actors.hero.skills.sidestep.name=侧步
actors.hero.skills.sidestep.desc=从敌人身边的一格踏到它身边的另一格，它会朝空处挥空，陷入_恍惚_。\n\n_+1：_恍惚_1回合_。\n\n_+2：_恍惚_2回合_。\n\n_+3：_恍惚_3回合_，且你对绕过的敌人的下一次命中_必定命中_，并多造成_30%_伤害。

actors.hero.skills.fleche.name=弓步刺
actors.hero.skills.fleche.cast=预备！
actors.hero.skills.fleche.desc=疾冲向一个敌人，以_130%武器伤害_攻击它，然后弹回你出发的那一格。被定身时你无法奔跑。\n\n_+1：_可触及最远_4格_外的敌人。\n\n_+2：_可触及最远_5格_外的敌人。\n\n_+3：_可达_6格_，且击杀目标的弓步刺_不消耗魔力_。
actors.hero.skills.fleche.no_target=触及范围内没有目标。
actors.hero.skills.fleche.no_room=没有空间靠近。

actors.hero.skills.countertime.name=逆时斩
actors.hero.skills.countertime.desc=在敌人退出你触及范围的瞬间把握出剑时机：它后撤时会承受一次武器伤害的一半。\n\n_+1：_有_20%_几率斩中后撤的敌人。\n\n_+2：_几率_35%_。\n\n_+3：_几率_50%_，且被斩中的敌人会_残废_2回合。

actors.hero.skills.pirouette.name=旋身步
actors.hero.skills.pirouette.cast=脱出距离！
actors.hero.skills.pirouette.desc=从身边的敌人中旋身离开，落到你选定的一格，并在护盾后落地。被定身时你无法旋身。\n\n_+1：_最多旋身_2格_，落地时获得相当于最大生命值_3%_的护盾。\n\n_+2：_最多_3格_，护盾_6%_。\n\n_+3：_最多_4格_，护盾_9%_，且被你甩下的敌人会_晕眩_2回合。

actors.hero.skills.bladebind.name=格剑
actors.hero.skills.bladebind.cast=锁住！
actors.hero.skills.bladebind.desc=与相邻敌人锁住剑刃：两剑铿然相交，它的打击会被_削弱_。\n\n_+1：_削弱_4回合_。\n\n_+2：_削弱_6回合_。\n\n_+3：_削弱_8回合_，且你把它拧得失衡：它的下一次攻击会_落空_，并使其陷入_易伤_3回合。
actors.hero.skills.bladebind.no_target=你需要一个紧贴身边的敌人才能格剑。

###cleric

actors.hero.skills.clericpassivea.name=牧师
actors.hero.skills.clericpassivea.desc=牧师的信仰是一口魔力之井，当死亡逼近时它便会回应。

actors.hero.skills.faith.name=信仰
actors.hero.skills.faith.desc=每层一次，当一次打击把你打到半血以下时，一道金色闪光会以魔力回应你的祈祷。\n\n_+1：_恢复_8点魔力_。\n\n_+2：_恢复_12点魔力_。\n\n_+3：_恢复_16点魔力_，且那道光会挡下该次打击的_6点伤害_。

actors.hero.skills.grace.name=恩典
actors.hero.skills.grace.desc=你杀死的每个敌人都会释放一点光尘，飞回你身上化为魔力。\n\n_+1：_每次击杀恢复_1点魔力_。\n\n_+2：_恢复_2点魔力_。\n\n_+3：_恢复_3点魔力_。若你的魔力已满，那道光会改为恢复你最大生命值的_3%_。

actors.hero.skills.sanctuary.name=圣所
actors.hero.skills.sanctuary.desc=结界开启期间，原地坚守_3回合_会消耗_3点魔力_，在你周围祝圣一圈光环，持续_3回合_：它会治疗你与盟友，并在敌人体内聚集光芒，在光环消散时爆开。\n\n_+1：_光环覆盖你周围_1格_。\n\n_+2：_覆盖_2格_。\n\n_+3：_覆盖_2格_。关闭结界可_让所有光环同时爆开_，把其中的敌人向外抛飞。

actors.hero.skills.lastrites.name=临终圣礼
actors.hero.skills.lastrites.cast=还没到时候！
actors.hero.skills.lastrites.desc=当一次攻击即将杀死你，而你至少拥有_%1$d点魔力_时，这些魔力会被消耗，你将在一道光柱中存活。\n\n_+1：_恢复_3点生命值_，并获得_10回合_祝福。\n\n_+2：_恢复_5点生命值_，祝福_15回合_。\n\n_+3：_恢复_7点生命值_，祝福_20回合_。光还会使每个相邻敌人失明_3回合_。
actors.hero.skills.lastrites.trigger=你的临终圣礼挡住了死亡！

actors.hero.skills.asceticvow.name=苦修誓约
actors.hero.skills.asceticvow.desc=你用治疗祈祷、群体治疗或连祷祈祷回来的生命值，会以魔力的形式回到你身上。\n\n_+1：_每恢复_6点生命值_获得_1点魔力_。\n\n_+2：_每恢复_5点生命值_获得_1点魔力_。\n\n_+3：_每恢复_4点生命值_获得_1点魔力_，且每次得到回应的祈祷都会祝福你_5回合_。

actors.hero.skills.bloodtithe.name=血税
actors.hero.skills.bloodtithe.desc=当技能消耗的魔力超过你拥有的量时，差额由鲜血支付，生命值不足时无法使用。\n\n_+1：_每缺1点魔力支付_3点生命值_。\n\n_+2：_每缺1点支付_2点生命值_。\n\n_+3：_每缺1点支付_2点生命值_，且在_3回合_内击杀会回复你所付鲜血的_一半_。

actors.hero.skills.clericpassiveb.name=热忱
actors.hero.skills.clericpassiveb.desc=牧师的武器是圣光的容器，挥击时满含热忱。

actors.hero.skills.righteousstrikes.name=正义打击
actors.hero.skills.righteousstrikes.desc=每_第三次_近战命中都会释放一阵圣光，在敌人之间跳跃，对每个敌人造成你伤害的_100%_，对亡灵与恶魔则翻倍。\n\n_+1：_圣光会弹向_1个额外敌人_。\n\n_+2：_弹向_2个额外敌人_。\n\n_+3：_弹向_3个额外敌人_，然后_回到你身上_，每命中一个敌人便恢复你最大生命值的_1%_。

actors.hero.skills.zealpassive.name=虔诚
actors.hero.skills.zealpassive.desc=近战击杀会点燃圣焰。你_5回合_内的下一次近战命中会爆出火焰。\n\n_+1：_爆发造成你伤害的_80%_。\n\n_+2：_造成_140%_。\n\n_+3：_造成_200%_，并吞没目标身边的每个敌人。

actors.hero.skills.sacredweapon.name=圣化武器
actors.hero.skills.sacredweapon.desc=近战命中时有_20%_几率使一把你武器的幽灵复制品从天而降。它会插在目标身边的地上，并在_3回合_内切割其旁的一个敌人，造成_35%武器伤害_。\n\n_+1：_同时至多存在_1把剑_。\n\n_+2：_至多_2把剑_。\n\n_+3：_至多_3把剑_，且消逝的剑会_飞向最近的敌人_，对4格内目标造成_50%武器伤害_。

actors.hero.skills.divinewrath.name=神圣之怒
actors.hero.skills.divinewrath.desc=神圣之怒开启期间，每次近战命中都会消耗魔力祝圣地面。站在圣地上的敌人每回合承受你伤害_80%_的灼烧，亡灵与恶魔则翻倍，直到_3回合_后消退。它无法与神圣惩击同时开启。\n\n_+1：_目标的格子被祝圣。\n\n_+2：_目标的格子及其_周围每一格_都被祝圣。\n\n_+3：_目标的格子及周围每一格，且圣地上的敌人会被_定在原地_。

actors.hero.skills.crusaderszeal.name=十字军热忱
actors.hero.skills.crusaderszeal.desc=在你无人阻挡地进攻时，热忱会不断积累。每次近战命中都会在你头顶添一簇火焰，每簇火焰让你的打击重上_10%_，而受到一次打击便会熄灭全部。\n\n_+1：_至多_2簇火焰_。\n\n_+2：_至多_3簇火焰_。\n\n_+3：_至多_4簇火焰_，且在热忱全满时打出的一击会_爆出圣光_，使身边的敌人失明_2回合_。

actors.hero.skills.shieldofthefaithful.name=信者之盾
actors.hero.skills.shieldofthefaithful.desc=一面光盾悬在你与你所能看见的最近敌人之间，挡下该敌人每次打击的_30%_。挡下足够多的打击后它会黯淡消失，并在_15回合_后重新成形。\n\n_+1：_光盾挡下_2次打击_。\n\n_+2：_挡下_3次打击_。\n\n_+3：_挡下_4次打击_，且它挡下的远程打击会被_掷回_射手身上。

actors.hero.skills.clericactive.name=神迹
actors.hero.skills.clericactive.desc=牧师唤下神迹：惩击的圣光、治疗的祈祷，以及守护之灵。

actors.hero.skills.holysmite.name=神圣惩击
actors.hero.skills.holysmite.cast=惩击！
actors.hero.skills.holysmite.desc=神圣惩击开启期间，每次近战打击都会消耗魔力，召下一柄光锤砸向目标，并把附近敌人向它拖近_1格_。它无法与神圣之怒同时开启。\n\n_+1：_拖动目标_2格_内的敌人。\n\n_+2：_拖动_3格_内的敌人。\n\n_+3：_拖动_3格_内的敌人，且被光锤波及的每个敌人都会受到该次打击_一半_的伤害。

actors.hero.skills.healingprayer.name=治疗祈祷
actors.hero.skills.healingprayer.cast=愈合
actors.hero.skills.healingprayer.desc=在炽天使之翼下祈祷，你的伤口会立刻闭合。\n\n_+1：_恢复最大生命值的_10%_。\n\n_+2：_恢复_15%_。\n\n_+3：_恢复_20%_。超过满血的治疗会化为一道_光之屏障_，上限为最大生命值的_20%_。

actors.hero.skills.guardianspirit.name=守护之灵
actors.hero.skills.guardianspirit.cast=守护我
actors.hero.skills.guardianspirit.desc=在6格内一处你能看见的格子上召唤一只漂浮的守护之眼。它拥有生命值，会向敌人发射随你伤害增强的激光，持续_一个游戏内白昼_后消散。\n\n_+1：_最大生命值等于你的_100%_；激光造成你伤害的_60%_。\n\n_+2：_最大生命值等于你的_150%_；激光造成_80%_。\n\n_+3：_最大生命值等于你的_200%_；激光造成_100%_。你可以_透过它的眼睛视物_，再次施放（无需消耗）即可命令它：选择本层_任何你见过的格子_，它会闪现过去守住那里；或选择它6格内的一个敌人，发射一道造成你伤害_240%_的激光。它承受的打击会为其光环充能，并加进那道激光之中。

actors.hero.skills.avataroflight.name=光之化身
actors.hero.skills.avataroflight.cast=成为我的光！
actors.hero.skills.avataroflight.desc=化身为光之化身：你获得祝福，一圈炽烈光环环绕着你。每个敌人首次进入光环时，一道射线会灼烧它，造成你伤害的_120%_，对亡灵与恶魔翻倍，并使其失明_3回合_。\n\n_+1：_持续_7回合_，光环覆盖_1格_。\n\n_+2：_持续_10回合_，覆盖_2格_。\n\n_+3：_持续_13回合_，且光环内的盟友会获得_祝福_，每回合恢复其最大生命值的_1%_。

actors.hero.skills.clericfourth.name=审判庭
actors.hero.skills.clericfourth.desc=审判官裁决不洁者，给他们打上印记，焚烧他们，并击垮他们的意志。

actors.hero.skills.condemn.name=判处有罪
actors.hero.skills.condemn.desc=你可以用圣光给敌人打上印记，使其陷入易伤。\n\n_+1：_命中时有_12%_几率打上_4回合_的印记。\n\n_+2：_有_24%_几率打上_5回合_的印记。\n\n_+3：_有_36%_几率打上_6回合_的印记。亡灵与恶魔_必定_被打上印记，且印记会灼烧它们，造成_120%_的伤害。

actors.hero.skills.scouringflame.name=涤罪之焰
actors.hero.skills.scouringflame.cast=焚净！
actors.hero.skills.scouringflame.desc=向你瞄准的方向扫出一道白焰锥形。它对亡灵与恶魔的灼烧加倍。\n\n_+1：_锥形可达_3格_，造成你伤害的_140%_。\n\n_+2：_可达_4格_，造成_200%_。\n\n_+3：_可达_5格_，造成_260%_，并让幸存者失明_3回合_。
actors.hero.skills.scouringflame.no_target=选择一个格子作为火焰的目标。

actors.hero.skills.reckoning.name=清算
actors.hero.skills.reckoning.cast=审判！
actors.hero.skills.reckoning.desc=审判降临在_%1$d格_内视野中的每个敌人身上。未被打上印记的敌人会立即被打上易伤印记。已带上印记的敌人则会被_结算印记_：一道光柱灼烧它，在其印记剩余的每回合造成你伤害的_60%%_，对亡灵与恶魔翻倍。\n\n_+1：_新印记持续_4回合_。\n\n_+2：_持续_6回合_。\n\n_+3：_持续_8回合_，且光柱还会打击每个受审的敌人，造成你伤害的_120%%_，对亡灵与恶魔翻倍。

###subclass branches

actors.hero.skills.subbranch.berserker.name=狂战士
actors.hero.skills.subbranch.berserker.desc=狂战士以一切换取怒火。
actors.hero.skills.subbranch.gladiator.name=角斗士
actors.hero.skills.subbranch.gladiator.desc=角斗士主宰整座竞技场。
actors.hero.skills.subbranch.battlemage.name=战斗法师
actors.hero.skills.subbranch.battlemage.desc=战斗法师将钢铁与法术交织为一。
actors.hero.skills.subbranch.warlock.name=术士
actors.hero.skills.subbranch.warlock.desc=术士与更为黑暗的力量做交易。
actors.hero.skills.subbranch.assassin.name=刺客
actors.hero.skills.subbranch.assassin.desc=刺客在战斗开始之前就将其终结。
actors.hero.skills.subbranch.freerunner.name=疾行者
actors.hero.skills.subbranch.freerunner.desc=疾行者从不停下脚步。
actors.hero.skills.subbranch.sniper.name=狙击手
actors.hero.skills.subbranch.sniper.desc=狙击手让每一箭都不虚发。
actors.hero.skills.subbranch.warden.name=守望者
actors.hero.skills.subbranch.warden.desc=守望者与荒野融为一体。
actors.hero.skills.subbranch.champion.name=勇士
actors.hero.skills.subbranch.champion.desc=勇士身先士卒，领众向前。
actors.hero.skills.subbranch.monk.name=武僧
actors.hero.skills.subbranch.monk.desc=武僧根本不需要武器。
actors.hero.skills.subbranch.priest.name=祭司
actors.hero.skills.subbranch.priest.desc=祭司让每个人都屹立不倒。
actors.hero.skills.subbranch.paladin.name=圣骑士
actors.hero.skills.subbranch.paladin.desc=圣骑士是光明之壁垒。

actors.hero.skills.carnage.name=屠戮
actors.hero.skills.carnage.desc=屠杀滋养你的狂怒：每次近战击杀都会积攒怒气。\n\n_+1：_每次击杀积攒_10%_怒气。\n\n_+2：_积攒_20%_怒气。\n\n_+3：_积攒_30%_怒气，且在狂暴状态下击杀会补充相当于最大生命值_5%_的狂暴护盾。

actors.hero.skills.bloodrush.name=浴血冲锋
actors.hero.skills.bloodrush.cast=鲜血！
actors.hero.skills.bloodrush.desc=沿直线冲锋，身后拖出一道血迹。路径上的每个敌人都会被撞开，受到_50%_武器伤害；若有敌人纹丝不动，冲锋便会中止。\n\n_+1：_最多冲锋_3格_。\n\n_+2：_最多_4格_。\n\n_+3：_最多_5格_，且奔袭会替你撕开_缠绕_、_残废_与_缓慢_，让你在被制住时也能冲锋。

actors.hero.skills.undyingwill.name=不灭意志
actors.hero.skills.undyingwill.cast=我不会倒下
actors.hero.skills.undyingwill.desc=升起一道猩红护幕，以怒气为食：它吸收的每一点伤害都会充盈你的狂怒。当打击将它击碎时你会怒吼，附近每个敌人都会转而攻击你。\n\n_+1：_护幕值为你最大生命值的_10%_。\n\n_+2：_护幕为_15%_。\n\n_+3：_护幕为_20%_，且它持续期间，致命一击只会把你留在_1点生命值_。

actors.hero.skills.comboopener.name=开场一击
actors.hero.skills.comboopener.desc=角斗士以一道冲击波开场：对满生命值敌人的一次近战命中会使其_恍惚_并将其抛退。\n\n_+1：_恍惚_2回合_，抛退_1格_。\n\n_+2：_恍惚_3回合_，抛退_2格_。\n\n_+3：_恍惚_4回合_，且冲击波还会把你身旁的_其他每个敌人_都抛退_1格_。

actors.hero.skills.warcry.name=战吼
actors.hero.skills.warcry.cast=啊啊啊啊！
actors.hero.skills.warcry.desc=放声怒吼，视野内每个敌人都会因恐惧而逃离你。\n\n_+1：_敌人逃跑_3回合_。\n\n_+2：_逃跑_4回合_。\n\n_+3：_逃跑_5回合_，并陷入_虚弱_同样长的时间。

actors.hero.skills.finishingblow.name=终结一击
actors.hero.skills.finishingblow.cast=终结他！
actors.hero.skills.finishingblow.desc=若一次近战命中后敌人剩余的生命值低于该次命中伤害的一部分，它便会被直接斩杀。首领与次级首领免疫。\n\n_+1：_敌人剩余生命值不高于该次命中的_20%_时处决。\n\n_+2：_不高于_35%_时。\n\n_+3：_不高于_50%_时，且处决会喷出鲜血，使其身旁的敌人_失明_，持续_2回合_。

actors.hero.skills.spellblade.name=法术之刃
actors.hero.skills.spellblade.desc=你的近战攻击可以从敌人身上汲取魔力，化作火花涌入你体内。\n\n_+1：_近战命中时有_15%_几率恢复_2点魔力_。\n\n_+2：_有_30%_几率恢复_3点魔力_。\n\n_+3：_有_45%_几率恢复_4点魔力_。若你的魔力已满，该次命中改为造成_4点额外伤害_。

actors.hero.skills.manashield.name=魔力护盾
actors.hero.skills.manashield.cast=奥术护幕
actors.hero.skills.manashield.desc=以水晶护幕裹住自己，它能吸收伤害并缓缓消褪。当打击将它击碎时，碎片会沉入你的武器：接下来每次近战命中都会消耗一片，额外造成你伤害_60-160%_的魔法伤害。\n\n_+1：_护幕可挡下相当于你最大生命值_8%_的伤害，并充能_2次命中_。\n\n_+2：__12%_，_3次_。\n\n_+3：__16%_，_4次_，且它首次破碎时会以一半强度_重新成形_。

actors.hero.skills.arcaneecho.name=奥术回响
actors.hero.skills.arcaneecho.desc=你的近战攻击能够回响，伴随一道闪电再次打击。\n\n_+1：_近战命中时有_10%_几率回响，造成你伤害的_40-120%_。\n\n_+2：_有_20%_几率回响，造成_40-160%_。\n\n_+3：_有_30%_几率回响，造成_40-200%_，且回响会继续弧向_另一个_相邻敌人。

actors.hero.skills.souldrain.name=灵魂汲取
actors.hero.skills.souldrain.desc=被你标记的灵魂无法安息。带有灵魂印记的敌人死亡时，其灵魂会飞向触及范围内最近的敌人并同样标记它，让你的施放持续为你提供滋养。\n\n_+1：_灵魂最远飞行_3格_。\n\n_+2：_最远_4格_。\n\n_+3：_最远_5格_，且它会先_穿过你_，恢复你最大生命值的_3%_。

actors.hero.skills.hex.name=幻惑
actors.hero.skills.hex.cast=受苦吧
actors.hero.skills.hex.desc=对一个你能看见的敌人施以幻惑，使其造成的伤害降低、受到的伤害提高。\n\n_+1：_幻惑持续_5回合_。\n\n_+2：_持续_7回合_。\n\n_+3：_持续_9回合_，并使该敌人_残废5回合_。

actors.hero.skills.darkpact.name=黑暗契约
actors.hero.skills.darkpact.cast=我的血，我的力量
actors.hero.skills.darkpact.desc=以最大生命值的十分之一换取一阵魔力涌动。若代价会致你于死地，契约拒绝成立。\n\n_+1：_恢复_15点魔力_。\n\n_+2：_恢复_20点魔力_。\n\n_+3：_恢复_25点魔力_，且溅出的鲜血会鞭打每个相邻敌人，造成所付生命值一半的伤害。

actors.hero.skills.ambush.name=伏击
actors.hero.skills.ambush.desc=你对每个敌人的首次突袭（无论近战还是投掷）都会将一枚暗影木桩钉进它的影子，把它_钉住_在原地。\n\n_+1：_钉住_2回合_。\n\n_+2：_钉住_3回合_。\n\n_+3：_钉住_4回合_，且目标身旁的每个敌人也会被_钉桩_。

actors.hero.skills.garrote.name=绞索
actors.hero.skills.garrote.desc=一道来自背后的钢丝：对正忙于与他人交战（你的暗影、分身、盟友或发狂的敌人）的敌人近战命中时，钢丝会绕上它的喉咙，并必定使其流血。\n\n_+1：_造成_3点流血_。\n\n_+2：_造成_4点流血_。\n\n_+3：_造成_5点流血_，且这一绞会使其_残废_，持续_2回合_。

actors.hero.skills.vanish.name=隐匿
actors.hero.skills.vanish.cast=...
actors.hero.skills.vanish.desc=不消耗回合地没入暗影。追猎你的敌人会失去你的踪迹，因此你对它们各自的下一次打击都是突袭。\n\n_+1：__3格_内的敌人会失去你。\n\n_+2：__5格_内的敌人会失去你。\n\n_+3：_视野内_每个敌人_都会失去你，且你会保持_隐形_，持续_3回合_。

actors.hero.skills.slipstream.name=滑流
actors.hero.skills.slipstream.cast=来抓我呀！
actors.hero.skills.slipstream.desc=拔腿飞奔_6回合_，在你身后的格子上留下_10回合_的旋风。踏入旋风的敌人会被_绊倒_并失去一回合。\n\n_+1：_风会保留你最后经过的_4格_。\n\n_+2：_最后_6格_。\n\n_+3：_最后_8格_，且再次施放可免费_乘风回溯_到风的尽头，绊倒沿途每个敌人。

actors.hero.skills.parkour.name=跑酷
actors.hero.skills.parkour.desc=移动中的目标难以命中。若你上一回合移动过，近战攻击可能完全落空——你会_翻滚1格_避开攻击者。\n\n_+1：_从_15%_的这类攻击中滚开。\n\n_+2：_从_25%_中滚开。\n\n_+3：_从_35%_中滚开，且在空间足够时_撑越_攻击者，落到它身后。

actors.hero.skills.momentummaster.name=动势大师
actors.hero.skills.momentummaster.desc=近战击杀后若你身边没有敌人，你会沿弧线跃起，落到你能看见的最近敌人身旁。\n\n_+1：_最多跃_2格_。\n\n_+2：_最多_3格_。\n\n_+3：_最多_4格_，且你下一次命中该敌人的近战攻击是_俯冲打击_，伤害_+50%_。

actors.hero.skills.overwatch.name=警戒射击
actors.hero.skills.overwatch.desc=守住阵线：你的远程命中可以击退目标。无法移动的目标会在原地承受全部力道。\n\n_+1：_有_20%_几率将其推开_2格_。\n\n_+2：_有_30%_几率推开_2格_。\n\n_+3：_有_40%_几率推开_3格_，且被撞上障碍或原地被钉住的目标会陷入眩晕。

actors.hero.skills.headshot.name=爆头
actors.hero.skills.headshot.cast=爆头！
actors.hero.skills.headshot.desc=远程命中偶尔会击碎目标的头骨，造成_150%_伤害，并将其掀翻在地一回合。\n\n_+1：_爆头几率_10%_。\n\n_+2：_爆头几率_15%_。\n\n_+3：_几率_20%_，且碎裂声回荡开来：目标身旁的敌人会_踉跄_，持续_3回合_。

actors.hero.skills.piercingfocus.name=穿刺专注
actors.hero.skills.piercingfocus.cast=专注...
actors.hero.skills.piercingfocus.desc=将准星扫过视野内每个敌人：被锁定的敌人都会陷入压制，命中与闪避都只剩一半。\n\n_+1：_压制_5回合_。\n\n_+2：_压制_7回合_。\n\n_+3：_压制_9回合_，且你能感知本层每个敌人_10回合_。

actors.hero.skills.thorns.name=荆棘
actors.hero.skills.thorns.desc=你的箭矢与投掷武器会在命中的目标身上留下一根荆棘。该敌人下次移动时，荆棘会生出带刺的藤蔓抽打它。\n\n_+1：_藤蔓抽打造成你伤害的_40%_。\n\n_+2：_造成_80%_。\n\n_+3：_造成_120%_，并_缠绕_它_1回合_。

actors.hero.skills.symbiosis.name=共生
actors.hero.skills.symbiosis.desc=当敌人的打击落到你身上时，有_25%_几率会有叶片从你体内迸出，在接下来几回合里修补你失去的部分生命值。\n\n_+1：_修补其中_30%_。\n\n_+2：_修补_45%_。\n\n_+3：_修补_60%_，且在叶片修补你期间，击中你的敌人会被缠身的藤蔓_减缓_，持续_3回合_。

actors.hero.skills.wildcall.name=荒野呼唤
actors.hero.skills.wildcall.cast=到我身边！
actors.hero.skills.wildcall.desc=标记一个你能看见的敌人，一头幽灵狼会从灌木中扑出，只追猎这个猎物。它无法被击中，每回合都会撕咬，并在猎物死亡或_10回合_后消散。\n\n_+1：_狼的撕咬造成你伤害的_80-180%_。\n\n_+2：_造成_120-220%_。\n\n_+3：_造成_160-260%_，且猎物死亡时它会_循迹_转向视野内最近的敌人。

actors.hero.skills.banner.name=战旗
actors.hero.skills.banner.desc=每次近战击杀都会在敌人倒下处插下你的战旗。每回合，你与战旗_2格_内的盟友都会升起一层屏障。\n\n_+1：_战旗矗立_6回合_。屏障成长为最大生命值的_5%_。\n\n_+2：_矗立_8回合_。屏障成长为_10%_。\n\n_+3：_矗立_10回合_。屏障成长为_15%_，且战旗附近的敌人会陷入_恍惚_。

actors.hero.skills.secondwind.name=回气
actors.hero.skills.secondwind.cast=再来一口气！
actors.hero.skills.secondwind.desc=喘匀这口气：你的武器技能会立刻恢复充能，并伴有一道绿色闪光。\n\n_+1：_恢复_1点充能_。\n\n_+2：_恢复_2点充能_。\n\n_+3：_恢复_3点充能_，且你可以把充能_超载_一点。

actors.hero.skills.challenge.name=挑战
actors.hero.skills.challenge.cast=面对我！
actors.hero.skills.challenge.desc=发出挑战的咆哮：视野内每个敌人都会前来与你对峙，每一个应战者都会让你的防御更加坚固。\n\n_+1：_每个应战者提供相当于最大生命值_2%_的护盾。\n\n_+2：_每个提供_3%_的护盾。\n\n_+3：_每个提供_4%_的护盾，且接下来_5回合_内每次击杀都会返还_2点魔力_。

actors.hero.skills.pressurepoint.name=点穴
actors.hero.skills.pressurepoint.desc=击打那些能让身体僵住不动的神经。\n\n_+1：_近战命中时有_10%_几率使非首领敌人麻痹一回合。\n\n_+2：_几率提高到_15%_。\n\n_+3：_几率提高到_20%_，且对已麻痹敌人的命中造成_50%额外_伤害。

actors.hero.skills.innerpeace.name=内心平静
actors.hero.skills.innerpeace.desc=平静的心境让伤害从身上滑落。当残废、虚弱、失明、眩晕或恐惧将要缠上你时，你可以一口白气将其吐散。毒素、流血及其他持续伤害无法被吐出。\n\n_+1：_几率_15%_。\n\n_+2：_几率_25%_。\n\n_+3：_几率_35%_，且每吐散一种都会恢复_2点魔力_。

actors.hero.skills.dragonkick.name=龙踢
actors.hero.skills.dragonkick.cast=喝啊！
actors.hero.skills.dragonkick.desc=沿直线飞向一个敌人，踢出一脚将其击飞。被踢的身体会撞穿路径上的每个敌人，各自承受这一脚的伤害并被撞开一格。若它撞上墙壁，会再承受一次这一脚的伤害并陷入_恍惚2回合_。此技能无视你的武器。\n\n_+1：_最多飞_2格_；击飞_2格_；造成你伤害的_100-240%_。\n\n_+2：_最多飞_3格_；击飞_3格_；造成_140-320%_。\n\n_+3：_最多飞_4格_；击飞_4格_；造成_180-400%_，且它落地处周围的敌人会陷入_恍惚2回合_。

actors.hero.skills.litany.name=连祷
actors.hero.skills.litany.desc=你每施放一个技能（开关不算）都会念出一节祷文：一个音符升起，你与2格内的盟友得到治疗。\n\n_+1：_恢复最大生命值的_2%_。\n\n_+2：_恢复最大生命值的_4%_。\n\n_+3：_恢复最大生命值的_6%_，且每_第三节_还会祝福所有被治疗者_3回合_。

actors.hero.skills.massheal.name=群体治疗
actors.hero.skills.massheal.cast=愈合吧！
actors.hero.skills.massheal.desc=炽天使之翼覆落于你，在停留的每回合治疗你与_2格_内的每个盟友。\n\n_+1：_双翼停留_3回合_，每回合恢复最大生命值的_4%_。\n\n_+2：_停留_4回合_，并在消褪时以你伤害的_260%_打击2格内的敌人。\n\n_+3：_停留_5回合_，且超过满血的治疗会凝结为_光之碎片_，挡下接下来部分打击并反击最近的敌人。

actors.hero.skills.purify.name=净化
actors.hero.skills.purify.cast=退散！
actors.hero.skills.purify.desc=一道纯净之光燃尽毒素、流血、残废、虚弱、失明与易伤。\n\n_+1：_净化你自身。\n\n_+2：_还会烧尽_幻惑、降级与腐蚀淤泥_，并净化视野内每个盟友。\n\n_+3：_还能从你身上驱除燃烧、恐惧与缓慢，并祝福你_2回合_。

actors.hero.skills.aegis.name=圣盾
actors.hero.skills.aegis.desc=一面光之盾会拦下一次沉重的近战打击（达到你最大生命值的十分之一或更多），吞下其中_一半_，并将攻击者击退。它需要_8回合_才能重新成形。\n\n_+1：_击退会把攻击者向后抛_1格_。\n\n_+2：_向后抛_2格_。\n\n_+3：_向后抛_3格_，且盾牌吞下的那一半会_反砸_回攻击者身上。

actors.hero.skills.holycharge.name=圣光冲锋
actors.hero.skills.holycharge.cast=为了光明！
actors.hero.skills.holycharge.desc=举起盾牌，化作一道光冲锋。挡路的第一个敌人会被推在你身前直到冲锋终点，若它撞上墙壁或生物，便会_眩晕2回合_。\n\n_+1：_最多冲锋_3格_。\n\n_+2：_最多_5格_。\n\n_+3：_最多_7格_，且光芒会使你路径旁的每个敌人_失明_。

actors.hero.skills.retribution.name=报应
actors.hero.skills.retribution.desc=敌人落在你身上的每一击都会在它身上留下一道金色的债务烙印。你对该敌人的下一次近战命中会以圣光偿还这笔债务，对亡灵与恶魔则是双倍。\n\n_+1：_债务为其对你造成的伤害的_30%_。\n\n_+2：_债务为_45%_。\n\n_+3：_债务为_60%_，且数额达到_10_或更多时，会爆向2格内_另一个敌人_，造成一半伤害。

actors.hero.skills.leap.name=跃击
actors.hero.skills.leap.cast=哈呀！
actors.hero.skills.leap.desc=跃向视野内的一个敌人，落在它身旁并挥落武器，使其_眩晕1回合_。被缠绕时无法跃击。\n\n_+1：_最远跃_3格_，造成_110%_伤害。\n\n_+2：_最远跃_4格_，造成_120%_伤害。\n\n_+3：_最远跃_5格_，造成_130%_伤害。落地的冲击会把身旁其他每个敌人抛退_1格_。
actors.hero.skills.leap.prompt=选择要跃击的敌人
actors.hero.skills.leap.no_target=你需要在视野内有一个可供跃击的敌人。
actors.hero.skills.leap.too_far=那超出了你的跃击距离。
actors.hero.skills.leap.no_path=前方有一堵墙。
actors.hero.skills.leap.no_room=它身旁没有落脚的地方。

actors.hero.skills.chargedshot.name=蓄力射击
actors.hero.skills.chargedshot.cast=放！
actors.hero.skills.chargedshot.desc=站定拉弓数回合，其间无法行动，然后射出一支必中的箭。它笔直穿过墙壁与直线上的每个敌人，身后拖着一道光束。\n\n_+1：_拉弓_10回合_。箭飞行_10格_，造成弓伤害的_150%_。\n\n_+2：_拉弓_7回合_。箭飞行_12格_，造成弓伤害的_175%_。\n\n_+3：_拉弓_5回合_。箭飞行_14格_，造成弓伤害的_200%_，并使其穿过的每个目标陷入_易伤_，持续3回合。
actors.hero.skills.chargedshot.prompt=选择射击的方向
actors.hero.skills.chargedshot.no_target=选一个格子作为射击方向。

actors.hero.skills.tengusarsenal.name=天狗的军械库
actors.hero.skills.tengusarsenal.cast=接住！
actors.hero.skills.tengusarsenal.desc=天狗的把戏，看他使过便学会了。选一枚炸弹投出。烟雾弹与电击器绝不会伤到你或你的盟友，但火焰弹的烈焰会灼烧任何站在其中的人。\n\n_+1：__烟雾弹_倒数三回合，然后炸开_2格_内的一切。\n\n_+2：_追加_火焰弹_：它落在原地，并在_5回合_内不断点燃周围的格子。\n\n_+3：_火焰弹的烈焰可及_2格外_，最终以烟雾弹的爆炸收尾。追加_电击器_：它落在原地，在_6回合_内向八方放射闪电，可及_2格外_，击中者被震晕，最后同样以那次爆炸收尾。
actors.hero.skills.tengusarsenal.pick=天狗的哪件玩具？
actors.hero.skills.tengusarsenal.opt_smoke=烟雾弹
actors.hero.skills.tengusarsenal.opt_fire=火焰弹
actors.hero.skills.tengusarsenal.opt_shock=电击器
actors.hero.skills.tengusarsenal.prompt=选择投掷的位置
actors.hero.skills.tengusarsenal.no_target=选一个远离自己的格子。
actors.hero.skills.tengusarsenal.chasm=它翻滚着坠入深渊，消失了。

actors.hero.skills.hurl.name=投掷
actors.hero.skills.hurl.cast=接住！
actors.hero.skills.hurl.desc=把手中的武器旋转掷向6格内的一个敌人，造成_120%_武器伤害（含附魔）。随后它飞回你手中。\n\n_+1：_每次命中都有_15%_几率弹向附近另一个敌人。\n\n_+2：_弹射几率提高到_30%_。\n\n_+3：_弹射几率提高到_45%_，且投掷命中会积攒_连击_：每点使你的下一次投掷伤害_提高10%_，最多5点。
actors.hero.skills.hurl.prompt=选择投掷的目标
actors.hero.skills.hurl.no_target=你需要在6格内视野中有一个敌人。
actors.hero.skills.hurl.no_weapon=你手中需要有近战武器才能投掷。

actors.hero.skills.pillaroflight.name=光柱
actors.hero.skills.pillaroflight.cast=要有光！
actors.hero.skills.pillaroflight.desc=从天上召唤一道光柱落在8格内视野中的敌人身上。对亡灵与恶魔的灼烧威力提高一半，并随你的伤害变强。\n\n_+1：_光柱造成你伤害的_160-320%_。\n\n_+2：_光柱造成你伤害的_220-440%_，并使身旁的敌人失明_2回合_。\n\n_+3：_光柱造成你伤害的_280-560%_，并向四周散射光之星芒，持续_2回合_，对敌人造成你伤害的_140%_并祝福盟友。
actors.hero.skills.pillaroflight.prompt=选择召唤光柱的敌人
actors.hero.skills.pillaroflight.no_target=你需要在8格内视野中有一个敌人。




actors.hero.skills.scouringflame.prompt=选择焚净的方向

actors.hero.skills.sidestep.cast=侧步！

actors.hero.skills.countertime.cast=反击！


actors.hero.skills.pressurepoint.cast=点穴！

actors.hero.skills.poacher.cast=新鲜诱饵。

actors.hero.skills.beartrap.prompt=选择布置陷阱的位置

actors.hero.skills.deadfall.prompt=选择架设重物的位置

actors.hero.skills.sixthsense.cast=今天不行。

actors.hero.skills.lonewolf.cast_alone=又只剩我一个了。
actors.hero.skills.lonewolf.cast_company=有伴了...

actors.hero.skills.hex.prompt=选择要诅咒的敌人
actors.hero.skills.hex.no_target=你需要一个视野内的敌人才能诅咒。

actors.hero.skills.ninjabomb.prompt=选择炸弹投掷的位置

actors.hero.skills.phantomstrike.prompt=选择暗影升起的位置，或选择一道暗影与其交换位置

actors.hero.skills.blackout.prompt=选择熄光的位置

actors.hero.skills.laststand.cast=还没到时候！

actors.hero.skills.doublestab.mark_prompt=选择第二刀要刺入的敌人
actors.hero.skills.doublestab.marked=已标记：只要%s还在触及范围内，第二刀就会刺入它。
actors.hero.skills.doublestab.no_mark=选择一个8格内可见的敌人。

actors.hero.skills.doubleshot.mark_prompt=选择第二箭射向的敌人
actors.hero.skills.doubleshot.marked=已标记：只要到%s的路线畅通，第二箭就会射向它。
actors.hero.skills.doubleshot.no_mark=标记一个你能看见的敌人。

actors.hero.skills.chargedshot.cast_draw=稳住...
actors.hero.skills.chargedshot.already=你已经在拉弓了。

actors.hero.skills.meteorcall.name=陨星召唤
actors.hero.skills.meteorcall.cast=坠落吧！
actors.hero.skills.meteorcall.desc=标记一个可见的格子，下一回合陨星会砸落其上，炸开并灼烧3x3范围内的每个敌人。中心承受的伤害高出五成。\n\n_+1：_射程_7_。造成你伤害的_240-480%_。\n\n_+2：_射程_9_。造成你伤害的_320-640%_。\n\n_+3：_射程_11_。造成你伤害的_400-800%_。冲击会使敌人眩晕，且一回合后地面会再次喷发。
actors.hero.skills.meteorcall.prompt=选择陨星落下的位置
