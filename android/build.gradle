apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'

android {
    namespace 'com.shatteredpixel.shatteredpixeldungeon.android'
    compileSdk appAndroidCompileSDK
    buildFeatures {
        buildConfig true
    }
    compileOptions.sourceCompatibility = compileOptions.targetCompatibility = appJavaCompatibility

    sourceSets.main.assets.srcDirs = [new File(project(':core').projectDir, "/src/main/assets")]

    defaultConfig {
        manifestPlaceholders = [appName:appName]
        applicationId appPackageName

        versionCode appVersionCode
        versionName appVersionName

        //noinspection MinSdkTooLow
        minSdkVersion appAndroidMinSDK
        targetSdkVersion appAndroidTargetSDK
        buildConfigField "boolean", "ENABLE_FIREBASE", "true"
        resourceConfigurations += ['en_US', 'cs', 'de', 'el', 'es', 'fr', 'hu', 'in', 'it', 'ja', 'ko', 'nl', 'pl', 'pt', 'ru', 'tr', 'uk', 'vi', 'zh_CN']

    }

    def envFile = file('.env')
    def keystorePassword = null
    if (envFile.exists()) {
        envFile.eachLine { line ->
            def trimmed = line.trim()
            if (trimmed && !trimmed.startsWith('#') && trimmed.startsWith('KEYSTORE_PASSWORD=')) {
                keystorePassword = trimmed.substring('KEYSTORE_PASSWORD='.length()).trim()
            }
        }
    }
    if (!keystorePassword) {
        def provided = project.findProperty('keystorePassword') ?: System.getenv('KEYSTORE_PASSWORD')
        if (provided) {
            keystorePassword = provided.toString().trim()
            envFile.text = "KEYSTORE_PASSWORD=${keystorePassword}\n"
        } else {
            throw new GradleException(
                "Keystore password not found in android/.env (this file is gitignored). Please provide the password via -PkeystorePassword=<password> (it will be saved to android/.env for future builds). If you are a fork author, you must generate your own keystore and re-sign."
            )
        }
    }

    def releaseKeystore = file('keystores/release.jks')
    def betaKeystore = file('keystores/beta.jks')
    if (!releaseKeystore.exists() || !betaKeystore.exists()) {
        throw new GradleException(
            "Keystore file(s) not found (android/keystores/*.jks are gitignored). Please place release.jks and beta.jks in android/keystores/, or if you are a developer/fork author, generate your own keystore and re-sign."
        )
    }

    signingConfigs {
        release {
            storeFile releaseKeystore
            storePassword keystorePassword
            keyAlias 'release'
            keyPassword keystorePassword
        }
        beta {
            storeFile betaKeystore
            storePassword keystorePassword
            keyAlias 'beta'
            keyPassword keystorePassword
        }
    }

    buildTypes {
        debug {
            //兼容FireBase Debug调试，因此请在虚拟机上运行！（包名一致）
            //            applicationIdSuffix ".indev"

            //Debug环境下会超方法 调用多Dex
            multiDexEnabled true
            //屏蔽CrashMap地图
            firebaseCrashlytics {mappingFileUploadEnabled false}
            versionNameSuffix '-INDEV'
            dependencies {
                debugImplementation project(':services:updates:debugUpdates')
                debugImplementation project(':services:news:debugNews')
            }
        }
        release {

            //Disabled R8/minify to prevent removal of reflection-loaded classes (e.g. EventSubscriberIndex)
            shrinkResources false
            minifyEnabled false
            //启用MultiDex解决64k方法限制
            multiDexEnabled true
            signingConfig signingConfigs.release
            firebaseCrashlytics {mappingFileUploadEnabled false}
            dependencies {
                releaseImplementation project(':services:updates:githubUpdates')
                releaseImplementation project(':services:news:shatteredNews')
            }
        }
        beta {
            initWith buildTypes.release
            applicationIdSuffix ".beta"
            versionNameSuffix " Build ${new Date().format('yyyy-MM-dd_HH-mm-ss')}"
            buildConfigField "boolean", "ENABLE_FIREBASE", "false"
            manifestPlaceholders = [appName: "Radish Pixel Dungeon Test Version"]
            signingConfig signingConfigs.beta
            matchingFallbacks = ['release']
            dependencies {
                betaImplementation project(':services:updates:debugUpdates')
                betaImplementation project(':services:news:debugNews')
            }
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            if (variant.buildType.name == 'beta') {
                def timestamp = new Date().format('yyyy-MM-dd_HH-mm-ss')
                outputFileName = "Radish Pixel Dungeon Test Version Build ${timestamp}.apk.rename"
            } else if (variant.buildType.name == 'release') {
                outputFileName = "${appName} ${appVersionName}.apk.rename"
            }
        }
    }
}

configurations { natives }

preBuild.dependsOn rootProject.tasks.named('generateRuntimeAtlasManifests')

tasks.matching { it.name == 'processBetaGoogleServices' }.configureEach {
    enabled = false
}

tasks.matching { it.name in ['assembleRelease', 'bundleRelease'] }.configureEach {
    doFirst {
        if (!file('google-services.json').exists()) {
            throw new GradleException(
                "android/google-services.json not found (this file is gitignored). Please provide your google-services.json before building release."
            )
        }
    }
}

dependencies {
    implementation project(':core')

    // 事件系统模块引入（订阅者在 core 模块，annotationProcessor 已在 core 模块配置）
    implementation project(':event-annotations')

    implementation 'cat.ereza:customactivityoncrash:2.3.0'

    implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"


    //接入多DEX 仅在Debug状态下使用
    implementation "androidx.multidex:multidex:2.0.1"

    //只考虑安卓端 电脑端直接呼出URL
    //----------AndroidX 版本
    //app-updater
    implementation 'com.github.jenly1314.AppUpdater:app-updater:1.2.0'
    //app-dialog
    implementation 'com.github.jenly1314.AppUpdater:app-dialog:1.2.0'

    //noinspection GradleDependency
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.blankj:utilcodex:1.30.6'
    //android:lintVitalAnalyzeRelease Error可忽略

    //noinspection GradleDependency
    implementation 'com.google.firebase:firebase-crashlytics:18.6.2'
    implementation 'com.google.firebase:firebase-analytics:21.5.1'
    implementation platform('com.google.firebase:firebase-bom:32.7.4')
    implementation 'com.google.firebase:firebase-analytics'

    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"
    implementation "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-x86"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-x86_64"
    implementation "com.badlogicgames.gdx-controllers:gdx-controllers-android:$gdxControllersVersion"
}

// called every time gradle gets executed, takes the native dependencies of
// the natives configuration, and extracts them to the proper libs/ folders
// so they get packed with the APK.
task copyAndroidNatives() {
    file("libs/armeabi-v7a/").mkdirs()
    file("libs/arm64-v8a/").mkdirs()
    file("libs/x86/").mkdirs()
    file("libs/x86_64/").mkdirs()

    configurations.natives.copy().files.each { jar ->
        def outputDir = null
        if(jar.name.endsWith("natives-armeabi-v7a.jar")) outputDir = file("libs/armeabi-v7a")
        if(jar.name.endsWith("natives-arm64-v8a.jar")) outputDir = file("libs/arm64-v8a")
        if(jar.name.endsWith("natives-x86.jar")) outputDir = file("libs/x86")
        if(jar.name.endsWith("natives-x86_64.jar")) outputDir = file("libs/x86_64")
        if(outputDir != null) {
            copy {
                from zipTree(jar)
                into outputDir
                include "*.so"
            }
        }
    }
}
